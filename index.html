<script id="essay-data" type="application/json">[{"id": "essay-01", "title": "少学习多锻炼", "question": "Parents should encourage children to spend less time studying and more time doing physical activities.\nTo what extent do you agree or disagree?", "qzh": "家长应该鼓励孩子减少学习时间，增加体育活动时间。你在多大程度上同意或不同意？", "paragraphs": ["In recent years, the rising academic burden on children has sparked widespread concern among parents and educators. While physical exercise is undeniably vital for childhood development, I disagree with the idea that study time should be reduced across the board. Instead, parents should focus on managing study efficiency so that children can engage in regular physical activity without compromising their academic foundation.", "On the one hand, encouraging children to participate in physical activities brings distinct health and psychological benefits that pure academic work cannot provide. When children engage in regular sports, their bodies release endorphins and experience increased blood circulation, which helps relieve the mental strain accumulated from long hours of stationary learning. Furthermore, team sports like basketball or football create dynamic social settings where children must cooperate, handle victory and defeat, and resolve conflict with peers. These real-world interactions foster social competence and emotional resilience—qualities that traditional textbook study rarely cultivates.", "On the other hand, simply cutting back on study time is a misplaced solution that could harm a child’s future opportunities. In most modern societies, academic performance remains the primary metric for high school and university admissions, which directly shapes a young person's career path. If parents blindly reduce study hours without addressing unproductive habits, children may simply fall behind in core subjects without gaining any meaningful athletic benefit. A far more effective approach is to eliminate inefficient study practices, such as passive memorization or digital distractions during homework. By mastering better time management, children can complete their academic tasks in less time, naturally freeing up room for sports.", "In conclusion, I disagree that parents should deliberately cut down on study time just to accommodate more physical activity. Academic knowledge and physical fitness are not mutually exclusive; rather than treating them as a zero-sum trade-off, parents should guide children to study more efficiently, ensuring they have ample time for exercise while maintaining strong academic performance."], "translations": ["近年来，儿童日益加重的学业负担引发了家长和教育工作者的广泛关注。虽然体育锻炼对儿童成长无疑至关重要，但我不赞成一概缩减学习时间。相反，家长应着重改善学习效率，让孩子能够在不损害学业基础的前提下，经常参加体育活动。", "一方面，鼓励孩子参加体育活动，能够带来单纯的学业学习无法提供的显著身心益处。孩子经常参加运动时，身体会释放内啡肽，血液循环也会加快，这有助于缓解长时间静坐学习积累的精神压力。此外，篮球、足球等团队运动会创造充满活力的社交情境，孩子必须在其中合作、面对胜负，并解决与同伴之间的冲突。这些现实生活中的互动能够培养社交能力和情绪韧性，而这些品质是传统课本学习很少能培养出来的。", "另一方面，单纯缩减学习时间是一种没有找准问题的解决办法，可能损害孩子未来的发展机会。在大多数现代社会中，学业成绩仍然是高中和大学录取的首要衡量标准，而这会直接影响年轻人的职业道路。如果家长不解决低效的学习习惯，只是盲目减少学习时长，孩子可能只会在核心科目上落后，却没有获得任何实质性的运动益处。有效得多的办法是消除低效的学习做法，例如被动记忆，或在做作业时被电子设备分散注意力。通过更好地掌握时间管理方法，孩子能够用更少的时间完成学业任务，从而自然腾出运动的时间。", "总之，我不赞成家长仅仅为了安排更多体育活动而刻意压缩学习时间。学科知识与身体健康并不相互排斥；家长不应把两者看作此消彼长的零和取舍，而应引导孩子提高学习效率，确保他们在保持良好学业表现的同时，有充足的时间锻炼。"], "kind": "同意与否", "stance": "承认运动重要，反对一刀切减少学习时间，主张提高效率。原题未限定盲目减时，方案本身也缩短实际学习时长，立场边界需更明确。", "structure": [{"title": "引言｜背景 → 让步 → 立场 → 方案", "role": "3 句。提出中心立场，不详细展开论据。", "points": ["S1：学业负担增加，引出家长与教育界的关注。", "S2：承认运动重要；反对一刀切减少学习时间。", "S3：提出替代方案——提高学习效率，以兼顾运动和学业。"], "chain": "学业负担 → 承认运动价值 → 反对普遍减时 → 提高效率"}, {"title": "主体一｜让步：运动确实值得鼓励", "role": "4 句，2 个主要论点。主题句统领两条收益。", "points": ["S1：总论点——运动带来学业学习难以充分提供的身心益处。", "S2：论点① 身心健康：运动产生生理变化 → 缓解久坐学习的精神压力。", "S3–S4：论点② 社交与情绪成长：团队运动 → 合作、面对胜负、解决冲突 → 社交能力与情绪韧性。"], "chain": "运动 → 压力缓解；团队运动 → 真实互动 → 能力与品质成长"}, {"title": "主体二｜反驳：只减时间没有解决低效", "role": "5 句。1 条核心反对理由 + 1 个替代方案；不是简单堆砌 5 个论点。", "points": ["S1：段落立场——单纯减时是错位的办法，可能损害未来机会。", "S2–S3：解释风险——学业影响升学和发展；若坏习惯不变，减时可能造成落后，又未必带来运动收益。", "S4–S5：给出方案与机制——消除低效做法 → 更好地管理时间 → 更快完成学业 → 腾出运动时间。"], "chain": "只减时 + 低效习惯未改 → 学业风险；改习惯 → 提效率 → 有时间运动"}, {"title": "结论｜重申立场 → 兼顾两者", "role": "2 句。收束前文，不添加新论据。", "points": ["S1：重申不赞成为运动而刻意压缩学习时间。", "S2：否定零和取舍，重申通过效率兼顾学业与锻炼。"], "chain": "反对机械减时 → 学业与运动可以兼顾 → 再次落到效率"}], "readerNotes": [{"p": 0, "c": "vocab", "q": "academic burden", "t": "academic burden", "e": "学业负担。burden n. 负担；academic adj. 学业的。"}, {"p": 0, "c": "vocab", "q": "sparked", "t": "spark v.", "e": "熟词生义：引发，而不是名词“火花”。此处引发广泛关注。"}, {"p": 0, "c": "vocab", "q": "undeniably vital", "t": "undeniably / vital", "e": "undeniably adv. 不可否认地；vital adj. 至关重要的。"}, {"p": 0, "c": "vocab", "q": "across the board", "t": "across the board", "e": "全面地、一概地；这里强调不加区分地缩减时间。"}, {"p": 0, "c": "vocab", "q": "compromising", "t": "compromise v.", "e": "熟词生义：损害、削弱；不是“妥协”。"}, {"p": 1, "c": "vocab", "q": "distinct", "t": "distinct adj.", "e": "明显的、显著的；修饰运动带来的益处。"}, {"p": 1, "c": "vocab", "q": "psychological", "t": "psychological adj.", "e": "心理的；与身体健康这一维度相对。"}, {"p": 1, "c": "vocab", "q": "endorphins", "t": "endorphins n.", "e": "内啡肽；生理类专门词，阅读认识即可。"}, {"p": 1, "c": "vocab", "q": "blood circulation", "t": "blood circulation", "e": "血液循环。circulation n. 循环、流通。"}, {"p": 1, "c": "vocab", "q": "mental strain accumulated", "t": "strain / accumulated", "e": "strain n. 压力；accumulated 为过去分词，表示积累起来的。"}, {"p": 1, "c": "vocab", "q": "stationary", "t": "stationary adj.", "e": "静止的、不移动的。此处指静坐学习；stationary learning 搭配不够自然。"}, {"p": 1, "c": "vocab", "q": "peers", "t": "peers n.", "e": "同龄人、同辈。这里是一起运动的孩子。"}, {"p": 1, "c": "vocab", "q": "social competence and emotional resilience", "t": "competence / resilience", "e": "competence n. 能力；resilience n. 韧性、受挫后的恢复能力。"}, {"p": 2, "c": "vocab", "q": "misplaced", "t": "misplaced adj.", "e": "不恰当的、用错地方的；这里说解决办法没有对准问题。"}, {"p": 2, "c": "vocab", "q": "primary metric", "t": "primary metric", "e": "首要衡量标准。metric n. 指标。"}, {"p": 2, "c": "vocab", "q": "admissions", "t": "admissions n.", "e": "熟词生义：招生、录取；不是“承认”。"}, {"p": 2, "c": "vocab", "q": "addressing", "t": "address v.", "e": "熟词生义：处理、解决；不是“地址”。"}, {"p": 2, "c": "vocab", "q": "eliminate inefficient", "t": "eliminate / inefficient", "e": "eliminate v. 消除；inefficient adj. 低效的。"}, {"p": 2, "c": "vocab", "q": "passive memorization", "t": "passive memorization", "e": "被动记忆。memorization n. 记忆、背诵。"}, {"p": 2, "c": "vocab", "q": "digital distractions", "t": "digital distractions", "e": "数字设备或内容造成的注意力干扰。"}, {"p": 2, "c": "vocab", "q": "room", "t": "room n.", "e": "熟词生义：余地、空间；此处指留给运动的时间。"}, {"p": 3, "c": "vocab", "q": "deliberately", "t": "deliberately adv.", "e": "刻意地、有意地。"}, {"p": 3, "c": "vocab", "q": "accommodate", "t": "accommodate v.", "e": "熟词生义：为……作安排、留出空间；不是“提供住宿”。"}, {"p": 3, "c": "vocab", "q": "mutually exclusive", "t": "mutually exclusive", "e": "相互排斥的；not mutually exclusive 表示两者可以兼顾。"}, {"p": 3, "c": "vocab", "q": "zero-sum trade-off", "t": "zero-sum trade-off", "e": "零和取舍：一方增加就要以另一方减少为代价。"}, {"p": 3, "c": "vocab", "q": "ample", "t": "ample adj.", "e": "充足的；修饰时间、空间、机会等。"}, {"p": 0, "c": "syntax", "q": "study time should be reduced", "t": "主语 + should be + 过去分词", "e": "情态动词的被动语态：学习时间“应该被减少”。that 从句解释 idea 的内容，是同位语从句。"}, {"p": 0, "c": "syntax", "q": "focus on managing study efficiency", "t": "focus on + doing", "e": "on 是介词，后接动名词 managing。这里用 improving study efficiency（提高学习效率）更自然。"}, {"p": 1, "c": "syntax", "q": "encouraging children to participate in physical activities brings", "t": "动名词短语作主语", "e": "整个 encouraging … activities 是主语，因此谓语用单数 brings。内部结构：encourage sb to do sth。"}, {"p": 1, "c": "syntax", "q": "which helps relieve the mental strain accumulated from long hours of stationary learning", "t": "which + 补充说明；过去分词修饰", "e": "which 概括前面的生理变化。accumulated … 后置修饰 strain，相当于 that has accumulated …，不是新的谓语。"}, {"p": 1, "c": "syntax", "q": "where children must cooperate, handle victory and defeat, and resolve conflict with peers", "t": "where 从句 + 并列动作", "e": "where = in which，修饰 social settings。must 后并列 cooperate、handle、resolve，形式保持一致。"}, {"p": 1, "c": "syntax", "q": "qualities that traditional textbook study rarely cultivates", "t": "概括名词 + 定语从句", "e": "qualities 概括前面的两种能力。that 指代 qualities，作 cultivates 的宾语；rarely 表示“很少”。"}, {"p": 2, "c": "syntax", "q": "simply cutting back on study time is a misplaced solution", "t": "动名词主语 + be + 表语", "e": "cutting back on study time 是主语，a misplaced solution 是表语。simply 限定“仅仅缩减时间”。"}, {"p": 2, "c": "syntax", "q": "A far more effective approach is to eliminate inefficient study practices", "t": "A more … approach is to do", "e": "不定式作表语，说明方法。far 加强比较级 more effective，表示“有效得多”。"}, {"p": 2, "c": "syntax", "q": "naturally freeing up room for sports", "t": "现在分词短语表示结果", "e": "freeing … 说明更快完成学业任务带来的结果：腾出运动时间。"}, {"p": 3, "c": "syntax", "q": "ensuring they have ample time for exercise", "t": "ensuring + (that) 从句", "e": "分词短语补充说明预期结果；they 指 children，that 可以省略。"}, {"p": 0, "c": "link", "q": "In recent years", "t": "时间背景", "e": "介词短语，限定近年的时间范围；对应 has sparked 的现在完成时。"}, {"p": 0, "c": "link", "q": "among parents and educators", "t": "among + 群体", "e": "介词，表示关注存在于家长和教育工作者之中。不是连词。"}, {"p": 0, "c": "link", "q": "While physical exercise is undeniably vital for childhood development", "t": "While：让步", "e": "相当于 although：先承认运动重要，再提出不同意见。"}, {"p": 0, "c": "link", "q": "Instead", "t": "Instead：替代", "e": "从“不赞成减时”转向“应提高效率”，不是简单追加观点。"}, {"p": 0, "c": "link", "q": "so that", "t": "so that：目的", "e": "连接家长的做法与希望实现的目标；后接 children can …。"}, {"p": 0, "c": "link", "q": "without compromising their academic foundation", "t": "without + doing", "e": "介词短语：在不损害学业基础的情况下。不是让步从句。"}, {"p": 1, "c": "link", "q": "On the one hand", "t": "第一方面", "e": "引出对运动益处的承认，与下一段的 On the other hand 呼应。"}, {"p": 1, "c": "link", "q": "When children engage in regular sports", "t": "When：时间／情境", "e": "引出运动发生时的身体变化，为解释其益处提供情境。"}, {"p": 1, "c": "link", "q": "Furthermore", "t": "Furthermore：递进", "e": "从身心健康扩展到社交、情绪成长这一独立维度。"}, {"p": 2, "c": "link", "q": "On the other hand", "t": "第二方面", "e": "由承认运动价值转入质疑“单纯减时”，不是列举运动的坏处。"}, {"p": 2, "c": "link", "q": "If parents blindly reduce study hours without addressing unproductive habits", "t": "If：条件", "e": "设定“减时但不改低效习惯”的条件；主句 may 表示可能后果，不是必然结果。"}, {"p": 2, "c": "link", "q": "such as", "t": "such as：举例", "e": "引出低效学习的实例，让前面的抽象判断具体化。"}, {"p": 2, "c": "link", "q": "By mastering better time management", "t": "By + doing：方式", "e": "通过掌握时间管理实现主句的结果；动作执行者是 children。"}, {"p": 3, "c": "link", "q": "In conclusion", "t": "结论信号", "e": "收束前文并重申立场，不引入新的主要论点。"}, {"p": 3, "c": "link", "q": "rather than treating them as a zero-sum trade-off", "t": "rather than：选择", "e": "与其把二者当作零和取舍，不如引导孩子提高效率。"}, {"p": 3, "c": "link", "q": "while maintaining strong academic performance", "t": "while：同时", "e": "这里表示保持成绩与锻炼同时实现；与第一段的让步含义不同。"}, {"p": 0, "c": "expression", "q": "sparked widespread concern", "t": "spark widespread concern", "e": "引发广泛关注／担忧。动词 spark 与 concern 搭配。"}, {"p": 0, "c": "expression", "q": "engage in regular physical activity", "t": "engage in ↔ participate in", "e": "本篇均表示参加运动。physical exercise / physical activity / sports 形成近义表达；team sports 范围更窄。"}, {"p": 1, "c": "expression", "q": "relieve the mental strain", "t": "relieve mental strain", "e": "缓解精神压力。relieve 是可积累的动词，比简单的 make … less 直接。"}, {"p": 1, "c": "expression", "q": "foster social competence and emotional resilience", "t": "foster / cultivate + 能力或品质", "e": "文中的 foster 与 cultivates 近义。social competence＝社交能力；emotional resilience＝情绪韧性。"}, {"p": 1, "c": "expression", "q": "handle victory and defeat, and resolve conflict with peers", "t": "handle / resolve", "e": "handle victory and defeat：应对胜负；resolve conflict：解决冲突。两个动词各有搭配对象。"}, {"p": 2, "c": "expression", "q": "cutting back on study time", "t": "cut back on / cut down on / reduce", "e": "都是减少学习时间的改写。前两者加 on；reduce 直接接宾语。"}, {"p": 2, "c": "expression", "q": "academic performance", "t": "academic 话题词汇链", "e": "foundation＝基础；performance＝表现；knowledge＝知识；tasks＝任务。是相关表达，不可互当同义词。"}, {"p": 2, "c": "expression", "q": "fall behind in core subjects", "t": "fall behind in + 学科", "e": "在核心科目上落后。core subjects 是常用的教育话题名词搭配。"}, {"p": 2, "c": "expression", "q": "freeing up room for sports", "t": "free up room for", "e": "为……腾出余地；本文具体指为体育活动腾出时间。"}, {"p": 3, "c": "expression", "q": "not mutually exclusive", "t": "not mutually exclusive", "e": "说明两个目标并不相互排斥，用于概括“学业与运动可兼顾”的观点。"}], "sourcePage": 2}, {"id": "essay-02", "title": "高层管理者与普通员工薪资差距", "question": "Some people think it is a good thing for senior management positions to have very high salaries compared to other workers of the same company or organisation.\nTo what extent do you agree?", "qzh": "有人认为，同一公司或机构的高层管理者薪资远高于普通员工是好事。你在多大程度上同意？", "paragraphs": ["The debate over whether senior management should receive significantly higher salaries than other employees is ongoing. While some argue that these high salaries are justified by the responsibilities and impact of these roles, others believe that excessive pay gaps can harm an organization. I believe that while senior management deserves higher compensation, excessively large pay differences can be detrimental and can even undermine the long-term success of the organization.", "Senior management roles carry substantial responsibilities that directly affect a company’s success. These positions often require extensive experience and advanced skills, justifying higher salaries to attract and retain top talent. For example, the decisions made by a CEO can determine the growth or decline of a multinational corporation, making higher pay reasonable and necessary to secure the best leadership.", "However, large pay gaps between senior management and other employees can create feelings of inequality and resentment. This can lower morale and productivity, as employees who feel undervalued may be less motivated to perform well. When the workforce sees that only top executives benefit significantly, they may be less inclined to contribute their best efforts, leading to a disengaged and less productive work environment.", "Furthermore, allocating too much to senior management salaries can reduce resources available for employee development and benefits. Organizations that prioritize equitable compensation are likely to foster a more loyal and motivated workforce, leading to a more collaborative and committed environment. A focus on fair distribution of resources ensures that all employees feel valued, which can enhance overall organizational performance.", "In conclusion, while senior management deserves higher salaries due to their roles, excessive pay gaps should be avoided. A reasonable compensation structure can lead to a more motivated and productive workforce, ultimately benefiting the organization as a whole and ensuring long-term success."], "translations": ["高层管理者是否应该比其他员工获得高得多的薪资，一直存在争论。有些人认为，这些岗位的责任和影响力足以证明高薪合理，另一些人则认为过大的薪酬差距会损害组织。我认为，高层管理者虽然应获得更高报酬，但过大的工资差异会造成损害，甚至削弱组织的长期成功。", "高层管理岗位承担着直接影响公司成败的重大责任。这些岗位通常要求丰富的经验和高级技能，因此有理由提供更高薪资来吸引和留住顶尖人才。例如，首席执行官的决策可以决定一家跨国公司的兴衰，所以支付更高薪酬来获得最佳领导人才是合理且必要的。", "然而，高层与普通员工之间过大的薪酬差距会引起不公平感和怨恨。这可能降低士气与生产效率，因为觉得自己未被重视的员工可能缺乏做好工作的动力。当员工看到只有高层显著受益时，他们可能更不愿尽最大努力，导致工作环境缺乏投入、效率下降。", "此外，把过多资金分配给高层薪酬，会减少可用于员工发展和福利的资源。重视公平薪酬的组织更可能培养出忠诚且积极的员工队伍，形成更加合作、投入的环境。重视资源公平分配能确保所有员工感到被重视，从而提升组织整体表现。", "总之，高层管理者因其岗位职责理应获得较高薪资，但应避免过大的薪酬差距。合理的薪酬结构能形成更积极、更高效的员工队伍，最终使整个组织受益并保障长期成功。"], "kind": "同意与否", "stance": "有条件同意高薪，反对过大差距。", "structure": [{"title": "引言", "role": "", "points": ["呈现争议", "区分合理高薪与过大差距。"]}, {"title": "主体一", "role": "", "points": ["1 个支持理由：责任与能力要求高", "经验和技能要求 → 吸引留住人才 → CEO 决策例子。"]}, {"title": "主体二", "role": "", "points": ["1 个反对理由：公平感和动力受损", "工资差距 → 怨恨 → 士气与效率下降。"]}, {"title": "主体三", "role": "", "points": ["1 个资源分配理由", "高层占用预算 → 员工发展福利减少；公平分配则提升投入。"]}, {"title": "结论", "role": "", "points": ["重申合理高薪、避免极端差距", "回扣员工动力与组织表现。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "compensation", "t": "compensation n.", "e": "此处为薪酬、报酬，不是事故后的赔偿。"}, {"p": 0, "c": "vocab", "q": "detrimental", "t": "detrimental adj.", "e": "有害的；常用 be detrimental to。"}, {"p": 1, "c": "vocab", "q": "substantial", "t": "substantial adj.", "e": "重大的、数量可观的。"}, {"p": 2, "c": "vocab", "q": "resentment", "t": "resentment n.", "e": "因不公产生的怨恨、不满。"}, {"p": 2, "c": "vocab", "q": "morale", "t": "morale n.", "e": "团队士气，区别于 moral（道德的）。"}, {"p": 3, "c": "vocab", "q": "equitable", "t": "equitable adj.", "e": "公平合理的，不一定意味着每人相同。"}, {"p": 0, "c": "syntax", "q": "while senior management deserves higher compensation", "t": "while 引导让步从句", "e": "在 I believe that 后嵌入让步：虽然高层应多得，但差距不宜过大。"}, {"p": 1, "c": "syntax", "q": "making higher pay reasonable and necessary", "t": "making + 宾语 + 形容词", "e": "现在分词交代结果；reasonable 和 necessary 作宾语补足语。"}, {"p": 3, "c": "syntax", "q": "are likely to foster", "t": "be likely to do", "e": "表示可能产生的结果，不把因果说成绝对。"}, {"p": 2, "c": "link", "q": "However", "t": "转折", "e": "由高薪合理性转向过大差距的危害。"}, {"p": 3, "c": "link", "q": "Furthermore", "t": "递进", "e": "从员工心理扩展到资源分配。"}, {"p": 2, "c": "link", "q": "as employees who feel undervalued", "t": "as：原因", "e": "解释士气下降的原因；who 从句修饰 employees。"}, {"p": 1, "c": "expression", "q": "attract and retain top talent", "t": "attract / retain talent", "e": "吸引并留住顶尖人才，两个并列动词。"}, {"p": 0, "c": "expression", "q": "pay gaps", "t": "pay gaps / pay differences", "e": "本文表示薪资差距的近义替换。"}, {"p": 3, "c": "expression", "q": "loyal and motivated workforce", "t": "loyal / motivated / committed", "e": "忠诚、有动力、投入的；适合描述员工品质。"}], "sourcePage": 3}, {"id": "essay-03", "title": "领导的重要品质", "question": "Intelligence is the most important factor for a leader.\nTo what extent do you agree or disagree?", "qzh": "智力是领导者最重要的因素。你在多大程度上同意或不同意？", "paragraphs": ["Leadership skills consist of various traits, yet it is often suggested that the primary one for a leader is intelligence. I completely agree with this view for several reasons.", "The main argument supporting this view is that it is vital for someone in a leadership position to be able to guide a team along the right path. This requires a person to be quick-witted and intelligent, as they must analyze and process a large amount of information. Moreover, leaders not only need to think carefully about strategies, but they must also come to a clear conclusion, as there are often multiple options to consider. Additionally, since leaders generally cannot afford to make mistakes, they must scrutinize every detail and potential outcome to ensure success. As a result, their effectiveness is largely dependent on their intelligence.", "Another reason why intelligence is crucial is that it helps leaders address weaknesses effectively. Undoubtedly, it is essential for a leader to help their team members identify their weak points and find solutions to improve them, as minimizing weaknesses plays a key role in making progress. This is especially useful when dealing with a unique problem that requires a different and analytical approach. There are also benefits for the leaders themselves, as they are not immune to flaws. They need to address their own weaknesses with even more precision. However, intelligent leaders are typically aware of their own shortcomings and can take appropriate actions to overcome them, which ultimately benefits both the leader and their team.", "In conclusion, I believe that intelligence is a critical factor for a leader, as it provides two essential benefits for the success of the team: the ability to guide the team effectively and the capacity to address weaknesses efficiently."], "translations": ["领导能力包含多种品质，但人们常认为领导者最主要的品质是智力。基于几个理由，我完全同意这一观点。", "支持这一观点的主要理由是，领导岗位上的人必须能引导团队走上正确道路。这要求一个人反应敏捷、聪明，因为他们必须分析和处理大量信息。此外，领导者不仅要仔细思考策略，还必须得出明确结论，因为通常有多种选择需要考虑。而且，领导者通常承担不起犯错的后果，因此必须仔细审查每个细节及可能结果，以确保成功。因此，他们的工作成效在很大程度上取决于智力。", "智力至关重要的另一个理由是，它帮助领导者有效解决弱点。毫无疑问，领导者必须帮助团队成员发现弱项并找到改进办法，因为尽量减少弱点对取得进步至关重要。在处理需要不同分析方法的特殊问题时，这一点尤其有用。这也有益于领导者本人，因为他们同样并非没有缺点。他们需要更精准地处理自己的弱点。不过，聪明的领导者通常了解自身不足，并能采取适当行动克服它们，最终使领导者和团队双方受益。", "总之，我认为智力是领导者的关键因素，因为它为团队成功提供了两项重要优势：有效引导团队的能力，以及高效处理弱点的能力。"], "kind": "同意与否", "stance": "完全同意；但正文主要证明“重要”，与“最重要”的比较论证不足。", "structure": [{"title": "引言", "role": "", "points": ["改写题目并明确完全同意。"]}, {"title": "主体一", "role": "", "points": ["1 个核心论点：指导方向", "处理信息 → 比较策略 → 检查风险 → 有效决策。"]}, {"title": "主体二", "role": "", "points": ["1 个核心论点：识别并克服弱点", "先谈团队成员，再谈领导者自身。"]}, {"title": "结论", "role": "", "points": ["汇总指导团队、处理弱点两点", "注意原题是最高级 most important。"]}], "readerNotes": [{"p": 1, "c": "vocab", "q": "quick-witted", "t": "quick-witted adj.", "e": "思维敏捷的、反应快的。"}, {"p": 1, "c": "vocab", "q": "scrutinize", "t": "scrutinize v.", "e": "仔细检查、审视，比 look at 更强调细致。"}, {"p": 2, "c": "vocab", "q": "immune to flaws", "t": "immune / flaws", "e": "immune to：不受影响；flaws：缺陷。这里说领导者也会有缺点。"}, {"p": 2, "c": "vocab", "q": "precision", "t": "precision n.", "e": "精确、准确。"}, {"p": 2, "c": "vocab", "q": "shortcomings", "t": "shortcomings n.", "e": "不足、缺点。"}, {"p": 1, "c": "syntax", "q": "it is vital for someone in a leadership position to be able to guide", "t": "It is + adj. + for sb + to do", "e": "it 为形式主语，不定式是真正主语；说明领导者需要具备的能力。"}, {"p": 2, "c": "syntax", "q": "Another reason why intelligence is crucial is that", "t": "Another reason why … is that …", "e": "why 从句限定 reason；that 从句说明具体理由。"}, {"p": 1, "c": "link", "q": "since leaders generally cannot afford to make mistakes", "t": "since：原因", "e": "解释为什么必须仔细检查；此处不是“自从”。"}, {"p": 1, "c": "link", "q": "As a result", "t": "结果", "e": "把前面的决策要求归结为成效依赖智力。"}, {"p": 2, "c": "link", "q": "However", "t": "转折", "e": "从领导者也有弱点，转向聪明领导者能够发现并改进。"}, {"p": 2, "c": "expression", "q": "weak points", "t": "weak points / weaknesses / shortcomings", "e": "本文表示弱点的相关替换；flaws 语气可更强。"}, {"p": 1, "c": "expression", "q": "guide a team along the right path", "t": "guide a team", "e": "引导团队；适合领导与协作话题。"}, {"p": 2, "c": "expression", "q": "take appropriate actions", "t": "take appropriate actions", "e": "采取适当行动；appropriate 修饰行动是否合乎情境。"}], "sourcePage": 4}, {"id": "essay-04", "title": "公司提供运动和社交设施", "question": "All large companies should provide sports and social facilities for the local community.\nTo what extent do you agree or disagree with this statement?", "qzh": "所有大公司都应该为当地社区提供体育和社交设施。你在多大程度上同意或不同意？", "paragraphs": ["In recent years, there has been growing debate about whether large companies should be responsible for providing sports and social facilities for the local community. While I agree that corporations can play a positive role in supporting society, I do not believe it should be considered an obligation for all big businesses.", "On the one hand, there are strong arguments for encouraging companies to contribute in this way. First, sports and social facilities improve the well-being of local residents by promoting healthier lifestyles and greater social interaction. For example, a gym or community centre built by a company could reduce health problems such as obesity and also create spaces where people build stronger connections. Second, companies benefit indirectly from such investments. By supporting the community, they can enhance their reputation, build customer loyalty, and even improve employee satisfaction, as workers often prefer companies with a strong sense of social responsibility.", "On the other hand, making it compulsory for all large companies may create unfair burdens. Businesses primarily exist to generate profit, provide jobs, and pay taxes. Forcing them to build facilities could distract them from their core operations or reduce their competitiveness, particularly in industries with high operating costs. Moreover, providing community facilities should remain the responsibility of governments, which collect taxes and are better placed to allocate resources fairly among different regions and social groups.", "In conclusion, while I believe it is highly beneficial for companies to support local communities by building sports and social facilities, it should not be seen as a duty for all large businesses. Instead, governments should take the main responsibility, while companies should be encouraged, but not forced, to contribute."], "translations": ["近年来，关于大公司是否应负责为当地社区提供体育和社交设施，讨论日益增多。虽然我同意企业能在支持社会方面发挥积极作用，但我不认为这应被视为所有大企业的义务。", "一方面，鼓励公司以这种方式作出贡献有充分理由。首先，体育和社交设施能通过促进健康生活方式和更多社会互动，改善当地居民的福祉。例如，公司建设的健身房或社区中心能够减少肥胖等健康问题，也能提供建立更紧密联系的空间。其次，公司也会从此类投资中间接受益。支持社区能改善企业声誉、建立顾客忠诚度，甚至提高员工满意度，因为员工往往更喜欢有强烈社会责任感的公司。", "另一方面，强制所有大公司这样做可能带来不公平的负担。企业存在的主要目的是创造利润、提供就业和缴纳税款。迫使它们建设设施可能分散核心业务精力，或削弱竞争力，尤其是在运营成本较高的行业。此外，提供社区设施仍应是政府的责任，因为政府征税，也更有条件在不同地区和社会群体之间公平配置资源。", "总之，我认为公司通过建设体育和社交设施来支持当地社区非常有益，但不应将其视为所有大企业的义务。相反，政府应承担主要责任，而企业应受到鼓励而非被迫作出贡献。"], "kind": "同意与否", "stance": "支持企业自愿贡献，反对对所有大公司一概强制。", "structure": [{"title": "引言", "role": "", "points": ["区分积极作用与强制义务。"]}, {"title": "主体一", "role": "", "points": ["2 点收益：社区健康与互动；企业声誉、忠诚度和满意度", "每点都有解释或例子。"]}, {"title": "主体二", "role": "", "points": ["2 点反对：企业负担；政府更适合公平分配资源。"]}, {"title": "结论", "role": "", "points": ["政府主责、企业自愿参与。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "obligation", "t": "obligation n.", "e": "义务、必须履行的责任。"}, {"p": 1, "c": "vocab", "q": "well-being", "t": "well-being n.", "e": "身心健康、福祉，不只指收入。"}, {"p": 2, "c": "vocab", "q": "compulsory", "t": "compulsory adj.", "e": "强制的、必须的。"}, {"p": 2, "c": "vocab", "q": "competitiveness", "t": "competitiveness n.", "e": "竞争力。"}, {"p": 2, "c": "vocab", "q": "allocate", "t": "allocate v.", "e": "分配资源、资金等。"}, {"p": 0, "c": "syntax", "q": "it should be considered an obligation", "t": "be considered + 名词", "e": "被视作某事；这里把是否履行义务作为争论核心。"}, {"p": 2, "c": "syntax", "q": "making it compulsory for all large companies may create", "t": "动名词短语作主语", "e": "making … companies 作整体主语；may 表示可能性。"}, {"p": 2, "c": "syntax", "q": "are better placed to allocate", "t": "be better placed to do", "e": "更有条件、更适合做某事。"}, {"p": 0, "c": "link", "q": "While I agree", "t": "While：让步", "e": "承认企业贡献的好处，但反对普遍强制。"}, {"p": 1, "c": "link", "q": "First", "t": "First / Second：分点", "e": "明确标示社区受益与企业受益两个论点。"}, {"p": 2, "c": "link", "q": "Moreover", "t": "递进", "e": "从企业成本扩展到政府职责。"}, {"p": 1, "c": "expression", "q": "enhance their reputation, build customer loyalty", "t": "enhance / build", "e": "提升声誉、建立顾客忠诚度，注意各自动宾搭配。"}, {"p": 3, "c": "expression", "q": "encouraged, but not forced", "t": "encouraged / forced", "e": "用对比精确表达自愿与强制的立场。"}, {"p": 0, "c": "expression", "q": "corporations", "t": "corporations / companies / businesses", "e": "本文用于公司、企业的替换；不是所有场景完全等价。"}], "sourcePage": 5}, {"id": "essay-05", "title": "交通拥堵税", "question": "In some cities, governments have tried to reduce traffic congestion. For instance, they have imposed a congestion tax during rush hour.\nDo you think this development is positive or negative?", "qzh": "一些城市的政府试图缓解交通拥堵，例如在高峰期征收拥堵税。你认为这是积极还是消极的发展？", "paragraphs": ["In many cities, governments have introduced congestion charges during peak hours in an effort to reduce traffic congestion. I strongly believe that this policy represents a positive development, as it helps alleviate environmental problems and encourages more sustainable transport choices.", "One key benefit of congestion charges is their ability to reduce the number of private vehicles on the road. By increasing the cost of driving during rush hours, unnecessary car journeys are discouraged, which leads to lower traffic volumes. As a result, levels of air pollution and noise pollution are significantly reduced, improving overall environmental quality in densely populated urban areas. This is particularly important in major cities, where excessive car use is a primary cause of traffic congestion.", "Another important advantage is the positive impact on commuters ’ well-being. Severe traffic congestion often results in long travel times, causing stress, frustration and mental fatigue. By easing traffic flow, congestion charges can make daily journeys more predictable and less exhausting. In addition, revenue generated from these charges can be invested in improving public transport systems, such as expanding bus and metro services. This further encourages people to shift away from private cars, creating a more efficient and balanced transport network.", "In conclusion, I firmly believe that imposing congestion charges during peak hours is a positive step forward. Not only does this policy reduce pollution and traffic-related stress, but it also supports the development of better public transport. In the long run, congestion pricing can help cities become cleaner, quieter and more livable places."], "translations": ["许多城市的政府在交通高峰时段征收拥堵费，以努力减轻拥堵。我坚信，这项政策是一种积极发展，因为它有助于缓解环境问题，并鼓励更可持续的交通选择。", "拥堵费的一个主要好处，是能减少道路上的私家车数量。提高高峰期驾车成本会抑制不必要的汽车出行，从而降低车流量。因此，空气污染和噪声污染显著减少，改善人口密集城市地区的整体环境质量。这对大城市尤其重要，因为过度使用汽车是拥堵的主要原因之一。", "另一个重要优点是对通勤者福祉的积极影响。严重拥堵经常导致出行时间延长，带来压力、挫败感和精神疲劳。拥堵费通过疏通车流，让日常出行更可预期、没那么疲惫。此外，收费产生的收入可用于改善公共交通，例如扩展公交和地铁服务。这会进一步鼓励人们放弃私家车，形成更高效、更均衡的交通网络。", "总之，我坚信高峰期征收拥堵费是积极的一步。该政策不仅减少污染和交通压力，也支持更好的公共交通发展。长远来看，拥堵收费能够帮助城市变得更清洁、更安静、更宜居。"], "kind": "积极／消极发展", "stance": "明确认为积极，论证环境与通勤两类收益。", "structure": [{"title": "引言", "role": "", "points": ["改写政策并表明积极立场。"]}, {"title": "主体一", "role": "", "points": ["1 条主链：收费 → 减少不必要驾车 → 车流和污染下降。"]}, {"title": "主体二", "role": "", "points": ["2 项相关收益：减轻通勤压力；收费收入投入公交形成进一步改善。"]}, {"title": "结论", "role": "", "points": ["重申两类收益与长期结果。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "alleviate", "t": "alleviate v.", "e": "缓解痛苦、压力、问题。"}, {"p": 1, "c": "vocab", "q": "densely populated", "t": "densely populated", "e": "人口密集的；densely 为副词。"}, {"p": 2, "c": "vocab", "q": "commuters", "t": "commuters n.", "e": "通勤者。"}, {"p": 2, "c": "vocab", "q": "fatigue", "t": "fatigue n.", "e": "疲劳，mental fatigue 指精神疲劳。"}, {"p": 2, "c": "vocab", "q": "revenue", "t": "revenue n.", "e": "收入，本文为收费所得。"}, {"p": 3, "c": "syntax", "q": "Not only does this policy reduce", "t": "Not only 前置倒装", "e": "Not only 放句首，助动词 does 前置；后接 but it also supports …。"}, {"p": 2, "c": "syntax", "q": "revenue generated from these charges", "t": "过去分词后置修饰", "e": "generated … 修饰 revenue，相当于收入“由收费产生”。"}, {"p": 1, "c": "syntax", "q": "By increasing the cost of driving", "t": "By + doing 的主语问题", "e": "后接被动句 unnecessary car journeys are discouraged，逻辑执行者不一致；改为 governments can discourage … 更清楚。"}, {"p": 0, "c": "link", "q": "in an effort to", "t": "目的短语", "e": "表示采取收费措施是为了缓解拥堵。"}, {"p": 1, "c": "link", "q": "As a result", "t": "结果", "e": "承接车流减少，推出污染下降。"}, {"p": 2, "c": "link", "q": "In addition", "t": "补充", "e": "从通勤体验补充资金用途。"}, {"p": 0, "c": "expression", "q": "peak hours", "t": "peak hours / rush hours", "e": "交通高峰时段的近义替换。"}, {"p": 2, "c": "expression", "q": "easing traffic flow", "t": "ease traffic flow", "e": "缓解交通压力；也可说 improve traffic flow。"}, {"p": 3, "c": "expression", "q": "more livable", "t": "livable adj.", "e": "宜居的，用于城市话题。"}], "sourcePage": 6}, {"id": "essay-06", "title": "远程工作对雇主无益", "question": "Many employees can now do their work from home using modern technology. However, this change may only benefit workers, not the employers.\nTo what extent do you agree or disagree?", "qzh": "许多员工现在可借助现代科技在家工作。然而，这种变化可能只对员工有利，对雇主无益。你在多大程度上同意或不同意？", "paragraphs": ["Many employees are now able to work from home with the help of modern technology. However, some people argue that this development benefits only workers rather than employers. I largely agree with this view, as the advantages for employees are more direct and substantial, while the benefits for employers are relatively limited and conditional.", "One major reason why remote work mainly benefits employees is the flexibility it provides. Working from home allows individuals to arrange their working hours more freely and better balance professional responsibilities with personal needs. This flexibility leads to higher job satisfaction and reduced stress, which are immediate and personal advantages for workers. For example, employees can adjust their schedules to meet family responsibilities without compromising their work performance, something that is far less achievable in a traditional office setting.", "Another significant benefit for employees is the improvement in work-life balance. By eliminating long commutes, workers can spend more time with their families and maintain better mental well-being. This not only improves overall quality of life but also helps prevent long-term issues such as burnout and chronic stress. From the employers’ perspective, remote work may reduce certain operational costs, such as office space and utilities. However, these savings are often inconsistent and may be offset by investments in digital infrastructure and remote management systems.", "Despite some potential advantages for employers, managing a remote workforce remains demanding. Monitoring employee performance, ensuring collaboration and maintaining productivity can be problematic, particularly in large organisations. Unlike employees, who experience daily and tangible benefits, employers must rely heavily on effective supervision and technology to achieve comparable outcomes. As a result, while employers may gain indirect or short-term benefits, employees enjoy clearer and more consistent advantages from working remotely.", "In conclusion, although working from home can offer certain benefits to employers, these are generally limited and highly dependent on management quality and technology. In contrast, employees benefit more directly and reliably, especially in terms of flexibility and work-life balance."], "translations": ["许多员工如今能够借助现代科技在家工作。不过，有人认为这种发展只让员工而非雇主受益。我大体同意这一观点，因为员工获得的好处更直接、更显著，而雇主的收益相对有限且有条件。", "远程工作主要让员工受益的一个重要原因，是它提供的灵活性。在家工作使个人能更自由地安排工作时间，更好地平衡职业责任和个人需要。这种灵活性带来更高的工作满意度和更低的压力，是员工直接且个人化的收益。例如，员工可以调整时间表履行家庭责任，同时不损害工作表现，而这在传统办公室环境中更难做到。", "员工的另一个显著收益是工作与生活更平衡。省去漫长通勤后，员工可以花更多时间陪伴家人，并保持更好的心理健康。这不仅改善整体生活质量，也有助于预防职业倦怠和长期压力等问题。从雇主角度看，远程工作可能减少办公空间和水电等运营成本。然而，这些节省往往不稳定，可能被数字基础设施和远程管理系统的投入抵消。", "尽管雇主可能获得一些好处，管理远程员工队伍仍然很有挑战。监督员工表现、确保协作、维持生产效率可能存在困难，尤其在大型组织中。员工每天得到切实好处，与之不同，雇主必须高度依靠有效监督和技术，才能获得可比的结果。因此，雇主可能获得间接或短期收益，员工则从远程工作中享有更清楚、更稳定的好处。", "总之，虽然在家工作可以给雇主带来一定收益，但这些收益通常有限，而且高度取决于管理质量和技术。相比之下，员工得到的好处更直接、更可靠，尤其体现在灵活性及工作生活平衡上。"], "kind": "同意与否", "stance": "原题是“只让员工受益”；范文实际论证“员工收益更多”，承认雇主受益后应明确部分同意而非偷换范围。", "structure": [{"title": "引言", "role": "", "points": ["对比员工直接收益与雇主有条件收益。"]}, {"title": "主体一", "role": "", "points": ["灵活性 → 安排家庭责任 → 满意度提高。"]}, {"title": "主体二", "role": "", "points": ["通勤减少 → 生活平衡；同时承认雇主节约成本但有抵消因素。"]}, {"title": "主体三", "role": "", "points": ["雇主管理成本与困难", "与员工日常可感知的收益对照。"]}, {"title": "结论", "role": "", "points": ["强调收益程度的差异，而非完全没有收益。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "conditional", "t": "conditional adj.", "e": "有条件的，取决于某些前提。"}, {"p": 2, "c": "vocab", "q": "burnout", "t": "burnout n.", "e": "长期工作压力造成的身心倦怠。"}, {"p": 2, "c": "vocab", "q": "utilities", "t": "utilities n.", "e": "水、电等公用服务。"}, {"p": 2, "c": "vocab", "q": "offset", "t": "offset v.", "e": "抵消；这里节省被新增投入抵消。"}, {"p": 3, "c": "vocab", "q": "tangible", "t": "tangible adj.", "e": "切实可感知的。"}, {"p": 3, "c": "vocab", "q": "supervision", "t": "supervision n.", "e": "监督、管理。"}, {"p": 1, "c": "syntax", "q": "allows individuals to arrange", "t": "allow sb to do", "e": "允许／使某人能够做某事；后面 arrange 与 balance 并列。"}, {"p": 1, "c": "syntax", "q": "without compromising their work performance", "t": "without + doing", "e": "在不损害工作表现的前提下。"}, {"p": 3, "c": "syntax", "q": "Monitoring employee performance, ensuring collaboration and maintaining productivity", "t": "并列动名词作主语", "e": "三个管理任务并列，后接 can be problematic。"}, {"p": 2, "c": "link", "q": "From the employers’ perspective", "t": "转换观察角度", "e": "从员工好处切换到雇主成本。"}, {"p": 3, "c": "link", "q": "Unlike employees", "t": "Unlike + 名词：对比", "e": "unlike 是介词；说明雇主获得收益的方式不同。"}, {"p": 4, "c": "link", "q": "In contrast", "t": "对照", "e": "与雇主有限、有条件的收益对照。"}, {"p": 1, "c": "expression", "q": "job satisfaction", "t": "job satisfaction", "e": "工作满意度，常用就业话题名词。"}, {"p": 2, "c": "expression", "q": "work-life balance", "t": "work-life balance", "e": "工作与生活的平衡。"}, {"p": 2, "c": "expression", "q": "operational costs", "t": "operational costs", "e": "运营成本；具体例子为办公空间和水电。"}], "sourcePage": 7}, {"id": "essay-07", "title": "极限运动", "question": "Extreme sports such as skydiving and skiing are very dangerous and should be banned.\nTo what extent do you agree or disagree with this view?", "qzh": "跳伞、滑雪等极限运动非常危险，应该禁止。你在多大程度上同意或不同意？", "paragraphs": ["Nowadays, extreme sports are increasing in popularity around the world, with extreme sports competitions offering thrill and adventure to all participants involved. Though some people are in favor of outlawing these dangerous sports, I think that everyone should have the freedom to participate in extreme sports.", "On one hand, it is true that extreme sports such as water rafting, car racing, kickboxing, and sky diving are inherently risky. People who are inexperienced might be reckless and unprepared, which would increase the likelihood of a life-threatening injury. Even a skilled and highly experienced sports person could make a minor mistake and end up getting severely injured or losing their lives. For example, the famous snowboarder Caleb Moore attempted a backflip on his snowmobile during a competition, but he ended up in a violent crash, eventually passing away from complications resulting from his injury. Accidents like these are not only devastating to the competitors, but also to their friends, families, and dedicated fans.", "Nevertheless, even though extreme sports are risky, people should still have the freedom to participate in them as they wish. Extreme sports competitors generally relish the challenge, thrill, and adrenaline rush inherent in these sports activities, and many are well-aware and accepting of the risks involved. What's more, extreme sports often bring glorious fame and prestige to the competitors and even recognition to their country. Since extreme sports are significantly more challenging and require more advanced technique than other sports, competitors often feel a sense of pride in their accomplishments. Rather than outright banning extreme sports, governments should ensure that the sports facilities meet the required legal standards of safety and that all competitors take the necessary precautions.", "In conclusion, I believe that—despite the risks—people should have the freedom to participate in extreme sports because it provides immense excitement and adventure to many."], "translations": ["如今，极限运动在世界各地越来越受欢迎，各类极限运动比赛为参与者带来刺激与冒险。虽然有些人支持取缔这些危险运动，但我认为每个人都应有参加极限运动的自由。", "一方面，漂流、赛车、踢拳、跳伞等极限运动确实具有内在风险。缺乏经验的人可能鲁莽且准备不足，增加危及生命的受伤风险。即使技术娴熟、经验丰富的运动员，也可能因小错误而严重受伤甚至丧生。例如，范文称著名滑雪板运动员 Caleb Moore 在比赛中驾驶雪地摩托尝试后空翻，却发生猛烈撞击，最终死于伤势引起的并发症。这类事故不仅对参赛者造成沉重打击，对他们的朋友、家人和忠实粉丝也一样。", "不过，即便极限运动有风险，人们仍应有按意愿参与的自由。极限运动选手通常享受这些活动固有的挑战、刺激和肾上腺素激增感，许多人也充分了解并接受风险。此外，极限运动往往给选手带来荣耀、名望，甚至为国家赢得认可。由于这些运动比其他运动更有挑战、要求更高技术，选手通常会为自己的成就感到自豪。政府不应完全禁止极限运动，而应确保设施符合所要求的法定安全标准，所有参赛者也采取必要的预防措施。", "总之，我认为，尽管存在风险，人们仍应有参加极限运动的自由，因为它为许多人带来极大的刺激和冒险体验。"], "kind": "同意与否", "stance": "承认危险，但反对禁令；提倡安全监管。文中人物身份与事故细节未提供来源，不宜直接背成事实论据。", "structure": [{"title": "引言", "role": "", "points": ["承认争议，表明参与自由。"]}, {"title": "主体一", "role": "", "points": ["让步：风险无法完全消除", "经验不足和经验丰富者均可能受伤，再举事故例子。"]}, {"title": "主体二", "role": "", "points": ["自由与个人价值；荣誉和成就", "最后提出监管替代禁令。"]}, {"title": "结论", "role": "", "points": ["重申自由及体验价值。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "outlawing", "t": "outlaw v.", "e": "宣布非法、禁止。"}, {"p": 1, "c": "vocab", "q": "inherently", "t": "inherently adv.", "e": "内在地、固有地。"}, {"p": 1, "c": "vocab", "q": "reckless", "t": "reckless adj.", "e": "鲁莽的，不顾风险的。"}, {"p": 1, "c": "vocab", "q": "complications", "t": "complications n.", "e": "此处为医疗上的并发症。"}, {"p": 2, "c": "vocab", "q": "relish", "t": "relish v.", "e": "非常享受、喜爱。"}, {"p": 2, "c": "vocab", "q": "prestige", "t": "prestige n.", "e": "声望、威望。"}, {"p": 1, "c": "syntax", "q": "end up getting severely injured", "t": "end up + doing", "e": "最终落得某种结果；getting injured 为被动含义。"}, {"p": 2, "c": "syntax", "q": "ensure that the sports facilities meet", "t": "ensure that … and that …", "e": "两个 that 从句分别说明设施达标与选手采取预防措施。"}, {"p": 3, "c": "syntax", "q": "because it provides", "t": "指代问题", "e": "it 与前面的 extreme sports 复数不一致；可改为 these activities provide。"}, {"p": 2, "c": "link", "q": "Nevertheless", "t": "让步转折", "e": "承认上一段风险后，坚持不应全面禁止。"}, {"p": 2, "c": "link", "q": "Since extreme sports", "t": "Since：原因", "e": "说明为什么选手具有成就感。"}, {"p": 2, "c": "link", "q": "Rather than outright banning", "t": "rather than：替代方案", "e": "从禁止转为监管设施和预防措施。"}, {"p": 2, "c": "expression", "q": "take the necessary precautions", "t": "take precautions", "e": "采取预防措施，安全类常用搭配。"}, {"p": 0, "c": "expression", "q": "increasing in popularity", "t": "increase in popularity", "e": "越来越受欢迎，避免只用 more popular。"}, {"p": 2, "c": "expression", "q": "a sense of pride in their accomplishments", "t": "a sense of pride / accomplishments", "e": "成就带来的自豪感；品质与动机表达。"}], "sourcePage": 8}, {"id": "essay-08", "title": "家用电器", "question": "In many countries people can buy a wide range of household goods (for example, TV, microwave ovens and rice cookers).\nIs it a positive or negative development?", "qzh": "许多国家的人们可以买到种类繁多的家用品，例如电视、微波炉和电饭煲。这是积极还是消极的发展？", "paragraphs": ["In modern society, an increasing number of people purchase various household appliances such as televisions, microwaves and rice cookers. In my view, this trend brings more advantages than disadvantages, though some negative consequences cannot be ignored.", "To begin with, these goods have greatly enhanced convenience and comfort in people’s daily routines. For instance, microwaves and rice cookers shorten the time spent on preparing meals, which is particularly beneficial for working professionals who often struggle to balance career and family responsibilities. Similarly, washing machines and vacuum cleaners reduce physical labour, allowing individuals to allocate their time to more meaningful or productive activities. As a result, the overall quality of life has improved remarkably.", "Moreover, household devices such as televisions and smart speakers provide people with easy access to information, knowledge and entertainment. This not only broadens horizons but also helps people stay connected with global events. In a fast-paced world, being well-informed is crucial, and technology makes this process far more efficient than in the past.", "Nevertheless, the rapid consumption of these products also generates challenges. The production and disposal of electronic appliances lead to environmental degradation, especially in the form of e-waste. Additionally, overdependence on machines may discourage physical activity, contributing to sedentary lifestyles and health concerns such as obesity.", "In conclusion, although there are undeniable drawbacks, I believe the positive aspects of using household goods outweigh the negatives. With stronger recycling systems and greater awareness of healthy living, the benefits of these devices can be maximised while minimising their harmful effects."], "translations": ["现代社会中，越来越多人购买电视、微波炉、电饭煲等各种家用电器。我认为这一趋势利大于弊，不过一些负面后果也不可忽视。", "首先，这些产品极大提高了日常生活的便利和舒适程度。例如，微波炉和电饭煲缩短做饭时间，对经常难以兼顾职业和家庭责任的上班族尤其有益。同样，洗衣机和吸尘器减少体力劳动，让人们能把时间用于更有意义或更有效率的活动。因此，整体生活质量显著改善。", "此外，电视和智能音箱等家用设备让人们容易获取信息、知识和娱乐。这不仅开阔眼界，也帮助人们跟上全球事件。在快节奏的世界中，了解信息至关重要，而科技使这一过程比过去高效得多。", "不过，这些产品的快速消费也产生挑战。电子电器的生产和废弃处置导致环境恶化，尤其是电子垃圾问题。此外，对机器的过度依赖可能减少身体活动，促成久坐生活方式及肥胖等健康问题。", "总之，虽然存在不可否认的弊端，我仍认为使用家用产品的积极方面超过消极方面。通过更完善的回收体系和更强的健康生活意识，可以在减少危害的同时，把这些设备的益处发挥到最大。"], "kind": "积极／消极发展", "stance": "总体积极，安排两段优点、一段弊端，再提出减害条件。", "structure": [{"title": "引言", "role": "", "points": ["总体利大于弊。"]}, {"title": "主体一", "role": "", "points": ["便利：缩短家务时间、减轻劳动 → 可重新分配时间。"]}, {"title": "主体二", "role": "", "points": ["信息与娱乐获取 → 开阔眼界、保持知情。"]}, {"title": "主体三", "role": "", "points": ["2 点风险：电子垃圾；过度依赖导致少动。"]}, {"title": "结论", "role": "", "points": ["综合判断并提出回收和健康意识。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "appliances", "t": "appliances n.", "e": "家用电器、器具。"}, {"p": 1, "c": "vocab", "q": "allocate", "t": "allocate v.", "e": "分配，此处为分配时间。"}, {"p": 3, "c": "vocab", "q": "disposal", "t": "disposal n.", "e": "处理、处置，本文指废弃电器处置。"}, {"p": 3, "c": "vocab", "q": "degradation", "t": "degradation n.", "e": "恶化、退化。"}, {"p": 3, "c": "vocab", "q": "sedentary", "t": "sedentary adj.", "e": "久坐的、缺乏活动的。"}, {"p": 1, "c": "syntax", "q": "the time spent on preparing meals", "t": "过去分词修饰名词", "e": "spent on … 修饰 time，相当于 time that is spent …。"}, {"p": 1, "c": "syntax", "q": "allowing individuals to allocate", "t": "allowing 表示结果", "e": "前文减少劳动，后文解释腾出的时间可以怎样使用。"}, {"p": 4, "c": "syntax", "q": "can be maximised while minimising", "t": "被动与省略主语", "e": "句意可懂，但 while 的动作执行者不明确；用 people can maximise … while minimising … 更平行。"}, {"p": 1, "c": "link", "q": "Similarly", "t": "类比补充", "e": "把烹饪电器的例子扩展到清洁电器。"}, {"p": 3, "c": "link", "q": "Nevertheless", "t": "转折", "e": "由两段优点转入环境与健康风险。"}, {"p": 4, "c": "link", "q": "With stronger recycling systems", "t": "With + 名词短语", "e": "说明改善结果所依赖的条件。"}, {"p": 2, "c": "expression", "q": "easy access to", "t": "have access to", "e": "有机会或条件获取信息；access 是名词。"}, {"p": 2, "c": "expression", "q": "broadens horizons", "t": "broaden horizons", "e": "开阔眼界，信息与教育类搭配。"}, {"p": 0, "c": "expression", "q": "household appliances", "t": "goods / appliances / devices", "e": "goods 范围最广；appliances 指电器；devices 强调设备，不是任意互换。"}], "sourcePage": 9}, {"id": "essay-09", "title": "文物的归还", "question": "Historical objects in museums all over the world should be returned to their country of origin.\nTo what extent do you agree or disagree?", "qzh": "世界各地博物馆中的历史文物应归还原属国。你在多大程度上同意或不同意？", "paragraphs": ["In recent years, whether old historical objects in foreign museums should be sent back to their home countries has become a big debate. In my opinion, I partially agree with this idea. Returning these items respects history and builds local pride, but keeping some of them in big international museums protects them from damage and helps more people learn about different cultures.", "On the one hand, returning historical objects brings clear benefits to their home countries. Firstly, returning old objects helps fix past mistakes and makes countries friendlier. Many treasures were taken away during past wars. When foreign countries return them, it shows respect for the local history, which helps heal past hurts and brings different nations together. Secondly, showing local treasures at home makes local people proud of their culture. These objects are important symbols of a country's history. When local people can see them in person, they can easily learn about their past, which makes them feel more connected to their home and culture.", "On the other hand, there are good reasons why not all objects should be sent back immediately. For one thing, moving old and weak objects over long distances can easily break them. Many ancient items are very old and can be ruined by long trips or changes in weather and temperature. Therefore, keeping them in modern, safe museums is a better choice. Furthermore, big international museums make it easy for people to learn about different cultures in one place. Famous places like the British Museum welcome millions of visitors each year. Showing objects from all over the world in one museum allows tourists to learn about different cultures at the same time, spreading knowledge around the globe.", "In conclusion, I partially agree that historical items should be sent back to where they came from. Returning them rights past wrongs and makes local people proud. However, to keep these objects safe and help more people learn, countries should talk and work together rather than returning everything right away."], "translations": ["近年来，外国博物馆里的历史文物是否应送回原属国成为重大争论。我部分同意这一观点。归还这些物品能尊重历史、建立本地人的自豪感，但把其中一部分留在大型国际博物馆能够保护它们免受损害，也帮助更多人了解不同文化。", "一方面，归还历史文物对原属国有明显好处。首先，归还古物有助于纠正过去的错误，改善国家间关系。许多珍宝是在过去的战争中被带走的。外国归还它们，体现对当地历史的尊重，有助于弥合旧伤、拉近国家之间的距离。其次，在本国展示本地珍宝会让当地人为自己的文化自豪。这些物品是国家历史的重要象征。当地人能够亲眼看到它们，就更容易了解过去，增强与故土及文化的联系。", "另一方面，并非所有物品都应立即送回，也有充分理由。其一，长距离运输古老、脆弱的物品容易使其破损。许多古物年代久远，长途旅行或天气和温度变化都可能损坏它们。因此，将它们保存在现代、安全的博物馆中是更好的选择。此外，大型国际博物馆方便人们在同一个地方了解不同文化。大英博物馆等知名场所每年迎接数百万访客。在同一博物馆展示世界各地的物品，让游客同时了解多种文化，使知识传播到全球。", "总之，我部分同意历史文物应归还原属地。归还能够纠正历史错误，并让当地人自豪。然而，为了保护文物并帮助更多人学习，各国应沟通合作，而不是立即归还一切。"], "kind": "同意与否", "stance": "部分同意；归还的文化价值与保存、传播价值对照。", "structure": [{"title": "引言", "role": "", "points": ["明确部分同意，并预告双方理由。"]}, {"title": "主体一", "role": "", "points": ["2 点：修复历史关系；强化文化认同。"]}, {"title": "主体二", "role": "", "points": ["2 点：运输保护风险；跨文化展示价值。"]}, {"title": "结论", "role": "", "points": ["建议协商而非一概立即归还", "保存能力应按实际情况判断，不能假定外国必然更好。"]}], "readerNotes": [{"p": 1, "c": "vocab", "q": "treasures", "t": "treasures n.", "e": "珍宝、宝贵文物。"}, {"p": 2, "c": "vocab", "q": "ruined", "t": "ruin v.", "e": "毁坏、严重损害。"}, {"p": 3, "c": "vocab", "q": "rights past wrongs", "t": "right v.", "e": "熟词生义：纠正。rights past wrongs＝纠正过去的不公。"}, {"p": 0, "c": "syntax", "q": "whether old historical objects in foreign museums should be sent back", "t": "whether 从句作主语", "e": "整个“是否应归还”的问题作 has become 的主语。"}, {"p": 2, "c": "syntax", "q": "there are good reasons why", "t": "there are reasons why …", "e": "why 从句说明理由所对应的判断。"}, {"p": 2, "c": "syntax", "q": "allows tourists to learn", "t": "allow sb to do", "e": "展示各国文物使游客能了解多元文化。"}, {"p": 1, "c": "link", "q": "Firstly", "t": "Firstly / Secondly", "e": "一段内部明确区分两项归还理由。"}, {"p": 2, "c": "link", "q": "For one thing", "t": "分点开头", "e": "提出运输风险，再用 Furthermore 补充文化传播价值。"}, {"p": 3, "c": "link", "q": "rather than", "t": "对比选择", "e": "协商合作优于立即全部归还。"}, {"p": 0, "c": "expression", "q": "historical objects", "t": "objects / items / treasures", "e": "objects、items 泛指物品；treasures 增加珍贵的评价色彩。"}, {"p": 1, "c": "expression", "q": "in person", "t": "in person", "e": "亲自、亲眼，区别于借助图片或媒体。"}, {"p": 1, "c": "expression", "q": "symbols of a country's history", "t": "symbols of history", "e": "历史的象征；文化类名词搭配。"}], "sourcePage": 10}, {"id": "essay-10", "title": "公司工厂迁移", "question": "Traffic and housing problems could be solved by moving large companies, factories and their employees to the countryside.\nTo what extent do you agree or disagree?", "qzh": "将大公司、工厂及其员工迁往乡村可以解决交通和住房问题。你在多大程度上同意或不同意？", "paragraphs": ["In today’s world, it is widely believed that relocating large companies, factories, and their employees to rural areas could effectively solve urban problems such as traffic congestion and housing shortages. I completely agree with this view because such a move would significantly reduce both traffic pressure and the demand for accommodation in cities.", "The first and foremost benefit of moving big enterprises and factories to the countryside is the reduction of traffic congestion in urban centers. When businesses and their employees relocate to rural regions, the number of daily commuters traveling to and from cities will decline sharply. Consequently, there will be fewer vehicles on the roads, leading to smoother traffic flow and less pollution. For example, a recent study in the United States and the United Kingdom revealed that government incentives encouraging major corporations to establish offices and factories outside urban areas resulted in a noticeable decline in congestion levels in cities such as New York and London between 2000 and 2020. This demonstrates that decentralizing industries can be an effective strategy to mitigate urban traffic problems.", "In addition, this policy could help alleviate housing shortages in metropolitan areas. Big companies often create attractive employment opportunities, drawing large numbers of workers to live near their workplaces. This influx of people drives up housing demand and property prices, making it difficult for residents to find affordable accommodation. However, by relocating these enterprises to the countryside, cities would experience reduced population density, easing the housing crisis. At the same time, this would promote development in rural areas by making better use of underutilized land and infrastructure.", "In conclusion, I firmly believe that transferring major companies, factories, and their employees to rural areas can effectively address two pressing urban challenges—traffic congestion and housing shortages. This approach not only improves living conditions in cities but also contributes to balanced regional development."], "translations": ["当今世界，人们普遍认为，把大公司、工厂及其员工迁往农村地区，能够有效解决城市交通拥堵和住房短缺等问题。我完全同意，因为这种迁移能显著降低城市的交通压力和住房需求。", "大型企业和工厂迁往乡村的首要好处，是减少城市中心的交通拥堵。当企业及员工迁往农村地区，每天往返城市的通勤者会大幅减少。因此，道路车辆更少，交通更顺畅，污染更轻。例如，范文称美国和英国的一项近期研究发现，政府鼓励大企业在城市以外设立办公室和工厂的激励措施，使纽约、伦敦等城市在2000年至2020年间的拥堵程度明显下降。这说明，分散产业可以是缓解城市交通问题的有效策略。", "此外，这项政策能够缓解大都市地区的住房短缺。大公司往往创造有吸引力的就业机会，吸引大量员工住到工作地点附近。人口流入推高住房需求和房价，使居民难以找到负担得起的住处。但把这些企业迁往乡村，会降低城市人口密度，缓解住房危机。同时，这也能通过更充分利用闲置土地和基础设施，促进农村发展。", "总之，我坚信将大公司、工厂及员工迁往农村地区，能有效应对交通拥堵和住房短缺这两项紧迫的城市挑战。这不仅改善城市居住条件，也有助于地区均衡发展。"], "kind": "同意与否", "stance": "完全同意。文中的“近期研究”未给出处，具体城市及年份不应当作已核实证据。", "structure": [{"title": "引言", "role": "", "points": ["表态完全同意，预告交通与住房两个论点。"]}, {"title": "主体一", "role": "", "points": ["企业和员工外迁 → 通勤人数减少 → 车流下降", "研究例子缺少来源。"]}, {"title": "主体二", "role": "", "points": ["解释公司吸引人口及推高房价的机制，再反推外迁的好处", "补充农村发展。"]}, {"title": "结论", "role": "", "points": ["汇总两大城市问题及区域均衡收益。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "relocating", "t": "relocate v.", "e": "搬迁、迁址。"}, {"p": 1, "c": "vocab", "q": "incentives", "t": "incentives n.", "e": "激励措施，例如补贴或优惠。"}, {"p": 1, "c": "vocab", "q": "decentralizing", "t": "decentralize v.", "e": "使分散、减少集中。"}, {"p": 2, "c": "vocab", "q": "metropolitan", "t": "metropolitan adj.", "e": "大都市的。"}, {"p": 2, "c": "vocab", "q": "influx", "t": "influx n.", "e": "大量涌入，本文指人口流入。"}, {"p": 2, "c": "vocab", "q": "underutilized", "t": "underutilized adj.", "e": "未充分利用的。"}, {"p": 0, "c": "syntax", "q": "it is widely believed that", "t": "It is believed that …", "e": "被动报告结构，用来引出一种普遍观点，不等于证实其正确。"}, {"p": 2, "c": "syntax", "q": "making it difficult for residents to find", "t": "make it + adj. + for sb + to do", "e": "it 为形式宾语，不定式说明真正困难的事。"}, {"p": 1, "c": "link", "q": "Consequently", "t": "结果", "e": "承接通勤人数减少，说明车辆、交通和污染的变化。"}, {"p": 2, "c": "link", "q": "At the same time", "t": "同时补充", "e": "从城市减压扩展到农村发展。"}, {"p": 2, "c": "link", "q": "by relocating these enterprises", "t": "by + doing", "e": "表实现方法，但主句 cities 非搬迁执行者；可写 relocating … would reduce …。"}, {"p": 0, "c": "expression", "q": "traffic congestion and housing shortages", "t": "交通与住房搭配", "e": "交通拥堵、住房短缺，常见城市话题名词组合。"}, {"p": 2, "c": "expression", "q": "drives up housing demand", "t": "drive up", "e": "推高需求或价格。"}, {"p": 1, "c": "expression", "q": "mitigate urban traffic problems", "t": "mitigate / alleviate", "e": "在本文均为缓解问题，而非完全消除。"}], "sourcePage": 11}, {"id": "essay-11", "title": "追寻理想社会", "question": "Throughout history, people have dreamed of living in a perfect society, while they have not agreed on what the ideal society would be like.\nWhat do you think is the most important element that makes a perfect society?\nHow do people achieve an ideal society?", "qzh": "历史上，人们梦想生活在完美社会中，却未就理想社会的样貌达成共识。你认为最重要的构成因素是什么？人们如何实现理想社会？", "paragraphs": ["Since the last few centuries, creating a perfect community has been a desire of many intellectuals, although they haven’t identified the character of an ideal society. This essay will discuss the crucial elements to build an ideal society as well as the ways to get it in the following paragraphs.", "To begin with, the vital element to building an ideal community, the most important element is education. This element brings many benefits not only to an individual but also to the whole of mankind. For instance, educated members of society can think independently and they can remove social vices. Education can eradicate the practices of discrimination in society, and as a result, harmony and peace will build up in society, which is the most essential part of any perfect society. Moreover, health plays a vital role in the creation of a society. The healthy members of society are more productive; their energy and resources can be fully utilized for the development of society, instead of curing and defending the health-related problems of the members.", "On the other hand, to achieve a perfect community these elements should be used by people effectively and efficiently. Educated people should provide their services to all segments of society. For example, the medical field, science, literature, and, many other fields need dedicated scholars to develop them. The culture and traditions should be wisely preserved by the people. Furthermore, healthy people in society can work effectively. Hence, to achieve an ideal society the citizens have to work together without any discrimination in any section of the industry.", "In conclusion, the intellectuals should utilize the most important elements of the society such as education and health. The integrated efforts of people could achieve a dream of a perfect society."], "translations": ["过去几个世纪以来，建立完美社会一直是许多知识分子的愿望，尽管他们尚未明确理想社会的特征。本文将在下文讨论建立理想社会的关键因素及实现途径。", "首先，建立理想社会最重要的因素是教育。这不仅给个人，也给全人类带来许多好处。例如，受教育的社会成员能够独立思考，并消除社会弊病。教育能够消除社会中的歧视做法，进而促进和谐与和平，而这正是任何完美社会最重要的部分。此外，健康在社会建设中发挥重要作用。健康的社会成员更有生产力，其精力和资源可充分用于社会发展，而非用于治疗和应对成员的健康问题。", "另一方面，要实现完美社会，人们应有效、高效地利用这些因素。受教育的人应向社会各阶层提供服务。例如，医疗、科学、文学等许多领域需要投入的学者推动发展。人们应明智地保存文化和传统。此外，健康的社会成员能高效工作。因此，要实现理想社会，公民必须在各个行业中不带歧视地共同努力。", "总之，知识分子应利用教育和健康等社会最重要的因素。人们共同努力能够实现完美社会的梦想。"], "kind": "双问题：重要因素＋实现方法", "stance": "正文把教育称为最重要因素，又补充健康。应让“最重要”的主次更明确；本篇语言质量参差。题干已修复明显粘连并规范语法，原始提取文本另存。", "structure": [{"title": "引言", "role": "", "points": ["宣告讨论因素与方法", "Since the last few centuries 不自然，应为 Over the past few centuries。"]}, {"title": "主体一", "role": "", "points": ["教育：独立思考、减少歧视、促进和谐；健康：生产力与资源利用", "开头重复 element，句法需重写。"]}, {"title": "主体二", "role": "", "points": ["专业服务、文化保存、公民合作", "文化保存与前文教育健康的关联解释不足。"]}, {"title": "结论", "role": "", "points": ["汇总教育健康与共同努力。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "intellectuals", "t": "intellectuals n.", "e": "知识分子。"}, {"p": 1, "c": "vocab", "q": "social vices", "t": "social vices", "e": "社会弊病；vice 在此不是“副”。"}, {"p": 1, "c": "vocab", "q": "eradicate", "t": "eradicate v.", "e": "根除、消除，语气较强。"}, {"p": 1, "c": "vocab", "q": "discrimination", "t": "discrimination n.", "e": "歧视。"}, {"p": 2, "c": "vocab", "q": "segments", "t": "segments n.", "e": "部分、群体；all segments of society＝社会各阶层。"}, {"p": 1, "c": "syntax", "q": "not only to an individual but also to the whole of mankind", "t": "not only … but also …", "e": "并列两个 to 介词短语，强调个人与社会双重收益。"}, {"p": 1, "c": "syntax", "q": "which is the most essential part", "t": "which 非限制性定语从句", "e": "补充说明和谐和平的价值；指代范围应避免模糊。"}, {"p": 1, "c": "link", "q": "as a result", "t": "结果", "e": "教育减少歧视后，推导和谐与和平。"}, {"p": 2, "c": "link", "q": "On the other hand", "t": "衔接不够准确", "e": "此处从因素转到办法，并非对立面；To achieve this 更符合关系。"}, {"p": 2, "c": "link", "q": "Hence", "t": "结果", "e": "由各方提供服务、有效工作归纳到共同努力。"}, {"p": 1, "c": "expression", "q": "plays a vital role", "t": "play a vital role in", "e": "在……中发挥重要作用。"}, {"p": 2, "c": "expression", "q": "dedicated scholars", "t": "dedicated adj.", "e": "投入的、敬业的，描述人的品质。"}, {"p": 3, "c": "expression", "q": "integrated efforts", "t": "integrated efforts", "e": "协同努力；此处用 joint efforts 更常见。"}], "sourcePage": 12}, {"id": "essay-12", "title": "科技发展对犯罪的影响", "question": "Some people think technology development decreases crime, while others believe it actually encourages crime.\nDiscuss both views and give your own opinion.", "qzh": "有人认为科技发展减少犯罪，另一些人认为它助长犯罪。讨论双方观点并给出你自己的看法。", "paragraphs": ["The impact of technology on crime rates is a complex issue with strong arguments on both sides. Proponents believe technological advancements are a boon to public safety, while others argue they create new avenues for criminal activity. Examining these viewpoints will help us understand the true relationship between technology and crime.", "Advocates for technology's crime-fighting potential point to advancements in surveillance and law enforcement tools. Security cameras, for instance, deter crime by increasing the perceived risk of getting caught. Additionally, data analysis software helps police identify crime patterns and predict future incidents, allowing for targeted patrols and proactive measures. Furthermore, digital forensics allow for more effective investigation and prosecution of crimes.", "However, critics argue that technology can also be a breeding ground for criminal activity. The rise of the internet has facilitated cyber crime, with criminals exploiting vulnerabilities to steal data, commit fraud, or launch cyber attacks. The anonymity provided by online platforms can embolden criminals, while readily available tutorials and forums can even create a sense of community for them. Additionally, concerns exist regarding the potential misuse of surveillance technology for mass monitoring, infringing on individual privacy.", "In my opinion, technology is a double-edged sword when it comes to crime. While it undoubtedly offers valuable tools for law enforcement, it also presents new challenges. The key lies in striking a balance. We must utilize technology's benefits while remaining vigilant against its potential misuse. Investing in cyber security measures, fostering responsible online behavior, and ensuring ethical implementation of surveillance are crucial steps in this ongoing battle. By harnessing technology's power for good and addressing its pitfalls, we can create a safer future for all."], "translations": ["科技对犯罪率的影响是个复杂问题，双方都有强有力的论据。支持者认为科技进步有益于公共安全，另一些人则认为它为犯罪活动创造新途径。考察这些观点有助于理解科技与犯罪的真实关系。", "支持科技打击犯罪潜力的人，着重指出监控和执法工具的发展。例如，监控摄像头通过增加人们对被抓风险的感知来震慑犯罪。此外，数据分析软件帮助警方识别犯罪模式、预测未来事件，从而开展有针对性的巡逻和主动措施。另外，数字取证有利于更有效地调查和起诉犯罪。", "然而，批评者认为科技也可能滋生犯罪。互联网兴起便利了网络犯罪，犯罪者利用漏洞窃取数据、实施欺诈或发动网络攻击。网络平台提供的匿名性会助长犯罪者的胆量，而容易获得的教程和论坛甚至能给他们带来群体归属感。此外，也有人担忧监控技术被滥用于大规模监视，侵犯个人隐私。", "在我看来，科技在犯罪问题上具有两面性。它无疑提供了有价值的执法工具，但也带来新挑战。关键是取得平衡。我们必须利用科技的好处，同时警惕潜在滥用。投资网络安全措施、促进负责任的网络行为、确保监控的伦理实施，是持续应对这一问题的重要步骤。利用科技力量服务正当目的，并处理其缺陷，才能为所有人创造更安全的未来。"], "kind": "双边讨论＋个人观点", "stance": "前两主体段分别说明打击犯罪与助长犯罪，末段给平衡观点和对策；引言未明确个人立场，可更早说明。", "structure": [{"title": "引言", "role": "", "points": ["呈现两方观点，没有明确自己的结论。"]}, {"title": "主体一", "role": "", "points": ["3 项技术：监控震慑、数据预测巡逻、数字取证。"]}, {"title": "主体二", "role": "", "points": ["网络漏洞和匿名性促成犯罪；补充监控滥用的隐私问题", "后者不完全等于犯罪增加。"]}, {"title": "结尾观点段", "role": "", "points": ["承认两面作用，提出安全、行为与伦理三类保障。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "a boon", "t": "boon n.", "e": "有益的事物、福音。"}, {"p": 1, "c": "vocab", "q": "surveillance", "t": "surveillance n.", "e": "监视、监控。"}, {"p": 1, "c": "vocab", "q": "deter", "t": "deter v.", "e": "威慑、阻止。"}, {"p": 1, "c": "vocab", "q": "forensics", "t": "forensics n.", "e": "取证、法证技术。"}, {"p": 2, "c": "vocab", "q": "vulnerabilities", "t": "vulnerabilities n.", "e": "漏洞、弱点。"}, {"p": 2, "c": "vocab", "q": "anonymity", "t": "anonymity n.", "e": "匿名性。"}, {"p": 2, "c": "vocab", "q": "embolden", "t": "embolden v.", "e": "使更大胆、助长胆量。"}, {"p": 3, "c": "vocab", "q": "vigilant", "t": "vigilant adj.", "e": "警惕的。"}, {"p": 1, "c": "syntax", "q": "allowing for targeted patrols and proactive measures", "t": "分词短语表示结果", "e": "数据分析的结果是可以采取针对性巡逻和主动措施。"}, {"p": 2, "c": "syntax", "q": "with criminals exploiting vulnerabilities", "t": "with + 名词 + doing", "e": "补充说明网络犯罪怎样发生；criminals 是 exploiting 的逻辑主语。"}, {"p": 1, "c": "link", "q": "for instance", "t": "举例", "e": "摄像头是监控技术减少犯罪的具体例子。"}, {"p": 2, "c": "link", "q": "while readily available tutorials", "t": "while：并列对照", "e": "把匿名性和教程论坛两项促成因素并列。"}, {"p": 3, "c": "link", "q": "while remaining vigilant", "t": "while + doing", "e": "一边利用技术好处，一边保持警惕。"}, {"p": 1, "c": "expression", "q": "law enforcement", "t": "law enforcement", "e": "执法；公共安全题常用名词。"}, {"p": 2, "c": "expression", "q": "infringing on individual privacy", "t": "infringe on privacy", "e": "侵犯隐私，介词用 on。"}, {"p": 3, "c": "expression", "q": "striking a balance", "t": "strike a balance", "e": "取得平衡。"}], "sourcePage": 13}, {"id": "essay-13", "title": "交流技术影响社会关系", "question": "Many people think modern communication technology is having some negative effects on social relationships.\nDo you agree or disagree?", "qzh": "许多人认为现代通信技术正对社会关系产生负面影响。你同意还是不同意？", "paragraphs": ["Many people believe that modern communication technology has a negative impact on social relationships. I agree with this view to a large extent, as excessive reliance on digital communication can weaken face-to-face interaction and reduce the quality of personal relationships.", "One major reason why modern communication technology harms social relationships is that it reduces direct, in-person communication. Although messaging apps and social media make it easier to stay in contact, they often replace meaningful face-to-face conversations. When people communicate mainly through screens, they may miss important social cues such as tone of voice and body language. As a result, misunderstandings can occur more easily, and emotional connections may become weaker. For example, family members may spend time chatting online instead of talking to each other at home, which can gradually reduce closeness.", "Another negative effect is that constant online communication can lead to superficial relationships. Social media platforms encourage users to interact briefly and frequently, rather than engage in deep and meaningful conversations. This can create a sense of connection without real emotional support. Over time, people may have many online contacts but few close relationships they can rely on. In addition, excessive use of communication technology can cause individuals to become distracted during social interactions, making others feel ignored or unimportant.", "In conclusion, while modern communication technology offers convenience, I believe it has significant negative effects on social relationships. By reducing face-to-face communication and encouraging shallow interactions, it can weaken emotional bonds between people. Therefore, it is important to use communication technology in moderation and maintain meaningful personal connections in real life."], "translations": ["许多人认为现代通信技术对社会关系有负面影响。我在很大程度上同意，因为过度依赖数字交流可能削弱面对面互动，降低人际关系的质量。", "现代通信技术损害社会关系的一个主要原因，是减少直接的线下交流。虽然聊天软件和社交媒体方便保持联系，它们也常取代有意义的面对面对话。主要通过屏幕交流时，人们可能错过语调、肢体语言等重要社交线索。因此，误解更容易发生，情感联系也可能变弱。例如，家人可能花时间在线聊天，而非在家彼此交谈，逐渐降低亲密程度。", "另一个负面影响是，持续在线交流可能导致表面化的关系。社交平台鼓励用户频繁、简短地互动，而不是深入、有意义地交谈。这可能创造联系的感觉，却没有真正的情感支持。久而久之，人们或许有许多网上联系人，却很少有可以依靠的亲密关系。此外，过度使用通信技术可能使人在社交过程中分心，让他人感到被忽视或不受重视。", "总之，虽然现代通信技术带来便利，我认为它对社会关系有显著负面影响。它减少面对面沟通，鼓励浅层互动，因此可能削弱人与人之间的情感纽带。所以，应适度使用通信技术，并维持现实生活中有意义的人际联系。"], "kind": "同意与否", "stance": "大体同意，重点限定为过度使用和依赖。", "structure": [{"title": "引言", "role": "", "points": ["明确大体同意，预告线下交流减少与关系质量下降。"]}, {"title": "主体一", "role": "", "points": ["少面对面 → 丢失非语言信息 → 误解、亲密度下降。"]}, {"title": "主体二", "role": "", "points": ["短暂频繁互动 → 关系表面化；补充分心导致忽视感。"]}, {"title": "结论", "role": "", "points": ["概括两条机制，并建议适度使用。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "excessive reliance", "t": "excessive reliance", "e": "过度依赖。reliance 常与 on 搭配。"}, {"p": 1, "c": "vocab", "q": "social cues", "t": "social cues", "e": "社交线索，例如语气和身体语言。"}, {"p": 2, "c": "vocab", "q": "superficial", "t": "superficial adj.", "e": "表面的、缺乏深度的。"}, {"p": 2, "c": "vocab", "q": "distracted", "t": "distracted adj.", "e": "分心的。"}, {"p": 3, "c": "vocab", "q": "moderation", "t": "moderation n.", "e": "适度、节制。"}, {"p": 1, "c": "syntax", "q": "One major reason why modern communication technology harms social relationships is that", "t": "reason why … is that …", "e": "先点出需要解释的现象，再用 that 从句给原因。"}, {"p": 2, "c": "syntax", "q": "relationships they can rely on", "t": "省略关系代词", "e": "relationships 后省略 that/which，在从句中作 on 的宾语。"}, {"p": 2, "c": "syntax", "q": "making others feel ignored or unimportant", "t": "make + 宾语 + 动词原形", "e": "making 表结果；feel 后接 ignored/unimportant 描述感受。"}, {"p": 1, "c": "link", "q": "Although", "t": "让步", "e": "先承认便利，再指出线下交流被替代。"}, {"p": 2, "c": "link", "q": "rather than", "t": "对比", "e": "简短频繁互动与深入对话形成对照。"}, {"p": 2, "c": "link", "q": "Over time", "t": "时间推进", "e": "说明长期积累的后果。"}, {"p": 2, "c": "expression", "q": "emotional support", "t": "emotional support", "e": "情感支持；与“联系人数量”区别。"}, {"p": 3, "c": "expression", "q": "emotional bonds", "t": "connections / bonds", "e": "本文都表示情感联系，bonds 强调纽带。"}, {"p": 3, "c": "expression", "q": "in moderation", "t": "in moderation", "e": "适度地，修饰 use communication technology。"}], "sourcePage": 14}, {"id": "essay-14", "title": "理科的选择", "question": "Nowadays, not enough students choose science subjects in universities in many countries.\nWhy is this?\nWhat are the effects on society?", "qzh": "如今许多国家选择大学理科专业的学生不足。原因是什么？对社会有哪些影响？", "paragraphs": ["In today’s knowledge-based society, science and technology are advancing at an unprecedented rate. Despite this rapid progress, the numbers of university students who choose science subjects show a declining trend in many countries. This essay will analyze its underlying reasons and negative effects on society.", "The first reason for this trend may involve the recognition that science subjects are more challenging than other subjects. Obtaining degrees in science requires more effort. For instance, to graduate from the school of physics or chemistry, students have to learn a wide range of theoretical courses and spend many years working in laboratories. This process is lengthy and tedious, which may dissuade many young people from pursuing science as a major.", "Moreover, a lack of interest in science contributes to the low enrollment in science subjects. In a society where fame and fortune determine a person’s value, younger generations tend to idolize popular stars and influencers rather than scientists. Additionally, primary and secondary school curricula often fail to adequately emphasize the importance and appeal of science. With limited knowledge and little interest in science, fewer people choose science subjects when they enter university.", "The declining number of students in science subjects at universities has profound effects on society. There will be a shortage of personnel capable of conducting scientific study and research, as universities reduce the supply of qualified graduates majoring in science. Declining scientific research could lead to hindered innovation and technological stagnation, negatively affecting economic growth and social progress. Countries with fewer skilled scientists may struggle to keep up with advancements made by others, thus losing competitiveness in the international arena.", "In conclusion, the declining enrollment in science subjects is attributed to multiple factors, and this issue can have serious consequences for society. Efforts should be made at all levels of education to foster interest in science and to emphasize its importance in driving progress and innovation. Only by addressing these challenges can we ensure a brighter future for science and society as a whole."], "translations": ["在当今知识型社会，科学技术正以前所未有的速度进步。尽管进步迅速，许多国家选择理科的大学生人数仍呈下降趋势。本文将分析其深层原因及对社会的负面影响。", "这一趋势的第一个原因，可能是人们认为理科比其他学科更难。获得理科学位需要更多努力。例如，要从物理或化学院系毕业，学生必须学习广泛的理论课程，并在实验室工作多年。这个过程漫长且乏味，可能使许多年轻人不愿选择理科作为专业。", "此外，对科学缺乏兴趣也导致理科入学人数偏低。在名声和财富决定个人价值的社会中，年轻一代倾向于崇拜明星和网红，而不是科学家。另外，中小学课程往往未充分强调科学的重要性和吸引力。由于了解有限、兴趣不足，进入大学时选择理科的人更少。", "大学理科学生数量下降对社会有深远影响。大学培养的合格理科毕业生减少，将导致能开展科学研究的人员短缺。科研减少可能阻碍创新、使技术停滞，给经济增长和社会进步带来负面影响。缺少熟练科学家的国家可能难以跟上其他国家的发展，从而失去国际竞争力。", "总之，理科入学人数下降源于多种因素，可能对社会产生严重后果。各教育阶段都应努力培养科学兴趣，并强调科学对推动进步和创新的重要性。只有解决这些挑战，我们才能确保科学和全社会拥有更光明的未来。"], "kind": "原因＋影响", "stance": "两段原因、一段社会影响；结尾补充建议。", "structure": [{"title": "引言", "role": "", "points": ["现象与任务预告", "人数不足不必然等于持续下降，改写时需注意这一差别。"]}, {"title": "原因一", "role": "", "points": ["难度大、学制与实践投入长 → 学生不愿选择。"]}, {"title": "原因二", "role": "", "points": ["价值取向与课程吸引力不足 → 缺少兴趣。"]}, {"title": "影响", "role": "", "points": ["人才供给不足 → 科研创新放缓 → 经济和竞争力受损。"]}, {"title": "结论", "role": "", "points": ["总结原因和后果，提出教育层面建议。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "unprecedented", "t": "unprecedented adj.", "e": "前所未有的。"}, {"p": 1, "c": "vocab", "q": "tedious", "t": "tedious adj.", "e": "冗长乏味的。"}, {"p": 1, "c": "vocab", "q": "dissuade", "t": "dissuade v.", "e": "劝阻、使不愿；dissuade sb from doing。"}, {"p": 2, "c": "vocab", "q": "curricula", "t": "curricula n.", "e": "curriculum 的复数，课程体系。"}, {"p": 3, "c": "vocab", "q": "personnel", "t": "personnel n.", "e": "人员，集合名词。"}, {"p": 3, "c": "vocab", "q": "stagnation", "t": "stagnation n.", "e": "停滞。"}, {"p": 1, "c": "syntax", "q": "dissuade many young people from pursuing science", "t": "dissuade sb from doing", "e": "from 是介词，后接 pursuing。"}, {"p": 3, "c": "syntax", "q": "personnel capable of conducting", "t": "形容词短语后置修饰", "e": "capable of … 修饰 personnel，表示能从事科研的人员。"}, {"p": 4, "c": "syntax", "q": "Only by addressing these challenges can we ensure", "t": "Only + 状语前置倒装", "e": "Only by … 置首，主句 can 提到 we 前面。"}, {"p": 0, "c": "link", "q": "Despite this rapid progress", "t": "Despite + 名词短语", "e": "让步，强调科技进步与学生选择不足的反差。"}, {"p": 2, "c": "link", "q": "rather than scientists", "t": "rather than：对照", "e": "崇拜明星网红，而非科学家。"}, {"p": 3, "c": "link", "q": "thus losing competitiveness", "t": "thus + doing：结果", "e": "跟不上科技进步，因而竞争力下降。"}, {"p": 0, "c": "expression", "q": "at an unprecedented rate", "t": "at a … rate", "e": "以某种速度发展，rate 与 at 搭配。"}, {"p": 3, "c": "expression", "q": "keep up with", "t": "keep up with advancements", "e": "跟上进展。"}, {"p": 4, "c": "expression", "q": "foster interest in science", "t": "foster interest in", "e": "培养对……的兴趣。"}], "sourcePage": 15}, {"id": "essay-15", "title": "生育年龄推迟", "question": "Some people choose to have their first child at an older age.\nWhat are the reasons?\nDo the advantages outweigh the disadvantages?", "qzh": "一些人选择在较大年龄生育第一个孩子。原因是什么？是否利大于弊？", "paragraphs": ["In many countries today, an increasing number of people choose to have their first child at a later age. This trend is influenced by several social and economic factors. Although delaying parenthood has both advantages and disadvantages, I believe the benefits generally outweigh the drawbacks.", "One major reason why people become parents later is the desire to establish a stable career before starting a family. In modern society, many young adults focus on higher education and professional development in their twenties. They hope to secure a well-paid job, gain financial independence, and create a comfortable living environment before welcoming a child. Another contributing factor is the high cost of raising children. Housing, childcare, and education expenses have risen sharply in recent years, making younger couples feel unprepared to take on the financial burden. In addition, many people now value personal growth and prefer to spend their early adulthood travelling, exploring hobbies, or building relationships, which naturally delays parenthood.", "Despite some clear disadvantages, such as reduced fertility and increased health risks during pregnancy, having children later in life also offers significant benefits. Older parents are usually more emotionally mature and better prepared to take on the responsibilities of raising a child. They tend to have greater financial stability, which allows them to provide a safer home, better healthcare, and more educational opportunities for their children. Moreover, parents who have already achieved personal and professional goals may feel less pressure balancing work and family, allowing them to spend more quality time with their child. In contrast, very young parents often struggle with stress, limited income, and lack of life experience, which can affect both their well-being and their child’s development.", "In conclusion, people choose to have their first child later for financial, educational, and personal reasons. Although this trend can create some challenges, I believe that the advantages, particularly greater stability and maturity, outweigh the disadvantages for most families."], "translations": ["如今许多国家越来越多的人选择较晚生育第一个孩子。这一趋势受到多种社会和经济因素影响。虽然推迟为人父母有利有弊，但我认为总体上利大于弊。", "人们较晚成为父母的一个主要原因，是希望先建立稳定事业再组建家庭。现代社会中，许多年轻人在二十多岁时专注高等教育和职业发展。他们希望在迎接孩子前获得高薪工作、实现经济独立并创造舒适的生活环境。另一个因素是养育孩子成本高。住房、托育、教育费用近年大幅上涨，使年轻夫妇觉得尚未准备好承担经济负担。此外，许多人重视个人成长，愿在成年早期旅行、探索爱好或建立人际关系，自然会推迟生育。", "尽管有生育能力下降、妊娠期健康风险增加等明显弊端，较晚生育也有重要益处。年龄较大的父母通常情绪更成熟，更有准备承担养育责任。他们往往经济更稳定，能给孩子提供更安全的家庭、更好的医疗和更多教育机会。此外，已实现个人和职业目标的父母，平衡工作与家庭的压力可能更小，因此能与孩子共度更多优质时光。相比之下，非常年轻的父母经常面临压力、收入有限、生活经验不足等困难，可能影响他们自己的福祉和孩子的发展。", "总之，人们出于经济、教育和个人原因选择较晚生育第一个孩子。虽然这一趋势可能带来一些挑战，但我认为，对大多数家庭而言，更稳定、更成熟等优势超过了弊端。"], "kind": "混合题：原因＋利弊权衡", "stance": "须同时回答原因及是否利大于弊；本文认为利大于弊。健康与年龄概括属于范文论据，不作个人生育建议。", "structure": [{"title": "引言", "role": "", "points": ["明确两个任务及权衡结论。"]}, {"title": "原因段", "role": "", "points": ["3 点：事业教育优先；养育成本；个人成长", "每点有具体解释。"]}, {"title": "权衡段", "role": "", "points": ["先承认健康风险，再展开情绪成熟、经济稳定、陪伴质量", "弊端论证较短，权衡可更充分。"]}, {"title": "结论", "role": "", "points": ["复述原因，重申稳定与成熟的优势。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "parenthood", "t": "parenthood n.", "e": "为人父母的状态与经历。"}, {"p": 1, "c": "vocab", "q": "childcare", "t": "childcare n.", "e": "儿童照护、托育。"}, {"p": 2, "c": "vocab", "q": "fertility", "t": "fertility n.", "e": "生育能力。"}, {"p": 2, "c": "vocab", "q": "emotionally mature", "t": "emotionally mature", "e": "情绪成熟的，成熟度并非只由年龄决定。"}, {"p": 2, "c": "vocab", "q": "financial stability", "t": "financial stability", "e": "经济稳定性。"}, {"p": 1, "c": "syntax", "q": "One major reason why people become parents later is", "t": "reason why … is + 名词短语", "e": "表语为 the desire to …，说明动机。"}, {"p": 2, "c": "syntax", "q": "which allows them to provide", "t": "which 非限制性从句", "e": "指向 greater financial stability，解释经济稳定如何使孩子受益。"}, {"p": 2, "c": "syntax", "q": "allowing them to spend", "t": "allowing 表示结果", "e": "压力较小从而有更多高质量陪伴时间。"}, {"p": 1, "c": "link", "q": "Another contributing factor", "t": "追加原因", "e": "在事业因素后引出养育成本。"}, {"p": 2, "c": "link", "q": "Despite some clear disadvantages", "t": "Despite + 名词：让步", "e": "先承认弊端，随后转入主要优点。"}, {"p": 2, "c": "link", "q": "In contrast", "t": "对照", "e": "用年轻父母的可能困难与前面的年长父母情况比较。"}, {"p": 1, "c": "expression", "q": "take on the financial burden", "t": "take on responsibility / burden", "e": "承担责任或负担。"}, {"p": 2, "c": "expression", "q": "quality time", "t": "quality time", "e": "高质量相处时间，而不只是时长。"}, {"p": 3, "c": "expression", "q": "outweigh the disadvantages", "t": "outweigh", "e": "在重要性上超过；不能只靠列举优点数量完成权衡。"}], "sourcePage": 16}, {"id": "essay-16", "title": "广告的影响", "question": "Some people say that advertising has positive economic effects. Others think it has negative social effects because it will make people feel dissatisfied with who they are and what they have.\nDiscuss both views and give your own opinion.", "qzh": "有人认为广告有积极经济影响，另一些人认为广告使人不满自身及已有之物，造成负面社会影响。讨论双方观点并给出你的看法。", "paragraphs": ["People have various views regarding whether advertising is a positive or negative thing. Although I recognise that there are economic benefits from advertising, I also think that advertising should be restricted to some extent because it can harm people's mental health.", "For one thing, advertising contributes to economic growth by increasing consumer spending. It does so by providing consumers with information about products and services, many of which fulfil certain needs of consumers. For example, when I saw a commercial for a mobile phone, I realised that it would be the perfect replacement for my dying phone. Without this advertisement, I would've wasted time searching and perhaps even end up with a less suitable replacement. On top of that, advertisements help create jobs. When the demand for products and services increases because of advertising, more people are needed to make and provide those products and services. Consequently, more jobs are created.", "Despite its contribution to the economy, advertising can have harmful social effects. This is because advertisements of luxury products like expensive clothes, shoes and cars are very common. It creates the impression that if you possess these things, you become more desirable or impressive to others. Thus, when people cannot buy expensive goods, it often leads to lower self-esteem. In their desperation, they might turn to stealing, or perhaps they will max out their credit cards and put themselves in debt. These effects on people's behaviour are why I'm strongly in favour of restricting the amount of advertisemen
