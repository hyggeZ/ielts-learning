<script id="essay-data" type="application/json">[{"id": "essay-01", "title": "少学习多锻炼", "question": "Parents should encourage children to spend less time studying and more time doing physical activities.\nTo what extent do you agree or disagree?", "qzh": "家长应该鼓励孩子减少学习时间，增加体育活动时间。你在多大程度上同意或不同意？", "paragraphs": ["In recent years, the rising academic burden on children has sparked widespread concern among parents and educators. While physical exercise is undeniably vital for childhood development, I disagree with the idea that study time should be reduced across the board. Instead, parents should focus on managing study efficiency so that children can engage in regular physical activity without compromising their academic foundation.", "On the one hand, encouraging children to participate in physical activities brings distinct health and psychological benefits that pure academic work cannot provide. When children engage in regular sports, their bodies release endorphins and experience increased blood circulation, which helps relieve the mental strain accumulated from long hours of stationary learning. Furthermore, team sports like basketball or football create dynamic social settings where children must cooperate, handle victory and defeat, and resolve conflict with peers. These real-world interactions foster social competence and emotional resilience—qualities that traditional textbook study rarely cultivates.", "On the other hand, simply cutting back on study time is a misplaced solution that could harm a child’s future opportunities. In most modern societies, academic performance remains the primary metric for high school and university admissions, which directly shapes a young person's career path. If parents blindly reduce study hours without addressing unproductive habits, children may simply fall behind in core subjects without gaining any meaningful athletic benefit. A far more effective approach is to eliminate inefficient study practices, such as passive memorization or digital distractions during homework. By mastering better time management, children can complete their academic tasks in less time, naturally freeing up room for sports.", "In conclusion, I disagree that parents should deliberately cut down on study time just to accommodate more physical activity. Academic knowledge and physical fitness are not mutually exclusive; rather than treating them as a zero-sum trade-off, parents should guide children to study more efficiently, ensuring they have ample time for exercise while maintaining strong academic performance."], "translations": ["近年来，儿童日益加重的学业负担引发了家长和教育工作者的广泛关注。虽然体育锻炼对儿童成长无疑至关重要，但我不赞成一概缩减学习时间。相反，家长应着重改善学习效率，让孩子能够在不损害学业基础的前提下，经常参加体育活动。", "一方面，鼓励孩子参加体育活动，能够带来单纯的学业学习无法提供的显著身心益处。孩子经常参加运动时，身体会释放内啡肽，血液循环也会加快，这有助于缓解长时间静坐学习积累的精神压力。此外，篮球、足球等团队运动会创造充满活力的社交情境，孩子必须在其中合作、面对胜负，并解决与同伴之间的冲突。这些现实生活中的互动能够培养社交能力和情绪韧性，而这些品质是传统课本学习很少能培养出来的。", "另一方面，单纯缩减学习时间是一种没有找准问题的解决办法，可能损害孩子未来的发展机会。在大多数现代社会中，学业成绩仍然是高中和大学录取的首要衡量标准，而这会直接影响年轻人的职业道路。如果家长不解决低效的学习习惯，只是盲目减少学习时长，孩子可能只会在核心科目上落后，却没有获得任何实质性的运动益处。有效得多的办法是消除低效的学习做法，例如被动记忆，或在做作业时被电子设备分散注意力。通过更好地掌握时间管理方法，孩子能够用更少的时间完成学业任务，从而自然腾出运动的时间。", "总之，我不赞成家长仅仅为了安排更多体育活动而刻意压缩学习时间。学科知识与身体健康并不相互排斥；家长不应把两者看作此消彼长的零和取舍，而应引导孩子提高学习效率，确保他们在保持良好学业表现的同时，有充足的时间锻炼。"], "kind": "同意与否", "stance": "承认运动重要，反对一刀切减少学习时间，主张提高效率。原题未限定盲目减时，方案本身也缩短实际学习时长，立场边界需更明确。", "structure": [{"title": "引言｜背景 → 让步 → 立场 → 方案", "role": "3 句。提出中心立场，不详细展开论据。", "points": ["S1：学业负担增加，引出家长与教育界的关注。", "S2：承认运动重要；反对一刀切减少学习时间。", "S3：提出替代方案——提高学习效率，以兼顾运动和学业。"], "chain": "学业负担 → 承认运动价值 → 反对普遍减时 → 提高效率"}, {"title": "主体一｜让步：运动确实值得鼓励", "role": "4 句，2 个主要论点。主题句统领两条收益。", "points": ["S1：总论点——运动带来学业学习难以充分提供的身心益处。", "S2：论点① 身心健康：运动产生生理变化 → 缓解久坐学习的精神压力。", "S3–S4：论点② 社交与情绪成长：团队运动 → 合作、面对胜负、解决冲突 → 社交能力与情绪韧性。"], "chain": "运动 → 压力缓解；团队运动 → 真实互动 → 能力与品质成长"}, {"title": "主体二｜反驳：只减时间没有解决低效", "role": "5 句。1 条核心反对理由 + 1 个替代方案；不是简单堆砌 5 个论点。", "points": ["S1：段落立场——单纯减时是错位的办法，可能损害未来机会。", "S2–S3：解释风险——学业影响升学和发展；若坏习惯不变，减时可能造成落后，又未必带来运动收益。", "S4–S5：给出方案与机制——消除低效做法 → 更好地管理时间 → 更快完成学业 → 腾出运动时间。"], "chain": "只减时 + 低效习惯未改 → 学业风险；改习惯 → 提效率 → 有时间运动"}, {"title": "结论｜重申立场 → 兼顾两者", "role": "2 句。收束前文，不添加新论据。", "points": ["S1：重申不赞成为运动而刻意压缩学习时间。", "S2：否定零和取舍，重申通过效率兼顾学业与锻炼。"], "chain": "反对机械减时 → 学业与运动可以兼顾 → 再次落到效率"}], "readerNotes": [{"p": 0, "c": "link", "q": "In recent years", "t": "时间背景", "e": "介词短语，限定近年的时间范围；对应 has sparked 的现在完成时。"}, {"p": 0, "c": "vocab", "q": "academic burden", "t": "academic burden", "e": "学业负担。burden n. 负担；academic adj. 学业的。"}, {"p": 0, "c": "expression", "q": "sparked widespread concern", "t": "spark widespread concern", "e": "引发广泛关注／担忧。动词 spark 与 concern 搭配。"}, {"p": 0, "c": "vocab", "q": "sparked", "t": "spark v.", "e": "熟词生义：引发，而不是名词“火花”。此处引发广泛关注。"}, {"p": 0, "c": "link", "q": "among parents and educators", "t": "among + 群体", "e": "介词，表示关注存在于家长和教育工作者之中。不是连词。"}, {"p": 0, "c": "link", "q": "While physical exercise is undeniably vital for childhood development", "t": "While：让步", "e": "相当于 although：先承认运动重要，再提出不同意见。"}, {"p": 0, "c": "vocab", "q": "undeniably vital", "t": "undeniably / vital", "e": "undeniably adv. 不可否认地；vital adj. 至关重要的。"}, {"p": 0, "c": "syntax", "q": "study time should be reduced", "t": "主语 + should be + 过去分词", "e": "情态动词的被动语态：学习时间“应该被减少”。that 从句解释 idea 的内容，是同位语从句。"}, {"p": 0, "c": "vocab", "q": "across the board", "t": "across the board", "e": "全面地、一概地；这里强调不加区分地缩减时间。"}, {"p": 0, "c": "link", "q": "Instead", "t": "Instead：替代", "e": "从“不赞成减时”转向“应提高效率”，不是简单追加观点。"}, {"p": 0, "c": "syntax", "q": "focus on managing study efficiency", "t": "focus on + doing", "e": "on 是介词，后接动名词 managing。这里用 improving study efficiency（提高学习效率）更自然。"}, {"p": 0, "c": "link", "q": "so that", "t": "so that：目的", "e": "连接家长的做法与希望实现的目标；后接 children can …。"}, {"p": 0, "c": "expression", "q": "engage in regular physical activity", "t": "engage in ↔ participate in", "e": "本篇均表示参加运动。physical exercise / physical activity / sports 形成近义表达；team sports 范围更窄。"}, {"p": 0, "c": "link", "q": "without compromising their academic foundation", "t": "without + doing", "e": "介词短语：在不损害学业基础的情况下。不是让步从句。"}, {"p": 0, "c": "vocab", "q": "compromising", "t": "compromise v.", "e": "熟词生义：损害、削弱；不是“妥协”。"}, {"p": 1, "c": "link", "q": "On the one hand", "t": "第一方面", "e": "引出对运动益处的承认，与下一段的 On the other hand 呼应。"}, {"p": 1, "c": "syntax", "q": "encouraging children to participate in physical activities brings", "t": "动名词短语作主语", "e": "整个 encouraging … activities 是主语，因此谓语用单数 brings。内部结构：encourage sb to do sth。"}, {"p": 1, "c": "vocab", "q": "distinct", "t": "distinct adj.", "e": "明显的、显著的；修饰运动带来的益处。"}, {"p": 1, "c": "vocab", "q": "psychological", "t": "psychological adj.", "e": "心理的；与身体健康这一维度相对。"}, {"p": 1, "c": "link", "q": "When children engage in regular sports", "t": "When：时间／情境", "e": "引出运动发生时的身体变化，为解释其益处提供情境。"}, {"p": 1, "c": "vocab", "q": "endorphins", "t": "endorphins n.", "e": "内啡肽；生理类专门词，阅读认识即可。"}, {"p": 1, "c": "vocab", "q": "blood circulation", "t": "blood circulation", "e": "血液循环。circulation n. 循环、流通。"}, {"p": 1, "c": "syntax", "q": "which helps relieve the mental strain accumulated from long hours of stationary learning", "t": "which + 补充说明；过去分词修饰", "e": "which 概括前面的生理变化。accumulated … 后置修饰 strain，相当于 that has accumulated …，不是新的谓语。"}, {"p": 1, "c": "expression", "q": "relieve the mental strain", "t": "relieve mental strain", "e": "缓解精神压力。relieve 是可积累的动词，比简单的 make … less 直接。"}, {"p": 1, "c": "vocab", "q": "mental strain accumulated", "t": "strain / accumulated", "e": "strain n. 压力；accumulated 为过去分词，表示积累起来的。"}, {"p": 1, "c": "vocab", "q": "stationary", "t": "stationary adj.", "e": "静止的、不移动的。此处指静坐学习；stationary learning 搭配不够自然。"}, {"p": 1, "c": "link", "q": "Furthermore", "t": "Furthermore：递进", "e": "从身心健康扩展到社交、情绪成长这一独立维度。"}, {"p": 1, "c": "syntax", "q": "where children must cooperate, handle victory and defeat, and resolve conflict with peers", "t": "where 从句 + 并列动作", "e": "where = in which，修饰 social settings。must 后并列 cooperate、handle、resolve，形式保持一致。"}, {"p": 1, "c": "expression", "q": "handle victory and defeat, and resolve conflict with peers", "t": "handle / resolve", "e": "handle victory and defeat：应对胜负；resolve conflict：解决冲突。两个动词各有搭配对象。"}, {"p": 1, "c": "vocab", "q": "peers", "t": "peers n.", "e": "同龄人、同辈。这里是一起运动的孩子。"}, {"p": 1, "c": "expression", "q": "foster social competence and emotional resilience", "t": "foster / cultivate + 能力或品质", "e": "文中的 foster 与 cultivates 近义。social competence＝社交能力；emotional resilience＝情绪韧性。"}, {"p": 1, "c": "vocab", "q": "social competence and emotional resilience", "t": "competence / resilience", "e": "competence n. 能力；resilience n. 韧性、受挫后的恢复能力。"}, {"p": 1, "c": "syntax", "q": "qualities that traditional textbook study rarely cultivates", "t": "概括名词 + 定语从句", "e": "qualities 概括前面的两种能力。that 指代 qualities，作 cultivates 的宾语；rarely 表示“很少”。"}, {"p": 2, "c": "link", "q": "On the other hand", "t": "第二方面", "e": "由承认运动价值转入质疑“单纯减时”，不是列举运动的坏处。"}, {"p": 2, "c": "syntax", "q": "simply cutting back on study time is a misplaced solution", "t": "动名词主语 + be + 表语", "e": "cutting back on study time 是主语，a misplaced solution 是表语。simply 限定“仅仅缩减时间”。"}, {"p": 2, "c": "expression", "q": "cutting back on study time", "t": "cut back on / cut down on / reduce", "e": "都是减少学习时间的改写。前两者加 on；reduce 直接接宾语。"}, {"p": 2, "c": "vocab", "q": "misplaced", "t": "misplaced adj.", "e": "不恰当的、用错地方的；这里说解决办法没有对准问题。"}, {"p": 2, "c": "expression", "q": "academic performance", "t": "academic 话题词汇链", "e": "foundation＝基础；performance＝表现；knowledge＝知识；tasks＝任务。是相关表达，不可互当同义词。"}, {"p": 2, "c": "vocab", "q": "primary metric", "t": "primary metric", "e": "首要衡量标准。metric n. 指标。"}, {"p": 2, "c": "vocab", "q": "admissions", "t": "admissions n.", "e": "熟词生义：招生、录取；不是“承认”。"}, {"p": 2, "c": "link", "q": "If parents blindly reduce study hours without addressing unproductive habits", "t": "If：条件", "e": "设定“减时但不改低效习惯”的条件；主句 may 表示可能后果，不是必然结果。"}, {"p": 2, "c": "vocab", "q": "addressing", "t": "address v.", "e": "熟词生义：处理、解决；不是“地址”。"}, {"p": 2, "c": "expression", "q": "fall behind in core subjects", "t": "fall behind in + 学科", "e": "在核心科目上落后。core subjects 是常用的教育话题名词搭配。"}, {"p": 2, "c": "syntax", "q": "A far more effective approach is to eliminate inefficient study practices", "t": "A more … approach is to do", "e": "不定式作表语，说明方法。far 加强比较级 more effective，表示“有效得多”。"}, {"p": 2, "c": "vocab", "q": "eliminate inefficient", "t": "eliminate / inefficient", "e": "eliminate v. 消除；inefficient adj. 低效的。"}, {"p": 2, "c": "link", "q": "such as", "t": "such as：举例", "e": "引出低效学习的实例，让前面的抽象判断具体化。"}, {"p": 2, "c": "vocab", "q": "passive memorization", "t": "passive memorization", "e": "被动记忆。memorization n. 记忆、背诵。"}, {"p": 2, "c": "vocab", "q": "digital distractions", "t": "digital distractions", "e": "数字设备或内容造成的注意力干扰。"}, {"p": 2, "c": "link", "q": "By mastering better time management", "t": "By + doing：方式", "e": "通过掌握时间管理实现主句的结果；动作执行者是 children。"}, {"p": 2, "c": "syntax", "q": "naturally freeing up room for sports", "t": "现在分词短语表示结果", "e": "freeing … 说明更快完成学业任务带来的结果：腾出运动时间。"}, {"p": 2, "c": "expression", "q": "freeing up room for sports", "t": "free up room for", "e": "为……腾出余地；本文具体指为体育活动腾出时间。"}, {"p": 2, "c": "vocab", "q": "room", "t": "room n.", "e": "熟词生义：余地、空间；此处指留给运动的时间。"}, {"p": 3, "c": "link", "q": "In conclusion", "t": "结论信号", "e": "收束前文并重申立场，不引入新的主要论点。"}, {"p": 3, "c": "vocab", "q": "deliberately", "t": "deliberately adv.", "e": "刻意地、有意地。"}, {"p": 3, "c": "vocab", "q": "accommodate", "t": "accommodate v.", "e": "熟词生义：为……作安排、留出空间；不是“提供住宿”。"}, {"p": 3, "c": "expression", "q": "not mutually exclusive", "t": "not mutually exclusive", "e": "说明两个目标并不相互排斥，用于概括“学业与运动可兼顾”的观点。"}, {"p": 3, "c": "vocab", "q": "mutually exclusive", "t": "mutually exclusive", "e": "相互排斥的；not mutually exclusive 表示两者可以兼顾。"}, {"p": 3, "c": "link", "q": "rather than treating them as a zero-sum trade-off", "t": "rather than：选择", "e": "与其把二者当作零和取舍，不如引导孩子提高效率。"}, {"p": 3, "c": "vocab", "q": "zero-sum trade-off", "t": "zero-sum trade-off", "e": "零和取舍：一方增加就要以另一方减少为代价。"}, {"p": 3, "c": "syntax", "q": "ensuring they have ample time for exercise", "t": "ensuring + (that) 从句", "e": "分词短语补充说明预期结果；they 指 children，that 可以省略。"}, {"p": 3, "c": "vocab", "q": "ample", "t": "ample adj.", "e": "充足的；修饰时间、空间、机会等。"}, {"p": 3, "c": "link", "q": "while maintaining strong academic performance", "t": "while：同时", "e": "这里表示保持成绩与锻炼同时实现；与第一段的让步含义不同。"}], "sourcePage": 2}, {"id": "essay-02", "title": "高层管理者与普通员工薪资差距", "question": "Some people think it is a good thing for senior management positions to have very high salaries compared to other workers of the same company or organisation.\nTo what extent do you agree?", "qzh": "有人认为，同一公司或机构的高层管理者薪资远高于普通员工是好事。你在多大程度上同意？", "paragraphs": ["The debate over whether senior management should receive significantly higher salaries than other employees is ongoing. While some argue that these high salaries are justified by the responsibilities and impact of these roles, others believe that excessive pay gaps can harm an organization. I believe that while senior management deserves higher compensation, excessively large pay differences can be detrimental and can even undermine the long-term success of the organization.", "Senior management roles carry substantial responsibilities that directly affect a company’s success. These positions often require extensive experience and advanced skills, justifying higher salaries to attract and retain top talent. For example, the decisions made by a CEO can determine the growth or decline of a multinational corporation, making higher pay reasonable and necessary to secure the best leadership.", "However, large pay gaps between senior management and other employees can create feelings of inequality and resentment. This can lower morale and productivity, as employees who feel undervalued may be less motivated to perform well. When the workforce sees that only top executives benefit significantly, they may be less inclined to contribute their best efforts, leading to a disengaged and less productive work environment.", "Furthermore, allocating too much to senior management salaries can reduce resources available for employee development and benefits. Organizations that prioritize equitable compensation are likely to foster a more loyal and motivated workforce, leading to a more collaborative and committed environment. A focus on fair distribution of resources ensures that all employees feel valued, which can enhance overall organizational performance.", "In conclusion, while senior management deserves higher salaries due to their roles, excessive pay gaps should be avoided. A reasonable compensation structure can lead to a more motivated and productive workforce, ultimately benefiting the organization as a whole and ensuring long-term success."], "translations": ["高层管理者是否应该比其他员工获得高得多的薪资，一直存在争论。有些人认为，这些岗位的责任和影响力足以证明高薪合理，另一些人则认为过大的薪酬差距会损害组织。我认为，高层管理者虽然应获得更高报酬，但过大的工资差异会造成损害，甚至削弱组织的长期成功。", "高层管理岗位承担着直接影响公司成败的重大责任。这些岗位通常要求丰富的经验和高级技能，因此有理由提供更高薪资来吸引和留住顶尖人才。例如，首席执行官的决策可以决定一家跨国公司的兴衰，所以支付更高薪酬来获得最佳领导人才是合理且必要的。", "然而，高层与普通员工之间过大的薪酬差距会引起不公平感和怨恨。这可能降低士气与生产效率，因为觉得自己未被重视的员工可能缺乏做好工作的动力。当员工看到只有高层显著受益时，他们可能更不愿尽最大努力，导致工作环境缺乏投入、效率下降。", "此外，把过多资金分配给高层薪酬，会减少可用于员工发展和福利的资源。重视公平薪酬的组织更可能培养出忠诚且积极的员工队伍，形成更加合作、投入的环境。重视资源公平分配能确保所有员工感到被重视，从而提升组织整体表现。", "总之，高层管理者因其岗位职责理应获得较高薪资，但应避免过大的薪酬差距。合理的薪酬结构能形成更积极、更高效的员工队伍，最终使整个组织受益并保障长期成功。"], "kind": "同意与否", "stance": "有条件同意高薪，反对过大差距。", "structure": [{"title": "引言", "role": "", "points": ["呈现争议", "区分合理高薪与过大差距。"]}, {"title": "主体一", "role": "", "points": ["1 个支持理由：责任与能力要求高", "经验和技能要求 → 吸引留住人才 → CEO 决策例子。"]}, {"title": "主体二", "role": "", "points": ["1 个反对理由：公平感和动力受损", "工资差距 → 怨恨 → 士气与效率下降。"]}, {"title": "主体三", "role": "", "points": ["1 个资源分配理由", "高层占用预算 → 员工发展福利减少；公平分配则提升投入。"]}, {"title": "结论", "role": "", "points": ["重申合理高薪、避免极端差距", "回扣员工动力与组织表现。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "whether senior management should receive significantly higher salaries than other employees", "t": "whether 引导宾语从句", "e": "whether 从句作介词 over 的宾语，具体说明 debate 的内容。higher … than … 构成薪资比较；significantly 修饰 higher。"}, {"p": 0, "c": "vocab", "q": "ongoing", "t": "ongoing adj.", "e": "持续进行中的；争论尚未结束。"}, {"p": 0, "c": "link", "q": "While some argue", "t": "While：观点对照", "e": "这里列出一些人支持高薪、另一些人反对差距的两方看法；不是表示时间。"}, {"p": 0, "c": "vocab", "q": "justified", "t": "justify v.", "e": "证明合理、使有正当理由；be justified by 表示理由来自何处。"}, {"p": 0, "c": "vocab", "q": "excessive", "t": "excessive adj.", "e": "过度的；excessively 是副词，用于修饰 large。不是所有较大差距都等于 excessive。"}, {"p": 0, "c": "expression", "q": "pay gaps", "t": "pay gaps / pay differences", "e": "本文表示薪资差距的近义替换。"}, {"p": 0, "c": "syntax", "q": "while senior management deserves higher compensation", "t": "while 引导让步从句", "e": "在 I believe that 后嵌入让步：虽然高层应多得，但差距不宜过大。"}, {"p": 0, "c": "vocab", "q": "compensation", "t": "compensation n.", "e": "此处为薪酬、报酬，不是事故后的赔偿。"}, {"p": 0, "c": "vocab", "q": "detrimental", "t": "detrimental adj.", "e": "有害的；常用 be detrimental to。"}, {"p": 0, "c": "expression", "q": "undermine the long-term success", "t": "undermine success", "e": "削弱长期成功的基础。比直接说 harm 更强调逐步侵蚀。"}, {"p": 0, "c": "vocab", "q": "undermine", "t": "undermine v.", "e": "削弱、损害根基；本文指长期组织成功受损。"}, {"p": 1, "c": "expression", "q": "carry substantial responsibilities", "t": "carry responsibilities", "e": "承担重大责任；carry 在此不是搬运物品。"}, {"p": 1, "c": "vocab", "q": "substantial", "t": "substantial adj.", "e": "重大的、数量可观的。"}, {"p": 1, "c": "syntax", "q": "responsibilities that directly affect a company’s success", "t": "that 定语从句", "e": "that 指代 responsibilities，在从句中作 affect 的主语，说明这些责任为何值得高薪。"}, {"p": 1, "c": "vocab", "q": "extensive experience", "t": "extensive adj.", "e": "丰富而广泛的，修饰工作经验。"}, {"p": 1, "c": "syntax", "q": "justifying higher salaries to attract and retain top talent", "t": "分词结果＋不定式目的", "e": "justifying 补充说明经验和技能要求为何使高薪合理；to attract and retain 说明高薪的目的。"}, {"p": 1, "c": "expression", "q": "attract and retain top talent", "t": "attract / retain talent", "e": "吸引并留住顶尖人才，两个并列动词。"}, {"p": 1, "c": "vocab", "q": "retain", "t": "retain v.", "e": "保留、留住；这里指留住人才。"}, {"p": 1, "c": "link", "q": "For example", "t": "举例落实责任", "e": "CEO 决策影响企业兴衰，用来支持高层责任重大，而不是另起一个论点。"}, {"p": 1, "c": "syntax", "q": "the decisions made by a CEO", "t": "过去分词后置修饰", "e": "made by a CEO 修饰 decisions，可展开为 decisions that are made by a CEO。"}, {"p": 1, "c": "vocab", "q": "multinational corporation", "t": "multinational corporation", "e": "跨国公司；multinational 修饰 corporation。"}, {"p": 1, "c": "syntax", "q": "making higher pay reasonable and necessary", "t": "making + 宾语 + 形容词", "e": "现在分词交代结果；reasonable 和 necessary 作宾语补足语。"}, {"p": 1, "c": "vocab", "q": "secure", "t": "secure v.", "e": "熟词生义：确保获得，指获得优秀领导人才。"}, {"p": 2, "c": "link", "q": "However", "t": "转折", "e": "由高薪合理性转向过大差距的危害。"}, {"p": 2, "c": "vocab", "q": "resentment", "t": "resentment n.", "e": "因不公产生的怨恨、不满。"}, {"p": 2, "c": "expression", "q": "lower morale and productivity", "t": "lower morale / productivity", "e": "降低士气和生产效率；心理状态与工作结果构成连续影响。"}, {"p": 2, "c": "vocab", "q": "morale", "t": "morale n.", "e": "团队士气，区别于 moral（道德的）。"}, {"p": 2, "c": "link", "q": "as employees who feel undervalued", "t": "as：原因", "e": "解释士气下降的原因；who 从句修饰 employees。"}, {"p": 2, "c": "syntax", "q": "employees who feel undervalued may be less motivated to perform well", "t": "who 定语从句＋be motivated to do", "e": "who feel undervalued 修饰 employees；be less motivated to do 表示做事动力降低。"}, {"p": 2, "c": "vocab", "q": "undervalued", "t": "undervalued adj.", "e": "价值未被充分认可、未受到应有重视的。"}, {"p": 2, "c": "link", "q": "When the workforce sees", "t": "When：条件情境", "e": "描写员工看到收益只流向高层时的反应，为动力下降提供具体情境。"}, {"p": 2, "c": "vocab", "q": "workforce", "t": "workforce n.", "e": "员工队伍、劳动力群体。"}, {"p": 2, "c": "vocab", "q": "executives", "t": "executive n.", "e": "高级管理人员；不是普通执行任务的员工。"}, {"p": 2, "c": "vocab", "q": "inclined", "t": "inclined adj.", "e": "倾向于、愿意；be inclined to do 表示有做某事的意愿。"}, {"p": 2, "c": "syntax", "q": "leading to a disengaged and less productive work environment", "t": "分词结果状语", "e": "leading … 承接不愿全力投入这一情况，解释最终工作环境的变化。"}, {"p": 2, "c": "vocab", "q": "disengaged", "t": "disengaged adj.", "e": "缺乏投入、疏离的；在职场语境不是机械装置“脱开”。"}, {"p": 3, "c": "link", "q": "Furthermore", "t": "递进", "e": "从员工心理扩展到资源分配。"}, {"p": 3, "c": "syntax", "q": "allocating too much to senior management salaries can reduce resources", "t": "动名词短语作主语", "e": "allocating … salaries 整体作 can reduce 的主语；too much 指资金过多。"}, {"p": 3, "c": "syntax", "q": "resources available for employee development and benefits", "t": "形容词短语后置修饰", "e": "available for … 修饰 resources，说明可供员工发展福利使用的资源。"}, {"p": 3, "c": "vocab", "q": "prioritize", "t": "prioritize v.", "e": "优先考虑、把某事放在重要位置。"}, {"p": 3, "c": "vocab", "q": "equitable", "t": "equitable adj.", "e": "公平合理的，不一定意味着每人相同。"}, {"p": 3, "c": "syntax", "q": "are likely to foster", "t": "be likely to do", "e": "表示可能产生的结果，不把因果说成绝对。"}, {"p": 3, "c": "expression", "q": "loyal and motivated workforce", "t": "loyal / motivated / committed", "e": "忠诚、有动力、投入的；适合描述员工品质。"}, {"p": 3, "c": "vocab", "q": "collaborative and committed", "t": "collaborative / committed", "e": "善于合作的／投入的；比笼统的 good 更具体地描述工作文化。"}, {"p": 3, "c": "expression", "q": "fair distribution of resources", "t": "fair distribution", "e": "公平分配；与前面的 equitable compensation 相呼应，但 resources 比薪酬范围更广。"}, {"p": 3, "c": "syntax", "q": "ensures that all employees feel valued, which can enhance", "t": "that 宾语从句＋which 补充结果", "e": "that 说明确保的内容；which 概括员工受到重视的状态及其对表现的作用。"}, {"p": 4, "c": "link", "q": "due to their roles", "t": "due to + 名词", "e": "交代高层应获高薪的原因；后接名词短语，不接完整独立句。"}, {"p": 4, "c": "syntax", "q": "excessive pay gaps should be avoided", "t": "should be + 过去分词", "e": "薪酬差距是被避免的对象，用被动强调规范建议。"}, {"p": 4, "c": "syntax", "q": "ultimately benefiting the organization as a whole and ensuring long-term success", "t": "并列分词表示结果", "e": "benefiting 与 ensuring 并列，概括合理薪酬结构的最终影响。"}, {"p": 4, "c": "expression", "q": "as a whole", "t": "as a whole", "e": "作为整体、总体上，强调受益者是全组织而非仅高层。"}], "sourcePage": 3}, {"id": "essay-03", "title": "领导的重要品质", "question": "Intelligence is the most important factor for a leader.\nTo what extent do you agree or disagree?", "qzh": "智力是领导者最重要的因素。你在多大程度上同意或不同意？", "paragraphs": ["Leadership skills consist of various traits, yet it is often suggested that the primary one for a leader is intelligence. I completely agree with this view for several reasons.", "The main argument supporting this view is that it is vital for someone in a leadership position to be able to guide a team along the right path. This requires a person to be quick-witted and intelligent, as they must analyze and process a large amount of information. Moreover, leaders not only need to think carefully about strategies, but they must also come to a clear conclusion, as there are often multiple options to consider. Additionally, since leaders generally cannot afford to make mistakes, they must scrutinize every detail and potential outcome to ensure success. As a result, their effectiveness is largely dependent on their intelligence.", "Another reason why intelligence is crucial is that it helps leaders address weaknesses effectively. Undoubtedly, it is essential for a leader to help their team members identify their weak points and find solutions to improve them, as minimizing weaknesses plays a key role in making progress. This is especially useful when dealing with a unique problem that requires a different and analytical approach. There are also benefits for the leaders themselves, as they are not immune to flaws. They need to address their own weaknesses with even more precision. However, intelligent leaders are typically aware of their own shortcomings and can take appropriate actions to overcome them, which ultimately benefits both the leader and their team.", "In conclusion, I believe that intelligence is a critical factor for a leader, as it provides two essential benefits for the success of the team: the ability to guide the team effectively and the capacity to address weaknesses efficiently."], "translations": ["领导能力包含多种品质，但人们常认为领导者最主要的品质是智力。基于几个理由，我完全同意这一观点。", "支持这一观点的主要理由是，领导岗位上的人必须能引导团队走上正确道路。这要求一个人反应敏捷、聪明，因为他们必须分析和处理大量信息。此外，领导者不仅要仔细思考策略，还必须得出明确结论，因为通常有多种选择需要考虑。而且，领导者通常承担不起犯错的后果，因此必须仔细审查每个细节及可能结果，以确保成功。因此，他们的工作成效在很大程度上取决于智力。", "智力至关重要的另一个理由是，它帮助领导者有效解决弱点。毫无疑问，领导者必须帮助团队成员发现弱项并找到改进办法，因为尽量减少弱点对取得进步至关重要。在处理需要不同分析方法的特殊问题时，这一点尤其有用。这也有益于领导者本人，因为他们同样并非没有缺点。他们需要更精准地处理自己的弱点。不过，聪明的领导者通常了解自身不足，并能采取适当行动克服它们，最终使领导者和团队双方受益。", "总之，我认为智力是领导者的关键因素，因为它为团队成功提供了两项重要优势：有效引导团队的能力，以及高效处理弱点的能力。"], "kind": "同意与否", "stance": "完全同意；但正文主要证明“重要”，与“最重要”的比较论证不足。", "structure": [{"title": "引言", "role": "", "points": ["改写题目并明确完全同意。"]}, {"title": "主体一", "role": "", "points": ["1 个核心论点：指导方向", "处理信息 → 比较策略 → 检查风险 → 有效决策。"]}, {"title": "主体二", "role": "", "points": ["1 个核心论点：识别并克服弱点", "先谈团队成员，再谈领导者自身。"]}, {"title": "结论", "role": "", "points": ["汇总指导团队、处理弱点两点", "注意原题是最高级 most important。"]}], "readerNotes": [{"p": 0, "c": "expression", "q": "consist of various traits", "t": "consist of", "e": "由……组成；consist of 不用被动。skills 与 traits 概念略有差别，不应随意混用。"}, {"p": 0, "c": "vocab", "q": "traits", "t": "trait n.", "e": "人的特质、品质；这里指构成领导能力的不同特征。"}, {"p": 0, "c": "link", "q": "yet", "t": "yet：转折连词", "e": "前面说品质多样，后面突出某一种被认为最主要，形成范围与重点的转折。"}, {"p": 0, "c": "syntax", "q": "it is often suggested that the primary one for a leader is intelligence", "t": "形式主语＋被动报告", "e": "it 占主语位置，that 从句给出被提出的观点；one 回指 trait。"}, {"p": 0, "c": "vocab", "q": "primary", "t": "primary adj.", "e": "主要的、首要的；此处不是初级的。"}, {"p": 1, "c": "syntax", "q": "it is vital for someone in a leadership position to be able to guide", "t": "It is + adj. + for sb + to do", "e": "it 为形式主语，不定式是真正主语；说明领导者需要具备的能力。"}, {"p": 1, "c": "expression", "q": "guide a team along the right path", "t": "guide a team", "e": "引导团队；适合领导与协作话题。"}, {"p": 1, "c": "syntax", "q": "This requires a person to be quick-witted and intelligent", "t": "require sb to do", "e": "要求某人具备某种状态；to be 后两个形容词并列。"}, {"p": 1, "c": "vocab", "q": "quick-witted", "t": "quick-witted adj.", "e": "思维敏捷的、反应快的。"}, {"p": 1, "c": "link", "q": "as they must analyze and process a large amount of information", "t": "as：原因", "e": "解释领导者为何必须思维敏捷；analyze 与 process 并列。"}, {"p": 1, "c": "vocab", "q": "analyze and process", "t": "analyze / process v.", "e": "分析／处理信息，process 在此为动词。"}, {"p": 1, "c": "link", "q": "Moreover", "t": "递进补充", "e": "从处理信息扩展到比较策略并形成结论。"}, {"p": 1, "c": "syntax", "q": "leaders not only need to think carefully about strategies, but they must also come to a clear conclusion", "t": "not only … but also …", "e": "并列思考策略与作出结论两项职责。not only 未前置到句首，不需要倒装。"}, {"p": 1, "c": "vocab", "q": "strategies", "t": "strategy n.", "e": "策略、行动方案；比单次具体动作更宏观。"}, {"p": 1, "c": "syntax", "q": "there are often multiple options to consider", "t": "不定式后置修饰", "e": "to consider 修饰 options，意为需要考虑的选项；考虑者从领导者语境中理解。"}, {"p": 1, "c": "vocab", "q": "multiple", "t": "multiple adj.", "e": "多个的、多种的，修饰可考虑的选项。"}, {"p": 1, "c": "link", "q": "Additionally", "t": "追加职责", "e": "补充细节审查与风险控制，为主论点继续提供支持。"}, {"p": 1, "c": "link", "q": "since leaders generally cannot afford to make mistakes", "t": "since：原因", "e": "解释为什么必须仔细检查；此处不是“自从”。"}, {"p": 1, "c": "expression", "q": "cannot afford to make mistakes", "t": "cannot afford to do", "e": "熟词用法：承担不起某后果，不是没有钱买东西。"}, {"p": 1, "c": "vocab", "q": "scrutinize", "t": "scrutinize v.", "e": "仔细检查、审视，比 look at 更强调细致。"}, {"p": 1, "c": "vocab", "q": "potential outcome", "t": "potential outcome", "e": "可能结果；potential 表示潜在的，而非已发生的。"}, {"p": 1, "c": "link", "q": "As a result", "t": "结果", "e": "把前面的决策要求归结为成效依赖智力。"}, {"p": 1, "c": "vocab", "q": "effectiveness", "t": "effectiveness n.", "e": "有效性、达成目标的成效；区别于效率 efficiency。"}, {"p": 1, "c": "expression", "q": "largely dependent on", "t": "be dependent on", "e": "很大程度取决于；largely 为程度限定，避免说成唯一决定因素。"}, {"p": 2, "c": "syntax", "q": "Another reason why intelligence is crucial is that", "t": "Another reason why … is that …", "e": "why 从句限定 reason；that 从句说明具体理由。"}, {"p": 2, "c": "link", "q": "Undoubtedly", "t": "判断态度副词", "e": "表示作者确信，不是额外证据；不能仅靠这个词证明论点。"}, {"p": 2, "c": "syntax", "q": "it is essential for a leader to help their team members identify their weak points", "t": "It is essential for sb to do", "e": "不定式说明必要的行为；help sb identify 中 identify 前可不加 to。"}, {"p": 2, "c": "expression", "q": "identify their weak points", "t": "identify weak points", "e": "识别弱点；identify 强调找出和辨认，而非解决。"}, {"p": 2, "c": "expression", "q": "weak points", "t": "weak points / weaknesses / shortcomings", "e": "本文表示弱点的相关替换；flaws 语气可更强。"}, {"p": 2, "c": "syntax", "q": "as minimizing weaknesses plays a key role in making progress", "t": "动名词作主语和介词宾语", "e": "minimizing weaknesses 作 plays 的主语；making progress 作 in 的宾语。"}, {"p": 2, "c": "vocab", "q": "minimizing", "t": "minimize v.", "e": "尽量减少，不等于完全消除。"}, {"p": 2, "c": "syntax", "q": "when dealing with a unique problem", "t": "when + doing 的省略", "e": "可理解为领导者处理特殊问题时；省略主语须能从上下文明确恢复。"}, {"p": 2, "c": "vocab", "q": "analytical", "t": "analytical adj.", "e": "善于分析的、分析性的，描述解决问题的方法。"}, {"p": 2, "c": "link", "q": "as they are not immune to flaws", "t": "as：原因", "e": "解释为何改进弱点也适用于领导者本人。"}, {"p": 2, "c": "vocab", "q": "immune to flaws", "t": "immune / flaws", "e": "immune to：不受影响；flaws：缺陷。这里说领导者也会有缺点。"}, {"p": 2, "c": "vocab", "q": "precision", "t": "precision n.", "e": "精确、准确。"}, {"p": 2, "c": "link", "q": "However", "t": "转折", "e": "从领导者也有弱点，转向聪明领导者能够发现并改进。"}, {"p": 2, "c": "expression", "q": "aware of their own shortcomings", "t": "be aware of", "e": "意识到自己的不足；aware 后接 of 名词短语。"}, {"p": 2, "c": "vocab", "q": "shortcomings", "t": "shortcomings n.", "e": "不足、缺点。"}, {"p": 2, "c": "expression", "q": "take appropriate actions", "t": "take appropriate actions", "e": "采取适当行动；appropriate 修饰行动是否合乎情境。"}, {"p": 2, "c": "vocab", "q": "appropriate", "t": "appropriate adj.", "e": "适合具体情境的、恰当的。"}, {"p": 2, "c": "syntax", "q": "which ultimately benefits both the leader and their team", "t": "which 概括前述行动", "e": "指发现不足并采取改进的行为；both … and … 标明双方受益。"}, {"p": 3, "c": "link", "q": "as it provides two essential benefits", "t": "as：归纳理由", "e": "用两个已展开的收益解释结论，没有增加新论点。"}, {"p": 3, "c": "syntax", "q": "the ability to guide the team effectively and the capacity to address weaknesses efficiently", "t": "名词＋to do 平行结构", "e": "ability 与 capacity 后都用不定式说明具体能力，两个名词短语概括正文。"}, {"p": 3, "c": "expression", "q": "effectively", "t": "effectively / efficiently", "e": "前者强调有效达成目标，后者强调高效率；不是完全同义。"}, {"p": 3, "c": "vocab", "q": "capacity", "t": "capacity n.", "e": "能力、潜能；此处不是容器容量。"}], "sourcePage": 4}, {"id": "essay-04", "title": "公司提供运动和社交设施", "question": "All large companies should provide sports and social facilities for the local community.\nTo what extent do you agree or disagree with this statement?", "qzh": "所有大公司都应该为当地社区提供体育和社交设施。你在多大程度上同意或不同意？", "paragraphs": ["In recent years, there has been growing debate about whether large companies should be responsible for providing sports and social facilities for the local community. While I agree that corporations can play a positive role in supporting society, I do not believe it should be considered an obligation for all big businesses.", "On the one hand, there are strong arguments for encouraging companies to contribute in this way. First, sports and social facilities improve the well-being of local residents by promoting healthier lifestyles and greater social interaction. For example, a gym or community centre built by a company could reduce health problems such as obesity and also create spaces where people build stronger connections. Second, companies benefit indirectly from such investments. By supporting the community, they can enhance their reputation, build customer loyalty, and even improve employee satisfaction, as workers often prefer companies with a strong sense of social responsibility.", "On the other hand, making it compulsory for all large companies may create unfair burdens. Businesses primarily exist to generate profit, provide jobs, and pay taxes. Forcing them to build facilities could distract them from their core operations or reduce their competitiveness, particularly in industries with high operating costs. Moreover, providing community facilities should remain the responsibility of governments, which collect taxes and are better placed to allocate resources fairly among different regions and social groups.", "In conclusion, while I believe it is highly beneficial for companies to support local communities by building sports and social facilities, it should not be seen as a duty for all large businesses. Instead, governments should take the main responsibility, while companies should be encouraged, but not forced, to contribute."], "translations": ["近年来，关于大公司是否应负责为当地社区提供体育和社交设施，讨论日益增多。虽然我同意企业能在支持社会方面发挥积极作用，但我不认为这应被视为所有大企业的义务。", "一方面，鼓励公司以这种方式作出贡献有充分理由。首先，体育和社交设施能通过促进健康生活方式和更多社会互动，改善当地居民的福祉。例如，公司建设的健身房或社区中心能够减少肥胖等健康问题，也能提供建立更紧密联系的空间。其次，公司也会从此类投资中间接受益。支持社区能改善企业声誉、建立顾客忠诚度，甚至提高员工满意度，因为员工往往更喜欢有强烈社会责任感的公司。", "另一方面，强制所有大公司这样做可能带来不公平的负担。企业存在的主要目的是创造利润、提供就业和缴纳税款。迫使它们建设设施可能分散核心业务精力，或削弱竞争力，尤其是在运营成本较高的行业。此外，提供社区设施仍应是政府的责任，因为政府征税，也更有条件在不同地区和社会群体之间公平配置资源。", "总之，我认为公司通过建设体育和社交设施来支持当地社区非常有益，但不应将其视为所有大企业的义务。相反，政府应承担主要责任，而企业应受到鼓励而非被迫作出贡献。"], "kind": "同意与否", "stance": "支持企业自愿贡献，反对对所有大公司一概强制。", "structure": [{"title": "引言", "role": "", "points": ["区分积极作用与强制义务。"]}, {"title": "主体一", "role": "", "points": ["2 点收益：社区健康与互动；企业声誉、忠诚度和满意度", "每点都有解释或例子。"]}, {"title": "主体二", "role": "", "points": ["2 点反对：企业负担；政府更适合公平分配资源。"]}, {"title": "结论", "role": "", "points": ["政府主责、企业自愿参与。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "there has been growing debate about whether", "t": "there has been＋名词", "e": "现在完成时描述讨论持续发展；whether 从句作 about 的宾语，明确争议内容。"}, {"p": 0, "c": "expression", "q": "be responsible for providing", "t": "be responsible for doing", "e": "负责提供；for 后为动名词 providing。"}, {"p": 0, "c": "link", "q": "for the local community", "t": "for：受益对象", "e": "设施是为当地社区提供的，不是在说明原因。"}, {"p": 0, "c": "link", "q": "While I agree", "t": "While：让步", "e": "承认企业贡献的好处，但反对普遍强制。"}, {"p": 0, "c": "expression", "q": "corporations", "t": "corporations / companies / businesses", "e": "本文用于公司、企业的替换；不是所有场景完全等价。"}, {"p": 0, "c": "vocab", "q": "corporations", "t": "corporation n.", "e": "公司、企业法人；本文泛指大企业。"}, {"p": 0, "c": "syntax", "q": "it should be considered an obligation", "t": "be considered + 名词", "e": "被视作某事；这里把是否履行义务作为争论核心。"}, {"p": 0, "c": "vocab", "q": "obligation", "t": "obligation n.", "e": "义务、必须履行的责任。"}, {"p": 1, "c": "link", "q": "First", "t": "First / Second：分点", "e": "明确标示社区受益与企业受益两个论点。"}, {"p": 1, "c": "vocab", "q": "well-being", "t": "well-being n.", "e": "身心健康、福祉，不只指收入。"}, {"p": 1, "c": "syntax", "q": "by promoting healthier lifestyles and greater social interaction", "t": "by + doing", "e": "说明设施如何改善福祉；两个宾语分别是生活方式和社会互动。"}, {"p": 1, "c": "vocab", "q": "interaction", "t": "interaction n.", "e": "互动、相互交流。"}, {"p": 1, "c": "syntax", "q": "a gym or community centre built by a company", "t": "过去分词后置修饰", "e": "built by a company 限定谁建设设施，省略了 which is。"}, {"p": 1, "c": "vocab", "q": "obesity", "t": "obesity n.", "e": "肥胖，健康类名词。"}, {"p": 1, "c": "syntax", "q": "spaces where people build stronger connections", "t": "where 定语从句", "e": "where 相当于 in which；说明空间中能够发生的社会互动。"}, {"p": 1, "c": "link", "q": "Second", "t": "第二个独立论点", "e": "从社区居民的收益切换到公司的间接收益，并非继续举第一个论点的例子。"}, {"p": 1, "c": "vocab", "q": "indirectly", "t": "indirectly adv.", "e": "间接地；公司并非通过设施本身直接收取收益。"}, {"p": 1, "c": "syntax", "q": "By supporting the community, they can enhance their reputation", "t": "方法状语＋主句", "e": "supporting 的逻辑主语为 they，即公司，主语关系清晰。"}, {"p": 1, "c": "expression", "q": "enhance their reputation, build customer loyalty", "t": "enhance / build", "e": "提升声誉、建立顾客忠诚度，注意各自动宾搭配。"}, {"p": 1, "c": "vocab", "q": "reputation", "t": "reputation n.", "e": "声誉、社会评价。"}, {"p": 1, "c": "vocab", "q": "loyalty", "t": "loyalty n.", "e": "忠诚度；customer loyalty 指顾客持续选择企业的倾向。"}, {"p": 1, "c": "expression", "q": "improve employee satisfaction", "t": "improve satisfaction", "e": "提高员工满意度；satisfaction 是名词，不等于 motivation。"}, {"p": 1, "c": "vocab", "q": "satisfaction", "t": "satisfaction n.", "e": "满意程度，本文指员工满意度。"}, {"p": 1, "c": "link", "q": "as workers often prefer companies", "t": "as：原因", "e": "解释社会责任为什么有助于员工满意度。"}, {"p": 1, "c": "expression", "q": "a strong sense of social responsibility", "t": "a sense of social responsibility", "e": "社会责任感；可用于评价企业的行为取向。"}, {"p": 2, "c": "syntax", "q": "making it compulsory for all large companies may create", "t": "动名词短语作主语", "e": "making … companies 作整体主语；may 表示可能性。"}, {"p": 2, "c": "vocab", "q": "compulsory", "t": "compulsory adj.", "e": "强制的、必须的。"}, {"p": 2, "c": "vocab", "q": "burdens", "t": "burden n.", "e": "负担，本文主要指企业额外财务或经营责任。"}, {"p": 2, "c": "expression", "q": "generate profit, provide jobs, and pay taxes", "t": "三个并列动宾搭配", "e": "创造利润、提供就业、缴税，用具体职责解释企业主要目的。"}, {"p": 2, "c": "syntax", "q": "Forcing them to build facilities could distract them from their core operations", "t": "动名词主语＋force sb to do", "e": "Forcing … facilities 整体作主语；distract sb from sth 表示使某人分心离开某事。"}, {"p": 2, "c": "vocab", "q": "distract", "t": "distract v.", "e": "使分心、分散注意力，常接 from。"}, {"p": 2, "c": "vocab", "q": "core operations", "t": "core operations", "e": "核心业务；operation 在此不是手术。"}, {"p": 2, "c": "vocab", "q": "competitiveness", "t": "competitiveness n.", "e": "竞争力。"}, {"p": 2, "c": "link", "q": "particularly in industries with high operating costs", "t": "限定适用范围", "e": "particularly 突出成本较高的行业，避免所有企业都同样受影响的绝对化判断。"}, {"p": 2, "c": "vocab", "q": "operating costs", "t": "operating costs", "e": "经营、运营成本，不只指设备操作费用。"}, {"p": 2, "c": "link", "q": "Moreover", "t": "递进", "e": "从企业成本扩展到政府职责。"}, {"p": 2, "c": "syntax", "q": "governments, which collect taxes", "t": "which 非限制性定语从句", "e": "补充政府为何更适合承担职责；which 后 collect 与 are better placed 并列。"}, {"p": 2, "c": "syntax", "q": "are better placed to allocate", "t": "be better placed to do", "e": "更有条件、更适合做某事。"}, {"p": 2, "c": "vocab", "q": "allocate", "t": "allocate v.", "e": "分配资源、资金等。"}, {"p": 2, "c": "link", "q": "among different regions and social groups", "t": "among：分配范围", "e": "资源在多个地区和社会群体间分配，among 连接分配动作和范围。"}, {"p": 3, "c": "vocab", "q": "beneficial", "t": "beneficial adj.", "e": "有益的、有利的；常用 beneficial to/for。"}, {"p": 3, "c": "syntax", "q": "it should not be seen as a duty", "t": "be seen as + 名词", "e": "被视为某种义务，呼应引言 be considered an obligation。"}, {"p": 3, "c": "expression", "q": "duty", "t": "duty / obligation", "e": "duty 回扣引言 obligation，均指义务；responsibility 更侧重责任。"}, {"p": 3, "c": "link", "q": "Instead", "t": "提出职责安排", "e": "由“不应是所有企业义务”转到“政府主责”的替代方案。"}, {"p": 3, "c": "syntax", "q": "companies should be encouraged, but not forced, to contribute", "t": "并列被动＋共享不定式", "e": "encouraged 与 forced 都接 to contribute；not forced 为插入式对照。"}, {"p": 3, "c": "expression", "q": "encouraged, but not forced", "t": "encouraged / forced", "e": "用对比精确表达自愿与强制的立场。"}], "sourcePage": 5}, {"id": "essay-05", "title": "交通拥堵税", "question": "In some cities, governments have tried to reduce traffic congestion. For instance, they have imposed a congestion tax during rush hour.\nDo you think this development is positive or negative?", "qzh": "一些城市的政府试图缓解交通拥堵，例如在高峰期征收拥堵税。你认为这是积极还是消极的发展？", "paragraphs": ["In many cities, governments have introduced congestion charges during peak hours in an effort to reduce traffic congestion. I strongly believe that this policy represents a positive development, as it helps alleviate environmental problems and encourages more sustainable transport choices.", "One key benefit of congestion charges is their ability to reduce the number of private vehicles on the road. By increasing the cost of driving during rush hours, unnecessary car journeys are discouraged, which leads to lower traffic volumes. As a result, levels of air pollution and noise pollution are significantly reduced, improving overall environmental quality in densely populated urban areas. This is particularly important in major cities, where excessive car use is a primary cause of traffic congestion.", "Another important advantage is the positive impact on commuters ’ well-being. Severe traffic congestion often results in long travel times, causing stress, frustration and mental fatigue. By easing traffic flow, congestion charges can make daily journeys more predictable and less exhausting. In addition, revenue generated from these charges can be invested in improving public transport systems, such as expanding bus and metro services. This further encourages people to shift away from private cars, creating a more efficient and balanced transport network.", "In conclusion, I firmly believe that imposing congestion charges during peak hours is a positive step forward. Not only does this policy reduce pollution and traffic-related stress, but it also supports the development of better public transport. In the long run, congestion pricing can help cities become cleaner, quieter and more livable places."], "translations": ["许多城市的政府在交通高峰时段征收拥堵费，以努力减轻拥堵。我坚信，这项政策是一种积极发展，因为它有助于缓解环境问题，并鼓励更可持续的交通选择。", "拥堵费的一个主要好处，是能减少道路上的私家车数量。提高高峰期驾车成本会抑制不必要的汽车出行，从而降低车流量。因此，空气污染和噪声污染显著减少，改善人口密集城市地区的整体环境质量。这对大城市尤其重要，因为过度使用汽车是拥堵的主要原因之一。", "另一个重要优点是对通勤者福祉的积极影响。严重拥堵经常导致出行时间延长，带来压力、挫败感和精神疲劳。拥堵费通过疏通车流，让日常出行更可预期、没那么疲惫。此外，收费产生的收入可用于改善公共交通，例如扩展公交和地铁服务。这会进一步鼓励人们放弃私家车，形成更高效、更均衡的交通网络。", "总之，我坚信高峰期征收拥堵费是积极的一步。该政策不仅减少污染和交通压力，也支持更好的公共交通发展。长远来看，拥堵收费能够帮助城市变得更清洁、更安静、更宜居。"], "kind": "积极／消极发展", "stance": "明确认为积极，论证环境与通勤两类收益。", "structure": [{"title": "引言", "role": "", "points": ["改写政策并表明积极立场。"]}, {"title": "主体一", "role": "", "points": ["1 条主链：收费 → 减少不必要驾车 → 车流和污染下降。"]}, {"title": "主体二", "role": "", "points": ["2 项相关收益：减轻通勤压力；收费收入投入公交形成进一步改善。"]}, {"title": "结论", "role": "", "points": ["重申两类收益与长期结果。"]}], "readerNotes": [{"p": 0, "c": "expression", "q": "introduced congestion charges", "t": "introduce charges", "e": "开始实施收费；charges 与题目 congestion tax 相关，但收费和税的法律含义不总相同。"}, {"p": 0, "c": "vocab", "q": "congestion", "t": "congestion n.", "e": "拥堵；交通语境为车流堵塞。"}, {"p": 0, "c": "expression", "q": "peak hours", "t": "peak hours / rush hours", "e": "交通高峰时段的近义替换。"}, {"p": 0, "c": "vocab", "q": "peak", "t": "peak adj.", "e": "高峰的，peak hours 为最繁忙时段。"}, {"p": 0, "c": "link", "q": "in an effort to", "t": "目的短语", "e": "表示采取收费措施是为了缓解拥堵。"}, {"p": 0, "c": "syntax", "q": "as it helps alleviate environmental problems and encourages more sustainable transport choices", "t": "as 原因从句中的并列谓语", "e": "helps alleviate 与 encourages 并列，分别对应环境改善和交通选择。"}, {"p": 0, "c": "vocab", "q": "alleviate", "t": "alleviate v.", "e": "缓解痛苦、压力、问题。"}, {"p": 0, "c": "vocab", "q": "sustainable", "t": "sustainable adj.", "e": "可持续的；交通语境强调较低资源消耗和环境负担。"}, {"p": 1, "c": "syntax", "q": "One key benefit of congestion charges is their ability to reduce", "t": "One benefit … is …", "e": "以名词结构点明好处，再由 to reduce 具体说明减少车辆的能力。"}, {"p": 1, "c": "syntax", "q": "By increasing the cost of driving", "t": "By + doing 的主语问题", "e": "后接被动句 unnecessary car journeys are discouraged，逻辑执行者不一致；改为 governments can discourage … 更清楚。"}, {"p": 1, "c": "vocab", "q": "discouraged", "t": "discourage v.", "e": "减少某种行为的发生、使不愿做；不只指口头劝阻。"}, {"p": 1, "c": "syntax", "q": "which leads to lower traffic volumes", "t": "which 补充结果", "e": "概括不必要驾车被抑制这一变化，导出车流下降。"}, {"p": 1, "c": "vocab", "q": "traffic volumes", "t": "traffic volume", "e": "车流量；volume 此处不是音量。"}, {"p": 1, "c": "link", "q": "As a result", "t": "结果", "e": "承接车流减少，推出污染下降。"}, {"p": 1, "c": "expression", "q": "air pollution and noise pollution", "t": "污染的具体分类", "e": "空气污染与噪声污染，两个并列名词让环境收益更具体。"}, {"p": 1, "c": "syntax", "q": "improving overall environmental quality", "t": "分词表示结果", "e": "补充空气、噪声污染下降带来的环境改善。"}, {"p": 1, "c": "vocab", "q": "densely populated", "t": "densely populated", "e": "人口密集的；densely 为副词。"}, {"p": 1, "c": "syntax", "q": "where excessive car use is a primary cause", "t": "where 定语从句", "e": "修饰 major cities，相当于 in which；解释该政策在大城市尤其重要的原因。"}, {"p": 1, "c": "vocab", "q": "excessive", "t": "excessive adj.", "e": "过度的、超过合理程度的。"}, {"p": 2, "c": "vocab", "q": "commuters", "t": "commuters n.", "e": "通勤者。"}, {"p": 2, "c": "syntax", "q": "causing stress, frustration and mental fatigue", "t": "分词说明后果", "e": "通勤时间增加带来三个心理或疲劳后果。"}, {"p": 2, "c": "vocab", "q": "frustration", "t": "frustration n.", "e": "挫败感、烦躁感，常由受阻或等待产生。"}, {"p": 2, "c": "vocab", "q": "fatigue", "t": "fatigue n.", "e": "疲劳，mental fatigue 指精神疲劳。"}, {"p": 2, "c": "link", "q": "By easing traffic flow", "t": "By：方法", "e": "说明收费政策改善出行体验的机制。"}, {"p": 2, "c": "expression", "q": "easing traffic flow", "t": "ease traffic flow", "e": "缓解交通压力；也可说 improve traffic flow。"}, {"p": 2, "c": "syntax", "q": "make daily journeys more predictable and less exhausting", "t": "make + 宾语 + 形容词", "e": "daily journeys 是宾语，more predictable 与 less exhausting 为补语，说明通勤如何改善。"}, {"p": 2, "c": "vocab", "q": "predictable", "t": "predictable adj.", "e": "可预测的；本文指通勤耗时更稳定。"}, {"p": 2, "c": "vocab", "q": "exhausting", "t": "exhausting adj.", "e": "令人疲惫的，描述通勤体验。"}, {"p": 2, "c": "link", "q": "In addition", "t": "补充", "e": "从通勤体验补充资金用途。"}, {"p": 2, "c": "syntax", "q": "revenue generated from these charges", "t": "过去分词后置修饰", "e": "generated … 修饰 revenue，相当于收入“由收费产生”。"}, {"p": 2, "c": "vocab", "q": "revenue", "t": "revenue n.", "e": "收入，本文为收费所得。"}, {"p": 2, "c": "syntax", "q": "can be invested in improving public transport systems", "t": "被动＋介词宾语", "e": "收入可以被投入交通建设；in 后接 improving，不接 improve。"}, {"p": 2, "c": "link", "q": "such as expanding bus and metro services", "t": "such as + doing", "e": "以扩展公交地铁为改善公共交通的具体内容。"}, {"p": 2, "c": "vocab", "q": "metro", "t": "metro n.", "e": "地铁、城市轨道交通系统。"}, {"p": 2, "c": "expression", "q": "shift away from private cars", "t": "shift away from", "e": "逐步减少依赖、转离某种选择。"}, {"p": 2, "c": "syntax", "q": "creating a more efficient and balanced transport network", "t": "分词结果状语", "e": "承接从私家车转向公交的变化，说明交通网络结果。"}, {"p": 3, "c": "syntax", "q": "imposing congestion charges during peak hours is a positive step forward", "t": "动名词主语", "e": "imposing … hours 整体作 is 的主语，重申对政策的评价。"}, {"p": 3, "c": "vocab", "q": "imposing", "t": "impose v.", "e": "征收、实施；这里指施加收费政策。"}, {"p": 3, "c": "syntax", "q": "Not only does this policy reduce", "t": "Not only 前置倒装", "e": "Not only 放句首，助动词 does 前置；后接 but it also supports …。"}, {"p": 3, "c": "vocab", "q": "traffic-related", "t": "traffic-related adj.", "e": "与交通有关的，连字符组成复合修饰语。"}, {"p": 3, "c": "link", "q": "In the long run", "t": "时间范围", "e": "把视角从立即减少污染，扩展到长期城市宜居性。"}, {"p": 3, "c": "expression", "q": "cleaner, quieter and more livable", "t": "三个形容词比较级", "e": "从环境、噪声、生活条件三方面归纳改善，最后一项用 more 构成比较级。"}, {"p": 3, "c": "expression", "q": "more livable", "t": "livable adj.", "e": "宜居的，用于城市话题。"}], "sourcePage": 6}, {"id": "essay-06", "title": "远程工作对雇主无益", "question": "Many employees can now do their work from home using modern technology. However, this change may only benefit workers, not the employers.\nTo what extent do you agree or disagree?", "qzh": "许多员工现在可借助现代科技在家工作。然而，这种变化可能只对员工有利，对雇主无益。你在多大程度上同意或不同意？", "paragraphs": ["Many employees are now able to work from home with the help of modern technology. However, some people argue that this development benefits only workers rather than employers. I largely agree with this view, as the advantages for employees are more direct and substantial, while the benefits for employers are relatively limited and conditional.", "One major reason why remote work mainly benefits employees is the flexibility it provides. Working from home allows individuals to arrange their working hours more freely and better balance professional responsibilities with personal needs. This flexibility leads to higher job satisfaction and reduced stress, which are immediate and personal advantages for workers. For example, employees can adjust their schedules to meet family responsibilities without compromising their work performance, something that is far less achievable in a traditional office setting.", "Another significant benefit for employees is the improvement in work-life balance. By eliminating long commutes, workers can spend more time with their families and maintain better mental well-being. This not only improves overall quality of life but also helps prevent long-term issues such as burnout and chronic stress. From the employers’ perspective, remote work may reduce certain operational costs, such as office space and utilities. However, these savings are often inconsistent and may be offset by investments in digital infrastructure and remote management systems.", "Despite some potential advantages for employers, managing a remote workforce remains demanding. Monitoring employee performance, ensuring collaboration and maintaining productivity can be problematic, particularly in large organisations. Unlike employees, who experience daily and tangible benefits, employers must rely heavily on effective supervision and technology to achieve comparable outcomes. As a result, while employers may gain indirect or short-term benefits, employees enjoy clearer and more consistent advantages from working remotely.", "In conclusion, although working from home can offer certain benefits to employers, these are generally limited and highly dependent on management quality and technology. In contrast, employees benefit more directly and reliably, especially in terms of flexibility and work-life balance."], "translations": ["许多员工如今能够借助现代科技在家工作。不过，有人认为这种发展只让员工而非雇主受益。我大体同意这一观点，因为员工获得的好处更直接、更显著，而雇主的收益相对有限且有条件。", "远程工作主要让员工受益的一个重要原因，是它提供的灵活性。在家工作使个人能更自由地安排工作时间，更好地平衡职业责任和个人需要。这种灵活性带来更高的工作满意度和更低的压力，是员工直接且个人化的收益。例如，员工可以调整时间表履行家庭责任，同时不损害工作表现，而这在传统办公室环境中更难做到。", "员工的另一个显著收益是工作与生活更平衡。省去漫长通勤后，员工可以花更多时间陪伴家人，并保持更好的心理健康。这不仅改善整体生活质量，也有助于预防职业倦怠和长期压力等问题。从雇主角度看，远程工作可能减少办公空间和水电等运营成本。然而，这些节省往往不稳定，可能被数字基础设施和远程管理系统的投入抵消。", "尽管雇主可能获得一些好处，管理远程员工队伍仍然很有挑战。监督员工表现、确保协作、维持生产效率可能存在困难，尤其在大型组织中。员工每天得到切实好处，与之不同，雇主必须高度依靠有效监督和技术，才能获得可比的结果。因此，雇主可能获得间接或短期收益，员工则从远程工作中享有更清楚、更稳定的好处。", "总之，虽然在家工作可以给雇主带来一定收益，但这些收益通常有限，而且高度取决于管理质量和技术。相比之下，员工得到的好处更直接、更可靠，尤其体现在灵活性及工作生活平衡上。"], "kind": "同意与否", "stance": "原题是“只让员工受益”；范文实际论证“员工收益更多”，承认雇主受益后应明确部分同意而非偷换范围。", "structure": [{"title": "引言", "role": "", "points": ["对比员工直接收益与雇主有条件收益。"]}, {"title": "主体一", "role": "", "points": ["灵活性 → 安排家庭责任 → 满意度提高。"]}, {"title": "主体二", "role": "", "points": ["通勤减少 → 生活平衡；同时承认雇主节约成本但有抵消因素。"]}, {"title": "主体三", "role": "", "points": ["雇主管理成本与困难", "与员工日常可感知的收益对照。"]}, {"title": "结论", "role": "", "points": ["强调收益程度的差异，而非完全没有收益。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "rather than employers", "t": "rather than + 名词", "e": "对比受益对象是员工还是雇主，不是对比工作地点。"}, {"p": 0, "c": "vocab", "q": "substantial", "t": "substantial adj.", "e": "显著的、程度大的；这里修饰好处。"}, {"p": 0, "c": "syntax", "q": "while the benefits for employers are relatively limited and conditional", "t": "while：对照", "e": "与前半句员工收益直接显著形成对照；不是时间含义。"}, {"p": 0, "c": "vocab", "q": "relatively", "t": "relatively adv.", "e": "相对而言，表示比较而非绝对数值。"}, {"p": 0, "c": "expression", "q": "limited and conditional", "t": "limited / conditional", "e": "有限且有条件，比直接说 no benefit 更有分寸，但也改变了原题 only 的强度。"}, {"p": 0, "c": "vocab", "q": "conditional", "t": "conditional adj.", "e": "有条件的，取决于某些前提。"}, {"p": 1, "c": "syntax", "q": "One major reason why remote work mainly benefits employees is the flexibility it provides", "t": "reason why … is + 名词短语", "e": "表语是 flexibility，后接省略 that 的定语从句 it provides。"}, {"p": 1, "c": "vocab", "q": "flexibility", "t": "flexibility n.", "e": "灵活性，此处指时间安排的自主程度。"}, {"p": 1, "c": "syntax", "q": "allows individuals to arrange", "t": "allow sb to do", "e": "允许／使某人能够做某事；后面 arrange 与 balance 并列。"}, {"p": 1, "c": "expression", "q": "balance professional responsibilities with personal needs", "t": "balance A with B", "e": "兼顾 A 与 B；不是消除职业责任。"}, {"p": 1, "c": "vocab", "q": "professional responsibilities", "t": "professional responsibilities", "e": "职业职责，与 personal needs 构成工作与个人的对照。"}, {"p": 1, "c": "expression", "q": "job satisfaction", "t": "job satisfaction", "e": "工作满意度，常用就业话题名词。"}, {"p": 1, "c": "syntax", "q": "which are immediate and personal advantages for workers", "t": "which 非限制性定语从句", "e": "which 指前面的更高满意度及更低压力，故用复数 are。"}, {"p": 1, "c": "link", "q": "For example", "t": "例子", "e": "调整时间履行家庭责任，具体说明灵活性怎样落实。"}, {"p": 1, "c": "syntax", "q": "without compromising their work performance", "t": "without + doing", "e": "在不损害工作表现的前提下。"}, {"p": 1, "c": "vocab", "q": "compromising", "t": "compromise v.", "e": "损害、影响质量，此处不是双方妥协。"}, {"p": 1, "c": "syntax", "q": "something that is far less achievable in a traditional office setting", "t": "something 概括前述情况", "e": "指兼顾家庭而不牺牲表现这件事；that 从句评价其在传统办公室的可行程度。"}, {"p": 1, "c": "vocab", "q": "achievable", "t": "achievable adj.", "e": "能够实现的；far less achievable 表示难以实现得多。"}, {"p": 2, "c": "expression", "q": "work-life balance", "t": "work-life balance", "e": "工作与生活的平衡。"}, {"p": 2, "c": "syntax", "q": "By eliminating long commutes, workers can spend more time with their families", "t": "By + doing", "e": "eliminating 与主句 workers 指同一行动者，说明省去通勤的具体收益。"}, {"p": 2, "c": "vocab", "q": "commutes", "t": "commute n.", "e": "上下班通勤的路程或过程。"}, {"p": 2, "c": "syntax", "q": "This not only improves overall quality of life but also helps prevent long-term issues", "t": "not only … but also …", "e": "并列现在生活质量和长期风险两层收益；not only 不在句首，无倒装。"}, {"p": 2, "c": "vocab", "q": "burnout", "t": "burnout n.", "e": "长期工作压力造成的身心倦怠。"}, {"p": 2, "c": "vocab", "q": "chronic stress", "t": "chronic stress", "e": "长期、持续性压力，chronic 不等于严重程度大。"}, {"p": 2, "c": "link", "q": "From the employers’ perspective", "t": "转换观察角度", "e": "从员工好处切换到雇主成本。"}, {"p": 2, "c": "expression", "q": "operational costs", "t": "operational costs", "e": "运营成本；具体例子为办公空间和水电。"}, {"p": 2, "c": "vocab", "q": "utilities", "t": "utilities n.", "e": "水、电等公用服务。"}, {"p": 2, "c": "link", "q": "However", "t": "转折", "e": "承认雇主能省成本后，说明节省也可能被抵消。"}, {"p": 2, "c": "vocab", "q": "inconsistent", "t": "inconsistent adj.", "e": "不稳定、不持续一致的，修饰节省的成本。"}, {"p": 2, "c": "syntax", "q": "may be offset by investments in digital infrastructure", "t": "may be + 过去分词", "e": "被动说明节省可能被数字投入抵消；may 保留可能性。"}, {"p": 2, "c": "vocab", "q": "offset", "t": "offset v.", "e": "抵消；这里节省被新增投入抵消。"}, {"p": 2, "c": "vocab", "q": "infrastructure", "t": "infrastructure n.", "e": "基础设施；digital infrastructure 指支持数字工作的网络系统等。"}, {"p": 3, "c": "link", "q": "Despite some potential advantages for employers", "t": "Despite + 名词短语", "e": "先承认潜在优势，再突出管理困难。"}, {"p": 3, "c": "vocab", "q": "demanding", "t": "demanding adj.", "e": "要求高、费力的；此处不是“提出要求”。"}, {"p": 3, "c": "syntax", "q": "Monitoring employee performance, ensuring collaboration and maintaining productivity", "t": "并列动名词作主语", "e": "三个管理任务并列，后接 can be problematic。"}, {"p": 3, "c": "vocab", "q": "collaboration", "t": "collaboration n.", "e": "协作、共同工作。"}, {"p": 3, "c": "vocab", "q": "productivity", "t": "productivity n.", "e": "生产效率、产出能力。"}, {"p": 3, "c": "link", "q": "particularly in large organisations", "t": "缩小重点范围", "e": "指出管理挑战尤其发生于大型组织，而非每家公司程度一致。"}, {"p": 3, "c": "link", "q": "Unlike employees", "t": "Unlike + 名词：对比", "e": "unlike 是介词；说明雇主获得收益的方式不同。"}, {"p": 3, "c": "vocab", "q": "tangible", "t": "tangible adj.", "e": "切实可感知的。"}, {"p": 3, "c": "syntax", "q": "employers must rely heavily on effective supervision and technology to achieve comparable outcomes", "t": "rely on … to do", "e": "依赖监督与技术来获得相近结果；to achieve 表示目的。"}, {"p": 3, "c": "vocab", "q": "supervision", "t": "supervision n.", "e": "监督、管理。"}, {"p": 3, "c": "vocab", "q": "comparable", "t": "comparable adj.", "e": "可比较的、相近的，修饰结果。"}, {"p": 4, "c": "syntax", "q": "highly dependent on management quality and technology", "t": "be dependent on", "e": "收益依赖管理与技术前提，highly 强调依赖程度。"}, {"p": 4, "c": "link", "q": "In contrast", "t": "对照", "e": "与雇主有限、有条件的收益对照。"}, {"p": 4, "c": "expression", "q": "directly and reliably", "t": "direct / indirect；reliable", "e": "结论通过直接性与可靠性比较收益，而非完全否认雇主获益。"}, {"p": 4, "c": "vocab", "q": "reliably", "t": "reliably adv.", "e": "可靠地、稳定可预期地，形容收益获得方式。"}, {"p": 4, "c": "link", "q": "especially in terms of flexibility and work-life balance", "t": "in terms of：评价维度", "e": "具体限定员工在哪些方面更明显受益。"}], "sourcePage": 7}, {"id": "essay-07", "title": "极限运动", "question": "Extreme sports such as skydiving and skiing are very dangerous and should be banned.\nTo what extent do you agree or disagree with this view?", "qzh": "跳伞、滑雪等极限运动非常危险，应该禁止。你在多大程度上同意或不同意？", "paragraphs": ["Nowadays, extreme sports are increasing in popularity around the world, with extreme sports competitions offering thrill and adventure to all participants involved. Though some people are in favor of outlawing these dangerous sports, I think that everyone should have the freedom to participate in extreme sports.", "On one hand, it is true that extreme sports such as water rafting, car racing, kickboxing, and sky diving are inherently risky. People who are inexperienced might be reckless and unprepared, which would increase the likelihood of a life-threatening injury. Even a skilled and highly experienced sports person could make a minor mistake and end up getting severely injured or losing their lives. For example, the famous snowboarder Caleb Moore attempted a backflip on his snowmobile during a competition, but he ended up in a violent crash, eventually passing away from complications resulting from his injury. Accidents like these are not only devastating to the competitors, but also to their friends, families, and dedicated fans.", "Nevertheless, even though extreme sports are risky, people should still have the freedom to participate in them as they wish. Extreme sports competitors generally relish the challenge, thrill, and adrenaline rush inherent in these sports activities, and many are well-aware and accepting of the risks involved. What's more, extreme sports often bring glorious fame and prestige to the competitors and even recognition to their country. Since extreme sports are significantly more challenging and require more advanced technique than other sports, competitors often feel a sense of pride in their accomplishments. Rather than outright banning extreme sports, governments should ensure that the sports facilities meet the required legal standards of safety and that all competitors take the necessary precautions.", "In conclusion, I believe that—despite the risks—people should have the freedom to participate in extreme sports because it provides immense excitement and adventure to many."], "translations": ["如今，极限运动在世界各地越来越受欢迎，各类极限运动比赛为参与者带来刺激与冒险。虽然有些人支持取缔这些危险运动，但我认为每个人都应有参加极限运动的自由。", "一方面，漂流、赛车、踢拳、跳伞等极限运动确实具有内在风险。缺乏经验的人可能鲁莽且准备不足，增加危及生命的受伤风险。即使技术娴熟、经验丰富的运动员，也可能因小错误而严重受伤甚至丧生。例如，范文称著名滑雪板运动员 Caleb Moore 在比赛中驾驶雪地摩托尝试后空翻，却发生猛烈撞击，最终死于伤势引起的并发症。这类事故不仅对参赛者造成沉重打击，对他们的朋友、家人和忠实粉丝也一样。", "不过，即便极限运动有风险，人们仍应有按意愿参与的自由。极限运动选手通常享受这些活动固有的挑战、刺激和肾上腺素激增感，许多人也充分了解并接受风险。此外，极限运动往往给选手带来荣耀、名望，甚至为国家赢得认可。由于这些运动比其他运动更有挑战、要求更高技术，选手通常会为自己的成就感到自豪。政府不应完全禁止极限运动，而应确保设施符合所要求的法定安全标准，所有参赛者也采取必要的预防措施。", "总之，我认为，尽管存在风险，人们仍应有参加极限运动的自由，因为它为许多人带来极大的刺激和冒险体验。"], "kind": "同意与否", "stance": "承认危险，但反对禁令；提倡安全监管。文中人物身份与事故细节未提供来源，不宜直接背成事实论据。", "structure": [{"title": "引言", "role": "", "points": ["承认争议，表明参与自由。"]}, {"title": "主体一", "role": "", "points": ["让步：风险无法完全消除", "经验不足和经验丰富者均可能受伤，再举事故例子。"]}, {"title": "主体二", "role": "", "points": ["自由与个人价值；荣誉和成就", "最后提出监管替代禁令。"]}, {"title": "结论", "role": "", "points": ["重申自由及体验价值。"]}], "readerNotes": [{"p": 0, "c": "expression", "q": "increasing in popularity", "t": "increase in popularity", "e": "越来越受欢迎，避免只用 more popular。"}, {"p": 0, "c": "syntax", "q": "with extreme sports competitions offering thrill and adventure", "t": "with + 名词 + doing", "e": "competitions 是 offering 的逻辑主语，附带说明受欢迎的体验来源。"}, {"p": 0, "c": "vocab", "q": "thrill", "t": "thrill n.", "e": "强烈的兴奋和刺激感。"}, {"p": 0, "c": "vocab", "q": "participants", "t": "participant n.", "e": "参与者；区别于只观看的观众。"}, {"p": 0, "c": "link", "q": "Though some people are in favor of", "t": "Though：让步", "e": "承认禁令支持者存在，再提出作者对自由的立场。"}, {"p": 0, "c": "vocab", "q": "outlawing", "t": "outlaw v.", "e": "宣布非法、禁止。"}, {"p": 0, "c": "expression", "q": "have the freedom to participate", "t": "have the freedom to do", "e": "有做某事的自由；不等于行为没有风险。"}, {"p": 1, "c": "vocab", "q": "inherently", "t": "inherently adv.", "e": "内在地、固有地。"}, {"p": 1, "c": "syntax", "q": "People who are inexperienced might be reckless and unprepared", "t": "who 定语从句＋might", "e": "who 限定缺乏经验的人；might 表示可能，不是所有新手必然鲁莽。"}, {"p": 1, "c": "vocab", "q": "reckless", "t": "reckless adj.", "e": "鲁莽的，不顾风险的。"}, {"p": 1, "c": "syntax", "q": "which would increase the likelihood of a life-threatening injury", "t": "which 补充结果", "e": "概括鲁莽、准备不足的状态；likelihood of 后接名词短语。"}, {"p": 1, "c": "expression", "q": "the likelihood of", "t": "likelihood of + 名词", "e": "……发生的可能性；increase the likelihood 表示风险上升。"}, {"p": 1, "c": "vocab", "q": "likelihood", "t": "likelihood n.", "e": "可能性、发生概率。"}, {"p": 1, "c": "vocab", "q": "life-threatening", "t": "life-threatening adj.", "e": "危及生命的，修饰 injury。"}, {"p": 1, "c": "link", "q": "Even a skilled and highly experienced sports person", "t": "Even：极端情形强调", "e": "用经验丰富者仍可能出事，支持风险无法完全消除。"}, {"p": 1, "c": "vocab", "q": "minor", "t": "minor adj.", "e": "微小的、不严重的；小失误也可能导致大后果。"}, {"p": 1, "c": "syntax", "q": "end up getting severely injured", "t": "end up + doing", "e": "最终落得某种结果；getting injured 为被动含义。"}, {"p": 1, "c": "vocab", "q": "severely", "t": "severely adv.", "e": "严重地，修饰受伤程度。"}, {"p": 1, "c": "vocab", "q": "backflip", "t": "backflip n.", "e": "后空翻；理解案例即可，不必列作通用写作输出词。"}, {"p": 1, "c": "syntax", "q": "complications resulting from his injury", "t": "现在分词后置修饰", "e": "resulting from 修饰 complications，说明并发症来源。"}, {"p": 1, "c": "vocab", "q": "complications", "t": "complications n.", "e": "此处为医疗上的并发症。"}, {"p": 1, "c": "syntax", "q": "not only devastating to the competitors, but also to their friends, families, and dedicated fans", "t": "not only … but also …", "e": "并列受影响的人群，两部分都由 to 引出。"}, {"p": 1, "c": "vocab", "q": "devastating", "t": "devastating adj.", "e": "造成毁灭性打击的、令人极度悲痛的。"}, {"p": 1, "c": "vocab", "q": "dedicated", "t": "dedicated adj.", "e": "忠实的、投入的，此处形容粉丝。"}, {"p": 2, "c": "link", "q": "Nevertheless", "t": "让步转折", "e": "承认上一段风险后，坚持不应全面禁止。"}, {"p": 2, "c": "link", "q": "even though extreme sports are risky", "t": "even though：让步", "e": "明确承认风险，但不由此直接推出禁令。"}, {"p": 2, "c": "syntax", "q": "as they wish", "t": "as：方式", "e": "按他们希望的方式，说明参与选择由个人作出。"}, {"p": 2, "c": "vocab", "q": "relish", "t": "relish v.", "e": "非常享受、喜爱。"}, {"p": 2, "c": "vocab", "q": "adrenaline rush", "t": "adrenaline rush", "e": "肾上腺素激增带来的兴奋感，运动题阅读表达。"}, {"p": 2, "c": "vocab", "q": "inherent", "t": "inherent adj.", "e": "固有的、内在的；与前段 inherently 词形呼应。"}, {"p": 2, "c": "syntax", "q": "many are well-aware and accepting of the risks involved", "t": "形容词并列＋后置分词", "e": "aware 与 accepting 共享 of；involved 后置修饰 risks。well-aware 通常无需连字符。"}, {"p": 2, "c": "link", "q": "What's more", "t": "递进补充", "e": "由挑战和刺激体验，进一步谈荣誉与国家认可。"}, {"p": 2, "c": "expression", "q": "glorious fame and prestige", "t": "fame / prestige", "e": "fame 是知名度，prestige 是声望；意义相关但不完全相同，glorious fame 稍显夸张。"}, {"p": 2, "c": "vocab", "q": "prestige", "t": "prestige n.", "e": "声望、威望。"}, {"p": 2, "c": "vocab", "q": "recognition", "t": "recognition n.", "e": "熟词生义：认可、赞誉，不是识别。"}, {"p": 2, "c": "link", "q": "Since extreme sports", "t": "Since：原因", "e": "说明为什么选手具有成就感。"}, {"p": 2, "c": "expression", "q": "a sense of pride in their accomplishments", "t": "a sense of pride / accomplishments", "e": "成就带来的自豪感；品质与动机表达。"}, {"p": 2, "c": "vocab", "q": "accomplishments", "t": "accomplishment n.", "e": "取得的成就、完成的重要事情。"}, {"p": 2, "c": "link", "q": "Rather than outright banning", "t": "rather than：替代方案", "e": "从禁止转为监管设施和预防措施。"}, {"p": 2, "c": "syntax", "q": "ensure that the sports facilities meet", "t": "ensure that … and that …", "e": "两个 that 从句分别说明设施达标与选手采取预防措施。"}, {"p": 2, "c": "expression", "q": "meet the required legal standards of safety", "t": "meet standards", "e": "达到标准；这里是设施达到安全要求。"}, {"p": 2, "c": "expression", "q": "take the necessary precautions", "t": "take precautions", "e": "采取预防措施，安全类常用搭配。"}, {"p": 2, "c": "vocab", "q": "precautions", "t": "precaution n.", "e": "预防措施，常用复数。"}, {"p": 3, "c": "link", "q": "despite the risks", "t": "despite + 名词", "e": "插在破折号之间再次承认危险，仍坚持参与自由。"}, {"p": 3, "c": "syntax", "q": "because it provides", "t": "指代问题", "e": "it 与前面的 extreme sports 复数不一致；可改为 these activities provide。"}, {"p": 3, "c": "vocab", "q": "immense", "t": "immense adj.", "e": "极大的，修饰 excitement。"}, {"p": 3, "c": "expression", "q": "excitement and adventure", "t": "excitement / adventure", "e": "刺激感与冒险体验，不是同一意义重复；结尾回扣引言体验价值。"}], "sourcePage": 8}, {"id": "essay-08", "title": "家用电器", "question": "In many countries people can buy a wide range of household goods (for example, TV, microwave ovens and rice cookers).\nIs it a positive or negative development?", "qzh": "许多国家的人们可以买到种类繁多的家用品，例如电视、微波炉和电饭煲。这是积极还是消极的发展？", "paragraphs": ["In modern society, an increasing number of people purchase various household appliances such as televisions, microwaves and rice cookers. In my view, this trend brings more advantages than disadvantages, though some negative consequences cannot be ignored.", "To begin with, these goods have greatly enhanced convenience and comfort in people’s daily routines. For instance, microwaves and rice cookers shorten the time spent on preparing meals, which is particularly beneficial for working professionals who often struggle to balance career and family responsibilities. Similarly, washing machines and vacuum cleaners reduce physical labour, allowing individuals to allocate their time to more meaningful or productive activities. As a result, the overall quality of life has improved remarkably.", "Moreover, household devices such as televisions and smart speakers provide people with easy access to information, knowledge and entertainment. This not only broadens horizons but also helps people stay connected with global events. In a fast-paced world, being well-informed is crucial, and technology makes this process far more efficient than in the past.", "Nevertheless, the rapid consumption of these products also generates challenges. The production and disposal of electronic appliances lead to environmental degradation, especially in the form of e-waste. Additionally, overdependence on machines may discourage physical activity, contributing to sedentary lifestyles and health concerns such as obesity.", "In conclusion, although there are undeniable drawbacks, I believe the positive aspects of using household goods outweigh the negatives. With stronger recycling systems and greater awareness of healthy living, the benefits of these devices can be maximised while minimising their harmful effects."], "translations": ["现代社会中，越来越多人购买电视、微波炉、电饭煲等各种家用电器。我认为这一趋势利大于弊，不过一些负面后果也不可忽视。", "首先，这些产品极大提高了日常生活的便利和舒适程度。例如，微波炉和电饭煲缩短做饭时间，对经常难以兼顾职业和家庭责任的上班族尤其有益。同样，洗衣机和吸尘器减少体力劳动，让人们能把时间用于更有意义或更有效率的活动。因此，整体生活质量显著改善。", "此外，电视和智能音箱等家用设备让人们容易获取信息、知识和娱乐。这不仅开阔眼界，也帮助人们跟上全球事件。在快节奏的世界中，了解信息至关重要，而科技使这一过程比过去高效得多。", "不过，这些产品的快速消费也产生挑战。电子电器的生产和废弃处置导致环境恶化，尤其是电子垃圾问题。此外，对机器的过度依赖可能减少身体活动，促成久坐生活方式及肥胖等健康问题。", "总之，虽然存在不可否认的弊端，我仍认为使用家用产品的积极方面超过消极方面。通过更完善的回收体系和更强的健康生活意识，可以在减少危害的同时，把这些设备的益处发挥到最大。"], "kind": "积极／消极发展", "stance": "总体积极，安排两段优点、一段弊端，再提出减害条件。", "structure": [{"title": "引言", "role": "", "points": ["总体利大于弊。"]}, {"title": "主体一", "role": "", "points": ["便利：缩短家务时间、减轻劳动 → 可重新分配时间。"]}, {"title": "主体二", "role": "", "points": ["信息与娱乐获取 → 开阔眼界、保持知情。"]}, {"title": "主体三", "role": "", "points": ["2 点风险：电子垃圾；过度依赖导致少动。"]}, {"title": "结论", "role": "", "points": ["综合判断并提出回收和健康意识。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "an increasing number of people purchase various household appliances", "t": "an increasing number of + 复数", "e": "表示越来越多的人，谓语用 purchase 而非 purchases。"}, {"p": 0, "c": "expression", "q": "household appliances", "t": "goods / appliances / devices", "e": "goods 范围最广；appliances 指电器；devices 强调设备，不是任意互换。"}, {"p": 0, "c": "vocab", "q": "appliances", "t": "appliances n.", "e": "家用电器、器具。"}, {"p": 0, "c": "expression", "q": "more advantages than disadvantages", "t": "advantages / disadvantages", "e": "优点和弊端的比较表达，正文应解释重要性而非只计数。"}, {"p": 0, "c": "link", "q": "though some negative consequences cannot be ignored", "t": "though：让步", "e": "总体支持后保留弊端，为后文负面段作预告。"}, {"p": 0, "c": "vocab", "q": "consequences", "t": "consequence n.", "e": "后果，不必然为负；此处由 negative 限定。"}, {"p": 1, "c": "expression", "q": "enhanced convenience and comfort", "t": "enhance convenience / comfort", "e": "提升便利与舒适，具体说明生活改善的维度。"}, {"p": 1, "c": "vocab", "q": "routines", "t": "routine n.", "e": "日常惯常活动、生活流程。"}, {"p": 1, "c": "link", "q": "For instance", "t": "举例", "e": "微波炉和电饭煲是“省时便利”的实例，不是新的中心论点。"}, {"p": 1, "c": "syntax", "q": "the time spent on preparing meals", "t": "过去分词修饰名词", "e": "spent on … 修饰 time，相当于 time that is spent …。"}, {"p": 1, "c": "syntax", "q": "which is particularly beneficial for working professionals", "t": "which 补充评价", "e": "指缩短做饭时间这一益处，后面的 who 从句进一步限定上班族。"}, {"p": 1, "c": "syntax", "q": "who often struggle to balance career and family responsibilities", "t": "who 从句＋struggle to do", "e": "修饰 working professionals，说明他们为什么特别需要省时电器。"}, {"p": 1, "c": "link", "q": "Similarly", "t": "类比补充", "e": "把烹饪电器的例子扩展到清洁电器。"}, {"p": 1, "c": "vocab", "q": "vacuum cleaners", "t": "vacuum cleaner", "e": "吸尘器，具体家用电器名词。"}, {"p": 1, "c": "vocab", "q": "physical labour", "t": "physical labour", "e": "体力劳动，区别于脑力工作。"}, {"p": 1, "c": "syntax", "q": "allowing individuals to allocate", "t": "allowing 表示结果", "e": "前文减少劳动，后文解释腾出的时间可以怎样使用。"}, {"p": 1, "c": "vocab", "q": "allocate", "t": "allocate v.", "e": "分配，此处为分配时间。"}, {"p": 1, "c": "vocab", "q": "productive", "t": "productive adj.", "e": "有成效的、能带来有效产出的。"}, {"p": 1, "c": "link", "q": "As a result", "t": "结果收束", "e": "把前面的减少家务、重新分配时间归结为生活质量改善。"}, {"p": 1, "c": "vocab", "q": "remarkably", "t": "remarkably adv.", "e": "显著地、明显地，修饰 improved。"}, {"p": 2, "c": "link", "q": "Moreover", "t": "追加独立维度", "e": "从家务便利转向信息、知识和娱乐获取。"}, {"p": 2, "c": "expression", "q": "easy access to", "t": "have access to", "e": "有机会或条件获取信息；access 是名词。"}, {"p": 2, "c": "vocab", "q": "access", "t": "access n.", "e": "获取机会或使用条件，常接 to。"}, {"p": 2, "c": "syntax", "q": "This not only broadens horizons but also helps people stay connected with global events", "t": "not only … but also …", "e": "两个并列谓语说明信息接触的不同结果：视野与时事联系。"}, {"p": 2, "c": "expression", "q": "broadens horizons", "t": "broaden horizons", "e": "开阔眼界，信息与教育类搭配。"}, {"p": 2, "c": "vocab", "q": "horizons", "t": "horizons n.", "e": "熟词生义：眼界、知识范围；不只指地平线。"}, {"p": 2, "c": "vocab", "q": "fast-paced", "t": "fast-paced adj.", "e": "节奏快的，用于描述现代生活。"}, {"p": 2, "c": "syntax", "q": "being well-informed is crucial", "t": "动名词作主语", "e": "being well-informed 整体作 is 的主语，表示掌握信息这一状态。"}, {"p": 2, "c": "vocab", "q": "well-informed", "t": "well-informed adj.", "e": "消息灵通、充分知情的。"}, {"p": 2, "c": "syntax", "q": "far more efficient than in the past", "t": "far + 比较级", "e": "far 加强 more efficient；than in the past 为省略式时间比较。"}, {"p": 3, "c": "link", "q": "Nevertheless", "t": "转折", "e": "由两段优点转入环境与健康风险。"}, {"p": 3, "c": "vocab", "q": "consumption", "t": "consumption n.", "e": "消费、消耗；本文指家用产品快速购置使用。"}, {"p": 3, "c": "syntax", "q": "The production and disposal of electronic appliances lead to environmental degradation", "t": "并列名词作主语", "e": "production 与 disposal 并列，谓语 lead 用复数形式。"}, {"p": 3, "c": "vocab", "q": "disposal", "t": "disposal n.", "e": "处理、处置，本文指废弃电器处置。"}, {"p": 3, "c": "vocab", "q": "degradation", "t": "degradation n.", "e": "恶化、退化。"}, {"p": 3, "c": "link", "q": "especially in the form of e-waste", "t": "具体化范围", "e": "把环境退化落到电子垃圾这一突出表现。"}, {"p": 3, "c": "vocab", "q": "e-waste", "t": "e-waste n.", "e": "电子废弃物，废旧电子电器产品。"}, {"p": 3, "c": "link", "q": "Additionally", "t": "第二项风险", "e": "由环境影响扩展到身体活动与健康。"}, {"p": 3, "c": "vocab", "q": "overdependence", "t": "overdependence n.", "e": "过度依赖；后常接 on。"}, {"p": 3, "c": "expression", "q": "discourage physical activity", "t": "discourage activity", "e": "降低进行活动的动力或机会，表达可能行为后果。"}, {"p": 3, "c": "syntax", "q": "contributing to sedentary lifestyles", "t": "分词结果＋contribute to", "e": "说明少活动可能带来久坐生活方式；to 后接名词，不是不定式。"}, {"p": 3, "c": "vocab", "q": "sedentary", "t": "sedentary adj.", "e": "久坐的、缺乏活动的。"}, {"p": 4, "c": "syntax", "q": "although there are undeniable drawbacks", "t": "although 从句＋there be", "e": "承认存在弊端，主句再作总体权衡。"}, {"p": 4, "c": "expression", "q": "outweigh the negatives", "t": "outweigh", "e": "在程度或重要性上超过，不能简化为“数量更多”。"}, {"p": 4, "c": "link", "q": "With stronger recycling systems", "t": "With + 名词短语", "e": "说明改善结果所依赖的条件。"}, {"p": 4, "c": "syntax", "q": "can be maximised while minimising", "t": "被动与省略主语", "e": "句意可懂，但 while 的动作执行者不明确；用 people can maximise … while minimising … 更平行。"}, {"p": 4, "c": "vocab", "q": "maximised", "t": "maximise v.", "e": "最大化、尽可能扩大；英式拼写。"}], "sourcePage": 9}, {"id": "essay-09", "title": "文物的归还", "question": "Historical objects in museums all over the world should be returned to their country of origin.\nTo what extent do you agree or disagree?", "qzh": "世界各地博物馆中的历史文物应归还原属国。你在多大程度上同意或不同意？", "paragraphs": ["In recent years, whether old historical objects in foreign museums should be sent back to their home countries has become a big debate. In my opinion, I partially agree with this idea. Returning these items respects history and builds local pride, but keeping some of them in big international museums protects them from damage and helps more people learn about different cultures.", "On the one hand, returning historical objects brings clear benefits to their home countries. Firstly, returning old objects helps fix past mistakes and makes countries friendlier. Many treasures were taken away during past wars. When foreign countries return them, it shows respect for the local history, which helps heal past hurts and brings different nations together. Secondly, showing local treasures at home makes local people proud of their culture. These objects are important symbols of a country's history. When local people can see them in person, they can easily learn about their past, which makes them feel more connected to their home and culture.", "On the other hand, there are good reasons why not all objects should be sent back immediately. For one thing, moving old and weak objects over long distances can easily break them. Many ancient items are very old and can be ruined by long trips or changes in weather and temperature. Therefore, keeping them in modern, safe museums is a better choice. Furthermore, big international museums make it easy for people to learn about different cultures in one place. Famous places like the British Museum welcome millions of visitors each year. Showing objects from all over the world in one museum allows tourists to learn about different cultures at the same time, spreading knowledge around the globe.", "In conclusion, I partially agree that historical items should be sent back to where they came from. Returning them rights past wrongs and makes local people proud. However, to keep these objects safe and help more people learn, countries should talk and work together rather than returning everything right away."], "translations": ["近年来，外国博物馆里的历史文物是否应送回原属国成为重大争论。我部分同意这一观点。归还这些物品能尊重历史、建立本地人的自豪感，但把其中一部分留在大型国际博物馆能够保护它们免受损害，也帮助更多人了解不同文化。", "一方面，归还历史文物对原属国有明显好处。首先，归还古物有助于纠正过去的错误，改善国家间关系。许多珍宝是在过去的战争中被带走的。外国归还它们，体现对当地历史的尊重，有助于弥合旧伤、拉近国家之间的距离。其次，在本国展示本地珍宝会让当地人为自己的文化自豪。这些物品是国家历史的重要象征。当地人能够亲眼看到它们，就更容易了解过去，增强与故土及文化的联系。", "另一方面，并非所有物品都应立即送回，也有充分理由。其一，长距离运输古老、脆弱的物品容易使其破损。许多古物年代久远，长途旅行或天气和温度变化都可能损坏它们。因此，将它们保存在现代、安全的博物馆中是更好的选择。此外，大型国际博物馆方便人们在同一个地方了解不同文化。大英博物馆等知名场所每年迎接数百万访客。在同一博物馆展示世界各地的物品，让游客同时了解多种文化，使知识传播到全球。", "总之，我部分同意历史文物应归还原属地。归还能够纠正历史错误，并让当地人自豪。然而，为了保护文物并帮助更多人学习，各国应沟通合作，而不是立即归还一切。"], "kind": "同意与否", "stance": "部分同意；归还的文化价值与保存、传播价值对照。", "structure": [{"title": "引言", "role": "", "points": ["明确部分同意，并预告双方理由。"]}, {"title": "主体一", "role": "", "points": ["2 点：修复历史关系；强化文化认同。"]}, {"title": "主体二", "role": "", "points": ["2 点：运输保护风险；跨文化展示价值。"]}, {"title": "结论", "role": "", "points": ["建议协商而非一概立即归还", "保存能力应按实际情况判断，不能假定外国必然更好。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "whether old historical objects in foreign museums should be sent back", "t": "whether 从句作主语", "e": "整个“是否应归还”的问题作 has become 的主语。"}, {"p": 0, "c": "expression", "q": "historical objects", "t": "objects / items / treasures", "e": "objects、items 泛指物品；treasures 增加珍贵的评价色彩。"}, {"p": 0, "c": "expression", "q": "their home countries", "t": "country of origin / home country", "e": "原属国、来源国的相关改写；此处不是指游客的祖国。"}, {"p": 0, "c": "vocab", "q": "partially", "t": "partially adv.", "e": "部分地，明确不是完全同意。"}, {"p": 0, "c": "syntax", "q": "Returning these items respects history and builds local pride", "t": "动名词主语＋并列谓语", "e": "Returning these items 作单数主语，respects 与 builds 都加 s。"}, {"p": 0, "c": "vocab", "q": "respects", "t": "respect v.", "e": "尊重，本文指尊重历史和原属国文化。"}, {"p": 0, "c": "link", "q": "but keeping some of them", "t": "but：利益对照", "e": "在归还的历史文化价值之后，补充保留部分藏品的理由。"}, {"p": 0, "c": "syntax", "q": "keeping some of them in big international museums protects them from damage", "t": "动名词主语＋protect from", "e": "保留部分文物是主语；protect sth from damage 指免受损坏。"}, {"p": 1, "c": "link", "q": "Firstly", "t": "Firstly / Secondly", "e": "一段内部明确区分两项归还理由。"}, {"p": 1, "c": "vocab", "q": "treasures", "t": "treasures n.", "e": "珍宝、宝贵文物。"}, {"p": 1, "c": "syntax", "q": "When foreign countries return them, it shows respect for the local history", "t": "When 从句及 it 指代", "e": "When 引出归还情境；it 概括归还行为，写成 this act shows … 指代更明确。"}, {"p": 1, "c": "expression", "q": "shows respect for", "t": "show respect for", "e": "表达对……的尊重，for 引出对象。"}, {"p": 1, "c": "syntax", "q": "which helps heal past hurts and brings different nations together", "t": "which＋并列谓语", "e": "补充归还所体现尊重的作用；helps 与 brings 并列。"}, {"p": 1, "c": "vocab", "q": "heal", "t": "heal v.", "e": "本文指修复历史伤害，不仅指治愈身体伤口。"}, {"p": 1, "c": "expression", "q": "brings different nations together", "t": "bring … together", "e": "拉近关系、促进团结，不一定是物理聚集。"}, {"p": 1, "c": "syntax", "q": "showing local treasures at home makes local people proud of their culture", "t": "make + 宾语 + 形容词", "e": "showing … 作主语；local people 是宾语，proud 为补语。"}, {"p": 1, "c": "expression", "q": "symbols of a country's history", "t": "symbols of history", "e": "历史的象征；文化类名词搭配。"}, {"p": 1, "c": "vocab", "q": "symbols", "t": "symbol n.", "e": "象征、具有代表意义的事物。"}, {"p": 1, "c": "link", "q": "When local people can see them in person", "t": "When：情境", "e": "说明亲眼接触文物怎样帮助本地人理解历史。"}, {"p": 1, "c": "expression", "q": "in person", "t": "in person", "e": "亲自、亲眼，区别于借助图片或媒体。"}, {"p": 1, "c": "vocab", "q": "connected", "t": "connected adj.", "e": "有联系、有归属感的；feel connected to 指情感联系。"}, {"p": 2, "c": "syntax", "q": "there are good reasons why", "t": "there are reasons why …", "e": "why 从句说明理由所对应的判断。"}, {"p": 2, "c": "vocab", "q": "immediately", "t": "immediately adv.", "e": "立刻、马上，强调归还的时间安排。"}, {"p": 2, "c": "link", "q": "For one thing", "t": "分点开头", "e": "提出运输风险，再用 Furthermore 补充文化传播价值。"}, {"p": 2, "c": "syntax", "q": "moving old and weak objects over long distances can easily break them", "t": "动名词主语", "e": "moving … distances 作 can break 主语；weak 用来形容文物不够准确，fragile 更自然。"}, {"p": 2, "c": "vocab", "q": "weak objects", "t": "weak adj. 的搭配", "e": "原文想表达脆弱易损的文物；fragile objects 更贴切，weak 一般不如此描述古物。"}, {"p": 2, "c": "vocab", "q": "ancient", "t": "ancient adj.", "e": "古代的；比一般 old 更强调久远年代。"}, {"p": 2, "c": "syntax", "q": "can be ruined by long trips or changes in weather and temperature", "t": "情态动词被动", "e": "说明文物受到的损害，by 后列出潜在因素。"}, {"p": 2, "c": "vocab", "q": "ruined", "t": "ruin v.", "e": "毁坏、严重损害。"}, {"p": 2, "c": "link", "q": "Therefore", "t": "推论", "e": "由长途运输可能损坏，推到继续保存的建议；是否成立取决于实际保护条件。"}, {"p": 2, "c": "syntax", "q": "keeping them in modern, safe museums is a better choice", "t": "动名词作主语＋比较级", "e": "以 better choice 表示比较判断，但需说明与哪种运输保存条件比较。"}, {"p": 2, "c": "link", "q": "Furthermore", "t": "新增第二理由", "e": "从实物安全转到跨文化学习价值。"}, {"p": 2, "c": "syntax", "q": "make it easy for people to learn about different cultures", "t": "make it + adj. + for sb + to do", "e": "it 为形式宾语，to learn … 是实际被评价的活动。"}, {"p": 2, "c": "syntax", "q": "allows
