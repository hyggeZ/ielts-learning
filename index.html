tourists to learn", "t": "allow sb to do", "e": "展示各国文物使游客能了解多元文化。"}, {"p": 2, "c": "syntax", "q": "spreading knowledge around the globe", "t": "分词表示结果", "e": "跨文化展览使知识得到更广泛传播。"}, {"p": 2, "c": "expression", "q": "around the globe", "t": "around the globe / all over the world", "e": "世界各地的表达替换。"}, {"p": 3, "c": "vocab", "q": "partially", "t": "partially adv.", "e": "部分地，明确有条件而非全面赞成。"}, {"p": 3, "c": "syntax", "q": "should be sent back to where they came from", "t": "被动＋where 从句", "e": "sent back 是被动；where they came from 作 to 后的地点内容，指原属地。"}, {"p": 3, "c": "vocab", "q": "rights past wrongs", "t": "right v.", "e": "熟词生义：纠正。rights past wrongs＝纠正过去的不公。"}, {"p": 3, "c": "vocab", "q": "rights", "t": "right v.", "e": "注意本句是 rights past wrongs：right 为动词纠正，与 wrongs 名词不公相对。"}, {"p": 3, "c": "link", "q": "to keep these objects safe and help more people learn", "t": "to do 表目的", "e": "两个并列动词说明协商合作的目的。"}, {"p": 3, "c": "link", "q": "rather than", "t": "对比选择", "e": "协商合作优于立即全部归还。"}, {"p": 3, "c": "expression", "q": "right away", "t": "right away / immediately", "e": "立即、马上；作者反对的是立即全部归还，而非所有归还。"}], "sourcePage": 10}, {"id": "essay-10", "title": "公司工厂迁移", "question": "Traffic and housing problems could be solved by moving large companies, factories and their employees to the countryside.\nTo what extent do you agree or disagree?", "qzh": "将大公司、工厂及其员工迁往乡村可以解决交通和住房问题。你在多大程度上同意或不同意？", "paragraphs": ["In today’s world, it is widely believed that relocating large companies, factories, and their employees to rural areas could effectively solve urban problems such as traffic congestion and housing shortages. I completely agree with this view because such a move would significantly reduce both traffic pressure and the demand for accommodation in cities.", "The first and foremost benefit of moving big enterprises and factories to the countryside is the reduction of traffic congestion in urban centers. When businesses and their employees relocate to rural regions, the number of daily commuters traveling to and from cities will decline sharply. Consequently, there will be fewer vehicles on the roads, leading to smoother traffic flow and less pollution. For example, a recent study in the United States and the United Kingdom revealed that government incentives encouraging major corporations to establish offices and factories outside urban areas resulted in a noticeable decline in congestion levels in cities such as New York and London between 2000 and 2020. This demonstrates that decentralizing industries can be an effective strategy to mitigate urban traffic problems.", "In addition, this policy could help alleviate housing shortages in metropolitan areas. Big companies often create attractive employment opportunities, drawing large numbers of workers to live near their workplaces. This influx of people drives up housing demand and property prices, making it difficult for residents to find affordable accommodation. However, by relocating these enterprises to the countryside, cities would experience reduced population density, easing the housing crisis. At the same time, this would promote development in rural areas by making better use of underutilized land and infrastructure.", "In conclusion, I firmly believe that transferring major companies, factories, and their employees to rural areas can effectively address two pressing urban challenges—traffic congestion and housing shortages. This approach not only improves living conditions in cities but also contributes to balanced regional development."], "translations": ["当今世界，人们普遍认为，把大公司、工厂及其员工迁往农村地区，能够有效解决城市交通拥堵和住房短缺等问题。我完全同意，因为这种迁移能显著降低城市的交通压力和住房需求。", "大型企业和工厂迁往乡村的首要好处，是减少城市中心的交通拥堵。当企业及员工迁往农村地区，每天往返城市的通勤者会大幅减少。因此，道路车辆更少，交通更顺畅，污染更轻。例如，范文称美国和英国的一项近期研究发现，政府鼓励大企业在城市以外设立办公室和工厂的激励措施，使纽约、伦敦等城市在2000年至2020年间的拥堵程度明显下降。这说明，分散产业可以是缓解城市交通问题的有效策略。", "此外，这项政策能够缓解大都市地区的住房短缺。大公司往往创造有吸引力的就业机会，吸引大量员工住到工作地点附近。人口流入推高住房需求和房价，使居民难以找到负担得起的住处。但把这些企业迁往乡村，会降低城市人口密度，缓解住房危机。同时，这也能通过更充分利用闲置土地和基础设施，促进农村发展。", "总之，我坚信将大公司、工厂及员工迁往农村地区，能有效应对交通拥堵和住房短缺这两项紧迫的城市挑战。这不仅改善城市居住条件，也有助于地区均衡发展。"], "kind": "同意与否", "stance": "完全同意。文中的“近期研究”未给出处，具体城市及年份不应当作已核实证据。", "structure": [{"title": "引言", "role": "", "points": ["表态完全同意，预告交通与住房两个论点。"]}, {"title": "主体一", "role": "", "points": ["企业和员工外迁 → 通勤人数减少 → 车流下降", "研究例子缺少来源。"]}, {"title": "主体二", "role": "", "points": ["解释公司吸引人口及推高房价的机制，再反推外迁的好处", "补充农村发展。"]}, {"title": "结论", "role": "", "points": ["汇总两大城市问题及区域均衡收益。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "it is widely believed that", "t": "It is believed that …", "e": "被动报告结构，用来引出一种普遍观点，不等于证实其正确。"}, {"p": 0, "c": "syntax", "q": "relocating large companies, factories, and their employees to rural areas could effectively solve", "t": "动名词主语", "e": "relocating … areas 是 could solve 的主语，列举公司、工厂及员工三个迁移对象。"}, {"p": 0, "c": "vocab", "q": "relocating", "t": "relocate v.", "e": "搬迁、迁址。"}, {"p": 0, "c": "vocab", "q": "rural", "t": "rural adj.", "e": "乡村的；与 urban（城市的）对照。"}, {"p": 0, "c": "expression", "q": "traffic congestion and housing shortages", "t": "交通与住房搭配", "e": "交通拥堵、住房短缺，常见城市话题名词组合。"}, {"p": 0, "c": "link", "q": "because such a move would significantly reduce", "t": "because：理由预告", "e": "把同意立场直接连到交通压力和住房需求两个核心理由。"}, {"p": 0, "c": "vocab", "q": "significantly", "t": "significantly adv.", "e": "显著地、程度较大地，修饰 reduce。"}, {"p": 0, "c": "expression", "q": "the demand for accommodation", "t": "demand for", "e": "对住房的需求，for 引出需求对象。"}, {"p": 0, "c": "vocab", "q": "accommodation", "t": "accommodation n.", "e": "住处、住宿；本文指城市住房，通常不可数。"}, {"p": 1, "c": "syntax", "q": "The first and foremost benefit of moving big enterprises and factories to the countryside is the reduction", "t": "名词主语＋be＋名词表语", "e": "核心为 benefit is the reduction；of moving … 说明哪种做法的收益。"}, {"p": 1, "c": "expression", "q": "first and foremost", "t": "first and foremost", "e": "首要的；本文强调交通收益是首先讨论的重点。"}, {"p": 1, "c": "vocab", "q": "enterprises", "t": "enterprise n.", "e": "企业、商业组织，不是进取心含义。"}, {"p": 1, "c": "link", "q": "When businesses and their employees relocate", "t": "When：条件情境", "e": "设置企业和员工迁移的前提，再推导通勤人数下降。"}, {"p": 1, "c": "syntax", "q": "commuters traveling to and from cities", "t": "现在分词后置修饰", "e": "traveling … 修饰 commuters，指往返城市的人；不是句子主谓中的独立谓语。"}, {"p": 1, "c": "vocab", "q": "commuters", "t": "commuter n.", "e": "通勤者，每日往返居住地和工作地的人。"}, {"p": 1, "c": "expression", "q": "decline sharply", "t": "decline sharply", "e": "大幅下降；sharply 修饰变化幅度。"}, {"p": 1, "c": "link", "q": "Consequently", "t": "结果", "e": "承接通勤人数减少，说明车辆、交通和污染的变化。"}, {"p": 1, "c": "syntax", "q": "leading to smoother traffic flow and less pollution", "t": "分词表示结果", "e": "车辆减少带来两个结果：车流更顺、污染更少。"}, {"p": 1, "c": "syntax", "q": "government incentives encouraging major corporations to establish offices and factories", "t": "分词修饰＋encourage sb to do", "e": "encouraging … 修饰 incentives，说明激励措施具体鼓励企业做什么。"}, {"p": 1, "c": "vocab", "q": "incentives", "t": "incentives n.", "e": "激励措施，例如补贴或优惠。"}, {"p": 1, "c": "vocab", "q": "noticeable", "t": "noticeable adj.", "e": "明显可察觉的，修饰 decline。"}, {"p": 1, "c": "link", "q": "This demonstrates that", "t": "回扣论点", "e": "This 指前面研究例子，that 从句说明作者从例子得出的判断；例子本身仍需可靠来源。"}, {"p": 1, "c": "vocab", "q": "decentralizing", "t": "decentralize v.", "e": "使分散、减少集中。"}, {"p": 1, "c": "expression", "q": "mitigate urban traffic problems", "t": "mitigate / alleviate", "e": "在本文均为缓解问题，而非完全消除。"}, {"p": 1, "c": "vocab", "q": "mitigate", "t": "mitigate v.", "e": "缓和、减轻严重程度。"}, {"p": 2, "c": "vocab", "q": "alleviate", "t": "alleviate v.", "e": "缓解，本文指住房短缺。"}, {"p": 2, "c": "vocab", "q": "metropolitan", "t": "metropolitan adj.", "e": "大都市的。"}, {"p": 2, "c": "syntax", "q": "drawing large numbers of workers to live near their workplaces", "t": "分词说明结果", "e": "就业机会吸引员工到附近居住，构成住房需求上升的原因链。"}, {"p": 2, "c": "vocab", "q": "influx", "t": "influx n.", "e": "大量涌入，本文指人口流入。"}, {"p": 2, "c": "expression", "q": "drives up housing demand", "t": "drive up", "e": "推高需求或价格。"}, {"p": 2, "c": "vocab", "q": "property prices", "t": "property prices", "e": "房产价格；property 在此不是一般个人财物。"}, {"p": 2, "c": "syntax", "q": "making it difficult for residents to find", "t": "make it + adj. + for sb + to do", "e": "it 为形式宾语，不定式说明真正困难的事。"}, {"p": 2, "c": "vocab", "q": "affordable", "t": "affordable adj.", "e": "负担得起的，不等于单纯价格最低。"}, {"p": 2, "c": "link", "q": "However", "t": "反向推导", "e": "前半段解释企业吸引人口的机制，转折后将企业外迁，推出相反结果。"}, {"p": 2, "c": "link", "q": "by relocating these enterprises", "t": "by + doing", "e": "表实现方法，但主句 cities 非搬迁执行者；可写 relocating … would reduce …。"}, {"p": 2, "c": "syntax", "q": "cities would experience reduced population density, easing the housing crisis", "t": "主句＋分词结果", "e": "城市人口密度降低，easing … 补充说明由此缓解住房危机。"}, {"p": 2, "c": "vocab", "q": "population density", "t": "population density", "e": "人口密度，强调一定面积内的人口数量。"}, {"p": 2, "c": "expression", "q": "easing the housing crisis", "t": "ease / alleviate", "e": "在本文均为缓解；缓解危机不意味着完全消除住房短缺。"}, {"p": 2, "c": "link", "q": "At the same time", "t": "同时补充", "e": "从城市减压扩展到农村发展。"}, {"p": 2, "c": "vocab", "q": "underutilized", "t": "underutilized adj.", "e": "未充分利用的。"}, {"p": 2, "c": "vocab", "q": "infrastructure", "t": "infrastructure n.", "e": "道路、供水等基础设施。"}, {"p": 3, "c": "vocab", "q": "pressing", "t": "pressing adj.", "e": "紧迫的，修饰 challenges；不是按压动作。"}, {"p": 3, "c": "syntax", "q": "This approach not only improves living conditions in cities but also contributes to balanced regional development", "t": "not only … but also …", "e": "并列城市生活条件与区域发展两类结果；contribute to 后接名词。"}, {"p": 3, "c": "link", "q": "not only", "t": "not only … but also …", "e": "结尾把城市内部改善与区域均衡两个层面并列，回扣前文而非新增证据。"}, {"p": 3, "c": "expression", "q": "balanced regional development", "t": "balanced development", "e": "均衡发展，本文指城市与乡村之间的区域平衡。"}, {"p": 3, "c": "vocab", "q": "regional", "t": "regional adj.", "e": "区域的、地区之间的。"}], "sourcePage": 11}, {"id": "essay-11", "title": "追寻理想社会", "question": "Throughout history, people have dreamed of living in a perfect society, while they have not agreed on what the ideal society would be like.\nWhat do you think is the most important element that makes a perfect society?\nHow do people achieve an ideal society?", "qzh": "历史上，人们梦想生活在完美社会中，却未就理想社会的样貌达成共识。你认为最重要的构成因素是什么？人们如何实现理想社会？", "paragraphs": ["Since the last few centuries, creating a perfect community has been a desire of many intellectuals, although they haven’t identified the character of an ideal society. This essay will discuss the crucial elements to build an ideal society as well as the ways to get it in the following paragraphs.", "To begin with, the vital element to building an ideal community, the most important element is education. This element brings many benefits not only to an individual but also to the whole of mankind. For instance, educated members of society can think independently and they can remove social vices. Education can eradicate the practices of discrimination in society, and as a result, harmony and peace will build up in society, which is the most essential part of any perfect society. Moreover, health plays a vital role in the creation of a society. The healthy members of society are more productive; their energy and resources can be fully utilized for the development of society, instead of curing and defending the health-related problems of the members.", "On the other hand, to achieve a perfect community these elements should be used by people effectively and efficiently. Educated people should provide their services to all segments of society. For example, the medical field, science, literature, and, many other fields need dedicated scholars to develop them. The culture and traditions should be wisely preserved by the people. Furthermore, healthy people in society can work effectively. Hence, to achieve an ideal society the citizens have to work together without any discrimination in any section of the industry.", "In conclusion, the intellectuals should utilize the most important elements of the society such as education and health. The integrated efforts of people could achieve a dream of a perfect society."], "translations": ["过去几个世纪以来，建立完美社会一直是许多知识分子的愿望，尽管他们尚未明确理想社会的特征。本文将在下文讨论建立理想社会的关键因素及实现途径。", "首先，建立理想社会最重要的因素是教育。这不仅给个人，也给全人类带来许多好处。例如，受教育的社会成员能够独立思考，并消除社会弊病。教育能够消除社会中的歧视做法，进而促进和谐与和平，而这正是任何完美社会最重要的部分。此外，健康在社会建设中发挥重要作用。健康的社会成员更有生产力，其精力和资源可充分用于社会发展，而非用于治疗和应对成员的健康问题。", "另一方面，要实现完美社会，人们应有效、高效地利用这些因素。受教育的人应向社会各阶层提供服务。例如，医疗、科学、文学等许多领域需要投入的学者推动发展。人们应明智地保存文化和传统。此外，健康的社会成员能高效工作。因此，要实现理想社会，公民必须在各个行业中不带歧视地共同努力。", "总之，知识分子应利用教育和健康等社会最重要的因素。人们共同努力能够实现完美社会的梦想。"], "kind": "双问题：重要因素＋实现方法", "stance": "正文把教育称为最重要因素，又补充健康。应让“最重要”的主次更明确；本篇语言质量参差。题干已修复明显粘连并规范语法，原始提取文本另存。", "structure": [{"title": "引言", "role": "", "points": ["宣告讨论因素与方法", "Since the last few centuries 不自然，应为 Over the past few centuries。"]}, {"title": "主体一", "role": "", "points": ["教育：独立思考、减少歧视、促进和谐；健康：生产力与资源利用", "开头重复 element，句法需重写。"]}, {"title": "主体二", "role": "", "points": ["专业服务、文化保存、公民合作", "文化保存与前文教育健康的关联解释不足。"]}, {"title": "结论", "role": "", "points": ["汇总教育健康与共同努力。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "creating a perfect community has been a desire", "t": "动名词主语＋现在完成时", "e": "creating … community 整体作 has been 的主语，说明这种愿望延续至今。"}, {"p": 0, "c": "vocab", "q": "intellectuals", "t": "intellectuals n.", "e": "知识分子。"}, {"p": 0, "c": "link", "q": "although they haven’t identified", "t": "although：让步", "e": "虽有愿望，却尚未清楚界定理想社会；they 指 intellectuals。"}, {"p": 0, "c": "vocab", "q": "character", "t": "character n.", "e": "熟词生义：特征、性质；这里不是人物角色或品格。"}, {"p": 0, "c": "expression", "q": "crucial elements", "t": "crucial / vital / essential", "e": "都可强调重要，但题目要求 most important，不能只列多个同等重要因素。"}, {"p": 0, "c": "vocab", "q": "crucial", "t": "crucial adj.", "e": "至关重要的，程度强于一般 important。"}, {"p": 1, "c": "syntax", "q": "the vital element to building an ideal community, the most important element is education", "t": "重复主语问题", "e": "the vital element 与 the most important element 重复堆叠；保留后者即可形成清楚主干。"}, {"p": 1, "c": "syntax", "q": "not only to an individual but also to the whole of mankind", "t": "not only … but also …", "e": "并列两个 to 介词短语，强调个人与社会双重收益。"}, {"p": 1, "c": "vocab", "q": "mankind", "t": "mankind n.", "e": "人类的总称；现代写作也常用 humankind。"}, {"p": 1, "c": "link", "q": "For instance", "t": "举例", "e": "受教育者独立思考、减少社会弊病，用以支持教育的社会价值。"}, {"p": 1, "c": "expression", "q": "think independently", "t": "think independently", "e": "独立思考；可积累的能力表达。"}, {"p": 1, "c": "vocab", "q": "social vices", "t": "social vices", "e": "社会弊病；vice 在此不是“副”。"}, {"p": 1, "c": "vocab", "q": "eradicate", "t": "eradicate v.", "e": "根除、消除，语气较强。"}, {"p": 1, "c": "vocab", "q": "discrimination", "t": "discrimination n.", "e": "歧视。"}, {"p": 1, "c": "link", "q": "as a result", "t": "结果", "e": "教育减少歧视后，推导和谐与和平。"}, {"p": 1, "c": "vocab", "q": "harmony", "t": "harmony n.", "e": "和谐、协调；此处强调社会关系状态。"}, {"p": 1, "c": "syntax", "q": "which is the most essential part", "t": "which 非限制性定语从句", "e": "补充说明和谐和平的价值；指代范围应避免模糊。"}, {"p": 1, "c": "vocab", "q": "essential", "t": "essential adj.", "e": "必不可少的、极重要的。"}, {"p": 1, "c": "link", "q": "Moreover", "t": "补充另一因素", "e": "由教育转到健康；该转换应明确二者主次，避免削弱“最重要”任务。"}, {"p": 1, "c": "expression", "q": "plays a vital role", "t": "play a vital role in", "e": "在……中发挥重要作用。"}, {"p": 1, "c": "expression", "q": "more productive", "t": "productive adj.", "e": "生产效率高、成果多；本文用于健康公民的社会贡献。"}, {"p": 1, "c": "syntax", "q": "their energy and resources can be fully utilized", "t": "can be + 过去分词", "e": "被动说明精力和资源能够被充分利用；fully 表示程度。"}, {"p": 1, "c": "vocab", "q": "utilized", "t": "utilize v.", "e": "利用，正式语体；不必在所有语境替换 use。"}, {"p": 1, "c": "link", "q": "instead of curing and defending the health-related problems", "t": "instead of + doing", "e": "表示资源用途的替代；defend problems 搭配不自然，应改成 preventing 或 addressing health problems。"}, {"p": 1, "c": "vocab", "q": "curing", "t": "cure v.", "e": "治疗、治愈；注意疾病对象的搭配。"}, {"p": 2, "c": "link", "q": "On the other hand", "t": "衔接不够准确", "e": "此处从因素转到办法，并非对立面；To achieve this 更符合关系。"}, {"p": 2, "c": "syntax", "q": "to achieve a perfect community", "t": "不定式表目的", "e": "放在句首，交代后续行动的目标。"}, {"p": 2, "c": "syntax", "q": "these elements should be used by people effectively and efficiently", "t": "should be + 过去分词", "e": "被动建议，effectively 强调达到目标，efficiently 强调效率，不是重复同义。"}, {"p": 2, "c": "vocab", "q": "efficiently", "t": "efficiently adv.", "e": "高效率地，以较少资源或时间完成事情。"}, {"p": 2, "c": "expression", "q": "provide their services to all segments of society", "t": "provide sth to sb", "e": "向社会各阶层提供服务；也可用 provide sb with sth，但不能混合两种搭配。"}, {"p": 2, "c": "vocab", "q": "segments", "t": "segments n.", "e": "部分、群体；all segments of society＝社会各阶层。"}, {"p": 2, "c": "link", "q": "For example", "t": "举例范围", "e": "medical field、science、literature 是专业服务的领域例子，并非新的主要措施。"}, {"p": 2, "c": "vocab", "q": "literature", "t": "literature n.", "e": "此处为文学领域，不是科研中的文献综述。"}, {"p": 2, "c": "expression", "q": "dedicated scholars", "t": "dedicated adj.", "e": "投入的、敬业的，描述人的品质。"}, {"p": 2, "c": "vocab", "q": "scholars", "t": "scholar n.", "e": "学者、研究者。"}, {"p": 2, "c": "syntax", "q": "The culture and traditions should be wisely preserved", "t": "并列主语＋情态被动", "e": "culture 与 traditions 并列；preserved 表被保护保存，wisely 说明方式。"}, {"p": 2, "c": "vocab", "q": "preserved", "t": "preserve v.", "e": "保存、保护，使传统延续。"}, {"p": 2, "c": "link", "q": "Hence", "t": "结果", "e": "由各方提供服务、有效工作归纳到共同努力。"}, {"p": 2, "c": "link", "q": "without any discrimination", "t": "without + 名词短语", "e": "强调合作的条件：不带歧视；无从句结构。"}, {"p": 3, "c": "vocab", "q": "utilize", "t": "utilize v.", "e": "利用、运用，正式表达。"}, {"p": 3, "c": "syntax", "q": "such as education and health", "t": "举例短语", "e": "说明最重要的 elements 包括哪些；结尾仍未明确一个最高优先因素。"}, {"p": 3, "c": "expression", "q": "integrated efforts", "t": "integrated efforts", "e": "协同努力；此处用 joint efforts 更常见。"}, {"p": 3, "c": "vocab", "q": "integrated", "t": "integrated adj.", "e": "整合的、协同的，强调不同部分共同作用。"}, {"p": 3, "c": "expression", "q": "achieve a dream of a perfect society", "t": "achieve / realise a dream", "e": "实现梦想；这里可积累的是搭配，而不是背诵整段结论。"}], "sourcePage": 12}, {"id": "essay-12", "title": "科技发展对犯罪的影响", "question": "Some people think technology development decreases crime, while others believe it actually encourages crime.\nDiscuss both views and give your own opinion.", "qzh": "有人认为科技发展减少犯罪，另一些人认为它助长犯罪。讨论双方观点并给出你自己的看法。", "paragraphs": ["The impact of technology on crime rates is a complex issue with strong arguments on both sides. Proponents believe technological advancements are a boon to public safety, while others argue they create new avenues for criminal activity. Examining these viewpoints will help us understand the true relationship between technology and crime.", "Advocates for technology's crime-fighting potential point to advancements in surveillance and law enforcement tools. Security cameras, for instance, deter crime by increasing the perceived risk of getting caught. Additionally, data analysis software helps police identify crime patterns and predict future incidents, allowing for targeted patrols and proactive measures. Furthermore, digital forensics allow for more effective investigation and prosecution of crimes.", "However, critics argue that technology can also be a breeding ground for criminal activity. The rise of the internet has facilitated cyber crime, with criminals exploiting vulnerabilities to steal data, commit fraud, or launch cyber attacks. The anonymity provided by online platforms can embolden criminals, while readily available tutorials and forums can even create a sense of community for them. Additionally, concerns exist regarding the potential misuse of surveillance technology for mass monitoring, infringing on individual privacy.", "In my opinion, technology is a double-edged sword when it comes to crime. While it undoubtedly offers valuable tools for law enforcement, it also presents new challenges. The key lies in striking a balance. We must utilize technology's benefits while remaining vigilant against its potential misuse. Investing in cyber security measures, fostering responsible online behavior, and ensuring ethical implementation of surveillance are crucial steps in this ongoing battle. By harnessing technology's power for good and addressing its pitfalls, we can create a safer future for all."], "translations": ["科技对犯罪率的影响是个复杂问题，双方都有强有力的论据。支持者认为科技进步有益于公共安全，另一些人则认为它为犯罪活动创造新途径。考察这些观点有助于理解科技与犯罪的真实关系。", "支持科技打击犯罪潜力的人，着重指出监控和执法工具的发展。例如，监控摄像头通过增加人们对被抓风险的感知来震慑犯罪。此外，数据分析软件帮助警方识别犯罪模式、预测未来事件，从而开展有针对性的巡逻和主动措施。另外，数字取证有利于更有效地调查和起诉犯罪。", "然而，批评者认为科技也可能滋生犯罪。互联网兴起便利了网络犯罪，犯罪者利用漏洞窃取数据、实施欺诈或发动网络攻击。网络平台提供的匿名性会助长犯罪者的胆量，而容易获得的教程和论坛甚至能给他们带来群体归属感。此外，也有人担忧监控技术被滥用于大规模监视，侵犯个人隐私。", "在我看来，科技在犯罪问题上具有两面性。它无疑提供了有价值的执法工具，但也带来新挑战。关键是取得平衡。我们必须利用科技的好处，同时警惕潜在滥用。投资网络安全措施、促进负责任的网络行为、确保监控的伦理实施，是持续应对这一问题的重要步骤。利用科技力量服务正当目的，并处理其缺陷，才能为所有人创造更安全的未来。"], "kind": "双边讨论＋个人观点", "stance": "前两主体段分别说明打击犯罪与助长犯罪，末段给平衡观点和对策；引言未明确个人立场，可更早说明。", "structure": [{"title": "引言", "role": "", "points": ["呈现两方观点，没有明确自己的结论。"]}, {"title": "主体一", "role": "", "points": ["3 项技术：监控震慑、数据预测巡逻、数字取证。"]}, {"title": "主体二", "role": "", "points": ["网络漏洞和匿名性促成犯罪；补充监控滥用的隐私问题", "后者不完全等于犯罪增加。"]}, {"title": "结尾观点段", "role": "", "points": ["承认两面作用，提出安全、行为与伦理三类保障。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "with strong arguments on both sides", "t": "with + 名词短语", "e": "补充说明争议双方都有理由；不是 with + doing 的独立结构。"}, {"p": 0, "c": "vocab", "q": "Proponents", "t": "proponent n.", "e": "支持者；常用 proponents of 某观点或措施。"}, {"p": 0, "c": "expression", "q": "technological advancements", "t": "technological advancements", "e": "技术进步；与题干 technology development 同话题改写。"}, {"p": 0, "c": "vocab", "q": "a boon", "t": "boon n.", "e": "有益的事物、福音。"}, {"p": 0, "c": "link", "q": "while others argue", "t": "while：观点对照", "e": "一方认为科技提升安全，另一方认为它提供犯罪途径。"}, {"p": 0, "c": "vocab", "q": "avenues", "t": "avenue n.", "e": "熟词生义：途径、渠道，不是街道。"}, {"p": 0, "c": "syntax", "q": "Examining these viewpoints will help us understand", "t": "动名词主语＋help sb do", "e": "Examining … 作主语；understand 前省略 to。"}, {"p": 1, "c": "vocab", "q": "surveillance", "t": "surveillance n.", "e": "监视、监控。"}, {"p": 1, "c": "expression", "q": "law enforcement", "t": "law enforcement", "e": "执法；公共安全题常用名词。"}, {"p": 1, "c": "link", "q": "for instance", "t": "举例", "e": "摄像头是监控技术减少犯罪的具体例子。"}, {"p": 1, "c": "vocab", "q": "deter", "t": "deter v.", "e": "威慑、阻止。"}, {"p": 1, "c": "syntax", "q": "by increasing the perceived risk of getting caught", "t": "by + doing；of + doing", "e": "说明监控的威慑机制；getting caught 表被抓获，作 of 的宾语。"}, {"p": 1, "c": "vocab", "q": "perceived", "t": "perceived adj.", "e": "被感知、被认为的；不等于客观实际风险本身。"}, {"p": 1, "c": "link", "q": "Additionally", "t": "追加技术路径", "e": "从摄像头威慑转到数据分析的预测和调度功能。"}, {"p": 1, "c": "syntax", "q": "helps police identify crime patterns and predict future incidents", "t": "help sb + 并列动词", "e": "identify 与 predict 并列，前者识别已有规律，后者预测未来事件。"}, {"p": 1, "c": "vocab", "q": "incidents", "t": "incident n.", "e": "事件，此处指可能发生的犯罪事件。"}, {"p": 1, "c": "syntax", "q": "allowing for targeted patrols and proactive measures", "t": "分词短语表示结果", "e": "数据分析的结果是可以采取针对性巡逻和主动措施。"}, {"p": 1, "c": "vocab", "q": "targeted patrols", "t": "targeted patrols", "e": "有针对性的巡逻；patrol 为巡逻行动。"}, {"p": 1, "c": "expression", "q": "proactive measures", "t": "proactive measures", "e": "主动预防措施，与事后被动应对相对。"}, {"p": 1, "c": "syntax", "q": "digital forensics allow", "t": "主谓一致需辨析", "e": "digital forensics 若作为学科或技术领域整体通常按单数处理，可写 digital forensic tools allow 避免歧义。"}, {"p": 1, "c": "vocab", "q": "forensics", "t": "forensics n.", "e": "取证、法证技术。"}, {"p": 1, "c": "vocab", "q": "prosecution", "t": "prosecution n.", "e": "起诉、检控，与 investigation（调查）是不同阶段。"}, {"p": 2, "c": "vocab", "q": "facilitated", "t": "facilitate v.", "e": "使更容易发生、便利某活动。"}, {"p": 2, "c": "syntax", "q": "with criminals exploiting vulnerabilities", "t": "with + 名词 + doing", "e": "补充说明网络犯罪怎样发生；criminals 是 exploiting 的逻辑主语。"}, {"p": 2, "c": "vocab", "q": "exploiting", "t": "exploit v.", "e": "熟词生义：利用漏洞；语境带负面含义，不是开发资源。"}, {"p": 2, "c": "vocab", "q": "vulnerabilities", "t": "vulnerabilities n.", "e": "漏洞、弱点。"}, {"p": 2, "c": "syntax", "q": "to steal data, commit fraud, or launch cyber attacks", "t": "三个并列不定式动作", "e": "to 后共享三个动词，说明利用漏洞的目的：窃取、欺诈、攻击。"}, {"p": 2, "c": "expression", "q": "commit fraud, or launch cyber attacks", "t": "commit / launch", "e": "实施欺诈用 commit；发动攻击用 launch，不能只把“做”统一译成 do。"}, {"p": 2, "c": "vocab", "q": "fraud", "t": "fraud n.", "e": "欺诈、诈骗。"}, {"p": 2, "c": "syntax", "q": "The anonymity provided by online platforms can embolden criminals", "t": "过去分词后置修饰", "e": "provided by … 修饰 anonymity；整个匿名性作主语，can embolden 作谓语。"}, {"p": 2, "c": "vocab", "q": "anonymity", "t": "anonymity n.", "e": "匿名性。"}, {"p": 2, "c": "vocab", "q": "embolden", "t": "embolden v.", "e": "使更大胆、助长胆量。"}, {"p": 2, "c": "link", "q": "while readily available tutorials", "t": "while：并列对照", "e": "把匿名性和教程论坛两项促成因素并列。"}, {"p": 2, "c": "vocab", "q": "misuse", "t": "misuse n.", "e": "滥用、不当使用。"}, {"p": 2, "c": "expression", "q": "infringing on individual privacy", "t": "infringe on privacy", "e": "侵犯隐私，介词用 on。"}, {"p": 2, "c": "syntax", "q": "infringing on individual privacy", "t": "分词结果状语", "e": "补充说明大规模监视的隐私后果，不是独立完整句。"}, {"p": 2, "c": "vocab", "q": "infringing", "t": "infringe v.", "e": "侵犯权利、违反规定，常与 on 连用。"}, {"p": 3, "c": "expression", "q": "The key lies in", "t": "the key lies in + doing", "e": "关键在于……；in 后接 striking a balance。"}, {"p": 3, "c": "expression", "q": "striking a balance", "t": "strike a balance", "e": "取得平衡。"}, {"p": 3, "c": "link", "q": "while remaining vigilant", "t": "while + doing", "e": "一边利用技术好处，一边保持警惕。"}, {"p": 3, "c": "vocab", "q": "vigilant", "t": "vigilant adj.", "e": "警惕的。"}, {"p": 3, "c": "syntax", "q": "Investing in cyber security measures, fostering responsible online behavior, and ensuring ethical implementation of surveillance are crucial steps", "t": "并列动名词作主语", "e": "三个行动并列，所以用 are；分别对应技术防护、行为规范、伦理实施。"}, {"p": 3, "c": "vocab", "q": "ethical implementation", "t": "ethical implementation", "e": "合乎伦理的实施，强调使用过程的规范。"}, {"p": 3, "c": "vocab", "q": "implementation", "t": "implementation n.", "e": "实施、落实；与提出计划不同。"}, {"p": 3, "c": "syntax", "q": "By harnessing technology's power for good and addressing its pitfalls, we can create", "t": "By + 两个 doing", "e": "harnessing 与 addressing 并列，逻辑主语均是 we，说明实现安全目标的方法。"}, {"p": 3, "c": "vocab", "q": "harnessing", "t": "harness v.", "e": "有效利用、驾驭某种力量。"}, {"p": 3, "c": "vocab", "q": "pitfalls", "t": "pitfall n.", "e": "隐患、容易遇到的问题。"}], "sourcePage": 13}, {"id": "essay-13", "title": "交流技术影响社会关系", "question": "Many people think modern communication technology is having some negative effects on social relationships.\nDo you agree or disagree?", "qzh": "许多人认为现代通信技术正对社会关系产生负面影响。你同意还是不同意？", "paragraphs": ["Many people believe that modern communication technology has a negative impact on social relationships. I agree with this view to a large extent, as excessive reliance on digital communication can weaken face-to-face interaction and reduce the quality of personal relationships.", "One major reason why modern communication technology harms social relationships is that it reduces direct, in-person communication. Although messaging apps and social media make it easier to stay in contact, they often replace meaningful face-to-face conversations. When people communicate mainly through screens, they may miss important social cues such as tone of voice and body language. As a result, misunderstandings can occur more easily, and emotional connections may become weaker. For example, family members may spend time chatting online instead of talking to each other at home, which can gradually reduce closeness.", "Another negative effect is that constant online communication can lead to superficial relationships. Social media platforms encourage users to interact briefly and frequently, rather than engage in deep and meaningful conversations. This can create a sense of connection without real emotional support. Over time, people may have many online contacts but few close relationships they can rely on. In addition, excessive use of communication technology can cause individuals to become distracted during social interactions, making others feel ignored or unimportant.", "In conclusion, while modern communication technology offers convenience, I believe it has significant negative effects on social relationships. By reducing face-to-face communication and encouraging shallow interactions, it can weaken emotional bonds between people. Therefore, it is important to use communication technology in moderation and maintain meaningful personal connections in real life."], "translations": ["许多人认为现代通信技术对社会关系有负面影响。我在很大程度上同意，因为过度依赖数字交流可能削弱面对面互动，降低人际关系的质量。", "现代通信技术损害社会关系的一个主要原因，是减少直接的线下交流。虽然聊天软件和社交媒体方便保持联系，它们也常取代有意义的面对面对话。主要通过屏幕交流时，人们可能错过语调、肢体语言等重要社交线索。因此，误解更容易发生，情感联系也可能变弱。例如，家人可能花时间在线聊天，而非在家彼此交谈，逐渐降低亲密程度。", "另一个负面影响是，持续在线交流可能导致表面化的关系。社交平台鼓励用户频繁、简短地互动，而不是深入、有意义地交谈。这可能创造联系的感觉，却没有真正的情感支持。久而久之，人们或许有许多网上联系人，却很少有可以依靠的亲密关系。此外，过度使用通信技术可能使人在社交过程中分心，让他人感到被忽视或不受重视。", "总之，虽然现代通信技术带来便利，我认为它对社会关系有显著负面影响。它减少面对面沟通，鼓励浅层互动，因此可能削弱人与人之间的情感纽带。所以，应适度使用通信技术，并维持现实生活中有意义的人际联系。"], "kind": "同意与否", "stance": "大体同意，重点限定为过度使用和依赖。", "structure": [{"title": "引言", "role": "", "points": ["明确大体同意，预告线下交流减少与关系质量下降。"]}, {"title": "主体一", "role": "", "points": ["少面对面 → 丢失非语言信息 → 误解、亲密度下降。"]}, {"title": "主体二", "role": "", "points": ["短暂频繁互动 → 关系表面化；补充分心导致忽视感。"]}, {"title": "结论", "role": "", "points": ["概括两条机制，并建议适度使用。"]}], "readerNotes": [{"p": 0, "c": "expression", "q": "a negative impact on", "t": "impact on / effects on", "e": "表示对……的影响，on 引出承受影响的对象。"}, {"p": 0, "c": "syntax", "q": "I agree with this view to a large extent", "t": "agree … to a large extent", "e": "通过程度短语表达大体同意，为承认便利保留空间。"}, {"p": 0, "c": "link", "q": "as excessive reliance on digital communication can weaken", "t": "as：原因", "e": "引出作者同意的理由，并限定问题在 excessive reliance。"}, {"p": 0, "c": "vocab", "q": "excessive reliance", "t": "excessive reliance", "e": "过度依赖。reliance 常与 on 搭配。"}, {"p": 0, "c": "vocab", "q": "reliance", "t": "reliance n.", "e": "依赖，名词形式，常接 on。"}, {"p": 1, "c": "syntax", "q": "One major reason why modern communication technology harms social relationships is that", "t": "reason why … is that …", "e": "先点出需要解释的现象，再用 that 从句给原因。"}, {"p": 1, "c": "vocab", "q": "in-person", "t": "in-person adj.", "e": "当面进行的、线下的；作前置修饰时常用连字符。"}, {"p": 1, "c": "link", "q": "Although", "t": "让步", "e": "先承认便利，再指出线下交流被替代。"}, {"p": 1, "c": "syntax", "q": "make it easier to stay in contact", "t": "make it + 比较级 + to do", "e": "it 为形式宾语，不定式说明更容易完成的行为。"}, {"p": 1, "c": "vocab", "q": "meaningful", "t": "meaningful adj.", "e": "有意义、有实质价值的，修饰对话。"}, {"p": 1, "c": "syntax", "q": "When people communicate mainly through screens, they may miss", "t": "When 从句＋may", "e": "将屏幕交流设为情境；may 表示可能漏失线索，不绝对化。"}, {"p": 1, "c": "vocab", "q": "social cues", "t": "social cues", "e": "社交线索，例如语气和身体语言。"}, {"p": 1, "c": "link", "q": "such as tone of voice and body language", "t": "such as：列举线索", "e": "举出两种被文字或屏幕交流削弱的信息线索。"}, {"p": 1, "c": "expression", "q": "tone of voice and body language", "t": "非语言信息搭配", "e": "语调与肢体语言，具体说明 social cues，而非泛称交流质量。"}, {"p": 1, "c": "link", "q": "As a result", "t": "结果", "e": "由线索缺失推出误解及情感联系减弱。"}, {"p": 1, "c": "link", "q": "instead of talking to each other at home", "t": "instead of + doing", "e": "强调在线聊天替代现实交流，突出机会被挤占。"}, {"p": 1, "c": "syntax", "q": "which can gradually reduce closeness", "t": "which 补充结果", "e": "概括家庭成员在线聊天取代家中交流的行为，gradually 强调长期累积。"}, {"p": 1, "c": "vocab", "q": "gradually", "t": "gradually adv.", "e": "逐渐地，表示变化随时间累积。"}, {"p": 1, "c": "vocab", "q": "closeness", "t": "closeness n.", "e": "亲密程度、关系紧密度。"}, {"p": 2, "c": "syntax", "q": "Another negative effect is that", "t": "表语从句", "e": "that 从句完整说明另一项影响：关系趋于表面化。"}, {"p": 2, "c": "vocab", "q": "constant", "t": "constant adj.", "e": "持续的、频繁不断的；形容在线交流状态。"}, {"p": 2, "c": "vocab", "q": "superficial", "t": "superficial adj.", "e": "表面的、缺乏深度的。"}, {"p": 2, "c": "syntax", "q": "encourage users to interact briefly and frequently", "t": "encourage sb to do", "e": "briefly 与 frequently 两个副词分别描述每次时长与互动频率。"}, {"p": 2, "c": "vocab", "q": "briefly", "t": "briefly adv.", "e": "简短地、短时间地。"}, {"p": 2, "c": "vocab", "q": "frequently", "t": "frequently adv.", "e": "频繁地，修饰互动频率。"}, {"p": 2, "c": "link", "q": "rather than", "t": "对比", "e": "简短频繁互动与深入对话形成对照。"}, {"p": 2, "c": "expression", "q": "deep and meaningful conversations", "t": "deep / meaningful", "e": "深入且有意义的对话；与 briefly and frequently 对照。"}, {"p": 2, "c": "link", "q": "without real emotional support", "t": "without + 名词", "e": "“看似联系”却缺乏真实支持，强调表象与实质的差别。"}, {"p": 2, "c": "expression", "q": "emotional support", "t": "emotional support", "e": "情感支持；与“联系人数量”区别。"}, {"p": 2, "c": "link", "q": "Over time", "t": "时间推进", "e": "说明长期积累的后果。"}, {"p": 2, "c": "vocab", "q": "contacts", "t": "contact n.", "e": "熟词生义：联系人、认识的人，此处为可数复数。"}, {"p": 2, "c": "syntax", "q": "relationships they can rely on", "t": "省略关系代词", "e": "relationships 后省略 that/which，在从句中作 on 的宾语。"}, {"p": 2, "c": "link", "q": "In addition", "t": "补充后果", "e": "从浅层关系扩展到当面社交时分心的影响。"}, {"p": 2, "c": "syntax", "q": "can cause individuals to become distracted", "t": "cause sb to do", "e": "导致某人陷入某状态；become 后接形容词 distracted。"}, {"p": 2, "c": "vocab", "q": "distracted", "t": "distracted adj.", "e": "分心的。"}, {"p": 2, "c": "syntax", "q": "making others feel ignored or unimportant", "t": "make + 宾语 + 动词原形", "e": "making 表结果；feel 后接 ignored/unimportant 描述感受。"}, {"p": 2, "c": "vocab", "q": "ignored", "t": "ignored adj.", "e": "被忽视的，与 unimportant 并列描述他人的感受。"}, {"p": 3, "c": "link", "q": "while modern communication technology offers convenience", "t": "while：让步", "e": "结论承认便利，不改变总体认为有负面影响的立场。"}, {"p": 3, "c": "syntax", "q": "By reducing face-to-face communication and encouraging shallow interactions", "t": "By + 并列 doing", "e": "说明技术削弱情感纽带的两条机制，逻辑主语为后面的 it。"}, {"p": 3, "c": "expression", "q": "shallow interactions", "t": "shallow / superficial", "e": "本文均指缺乏深度；shallow interactions 与 superficial relationships 互相呼应，但修饰对象不同。"}, {"p": 3, "c": "vocab", "q": "shallow", "t": "shallow adj.", "e": "熟词生义：肤浅的、缺乏深度的，而非水浅。"}, {"p": 3, "c": "expression", "q": "emotional bonds", "t": "connections / bonds", "e": "本文都表示情感联系，bonds 强调纽带。"}, {"p": 3, "c": "vocab", "q": "bonds", "t": "bond n.", "e": "联系、纽带，本文为情感纽带。"}, {"p": 3, "c": "link", "q": "Therefore", "t": "导出建议", "e": "根据前文影响推出适度使用和维系现实联系的建议。"}, {"p": 3, "c": "syntax", "q": "it is important to use communication technology in moderation and maintain", "t": "It is important to do", "e": "it 为形式主语，use 与 maintain 两个动词共享 to。"}, {"p": 3, "c": "expression", "q": "in moderation", "t": "in moderation", "e": "适度地，修饰 use communication technology。"}, {"p": 3, "c": "vocab", "q": "moderation", "t": "moderation n.", "e": "适度、节制。"}], "sourcePage": 14}, {"id": "essay-14", "title": "理科的选择", "question": "Nowadays, not enough students choose science subjects in universities in many countries.\nWhy is this?\nWhat are the effects on society?", "qzh": "如今许多国家选择大学理科专业的学生不足。原因是什么？对社会有哪些影响？", "paragraphs": ["In today’s knowledge-based society, science and technology are advancing at an unprecedented rate. Despite this rapid progress, the numbers of university students who choose science subjects show a declining trend in many countries. This essay will analyze its underlying reasons and negative effects on society.", "The first reason for this trend may involve the recognition that science subjects are more challenging than other subjects. Obtaining degrees in science requires more effort. For instance, to graduate from the school of physics or chemistry, students have to learn a wide range of theoretical courses and spend many years working in laboratories. This process is lengthy and tedious, which may dissuade many young people from pursuing science as a major.", "Moreover, a lack of interest in science contributes to the low enrollment in science subjects. In a society where fame and fortune determine a person’s value, younger generations tend to idolize popular stars and influencers rather than scientists. Additionally, primary and secondary school curricula often fail to adequately emphasize the importance and appeal of science. With limited knowledge and little interest in science, fewer people choose science subjects when they enter university.", "The declining number of students in science subjects at universities has profound effects on society. There will be a shortage of personnel capable of conducting scientific study and research, as universities reduce the supply of qualified graduates majoring in science. Declining scientific research could lead to hindered innovation and technological stagnation, negatively affecting economic growth and social progress. Countries with fewer skilled scientists may struggle to keep up with advancements made by others, thus losing competitiveness in the international arena.", "In conclusion, the declining enrollment in science subjects is attributed to multiple factors, and this issue can have serious consequences for society. Efforts should be made at all levels of education to foster interest in science and to emphasize its importance in driving progress and innovation. Only by addressing these challenges can we ensure a brighter future for science and society as a whole."], "translations": ["在当今知识型社会，科学技术正以前所未有的速度进步。尽管进步迅速，许多国家选择理科的大学生人数仍呈下降趋势。本文将分析其深层原因及对社会的负面影响。", "这一趋势的第一个原因，可能是人们认为理科比其他学科更难。获得理科学位需要更多努力。例如，要从物理或化学院系毕业，学生必须学习广泛的理论课程，并在实验室工作多年。这个过程漫长且乏味，可能使许多年轻人不愿选择理科作为专业。", "此外，对科学缺乏兴趣也导致理科入学人数偏低。在名声和财富决定个人价值的社会中，年轻一代倾向于崇拜明星和网红，而不是科学家。另外，中小学课程往往未充分强调科学的重要性和吸引力。由于了解有限、兴趣不足，进入大学时选择理科的人更少。", "大学理科学生数量下降对社会有深远影响。大学培养的合格理科毕业生减少，将导致能开展科学研究的人员短缺。科研减少可能阻碍创新、使技术停滞，给经济增长和社会进步带来负面影响。缺少熟练科学家的国家可能难以跟上其他国家的发展，从而失去国际竞争力。", "总之，理科入学人数下降源于多种因素，可能对社会产生严重后果。各教育阶段都应努力培养科学兴趣，并强调科学对推动进步和创新的重要性。只有解决这些挑战，我们才能确保科学和全社会拥有更光明的未来。"], "kind": "原因＋影响", "stance": "两段原因、一段社会影响；结尾补充建议。", "structure": [{"title": "引言", "role": "", "points": ["现象与任务预告", "人数不足不必然等于持续下降，改写时需注意这一差别。"]}, {"title": "原因一", "role": "", "points": ["难度大、学制与实践投入长 → 学生不愿选择。"]}, {"title": "原因二", "role": "", "points": ["价值取向与课程吸引力不足 → 缺少兴趣。"]}, {"title": "影响", "role": "", "points": ["人才供给不足 → 科研创新放缓 → 经济和竞争力受损。"]}, {"title": "结论", "role": "", "points": ["总结原因和后果，提出教育层面建议。"]}], "readerNotes": [{"p": 0, "c": "expression", "q": "knowledge-based society", "t": "knowledge-based society", "e": "以知识为基础的社会，说明科学教育的重要背景。"}, {"p": 0, "c": "syntax", "q": "science and technology are advancing", "t": "现在进行时", "e": "描述当前持续发展的趋势，不是在写单次事件。"}, {"p": 0, "c": "expression", "q": "at an unprecedented rate", "t": "at a … rate", "e": "以某种速度发展，rate 与 at 搭配。"}, {"p": 0, "c": "vocab", "q": "unprecedented", "t": "unprecedented adj.", "e": "前所未有的。"}, {"p": 0, "c": "link", "q": "Despite this rapid progress", "t": "Despite + 名词短语", "e": "让步，强调科技进步与学生选择不足的反差。"}, {"p": 0, "c": "syntax", "q": "the numbers of university students who choose science subjects show a declining trend", "t": "主干与定语从句", "e": "who choose … 修饰 students；表达总人数通常用 the number … shows 更自然，原文 numbers 暗示多个统计数量。"}, {"p": 0, "c": "vocab", "q": "declining", "t": "declining adj.", "e": "呈下降趋势的；不是拒绝邀请的含义。"}, {"p": 0, "c": "vocab", "q": "underlying", "t": "underlying adj.", "e": "深层的、潜在的，修饰 reasons。"}, {"p": 1, "c": "syntax", "q": "the recognition that science subjects are more challenging than other subjects", "t": "that 同位语从句", "e": "解释 recognition 的内容；more … than … 是学科难度比较。"}, {"p": 1, "c": "syntax", "q": "Obtaining degrees in science requires more effort", "t": "动名词短语作主语", "e": "Obtaining … science 整体作单数主语，所以用 requires。"}, {"p": 1, "c": "link", "q": "For instance", "t": "例子", "e": "物理化学课程及实验室工作具体解释“理科更有挑战”的主张。"}, {"p": 1, "c": "vocab", "q": "theoretical", "t": "theoretical adj.", "e": "理论的，与 practical（实践的）相对。"}, {"p": 1, "c": "syntax", "q": "spend many years working in laboratories", "t": "spend + 时间 + doing", "e": "work 用 working，不接 to work；说明实践投入较长。"}, {"p": 1, "c": "vocab", "q": "laboratories", "t": "laboratory n.", "e": "实验室，复数形式。"}, {"p": 1, "c": "vocab", "q": "lengthy", "t": "lengthy adj.", "e": "耗时很长的，往往含过长的意味。"}, {"p": 1, "c": "vocab", "q": "tedious", "t": "tedious adj.", "e": "冗长乏味的。"}, {"p": 1, "c": "syntax", "q": "dissuade many young people from pursuing science", "t": "dissuade sb from doing", "e": "from 是介词，后接 pursuing。"}, {"p": 1, "c": "vocab", "q": "dissuade", "t": "dissuade v.", "e": "劝阻、使不愿；dissuade sb from doing。"}, {"p": 1, "c": "expression", "q": "pursuing science as a major", "t": "pursue … as a major", "e": "选择并攻读某专业；pursue 在此不是追赶。"}, {"p": 2, "c": "syntax", "q": "a lack of interest in science contributes to the low enrollment", "t": "名词主语＋contribute to", "e": "主干为 a lack … contributes；to 后的 enrollment 为结果。"}, {"p": 2, "c": "vocab", "q": "enrollment", "t": "enrollment n.", "e": "入学、选课人数；同一文章应保持语境一致。"}, {"p": 2, "c": "syntax", "q": "In a society where fame and fortune determine a person’s value", "t": "where 定语从句", "e": "where 修饰 society，说明作者假定的社会价值背景；判断较概括。"}, {"p": 2, "c": "expression", "q": "fame and fortune", "t": "fame and fortune", "e": "名声与财富，常见并列搭配。"}, {"p": 2, "c": "vocab", "q": "idolize", "t": "idolize v.", "e": "崇拜、偶像化，比 admire 程度更强。"}, {"p": 2, "c": "vocab", "q": "influencers", "t": "influencer n.", "e": "网络上有影响力的人、网红。"}, {"p": 2, "c": "link", "q": "rather than scientists", "t": "rather than：对照", "e": "崇拜明星网红，而非科学家。"}, {"p": 2, "c": "vocab", "q": "curricula", "t": "curricula n.", "e": "curriculum 的复数，课程体系。"}, {"p": 2, "c": "syntax", "q": "fail to adequately emphasize the importance and appeal of science", "t": "fail to do", "e": "未能充分强调；importance 与 appeal 并列，分别是重要性和吸引力。"}, {"p": 2, "c": "vocab", "q": "appeal", "t": "appeal n.", "e": "吸引力，不是上诉或呼吁。"}, {"p": 2, "c": "link", "q": "With limited knowledge and little interest in science", "t": "With：背景条件", "e": "把了解与兴趣不足作为较少选择理科的背景。"}, {"p": 3, "c": "vocab", "q": "profound", "t": "profound adj.", "e": "深刻的、影响深远的。"}, {"p": 3, "c": "syntax", "q": "There will be a shortage of personnel capable of conducting scientific study and research", "t": "There will be + 名词", "e": "预测人才短缺；capable of doing 修饰 personnel，说明短缺的人才类型。"}, {"p": 3, "c": "syntax", "q": "personnel capable of conducting", "t": "形容词短语后置修饰", "e": "capable of … 修饰 personnel，表示能从事科研的人员。"}, {"p": 3, "c": "vocab", "q": "personnel", "t": "personnel n.", "e": "人员，集合名词。"}, {"p": 3, "c": "link", "q": "as universities reduce the supply", "t": "as：原因", "e": "解释科研人才为何不足：大学输出减少。"}, {"p": 3, "c": "vocab", "q": "qualified", "t": "qualified adj.", "e": "具备资格、能力合格的，修饰毕业生。"}, {"p": 3, "c": "vocab", "q": "hindered", "t": "hinder v.", "e": "阻碍、妨碍；hindered innovation 指受阻的创新。"}, {"p": 3, "c": "vocab", "q": "stagnation", "t": "stagnation n.", "e": "停滞。"}, {"p": 3, "c": "syntax", "q": "negatively affecting economic growth and social progress", "t": "分词结果状语", "e": "承接创新受阻和技术停滞的状态，说明对经济社会的进一步影响。"}, {"p": 3, "c": "expression", "q": "keep up with", "t": "keep up with advancements", "e": "跟上进展。"}, {"p": 3, "c": "link", "q": "thus losing competitiveness", "t": "thus + doing：结果", "e": "跟不上科技进步，因而竞争力下降。"}, {"p": 3, "c": "vocab", "q": "competitiveness", "t": "competitiveness n.", "e": "竞争力，本文是国家科技领域的相对能力。"}, {"p": 3, "c": "expression", "q": "in the international arena", "t": "international arena", "e": "国际舞台、国际竞争领域；arena 在此非体育场。"}, {"p": 4, "c": "vocab", "q": "attributed to", "t": "attribute … to", "e": "归因于；is attributed to 为被动，说明被认为的原因。"}, {"p": 4, "c": "syntax", "q": "Efforts should be made at all levels of education", "t": "should be made：被动建议", "e": "强调所有教育阶段都应付出努力，行动主体被省略。"}, {"p": 4, "c": "expression", "q": "foster interest in science", "t": "foster interest in", "e": "培养对……的兴趣。"}, {"p": 4, "c": "link", "q": "to emphasize its importance in driving progress and innovation", "t": "目的＋介词 doing", "e": "to emphasize 与 to foster 并列；in driving … 说明科学的重要作用。"}, {"p": 4, "c": "syntax", "q": "Only by addressing these challenges can we ensure", "t": "Only + 状语前置倒装", "e": "Only by … 置首，主句 can 提到 we 前面。"}], "sourcePage": 15}, {"id": "essay-15", "title": "生育年龄推迟", "question": "Some people choose to have their first child at an older age.\nWhat are the reasons?\nDo the advantages outweigh the disadvantages?", "qzh": "一些人选择在较大年龄生育第一个孩子。原因是什么？是否利大于弊？", "paragraphs": ["In many countries today, an increasing number of people choose to have their first child at a later age. This trend is influenced by several social and economic factors. Although delaying parenthood has both advantages and disadvantages, I believe the benefits generally outweigh the drawbacks.", "One major reason why people become parents later is the desire to establish a stable career before starting a family. In modern society, many young adults focus on higher education and professional development in their twenties. They hope to secure a well-paid job, gain financial independence, and create a comfortable living environment before welcoming a child. Another contributing factor is the high cost of raising children. Housing, childcare, and education expenses have risen sharply in recent years, making younger couples feel unprepared to take on the financial burden. In addition, many people now value personal growth and prefer to spend their early adulthood travelling, exploring hobbies, or building relationships, which naturally delays parenthood.", "Despite some clear disadvantages, such as reduced fertility and increased health risks during pregnancy, having children later in life also offers significant benefits. Older parents are usually more emotionally mature and better prepared to take on the responsibilities of raising a child. They tend to have greater financial stability, which allows them to provide a safer home, better healthcare, and more educational opportunities for their children. Moreover, parents who have already achieved personal and professional goals may feel less pressure balancing work and family, allowing them to spend more quality time with their child. In contrast, very young parents often struggle with stress, limited income, and lack of life experience, which can affect both their well-being and their child’s development.", "In conclusion, people choose to have their first child later for financial, educational, and personal reasons. Although this trend can create some challenges, I believe that the advantages, particularly greater stability and maturity, outweigh the disadvantages for most families."], "translations": ["如今许多国家越来越多的人选择较晚生育第一个孩子。这一趋势受到多种社会和经济因素影响。虽然推迟为人父母有利有弊，但我认为总体上利大于弊。", "人们较晚成为父母的一个主要原因，是希望先建立稳定事业再组建家庭。现代社会中，许多年轻人在二十多岁时专注高等教育和职业发展。他们希望在迎接孩子前获得高薪工作、实现经济独立并创造舒适的生活环境。另一个因素是养育孩子成本高。住房、托育、教育费用近年大幅上涨，使年轻夫妇觉得尚未准备好承担经济负担。此外，许多人重视个人成长，愿在成年早期旅行、探索爱好或建立人际关系，自然会推迟生育。", "尽管有生育能力下降、妊娠期健康风险增加等明显弊端，较晚生育也有重要益处。年龄较大的父母通常情绪更成熟，更有准备承担养育责任。他们往往经济更稳定，能给孩子提供更安全的家庭、更好的医疗和更多教育机会。此外，已实现个人和职业目标的父母，平衡工作与家庭的压力可能更小，因此能与孩子共度更多优质时光。相比之下，非常年轻的父母经常面临压力、收入有限、生活经验不足等困难，可能影响他们自己的福祉和孩子的发展。", "总之，人们出于经济、教育和个人原因选择较晚生育第一个孩子。虽然这一趋势可能带来一些挑战，但我认为，对大多数家庭而言，更稳定、更成熟等优势超过了弊端。"], "kind": "混合题：原因＋利弊权衡", "stance": "须同时回答原因及是否利大于弊；本文认为利大于弊。健康与年龄概括属于范文论据，不作个人生育建议。", "structure": [{"title": "引言", "role": "", "points": ["明确两个任务及权衡结论。"]}, {"title": "原因段", "role": "", "points": ["3 点：事业教育优先；养育成本；个人成长", "每点有具体解释。"]}, {"title": "权衡段", "role": "", "points": ["先承认健康风险，再展开情绪成熟、经济稳定、陪伴质量", "弊端论证较短，权衡可更充分。"]}, {"title": "结论", "role": "", "points": ["复述原因，重申稳定与成熟的优势。"]}], "readerNotes": [{"p": 0, "c": "expression", "q": "at a later age", "t": "at a later age / later in life", "e": "较晚生育的相关表达；不是所有较晚年龄都相同。"}, {"p": 0, "c": "syntax", "q": "This trend is influenced by several social and economic factors", "t": "被动结构", "e": "趋势受到多种因素影响，by 引出原因来源。"}, {"p": 0, "c": "link", "q": "Although delaying parenthood has both advantages and disadvantages", "t": "Although：让步", "e": "承认利弊并存，主句再给出总体权衡结论。"}, {"p": 0, "c": "vocab", "q": "parenthood", "t": "parenthood n.", "e": "为人父母的状态与经历。"}, {"p": 1, "c": "syntax", "q": "One major reason why people become parents later is", "t": "reason why … is + 名词短语", "e": "表语为 the desire to …，说明动机。"}, {"p": 1, "c": "expression", "q": "establish a stable career", "t": "establish a career", "e": "建立稳定职业基础，stable 描述稳定性而非高收入。"}, {"p": 1, "c": "syntax", "q": "before starting a family", "t": "before + doing", "e": "表示先建立事业再组建家庭的时间顺序。"}, {"p": 1, "c": "vocab", "q": "professional development", "t": "professional development", "e": "职业发展、专业能力提升。"}, {"p": 1, "c": "syntax", "q": "They hope to secure a well-paid job, gain financial independence, and create a comfortable living environment", "t": "hope to＋三个并列动词", "e": "secure、gain、create 共享 to，依次说明职业、经济和生活准备。"}, {"p": 1, "c": "vocab", "q": "secure", "t": "secure v.", "e": "熟词生义：获得、确保得到工作，不是形容词安全的。"}, {"p": 1, "c": "expression", "q": "gain financial independence", "t": "gain independence", "e": "获得经济独立；gain 表示逐渐取得某种状态。"}, {"p": 1, "c": "link", "q": "Another contributing factor", "t": "追加原因", "e": "在事业因素后引出养育成本。"}, {"p": 1, "c": "vocab", "q": "childcare", "t": "childcare n.", "e": "儿童照护、托育。"}, {"p": 1, "c": "syntax", "q": "making younger couples feel unprepared to take on the financial burden", "t": "making + 宾语 + 动词原形", "e": "couples 为宾语，feel 为原形；unprepared to … 描述尚未准备承担责任。"}, {"p": 1, "c": "vocab", "q": "unprepared", "t": "unprepared adj.", "e": "尚未做好准备的，后可接 to do。"}, {"p": 1, "c": "expression", "q": "take on the financial burden", "t": "take on responsibility / burden", "e": "承担责任或负担。"}, {"p": 1, "c": "vocab", "q": "financial burden", "t": "financial burden", "e": "经济负担，常用 bear / take on a burden。"}, {"p": 1, "c": "link", "q": "In addition", "t": "第三项原因", "e": "在事业与成本之外，补充个人生活偏好。"}, {"p": 1, "c": "syntax", "q": "prefer to spend their early adulthood travelling, exploring hobbies, or building relationships", "t": "prefer to do＋spend time doing", "e": "spend 后接时间及三个并列 doing，解释个人成长怎样占用较早阶段。"}, {"p": 1, "c": "vocab", "q": "adulthood", "t": "adulthood n.", "e": "成年期；early adulthood 为成年早期。"}, {"p": 1, "c": "syntax", "q": "which naturally delays parenthood", "t": "which 概括前述选择", "e": "指旅行、爱好和关系等生活安排带来的生育推迟结果。"}, {"p": 2, "c": "link", "q": "Despite some clear disadvantages", "t": "Despite + 名词：让步", "e": "先承认弊端，随后转入主要优点。"}, {"p": 2, "c": "link", "q": "such as reduced fertility and increased health risks during pregnancy", "t": "such as：举例", "e": "列出弊端的两个具体方面；during pregnancy 是时间范围。"}, {"p": 2, "c": "vocab", "q": "fertility", "t": "fertility n.", "e": "生育能力。"}, {"p": 2, "c": "vocab", "q": "pregnancy", "t": "pregnancy n.", "e": "怀孕、妊娠期。"}, {"p": 2, "c": "syntax", "q": "having children later in life also offers significant benefits", "t": "动名词主语", "e": "having … life 为单数主语，offers 加 s。"}, {"p": 2, "c": "vocab", "q": "emotionally mature", "t": "emotionally mature", "e": "情绪成熟的，成熟度并非只由年龄决定。"}, {"p": 2, "c": "vocab", "q": "mature", "t": "mature adj.", "e": "成熟的，与年龄相关但不由年龄完全决定。"}, {"p": 2, "c": "syntax", "q": "better prepared to take on the responsibilities of raising a child", "t": "be prepared to do", "e": "为承担养育责任做好准备；of raising 说明 responsibilities 的内容。"}, {"p": 2, "c": "vocab", "q": "financial stability", "t": "financial stability", "e": "经济稳定性。"}, {"p": 2, "c": "vocab", "q": "stability", "t": "stability n.", "e": "稳定性，本文包括经济和家庭准备。"}, {"p": 2, "c": "syntax", "q": "which allows them to provide", "t": "which 非限制性从句", "e": "指向 greater financial stability，解释经济稳定如何使孩子受益。"}, {"p": 2, "c": "expression", "q": "safer home, better healthcare, and more educational opportunities", "t": "比较级并列", "e": "以安全、医疗、教育三个具体方面说明经济稳定怎样惠及孩子。"}, {"p": 2, "c": "vocab", "q": "healthcare", "t": "healthcare n.", "e": "医疗保健服务，不等于单纯个人健康状态。"}, {"p": 2, "c": "link", "q": "Moreover", "t": "补充收益", "e": "由成熟度、经济稳定延伸到工作家庭压力和陪伴质量。"}, {"p": 2, "c": "syntax", "q": "parents who have already achieved personal and professional goals", "t": "who 定语从句＋现在完成时", "e": "限定已经实现目标的父母，不能将结论无条件推广到所有年长父母。"}, {"p": 2, "c": "syntax", "q": "allowing them to spend", "t": "allowing 表示结果", "e": "压力较小从而有更多高质量陪伴时间。"}, {"p": 2, "c": "expression", "q": "quality time", "t": "quality time", "e": "高质量相处时间，而不只是时长。"}, {"p": 2, "c": "link", "q": "In contrast", "t": "对照", "e": "用年轻父母的可能困难与前面的年长父母情况比较。"}, {"p": 2, "c": "expression", "q": "struggle with stress", "t": "struggle with + 名词", "e": "难以应对压力，with 后接面临的问题。"}, {"p": 2, "c": "syntax", "q": "which can affect both their well-being and their child’s development", "t": "which＋both … and …", "e": "前面的多项困难影响父母和孩子双方；both 明确双重对象。"}, {"p": 2, "c": "vocab", "q": "well-being", "t": "well-being n.", "e": "身心健康与整体福祉。"}, {"p": 3, "c": "syntax", "q": "particularly greater stability and maturity", "t": "插入式重点限定", "e": "指出权衡中最重视的优点，帮助结论与主体论据对应。"}, {"p": 3, "c": "vocab", "q": "maturity", "t": "maturity n.", "e": "成熟度；mature 的名词形式。"}, {"p": 3, "c": "expression", "q": "outweigh the disadvantages", "t": "outweigh", "e": "在重要性上超过；不能只靠列举优点数量完成权衡。"}, {"p": 3, "c": "vocab", "q": "outweigh", "t": "outweigh v.", "e": "在重要性或程度上超过，不一定是数量更多。"}, {"p": 3, "c": "link", "q": "for most families", "t": "范围限定", "e": "将判断限于大多数家庭，不等于所有家庭都适合推迟生育。"}], "sourcePage": 16}, {"id": "essay-16", "title": "广告的影响", "question": "Some people say that advertising has positive economic effects. Others think it has negative social effects because it will make people feel dissatisfied with who they are and what they have.\nDiscuss both views and give your own opinion.", "qzh": "有人认为广告有积极经济影响，另一些人认为广告使人不满自身及已有之物，造成负面社会影响。讨论双方观点并给出你的看法。", "paragraphs": ["People have various views regarding whether advertising is a positive or negative thing. Although I recognise that there are economic benefits from advertising, I also think that advertising should be restricted to some extent because it can harm people's mental health.", "For one thing, advertising contributes to economic growth by increasing consumer spending. It does so by providing consumers with information about products and services, many of which fulfil certain needs of consumers. For example, when I saw a commercial for a mobile phone, I realised that it would be the perfect replacement for my dying phone. Without this advertisement, I would've wasted time searching and perhaps even end up with a less suitable replacement. On top of that, advertisements help create jobs. When the demand for products and services increases because of advertising, more people are needed to make and provide those products and services. Consequently, more jobs are created.", "Despite its contribution to the economy, advertising can have harmful social effects. This is because advertisements of luxury products like expensive clothes, shoes and cars are very common. It creates the impression that if you possess these things, you become more desirable or impressive to others. Thus, when people cannot buy expensive goods, it often leads to lower self-esteem. In their desperation, they might turn to stealing, or perhaps they will max out their credit cards and put themselves in debt. These effects on people's behaviour are why I'm strongly in favour of restricting the amount of advertisements–particularly ones that target younger people, who are more vulnerable to media influences.", "Therefore, even though advertising promotes economic growth, I believe that it should be somewhat restricted to protect people's mental health."], "translations": ["人们对广告是积极还是消极的事物看法不一。虽然我承认广告有经济益处，但我也认为应在一定程度上限制广告，因为它可能损害心理健康。", "一方面，广告通过增加消费支出促进经济增长。它向消费者提供产品和服务信息，其中许多满足消费者的某些需要。例如，我看到一则手机广告时，意识到它能完美替代我快坏掉的手机。没有这则广告，我可能会浪费时间寻找，甚至最终买到更不合适的替代品。另外，广告有助于创造就业。广告增加产品与服务需求时，需要更多人生产和提供它们。因此，就业岗位增加。", "尽管广告有经济贡献，也会产生有害的社会影响。这是因为昂贵衣服、鞋子和汽车等奢侈品广告很常见。它营造一种印象：拥有这些东西会让你在别人眼中更有吸引力、更令人印象深刻。因此，人们买不起昂贵物品时，往往会降低自尊。绝望之下，他们可能偷窃，或刷爆信用卡使自己负债。这些对行为的影响，使我强烈支持限制广告数量，尤其是针对更易受媒体影响的年轻人的广告。", "因此，虽然广告促进经济增长，但我认为应加以一定限制，以保护人们的心理健康。"], "kind": "双边讨论＋个人观点", "stance": "承认经济利益，因社会心理危害支持适当限制。", "structure": [{"title": "引言", "role": "", "points": ["明确双方关系与限制广告的立场。"]}, {"title": "经济段", "role": "", "points": ["2 点：信息促消费；需求增加创造就业", "个人买手机经历作例子。"]}, {"title": "社会段", "role": "", "points": ["奢侈品展示 → 身份比较 → 自尊受损 → 借贷等后果", "直接推到偷窃，因果跨度较大。"]}, {"title": "结论", "role": "", "points": ["以经济利益和心理健康的平衡收束。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "whether advertising is a positive or negative thing", "t": "whether 名词性从句", "e": "作介词 regarding 的宾语，说明观点分歧的内容。"}, {"p": 0, "c": "link", "q": "Although I recognise", "t": "Although：让步", "e": "承认经济收益，主句仍提出限制措施。"}, {"p": 0, "c": "vocab", "q": "recognise", "t": "recognise v.", "e": "熟词生义：承认、认可某事实，不是认出某人。"}, {"p": 0, "c": "syntax", "q": "advertising should be restricted to some extent", "t": "情态被动＋程度限定", "e": "should be restricted 表示应受限制，to some extent 明确不是全面禁止。"}, {"p": 0, "c": "expression", "q": "restricted to some extent", "t": "restrict / to some extent", "e": "适当限制，而非全面禁止。"}, {"p": 1, "c": "expression", "q": "contributes to economic growth", "t": "contribute to growth", "e": "促进经济增长，to 后用名词，不接动词原形。"}, {"p": 1, "c": "expression", "q": "consumer spending", "t": "consumer spending", "e": "消费支出，经济类名词搭配。"}, {"p": 1, "c": "syntax", "q": "It does so by providing consumers with information", "t": "do so 回指＋provide sb with sth", "e": "does so 回指促进经济增长；by providing 解释实现方法。"}, {"p": 1, "c": "syntax", "q": "many of which fulfil certain needs", "t": "many of which", "e": "非限制性定语从句，指前面的 products and services 中许多项。"}, {"p": 1, "c": "vocab", "q": "fulfil", "t": "fulfil v.", "e": "满足需要、履行职责，本文指满足需求。"}, {"p": 1, "c": "syntax", "q": "when I saw a commercial for a mobile phone", "t": "when 时间从句", "e": "具体叙述看到广告的经历，给信息匹配需求提供实例。"}, {"p": 1, "c": "vocab", "q": "commercial", "t": "commercial n.", "e": "商业广告，此处不是形容词“商业的”。"}, {"p": 1, "c": "vocab", "q": "replacement", "t": "replacement n.", "e": "替代品；本文是替换故障手机的新手机。"}, {"p": 1, "c": "vocab", "q": "dying phone", "t": "dying adj.", "e": "熟词生义：设备快不能用了。"}, {"p": 1, "c": "syntax", "q": "I would've wasted time searching and perhaps even end up", "t": "虚拟结果的并列形式", "e": "would have 后应并列 wasted 与 ended up；原文 end up 形式不一致。"}, {"p": 1, "c": "vocab", "q": "suitable", "t": "suitable adj.", "e": "适合用途或需要的。"}, {"p": 1, "c": "link", "q": "On top of that", "t": "补充递进", "e": "从消费增长补充创造就业。"}, {"p": 1, "c": "expression", "q": "create jobs", "t": "create jobs", "e": "创造就业岗位，与 reduce unemployment 相关但不完全等同。"}, {"p": 1, "c": "link", "q": "When the demand for products and services increases because of advertising", "t": "When＋because of", "e": "When 设置需求增长情境；because of 后接名词 advertising 说明原因。"}, {"p": 1, "c": "syntax", "q": "more people are needed to make and provide those products and services", "t": "被动＋不定式", "e": "需要更多劳动力；to make and provide 说明需要他们完成的工作。"}, {"p": 1, "c": "link", "q": "Consequently", "t": "结果", "e": "从企业需要更多劳动力，推出新增岗位。"}, {"p": 2, "c": "link", "q": "Despite its contribution to the economy", "t": "Despite：让步", "e": "承认经济贡献，同时转向社会损害。"}, {"p": 2, "c": "syntax", "q": "This is because advertisements of luxury products", "t": "This is because …", "e": "用 because 从句直接解释社会危害的来源。"}, {"p": 2, "c": "vocab", "q": "luxury", "t": "luxury adj.", "e": "奢侈的、非基本必需的，修饰 products。"}, {"p": 2, "c": "syntax", "q": "It creates the impression", "t": "指代不清", "e": "前一句主语是 advertisements 复数，It 指代模糊；可写 Such advertising creates …。"}, {"p": 2, "c": "syntax", "q": "the impression that if you possess these things, you become more desirable or impressive to others", "t": "同位语从句内含条件从句", "e": "that 解释 impression；if 在其内部设定拥有奢侈品的条件。"}, {"p": 2, "c": "vocab", "q": "possess", "t": "possess v.", "e": "拥有，较正式，本文指拥有奢侈品。"}, {"p": 2, "c": "vocab", "q": "desirable", "t": "desirable adj.", "e": "有吸引力的、令人向往的，描写广告暗示的人物形象。"}, {"p": 2, "c": "vocab", "q": "impressive", "t": "impressive adj.", "e": "给人深刻印象的，此处是广告暗示的社会评价。"}, {"p": 2, "c": "link", "q": "Thus", "t": "推导结果", "e": "从奢侈品代表身份的印象，推到无法购买时的低自尊。"}, {"p": 2, "c": "vocab", "q": "self-esteem", "t": "self-esteem n.", "e": "自尊、自我价值感。"}, {"p": 2, "c": "link", "q": "In their desperation", "t": "状态背景", "e": "在绝望的状态下；该背景并不能自动证明偷窃一定发生。"}, {"p": 2, "c": "vocab", "q": "desperation", "t": "desperation n.", "e": "绝望、走投无路。"}, {"p": 2, "c": "vocab", "q": "max out", "t": "max out", "e": "用尽额度；这里刷到信用卡上限。"}, {"p": 2, "c": "expression", "q": "put themselves in debt", "t": "put sb in debt", "e": "使某人负债。"}, {"p": 2, "c": "vocab", "q": "debt", "t": "debt n.", "e": "债务、负债状态，in debt 表负债。"}, {"p": 2, "c": "syntax", "q": "These effects on people's behaviour are why I'm strongly in favour", "t": "why 表语从句", "e": "说明为何作者支持限制广告；前半句 effects 是主语，are 是系动词。"}, {"p": 2, "c": "expression", "q": "in favour of restricting", "t": "in favour of + doing", "e": "支持限制，of 是介词。"}, {"p": 2, "c": "expression", "q": "the amount of advertisements", "t": "amount / number 的选择", "e": "advertisements 可数，宜用 the number of advertisements；advertising 不可数，可用 amount of advertising。"}, {"p": 2, "c": "syntax", "q": "ones that target younger people, who are more vulnerable to media influences", "t": "两个定语从句层级", "e": "that 修饰广告 ones；who 修饰 younger people，说明年轻受众特点。"}, {"p": 2, "c": "vocab", "q": "target", "t": "target v.", "e": "以某人群为目标，本文是针对年轻受众。"}, {"p": 2, "c": "vocab", "q": "vulnerable", "t": "vulnerable adj.", "e": "易受伤害或影响的。"}, {"p": 3, "c": "link", "q": "even though", "t": "让步从句", "e": "最后重申利益不能取消限制的必要性。"}, {"p": 3, "c": "expression", "q": "promotes economic growth", "t": "promote / contribute to", "e": "结尾 promotes 回扣主体 contributes to，均表达促进而非唯一造成增长。"}, {"p": 3, "c": "syntax", "q": "it should be somewhat restricted to protect people's mental health", "t": "情态被动＋不定式目的", "e": "somewhat 限定限制程度；to protect 说明限制的目标。"}, {"p": 3, "c": "vocab", "q": "somewhat", "t": "somewhat adv.", "e": "有些、在一定程度上，限制建议的强度。"}], "sourcePage": 17}, {"id": "essay-17", "title": "移居其他星球", "question": "Living on earth would become difficult in the future. So, more money should be spent on researching other planets to live, like Mars.\nTo what extent do you agree or disagree?", "qzh": "未来在地球生活会变得困难，因此应投入更多资金研究火星等适合居住的其他星球。你在多大程度上同意或不同意？", "paragraphs": ["It is predicted by many that Earth will become unsuitable for human habitation in the future. Consequently, some people argue that governments should allocate more financial resources to exploring alternative planets, such as Mars. Personally, I disagree with this view and believe that public funds should be prioritized to address existing issues on Earth.", "On the one hand, supporters of space exploration argue that searching for a new home is vital for the long-term survival of human beings. First of all, Earth’s natural resources are being rapidly depleted due to overpopulation and excessive industrial development. This has already resulted in a severe shortage of energy and clean water, meaning that our living conditions will inevitably deteriorate. Therefore, researching other planets is a necessary way to find new survival space. Additionally, investment in space projects can stimulate technological progress. The scientific breakthroughs required for space travel, such as advanced solar energy and artificial intelligence, can be applied to improve life on Earth and promote overall human development.", "On the other hand, I believe that it is much more rational to spend money on preserving our own planet rather than escaping from it. The primary reason is that current environmental crises, including global warming and pollution, can still be solved if adequate funding is provided. Investing in renewable energy and green technologies is far more effective and practical than spending billions of dollars on searching for an unpredictable future on Mars. Furthermore, public funds should focus on improving the current living standards of ordinary citizens. Today, many countries are still facing urgent challenges such as poverty, inadequate education, and poor healthcare systems. Governments have a responsibility to prioritize citizens’ immediate well-being instead of funding distant space ambitions.", "In conclusion, although exploring other planets might offer a potential alternative for the distant future and bring some technical innovations, I think it is a misplaced priority. Governments should spend money on saving Earth and helping people live better today."], "translations": ["许多人预测，未来地球将不适合人类居住。因此，有人主张政府应投入更多财政资源探索火星等替代星球。我不同意，并认为应优先用公共资金解决地球上现有的问题。", "一方面，支持太空探索的人认为，寻找新家园对人类长期生存至关重要。首先，人口过多和工业过度发展正迅速消耗地球自然资源。这已导致能源和清洁水严重短缺，意味着我们的生活条件不可避免地会恶化。因此，研究其他星球是寻找新生存空间的必要方式。此外，投资太空项目可以推动技术进步。太空旅行需要的先进太阳能和人工智能等科学突破，可应用于改善地球生活，促进人类整体发展。", "另一方面，我认为把钱花在保护自己的星球而不是逃离它，要理性得多。首要原因是，如果提供足够资金，全球变暖和污染等环境危机仍可解决。投资可再生能源和绿色技术，比花费数十亿美元寻找火星上不可预测的未来更有效、更实际。此外，公共资金应着重改善普通公民当下的生活水平。如今许多国家仍面临贫困、教育不足和医疗系统落后等紧急问题。政府有责任优先照顾公民眼前的福祉，而不是资助遥远的太空雄心。", "总之，虽然探索其他星球可能为遥远未来提供潜在替代选择，并带来技术创新，但我认为这是优先顺序失当。政府应把钱用于拯救地球，帮助人们今天过得更好。"], "kind": "同意与否", "stance": "反对增加迁居星球研究投入，主张当前地球问题优先；先陈述支持方，再反驳。", "structure": [{"title": "引言", "role": "", "points": ["明确财政资源应优先地球问题。"]}, {"title": "让步段", "role": "", "points": ["2 个支持理由：长期生存备选；技术外溢收益。"]}, {"title": "主张段", "role": "", "points": ["2 个优先理由：环境问题可直接治理；民生需求紧迫。"]}, {"title": "结论", "role": "", "points": ["承认长期潜力，但否定当前投入优先级。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "It is predicted by many that", "t": "It is predicted that …", "e": "被动预测结构；预测不是已确定的事实。"}, {"p": 0, "c": "vocab", "q": "habitation", "t": "habitation n.", "e": "居住、栖居。"}, {"p": 0, "c": "link", "q": "Consequently", "t": "结果", "e": "由居住困难的预测引出增加研究投入的主张。"}, {"p": 0, "c": "expression", "q": "allocate more financial resources", "t": "allocate resources to", "e": "把资源分配到某领域。"}, {"p": 0, "c": "vocab", "q": "alternative", "t": "alternative adj.", "e": "替代的、可供选择的；alternative planets 指潜在替代居住地。"}, {"p": 0, "c": "link", "q": "Personally", "t": "立场提示", "e": "明确接下来是作者自己的判断，与前面的预测及他人主张区分。"}, {"p": 0, "c": "syntax", "q": "public funds should be prioritized to address existing issues on Earth", "t": "被动建议的搭配", "e": "作者想说资金优先用于地球问题；public spending should prioritize … 或 funds should be allocated to … 更自然。"}, {"p": 1, "c": "syntax", "q": "searching for a new home is vital for the long-term survival of human beings", "t": "动名词主语＋be vital for", "e": "searching … 作单数主语，for 后给出重要性所针对的目标。"}, {"p": 1, "c": "vocab", "q": "survival", "t": "survival n.", "e": "生存、延续存活的能力或状态。"}, {"p": 1, "c": "syntax", "q": "are being rapidly depleted", "t": "be being + 过去分词", "e": "现在进行时的被动语态，强调正在消耗。"}, {"p": 1, "c": "vocab", "q": "depleted", "t": "deplete v.", "e": "耗尽、使大量减少。"}, {"p": 1, "c": "link", "q": "due to overpopulation and excessive industrial development", "t": "due to + 两个名词短语", "e": "解释自然资源消耗的原因，两个因素并列。"}, {"p": 1, "c": "vocab", "q": "overpopulation", "t": "overpopulation n.", "e": "人口过多，强调相对资源承载能力的压力。"}, {"p": 1, "c": "expression", "q": "a severe shortage of energy and clean water", "t": "a shortage of", "e": "能源和清洁水的严重短缺；shortage 可数，需冠词或复数。"}, {"p": 1, "c": "vocab", "q": "severe", "t": "severe adj.", "e": "严重的，修饰 shortage。"}, {"p": 1, "c": "syntax", "q": "meaning that our living conditions will inevitably deteriorate", "t": "分词＋that 从句", "e": "meaning 补充资源短缺被作者推导出的结果；inevitably 过于绝对，可更谨慎限定。"}, {"p": 1, "c": "vocab", "q": "inevitably", "t": "inevitably adv.", "e": "不可避免地；表达确定性很强，需要足够论据支持。"}, {"p": 1, "c": "vocab", "q": "deteriorate", "t": "deteriorate v.", "e": "恶化。"}, {"p": 1, "c": "link", "q": "Additionally", "t": "第二个支持理由", "e": "从寻找生存空间转向太空研究的技术外溢收益。"}, {"p": 1, "c": "expression", "q": "stimulate technological progress", "t": "stimulate progress", "e": "推动、促进技术进步，stimulate 强调激发发展。"}, {"p": 1, "c": "vocab", "q": "stimulate", "t": "stimulate v.", "e": "促进、激发；此处为推动技术发展。"}, {"p": 1, "c": "syntax", "q": "The scientific breakthroughs required for space travel", "t": "过去分词后置修饰", "e": "required for … 修饰 breakthroughs，说明哪些突破。"}, {"p": 1, "c": "expression", "q": "scientific breakthroughs", "t": "scientific breakthroughs", "e": "科学突破。"}, {"p": 1, "c": "syntax", "q": "can be applied to improve life on Earth and promote overall human development", "t": "情态被动＋目的不定式", "e": "技术可以被应用来 improve 和 promote 两种结果。"}, {"p": 2, "c": "syntax", "q": "it is much more rational to spend money on preserving our own planet", "t": "形式主语＋比较级", "e": "真正主语为 to spend …；on 后用 preserving。much 强调更合理的程度。"}, {"p": 2, "c": "vocab", "q": "rational", "t": "rational adj.", "e": "理性的、合理的。"}, {"p": 2, "c": "vocab", "q": "preserving", "t": "preserve v.", "e": "保护、维持，使不遭损坏。"}, {"p": 2, "c": "link", "q": "rather than escaping from it", "t": "rather than：选择对照", "e": "保护地球与逃离地球对比，强调资金优先级。"}, {"p": 2, "c": "syntax", "q": "The primary reason is that current environmental crises", "t": "that 表语从句", "e": "直接给出优先地球投入的首要理由。"}, {"p": 2, "c": "syntax", "q": "if adequate funding is provided", "t": "if 条件从句", "e": "说明解决环境问题所需条件。"}, {"p": 2, "c": "vocab", "q": "adequate", "t": "adequate adj.", "e": "足够的、适当的。"}, {"p": 2, "c": "syntax", "q": "Investing in renewable energy and green technologies is far more effective and practical than spending billions of dollars", "t": "两个动名词短语比较", "e": "Investing … 与 spending … 平行，比较资金用途的效果和实用性。"}, {"p": 2, "c": "vocab", "q": "renewable", "t": "renewable adj.", "e": "可再生的，用于能源类型。"}, {"p": 2, "c": "link", "q": "Furthermore", "t": "第二个反对理由", "e": "从环境修复扩展到贫困、教育和医疗等民生需求。"}, {"p": 2, "c": "expression", "q": "living standards", "t": "living standards", "e": "生活水平，常用复数；与 living conditions（生活条件）相关。"}, {"p": 2, "c": "expression", "q": "urgent challenges", "t": "urgent / pressing challenges", "e": "紧迫的问题，突出当前行动的时间优先性。"}, {"p": 2, "c": "vocab", "q": "inadequate", "t": "inadequate adj.", "e": "不充分的、不能满足需要的，修饰 education。"}, {"p": 2, "c": "syntax", "q": "Governments have a responsibility to prioritize", "t": "have a responsibility to do", "e": "用职责结构支持财政选择，而不只表达个人偏好。"}, {"p": 2, "c": "expression", "q": "prioritize citizens’ immediate well-being", "t": "prioritize + 名词", "e": "优先考虑公民眼前福祉；与长期目标形成对比。"}, {"p": 2, "c": "link", "q": "instead of funding", "t": "instead of + doing", "e": "用当前民生投入替代遥远太空目标。"}, {"p": 2, "c": "vocab", "q": "ambitions", "t": "ambition n.", "e": "宏大目标、雄心，distant space ambitions 指遥远太空目标。"}, {"p": 3, "c": "syntax", "q": "although exploring other planets might offer a potential alternative", "t": "although＋动名词主语＋might", "e": "承认未来可能性，might 保留不确定性，随后给当前优先判断。"}, {"p": 3, "c": "link", "q": "for the distant future", "t": "时间范围限定", "e": "指长期未来的替代选项，与结尾 today 对照。"}, {"p": 3, "c": "vocab", "q": "misplaced priority", "t": "misplaced priority", "e": "优先顺序不恰当，重点放错位置。"}, {"p": 3, "c": "expression", "q": "saving Earth and helping people live better today", "t": "并列 doing", "e": "spend money on 后并列 saving 与 helping；help people live 中 live 为原形。"}], "sourcePage": 18}, {"id": "essay-18", "title": "投资科研", "question": "Some people believe that a lot of scientific research done today is a waste of time and money.\nTo what extent do you agree or disagree?", "qzh": "有人认为今天开展的许多科研浪费时间和金钱。你在多大程度上同意或不同意？", "paragraphs": ["In the modern world, scientific research has become increasingly significant, influencing nearly every aspect of human life. I strongly believe that it is worth investing substantial amounts of time and money, as the benefits of scientific research are undeniable.", "One major area where scientific inquiry has proved indispensable is healthcare. Ongoing research drives the development of innovative treatments and life-saving medicines. For example, during the COVID-19 pandemic, scientists worked intensively to develop vaccines that ultimately contained the spread of the virus and saved millions of lives worldwide. Without such breakthroughs, modern healthcare would struggle to address urgent health crises.", "Another compelling reason is the advancement of technology. Scientific research has been the foundation for inventions that shape our daily lives. For instance, the internet, which initially emerged as a scientific project, has now become the backbone of the global economy. Moreover, digital devices such as smartphones, laptops, and computers, which stem from scientific progress, have transformed the way people learn, work, and communicate.", "Furthermore, research plays a crucial role in tackling global challenges such as climate change, environmental degradation, and energy shortages. For example, scientists have developed renewable energy sources—including solar, wind, and nuclear power—as viable alternatives to fossil fuels, which severely damage the environment. The adoption of these cleaner technologies not only alleviates the pressure on ecosystems but also promotes sustainable development worldwide.", "In conclusion, far from being a waste of time or money, scientific research is essential to the progress of modern society. Its contributions to medicine, technology, and global problem-solving demonstrate that continued investment in research is fundamental for building a healthier, more sustainable, and more prosperous future."], "translations": ["在现代世界，科研日益重要，影响人类生活的几乎所有方面。我坚信，投入大量时间和金钱是值得的，因为科研的好处不可否认。", "科研已证明不可或缺的一个主要领域是医疗。持续研究推动创新治疗和救命药物的发展。例如，在新冠疫情期间，科学家努力研发疫苗，最终遏制病毒传播，并挽救世界各地数百万人的生命。如果没有这些突破，现代医疗将难以应对紧急健康危机。", "另一个有力理由是技术进步。科研是塑造我们日常生活的发明的基础。例如，互联网最初起源于科学项目，如今已成为全球经济的重要支柱。此外，源于科学进步的智能手机、笔记本电脑和计算机等数字设备，改变了人们学习、工作和交流的方式。", "另外，研究对解决气候变化、环境恶化和能源短缺等全球挑战至关重要。例如，科学家开发了包括太阳能、风能和核能在内的可再生能源，作为严重损害环境的化石燃料的可行替代品。采用这些更清洁的技术，不仅缓解生态系统压力，也促进全球可持续发展。", "总之，科研远不是浪费时间和金钱，而是现代社会进步不可缺少的部分。其对医学、技术及全球问题解决的贡献，表明持续投入科研是建设更健康、更可持续、更繁荣未来的基础。"], "kind": "同意与否", "stance": "反对浪费论，用医疗、技术、环境三方面支持投入。原文把核能归为可再生能源不准确，译文忠实保留并在分析中指出。", "structure": [{"title": "引言", "role": "", "points": ["直接肯定投入价值。"]}, {"title": "主体一", "role": "", "points": ["医疗研究 → 药物疫苗 → 应对健康危机", "量化挽救人数未注明来源。"]}, {"title": "主体二", "role": "", "points": ["互联网与数字设备 → 经济、学习、工作和沟通变化。"]}, {"title": "主体三", "role": "", "points": ["能源与环境问题 → 替代能源 → 可持续发展", "核能通常不归为可再生能源，宜改为低碳能源。"]}, {"title": "结论", "role": "", "points": ["汇总三领域，重申长期投入。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "influencing nearly every aspect of human life", "t": "分词补充说明", "e": "influencing 的逻辑主语为 scientific research，说明其重要性体现在哪些范围。"}, {"p": 0, "c": "expression", "q": "nearly every aspect of human life", "t": "aspect of", "e": "生活的各个方面；nearly 表示几乎，避免绝对覆盖。"}, {"p": 0, "c": "syntax", "q": "it is worth investing", "t": "be worth doing", "e": "值得做；worth 后接动名词 investing。"}, {"p": 0, "c": "vocab", "q": "substantial", "t": "substantial adj.", "e": "大量的、可观的；修饰时间和金钱的投入。"}, {"p": 0, "c": "link", "q": "as the benefits of scientific research are undeniable", "t": "as：原因", "e": "解释值得投入的立场；undeniable 是作者评价，具体支持在后文。"}, {"p": 0, "c": "vocab", "q": "undeniable", "t": "undeniable adj.", "e": "不可否认的，作者确信程度很强。"}, {"p": 1, "c": "syntax", "q": "One major area where scientific inquiry has proved indispensable is healthcare", "t": "where 定语从句＋主干", "e": "主干是 One major area is healthcare；where 从句说明科研在该领域的重要性。"}, {"p": 1, "c": "vocab", "q": "inquiry", "t": "inquiry n.", "e": "探究、研究；scientific inquiry 指科学探究，不是一般询问。"}, {"p": 1, "c": "vocab", "q": "indispensable", "t": "indispensable adj.", "e": "不可或缺的。"}, {"p": 1, "c": "vocab", "q": "Ongoing", "t": "ongoing adj.", "e": "持续进行的，修饰研究。"}, {"p": 1, "c": "vocab", "q": "innovative", "t": "innovative adj.", "e": "创新的，修饰 treatments。"}, {"p": 1, "c": "expression", "q": "life-saving medicines", "t": "life-saving adj.", "e": "能够挽救生命的，作 medicines 的前置修饰语。"}, {"p": 1, "c": "link", "q": "during the COVID-19 pandemic", "t": "during + 名词", "e": "限定例子发生的时间，而不是原因连词。"}, {"p": 1, "c": "vocab", "q": "intensively", "t": "intensively adv.", "e": "集中而深入地、密集地，描述研发投入。"}, {"p": 1, "c": "syntax", "q": "vaccines that ultimately contained the spread of the virus", "t": "that 定语从句", "e": "that 指 vaccines，在从句中作主语，说明疫苗的效果；原文表述概括，效果受病毒和疫苗类型影响。"}, {"p": 1, "c": "vocab", "q": "contained", "t": "contain v.", "e": "熟词生义：遏制、控制；不是“包含”。"}, {"p": 1, "c": "syntax", "q": "Without such breakthroughs, modern healthcare would struggle", "t": "without + would", "e": "假设缺少这些突破的情形，说明科研不可或缺。"}, {"p": 1, "c": "vocab", "q": "breakthroughs", "t": "breakthrough n.", "e": "突破性进展，不是普通小幅改进。"}, {"p": 1, "c": "expression", "q": "address urgent health crises", "t": "address a crisis", "e": "应对紧急健康危机；address 在此不是说话或地址。"}, {"p": 2, "c": "vocab", "q": "compelling", "t": "compelling adj.", "e": "令人信服的、有说服力的。"}, {"p": 2, "c": "expression", "q": "has been the foundation for", "t": "the foundation for", "e": "为某事奠定基础，for 引出被支持的发明或发展。"}, {"p": 2, "c": "syntax", "q": "inventions that shape our daily lives", "t": "that 定语从句", "e": "that 指 inventions，作 shape 的主语；说明这些发明的重要作用。"}, {"p": 2, "c": "link", "q": "For instance", "t": "实例支持", "e": "互联网的用途变化说明科研可能发展出广泛社会价值。"}, {"p": 2, "c": "syntax", "q": "the internet, which initially emerged as a scientific project, has now become", "t": "插入非限制性从句", "e": "主干是 the internet has now become …；which 从句交代最初起源。"}, {"p": 2, "c": "vocab", "q": "initially", "t": "initially adv.", "e": "最初，与 has now become 的如今形成时间对照。"}, {"p": 2, "c": "vocab", "q": "emerged", "t": "emerge v.", "e": "出现、形成；emerge as 强调以何种形式出现。"}, {"p": 2, "c": "vocab", "q": "backbone", "t": "backbone n.", "e": "此处指支柱、核心基础。"}, {"p": 2, "c": "link", "q": "Moreover", "t": "追加实例", "e": "从互联网再补充数字设备，仍围绕技术进步同一论点。"}, {"p": 2, "c": "syntax", "q": "digital devices such as smartphones, laptops, and computers, which stem from scientific progress", "t": "名词列举＋which 从句", "e": "such as 提供设备例子；which 回指这些设备，补充它们与科学发展的联系。"}, {"p": 2, "c": "expression", "q": "stem from scientific progress", "t": "stem from", "e": "源于、起因于。"}, {"p": 2, "c": "syntax", "q": "the way people learn, work, and communicate", "t": "the way + 从句", "e": "说明人们学习、工作、沟通的方式，三个动词并列。"}, {"p": 3, "c": "link", "q": "Furthermore", "t": "递进", "e": "从医疗、日常技术扩展到全球性挑战。"}, {"p": 3, "c": "expression", "q": "tackling global challenges", "t": "tackle challenges", "e": "应对挑战，常用动宾搭配。"}, {"p": 3, "c": "syntax", "q": "as viable alternatives to fossil fuels", "t": "as＋名词；alternative to", "e": "作为化石燃料的可行替代品，to 引出被替代的对象。"}, {"p": 3, "c": "vocab", "q": "viable", "t": "viable adj.", "e": "切实可行的。"}, {"p": 3, "c": "vocab", "q": "fossil fuels", "t": "fossil fuels", "e": "化石燃料，包括煤、石油、天然气等。"}, {"p": 3, "c": "syntax", "q": "which severely damage the environment", "t": "which 非限制性从句", "e": "指紧邻的 fossil fuels，补充选择替代能源的理由。"}, {"p": 3, "c": "syntax", "q": "The adoption of these cleaner technologies not only alleviates", "t": "名词化主语＋单数谓语", "e": "adoption 为单数中心词，故用 alleviates；technologies 复数不决定谓语形式。"}, {"p": 3, "c": "vocab", "q": "adoption", "t": "adoption n.", "e": "熟词生义：采用，不是收养。"}, {"p": 3, "c": "link", "q": "not only alleviates", "t": "not only … but also …", "e": "并列减轻生态压力和促进持续发展。"}, {"p": 3, "c": "expression", "q": "alleviates the pressure on ecosystems", "t": "alleviate pressure on", "e": "减轻对生态系统的压力，on 指压力承受对象。"}, {"p": 3, "c": "vocab", "q": "alleviates", "t": "alleviate v.", "e": "缓解、减轻压力或问题。"}, {"p": 3, "c": "vocab", "q": "ecosystems", "t": "ecosystem n.", "e": "生态系统，包含生物与环境的相互关系。"}, {"p": 4, "c": "link", "q": "far from being", "t": "far from + doing", "e": "远非……，用于明确否定题目中的浪费评价。"}, {"p": 4, "c": "expression", "q": "essential to the progress of modern society", "t": "be essential to", "e": "对……必不可少；to 为介词，不是不定式标记。"}, {"p": 4, "c": "syntax", "q": "Its contributions to medicine, technology, and global problem-solving demonstrate that", "t": "名词主语＋that 宾语从句", "e": "主语 contributions 为复数，谓语 demonstrate；that 从句给出由三类贡献导出的结论。"}, {"p": 4, "c": "expression", "q": "continued investment in research", "t": "investment in", "e": "对科研的持续投入。"}, {"p": 4, "c": "syntax", "q": "fundamental for building a healthier, more sustainable, and more prosperous future", "t": "for + doing＋并列比较级", "e": "building 作介词宾语，三个比较级分别描述健康、持续性与繁荣。"}, {"p": 4, "c": "vocab", "q": "fundamental", "t": "fundamental adj.", "e": "基础性的、根本重要的；与 essential、indispensable 语义相关。"}, {"p": 4, "c": "vocab", "q": "prosperous", "t": "prosperous adj.", "e": "繁荣的。"}], "sourcePage": 19}, {"id": "essay-19", "title": "孩子犯罪父母同罪", "question": "Some people argue that parents of children who break the law should be punished in some way, because they are responsible for their children’s actions.\nTo what extent do you agree or disagree?", "qzh": "有人主张违法儿童的父母应受到某种惩罚，因为父母要为孩子的行为负责。你在多大程度上同意或不同意？", "paragraphs": ["The debate regarding whether parents should bear legal consequences for their children's criminal actions is highly controversial. While I agree that parents play a crucial role in a child's upbringing and should be held accountable to some degree, I also believe it is unfair to punish them universally, as other external factors contribute to juvenile delinquency.", "On the one hand, parents are the primar
