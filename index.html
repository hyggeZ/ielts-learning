ts–particularly ones that target younger people, who are more vulnerable to media influences.", "Therefore, even though advertising promotes economic growth, I believe that it should be somewhat restricted to protect people's mental health."], "translations": ["人们对广告是积极还是消极的事物看法不一。虽然我承认广告有经济益处，但我也认为应在一定程度上限制广告，因为它可能损害心理健康。", "一方面，广告通过增加消费支出促进经济增长。它向消费者提供产品和服务信息，其中许多满足消费者的某些需要。例如，我看到一则手机广告时，意识到它能完美替代我快坏掉的手机。没有这则广告，我可能会浪费时间寻找，甚至最终买到更不合适的替代品。另外，广告有助于创造就业。广告增加产品与服务需求时，需要更多人生产和提供它们。因此，就业岗位增加。", "尽管广告有经济贡献，也会产生有害的社会影响。这是因为昂贵衣服、鞋子和汽车等奢侈品广告很常见。它营造一种印象：拥有这些东西会让你在别人眼中更有吸引力、更令人印象深刻。因此，人们买不起昂贵物品时，往往会降低自尊。绝望之下，他们可能偷窃，或刷爆信用卡使自己负债。这些对行为的影响，使我强烈支持限制广告数量，尤其是针对更易受媒体影响的年轻人的广告。", "因此，虽然广告促进经济增长，但我认为应加以一定限制，以保护人们的心理健康。"], "kind": "双边讨论＋个人观点", "stance": "承认经济利益，因社会心理危害支持适当限制。", "structure": [{"title": "引言", "role": "", "points": ["明确双方关系与限制广告的立场。"]}, {"title": "经济段", "role": "", "points": ["2 点：信息促消费；需求增加创造就业", "个人买手机经历作例子。"]}, {"title": "社会段", "role": "", "points": ["奢侈品展示 → 身份比较 → 自尊受损 → 借贷等后果", "直接推到偷窃，因果跨度较大。"]}, {"title": "结论", "role": "", "points": ["以经济利益和心理健康的平衡收束。"]}], "readerNotes": [{"p": 1, "c": "vocab", "q": "fulfil", "t": "fulfil v.", "e": "满足需要、履行职责，本文指满足需求。"}, {"p": 1, "c": "vocab", "q": "dying phone", "t": "dying adj.", "e": "熟词生义：设备快不能用了。"}, {"p": 2, "c": "vocab", "q": "self-esteem", "t": "self-esteem n.", "e": "自尊、自我价值感。"}, {"p": 2, "c": "vocab", "q": "desperation", "t": "desperation n.", "e": "绝望、走投无路。"}, {"p": 2, "c": "vocab", "q": "max out", "t": "max out", "e": "用尽额度；这里刷到信用卡上限。"}, {"p": 2, "c": "vocab", "q": "vulnerable", "t": "vulnerable adj.", "e": "易受伤害或影响的。"}, {"p": 1, "c": "syntax", "q": "many of which fulfil certain needs", "t": "many of which", "e": "非限制性定语从句，指前面的 products and services 中许多项。"}, {"p": 1, "c": "syntax", "q": "I would've wasted time searching and perhaps even end up", "t": "虚拟结果的并列形式", "e": "would have 后应并列 wasted 与 ended up；原文 end up 形式不一致。"}, {"p": 2, "c": "syntax", "q": "It creates the impression", "t": "指代不清", "e": "前一句主语是 advertisements 复数，It 指代模糊；可写 Such advertising creates …。"}, {"p": 1, "c": "link", "q": "On top of that", "t": "补充递进", "e": "从消费增长补充创造就业。"}, {"p": 2, "c": "link", "q": "Despite its contribution to the economy", "t": "Despite：让步", "e": "承认经济贡献，同时转向社会损害。"}, {"p": 3, "c": "link", "q": "even though", "t": "让步从句", "e": "最后重申利益不能取消限制的必要性。"}, {"p": 1, "c": "expression", "q": "consumer spending", "t": "consumer spending", "e": "消费支出，经济类名词搭配。"}, {"p": 2, "c": "expression", "q": "put themselves in debt", "t": "put sb in debt", "e": "使某人负债。"}, {"p": 0, "c": "expression", "q": "restricted to some extent", "t": "restrict / to some extent", "e": "适当限制，而非全面禁止。"}], "sourcePage": 17}, {"id": "essay-17", "title": "移居其他星球", "question": "Living on earth would become difficult in the future. So, more money should be spent on researching other planets to live, like Mars.\nTo what extent do you agree or disagree?", "qzh": "未来在地球生活会变得困难，因此应投入更多资金研究火星等适合居住的其他星球。你在多大程度上同意或不同意？", "paragraphs": ["It is predicted by many that Earth will become unsuitable for human habitation in the future. Consequently, some people argue that governments should allocate more financial resources to exploring alternative planets, such as Mars. Personally, I disagree with this view and believe that public funds should be prioritized to address existing issues on Earth.", "On the one hand, supporters of space exploration argue that searching for a new home is vital for the long-term survival of human beings. First of all, Earth’s natural resources are being rapidly depleted due to overpopulation and excessive industrial development. This has already resulted in a severe shortage of energy and clean water, meaning that our living conditions will inevitably deteriorate. Therefore, researching other planets is a necessary way to find new survival space. Additionally, investment in space projects can stimulate technological progress. The scientific breakthroughs required for space travel, such as advanced solar energy and artificial intelligence, can be applied to improve life on Earth and promote overall human development.", "On the other hand, I believe that it is much more rational to spend money on preserving our own planet rather than escaping from it. The primary reason is that current environmental crises, including global warming and pollution, can still be solved if adequate funding is provided. Investing in renewable energy and green technologies is far more effective and practical than spending billions of dollars on searching for an unpredictable future on Mars. Furthermore, public funds should focus on improving the current living standards of ordinary citizens. Today, many countries are still facing urgent challenges such as poverty, inadequate education, and poor healthcare systems. Governments have a responsibility to prioritize citizens’ immediate well-being instead of funding distant space ambitions.", "In conclusion, although exploring other planets might offer a potential alternative for the distant future and bring some technical innovations, I think it is a misplaced priority. Governments should spend money on saving Earth and helping people live better today."], "translations": ["许多人预测，未来地球将不适合人类居住。因此，有人主张政府应投入更多财政资源探索火星等替代星球。我不同意，并认为应优先用公共资金解决地球上现有的问题。", "一方面，支持太空探索的人认为，寻找新家园对人类长期生存至关重要。首先，人口过多和工业过度发展正迅速消耗地球自然资源。这已导致能源和清洁水严重短缺，意味着我们的生活条件不可避免地会恶化。因此，研究其他星球是寻找新生存空间的必要方式。此外，投资太空项目可以推动技术进步。太空旅行需要的先进太阳能和人工智能等科学突破，可应用于改善地球生活，促进人类整体发展。", "另一方面，我认为把钱花在保护自己的星球而不是逃离它，要理性得多。首要原因是，如果提供足够资金，全球变暖和污染等环境危机仍可解决。投资可再生能源和绿色技术，比花费数十亿美元寻找火星上不可预测的未来更有效、更实际。此外，公共资金应着重改善普通公民当下的生活水平。如今许多国家仍面临贫困、教育不足和医疗系统落后等紧急问题。政府有责任优先照顾公民眼前的福祉，而不是资助遥远的太空雄心。", "总之，虽然探索其他星球可能为遥远未来提供潜在替代选择，并带来技术创新，但我认为这是优先顺序失当。政府应把钱用于拯救地球，帮助人们今天过得更好。"], "kind": "同意与否", "stance": "反对增加迁居星球研究投入，主张当前地球问题优先；先陈述支持方，再反驳。", "structure": [{"title": "引言", "role": "", "points": ["明确财政资源应优先地球问题。"]}, {"title": "让步段", "role": "", "points": ["2 个支持理由：长期生存备选；技术外溢收益。"]}, {"title": "主张段", "role": "", "points": ["2 个优先理由：环境问题可直接治理；民生需求紧迫。"]}, {"title": "结论", "role": "", "points": ["承认长期潜力，但否定当前投入优先级。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "habitation", "t": "habitation n.", "e": "居住、栖居。"}, {"p": 1, "c": "vocab", "q": "depleted", "t": "deplete v.", "e": "耗尽、使大量减少。"}, {"p": 1, "c": "vocab", "q": "deteriorate", "t": "deteriorate v.", "e": "恶化。"}, {"p": 2, "c": "vocab", "q": "rational", "t": "rational adj.", "e": "理性的、合理的。"}, {"p": 2, "c": "vocab", "q": "adequate", "t": "adequate adj.", "e": "足够的、适当的。"}, {"p": 3, "c": "vocab", "q": "misplaced priority", "t": "misplaced priority", "e": "优先顺序不恰当，重点放错位置。"}, {"p": 0, "c": "syntax", "q": "It is predicted by many that", "t": "It is predicted that …", "e": "被动预测结构；预测不是已确定的事实。"}, {"p": 1, "c": "syntax", "q": "are being rapidly depleted", "t": "be being + 过去分词", "e": "现在进行时的被动语态，强调正在消耗。"}, {"p": 2, "c": "syntax", "q": "if adequate funding is provided", "t": "if 条件从句", "e": "说明解决环境问题所需条件。"}, {"p": 0, "c": "link", "q": "Consequently", "t": "结果", "e": "由居住困难的预测引出增加研究投入的主张。"}, {"p": 2, "c": "link", "q": "rather than escaping from it", "t": "rather than：选择对照", "e": "保护地球与逃离地球对比，强调资金优先级。"}, {"p": 2, "c": "link", "q": "instead of funding", "t": "instead of + doing", "e": "用当前民生投入替代遥远太空目标。"}, {"p": 0, "c": "expression", "q": "allocate more financial resources", "t": "allocate resources to", "e": "把资源分配到某领域。"}, {"p": 1, "c": "expression", "q": "scientific breakthroughs", "t": "scientific breakthroughs", "e": "科学突破。"}, {"p": 2, "c": "expression", "q": "prioritize citizens’ immediate well-being", "t": "prioritize + 名词", "e": "优先考虑公民眼前福祉；与长期目标形成对比。"}], "sourcePage": 18}, {"id": "essay-18", "title": "投资科研", "question": "Some people believe that a lot of scientific research done today is a waste of time and money.\nTo what extent do you agree or disagree?", "qzh": "有人认为今天开展的许多科研浪费时间和金钱。你在多大程度上同意或不同意？", "paragraphs": ["In the modern world, scientific research has become increasingly significant, influencing nearly every aspect of human life. I strongly believe that it is worth investing substantial amounts of time and money, as the benefits of scientific research are undeniable.", "One major area where scientific inquiry has proved indispensable is healthcare. Ongoing research drives the development of innovative treatments and life-saving medicines. For example, during the COVID-19 pandemic, scientists worked intensively to develop vaccines that ultimately contained the spread of the virus and saved millions of lives worldwide. Without such breakthroughs, modern healthcare would struggle to address urgent health crises.", "Another compelling reason is the advancement of technology. Scientific research has been the foundation for inventions that shape our daily lives. For instance, the internet, which initially emerged as a scientific project, has now become the backbone of the global economy. Moreover, digital devices such as smartphones, laptops, and computers, which stem from scientific progress, have transformed the way people learn, work, and communicate.", "Furthermore, research plays a crucial role in tackling global challenges such as climate change, environmental degradation, and energy shortages. For example, scientists have developed renewable energy sources—including solar, wind, and nuclear power—as viable alternatives to fossil fuels, which severely damage the environment. The adoption of these cleaner technologies not only alleviates the pressure on ecosystems but also promotes sustainable development worldwide.", "In conclusion, far from being a waste of time or money, scientific research is essential to the progress of modern society. Its contributions to medicine, technology, and global problem-solving demonstrate that continued investment in research is fundamental for building a healthier, more sustainable, and more prosperous future."], "translations": ["在现代世界，科研日益重要，影响人类生活的几乎所有方面。我坚信，投入大量时间和金钱是值得的，因为科研的好处不可否认。", "科研已证明不可或缺的一个主要领域是医疗。持续研究推动创新治疗和救命药物的发展。例如，在新冠疫情期间，科学家努力研发疫苗，最终遏制病毒传播，并挽救世界各地数百万人的生命。如果没有这些突破，现代医疗将难以应对紧急健康危机。", "另一个有力理由是技术进步。科研是塑造我们日常生活的发明的基础。例如，互联网最初起源于科学项目，如今已成为全球经济的重要支柱。此外，源于科学进步的智能手机、笔记本电脑和计算机等数字设备，改变了人们学习、工作和交流的方式。", "另外，研究对解决气候变化、环境恶化和能源短缺等全球挑战至关重要。例如，科学家开发了包括太阳能、风能和核能在内的可再生能源，作为严重损害环境的化石燃料的可行替代品。采用这些更清洁的技术，不仅缓解生态系统压力，也促进全球可持续发展。", "总之，科研远不是浪费时间和金钱，而是现代社会进步不可缺少的部分。其对医学、技术及全球问题解决的贡献，表明持续投入科研是建设更健康、更可持续、更繁荣未来的基础。"], "kind": "同意与否", "stance": "反对浪费论，用医疗、技术、环境三方面支持投入。原文把核能归为可再生能源不准确，译文忠实保留并在分析中指出。", "structure": [{"title": "引言", "role": "", "points": ["直接肯定投入价值。"]}, {"title": "主体一", "role": "", "points": ["医疗研究 → 药物疫苗 → 应对健康危机", "量化挽救人数未注明来源。"]}, {"title": "主体二", "role": "", "points": ["互联网与数字设备 → 经济、学习、工作和沟通变化。"]}, {"title": "主体三", "role": "", "points": ["能源与环境问题 → 替代能源 → 可持续发展", "核能通常不归为可再生能源，宜改为低碳能源。"]}, {"title": "结论", "role": "", "points": ["汇总三领域，重申长期投入。"]}], "readerNotes": [{"p": 1, "c": "vocab", "q": "indispensable", "t": "indispensable adj.", "e": "不可或缺的。"}, {"p": 1, "c": "vocab", "q": "contained", "t": "contain v.", "e": "熟词生义：遏制、控制；不是“包含”。"}, {"p": 2, "c": "vocab", "q": "compelling", "t": "compelling adj.", "e": "令人信服的、有说服力的。"}, {"p": 2, "c": "vocab", "q": "backbone", "t": "backbone n.", "e": "此处指支柱、核心基础。"}, {"p": 3, "c": "vocab", "q": "viable", "t": "viable adj.", "e": "切实可行的。"}, {"p": 4, "c": "vocab", "q": "prosperous", "t": "prosperous adj.", "e": "繁荣的。"}, {"p": 0, "c": "syntax", "q": "it is worth investing", "t": "be worth doing", "e": "值得做；worth 后接动名词 investing。"}, {"p": 1, "c": "syntax", "q": "Without such breakthroughs, modern healthcare would struggle", "t": "without + would", "e": "假设缺少这些突破的情形，说明科研不可或缺。"}, {"p": 2, "c": "syntax", "q": "the way people learn, work, and communicate", "t": "the way + 从句", "e": "说明人们学习、工作、沟通的方式，三个动词并列。"}, {"p": 3, "c": "link", "q": "Furthermore", "t": "递进", "e": "从医疗、日常技术扩展到全球性挑战。"}, {"p": 4, "c": "link", "q": "far from being", "t": "far from + doing", "e": "远非……，用于明确否定题目中的浪费评价。"}, {"p": 3, "c": "link", "q": "not only alleviates", "t": "not only … but also …", "e": "并列减轻生态压力和促进持续发展。"}, {"p": 2, "c": "expression", "q": "stem from scientific progress", "t": "stem from", "e": "源于、起因于。"}, {"p": 3, "c": "expression", "q": "tackling global challenges", "t": "tackle challenges", "e": "应对挑战，常用动宾搭配。"}, {"p": 4, "c": "expression", "q": "continued investment in research", "t": "investment in", "e": "对科研的持续投入。"}], "sourcePage": 19}, {"id": "essay-19", "title": "孩子犯罪父母同罪", "question": "Some people argue that parents of children who break the law should be punished in some way, because they are responsible for their children’s actions.\nTo what extent do you agree or disagree?", "qzh": "有人主张违法儿童的父母应受到某种惩罚，因为父母要为孩子的行为负责。你在多大程度上同意或不同意？", "paragraphs": ["The debate regarding whether parents should bear legal consequences for their children's criminal actions is highly controversial. While I agree that parents play a crucial role in a child's upbringing and should be held accountable to some degree, I also believe it is unfair to punish them universally, as other external factors contribute to juvenile delinquency.", "On the one hand, parents are the primary caregivers and moral compasses for their offspring. If children break the law, it sometimes reflects a severe lack of proper parental supervision or guidance. For instance, if parents turn a blind eye to their children's early misbehaviors, these minor issues can eventually escalate into serious offenses. Therefore, holding parents partially accountable can force them to take their parenting responsibilities more seriously. By being more involved, parents can identify early signs of trouble and nip it in the bud before their children commit actual crimes.", "On the other hand, it is unreasonable to place all the blame entirely on parents. As children grow up, they are heavily influenced by the outside world, including peer pressure, social media, and school environments. Even with the best upbringing, teenagers can be led astray by bad company or harmful online content. Furthermore, older children and adolescents are capable of independent thought and must learn to take responsibility for their own actions. Punishing parents for crimes they did not commit or endorse would be unjust and could severely damage the family dynamic.", "In conclusion, while parents should face some form of accountability if gross negligence in their parenting is proven, they should not be automatically punished for every crime committed by their children. A fair justice system should evaluate each case individually, considering both the parents' involvement and the external influences on the child."], "translations": ["父母是否应为孩子的犯罪行为承担法律后果，极具争议。虽然我同意父母对孩子养育至关重要，应在一定程度上负责，但我也认为普遍惩罚他们并不公平，因为其他外部因素也会导致青少年违法犯罪。", "一方面，父母是子女的主要照护者和道德引导者。孩子违法有时反映出父母严重缺乏监督或引导。例如，如果父母对孩子早期的不良行为视而不见，小问题最终可能升级为严重罪行。因此，让父母承担部分责任能够促使他们更认真对待养育责任。父母更多参与，就能及早发现问题迹象，在孩子真正犯罪前将问题消除在萌芽状态。", "另一方面，把一切完全归咎于父母并不合理。孩子成长时会深受外部世界影响，包括同伴压力、社交媒体和学校环境。即使得到最好的养育，青少年也可能被不良同伴或有害网络内容引入歧途。此外，年长儿童和青少年具有独立思考能力，必须学会为自己的行为负责。因他们没有实施、也没有认可的犯罪而惩罚父母，会不公平，并可能严重破坏家庭关系。", "总之，如果证实养育中存在严重疏忽，父母应承担某种责任；但不应因孩子犯下的每一项罪行而自动受罚。公正的司法制度应逐案评估，同时考虑父母的参与程度和孩子受到的外界影响。"], "kind": "同意与否", "stance": "条件立场：严重疏忽被证实时追责，反对一概惩罚。", "structure": [{"title": "引言", "role": "", "points": ["承认父母责任，同时指出外部因素。"]}, {"title": "主体一", "role": "", "points": ["监督失职可能促成犯罪；追责促使尽责", "预防机制解释。"]}, {"title": "主体二", "role": "", "points": ["2 点限制：外部影响；孩子独立责任", "补充不当惩罚的家庭后果。"]}, {"title": "结论", "role": "", "points": ["明确追责条件，逐案判断。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "upbringing", "t": "upbringing n.", "e": "养育、成长教育。"}, {"p": 0, "c": "vocab", "q": "juvenile delinquency", "t": "juvenile delinquency", "e": "青少年违法犯罪。"}, {"p": 1, "c": "vocab", "q": "offspring", "t": "offspring n.", "e": "子女、后代；单复数同形。"}, {"p": 1, "c": "vocab", "q": "escalate", "t": "escalate v.", "e": "升级、恶化。"}, {"p": 2, "c": "vocab", "q": "endorse", "t": "endorse v.", "e": "认可、支持。"}, {"p": 3, "c": "vocab", "q": "gross negligence", "t": "gross negligence", "e": "严重疏忽；gross 在此不是“总的”。"}, {"p": 0, "c": "syntax", "q": "should be held accountable", "t": "hold sb accountable → 被动", "e": "应被追责；accountable 是宾语补足语在被动中的保留形式。"}, {"p": 2, "c": "syntax", "q": "crimes they did not commit or endorse", "t": "省略关系代词的定语从句", "e": "修饰 crimes，强调父母既未实施也未认可。"}, {"p": 3, "c": "syntax", "q": "if gross negligence in their parenting is proven", "t": "if + 被动从句", "e": "以证明严重疏忽作为追责条件。"}, {"p": 0, "c": "link", "q": "to some degree", "t": "程度限定", "e": "表示部分责任，不是一概全责。"}, {"p": 2, "c": "link", "q": "Even with the best upbringing", "t": "Even with：让步", "e": "即使养育良好，也有外部风险。"}, {"p": 3, "c": "link", "q": "considering both", "t": "补充考虑因素", "e": "分词短语说明逐案判断应兼顾的两方面。"}, {"p": 1, "c": "expression", "q": "turn a blind eye to", "t": "turn a blind eye to", "e": "对……视而不见，后接名词。"}, {"p": 1, "c": "expression", "q": "nip it in the bud", "t": "nip … in the bud", "e": "及早阻止问题恶化；it 指早期问题。"}, {"p": 2, "c": "expression", "q": "take responsibility for their own actions", "t": "take responsibility for", "e": "为自己的行为负责。"}], "sourcePage": 20}, {"id": "essay-20", "title": "如果有机会不工作", "question": "If some people get a chance to choose between life without work and spending most of their time working, then they would choose not to work.\nTo what extent do you agree or disagree with this statement?", "qzh": "如果人们能在完全不工作与大部分时间都在工作之间选择，他们会选择不工作。你在多大程度上同意或不同意？", "paragraphs": ["It is often said that if people had to choose between working all the time and never working, most would choose not to work. While I agree that people want to escape from tiring jobs, I disagree that they would choose to do nothing forever, because work gives us a sense of purpose.", "On the one hand, a life without work sounds attractive, especially today when many people are too busy. A lot of jobs are very stressful and take up most of our time. If people did not have to worry about making money, they would certainly want to leave these tiring jobs. Without work, they could spend more time on their hobbies, stay with their families, and travel. These are things that people often have to give up because of their careers. Therefore, wanting to escape from an exhausting working life is a very natural reaction to stress.", "On the other hand, never working will not bring true happiness. Work is not just a way to make a living; it also gives us a daily routine, social connections, and a sense of value. Without a job, people often feel empty and bored. Also, solving problems at work gives us a feeling of success that hobbies usually cannot provide. For example, many people who win the lottery or retire early often go back to part-time jobs or start small businesses. They do this not for money, but to feel useful and connected to society.", "In conclusion, although most people would hate a life where work takes up all their time, they do not really want to be completely jobless. Humans need goals, achievements, and communication, which are all closely connected to having a meaningful job. So, if given the choice, most people would prefer a balanced life with reasonable work rather than no work at all."], "translations": ["人们常说，如果必须在一直工作和从不工作之间选择，大多数人会选择不工作。虽然我同意人们想逃离令人疲惫的工作，但我不同意他们愿意永远什么也不做，因为工作赋予我们目标感。", "一方面，不工作的生活听起来有吸引力，尤其在许多人非常忙碌的今天。许多工作压力很大，占用大部分时间。如果不用担心赚钱，人们当然希望离开这些疲惫的工作。不工作时，他们可以花更多时间发展爱好、陪伴家人和旅行。这些是人们常因事业而不得不放弃的事情。因此，想逃离令人精疲力竭的职业生活，是面对压力的自然反应。", "另一方面，从不工作不会带来真正幸福。工作不仅是谋生方式，还提供日常规律、社会联系和价值感。没有工作时，人们常感到空虚无聊。而且，解决工作中的问题能带来爱好通常无法提供的成就感。例如，许多中彩票或提前退休的人经常重返兼职岗位或创业。他们这样做不是为了钱，而是为了感到有用，并与社会保持联系。", "总之，虽然大多数人讨厌工作占满所有时间的生活，但他们并不真正希望完全失业。人类需要目标、成就和沟通，这些都与有意义的工作密切相关。因此，若能选择，大多数人更愿意过工作合理、生活平衡的日子，而非完全不工作。"], "kind": "同意与否", "stance": "部分同意逃离过度工作，反对永久不工作。原题有明显文字错误，展示题干已作最小语法修复；不工作不等于什么也不做，正文概念有所扩大。", "structure": [{"title": "引言", "role": "", "points": ["区分逃离疲惫工作与永久无所事事。"]}, {"title": "主体一", "role": "", "points": ["让步：压力和时间被占用 → 不工作能恢复家庭和休闲。"]}, {"title": "主体二", "role": "", "points": ["工作提供规律、联系、价值感", "以重返工作为例，但未提供数据。"]}, {"title": "结论", "role": "", "points": ["转向适量工作的平衡生活", "这是题目二选一之外的折中方案，需要说明。"]}], "readerNotes": [{"p": 1, "c": "vocab", "q": "exhausting", "t": "exhausting adj.", "e": "令人精疲力尽的；exhausted 描述人的疲惫状态。"}, {"p": 2, "c": "vocab", "q": "lottery", "t": "lottery n.", "e": "彩票。"}, {"p": 2, "c": "vocab", "q": "retire", "t": "retire v.", "e": "退休。"}, {"p": 3, "c": "vocab", "q": "jobless", "t": "jobless adj.", "e": "无工作的、失业的。"}, {"p": 0, "c": "syntax", "q": "if people had to choose", "t": "if + 过去式，would + 动词", "e": "假设选择情境，使用虚拟条件形式。"}, {"p": 1, "c": "syntax", "q": "things that people often have to give up", "t": "that 定语从句", "e": "that 指代 things，并作 give up 的宾语。"}, {"p": 3, "c": "syntax", "q": "if given the choice", "t": "省略条件从句", "e": "可展开为 if they were given the choice。"}, {"p": 1, "c": "link", "q": "Without work", "t": "without + 名词", "e": "设定不工作的情境。"}, {"p": 2, "c": "link", "q": "not for money, but to feel useful", "t": "not … but …", "e": "纠正回到工作的动机；两个不同形式的状语形成对照。"}, {"p": 3, "c": "link", "q": "rather than no work at all", "t": "rather than：选择", "e": "适量工作与完全不工作对照。"}, {"p": 0, "c": "expression", "q": "a sense of purpose", "t": "a sense of purpose / value", "e": "目标感／价值感，心理与就业话题表达。"}, {"p": 2, "c": "expression", "q": "make a living", "t": "make a living", "e": "谋生。"}, {"p": 3, "c": "expression", "q": "a balanced life", "t": "a balanced life", "e": "均衡的生活，结论中的替代选择。"}], "sourcePage": 21}, {"id": "essay-21", "title": "广告推销", "question": "Some people say that the main aim of advertising is to improve the sales of products that people do not really need.\nTo what extent do you agree or disagree?", "qzh": "有人认为广告的主要目的是增加人们并不真正需要的产品的销量。你在多大程度上同意或不同意？", "paragraphs": ["People have different views on whether advertising mainly aims to increase the sales of products which people don't actually need. Although advertising can work that way, I believe that the main purpose of advertising is simply to spread information about a product, regardless of whether it's needed or not.", "On one hand, advertising does sometimes aim to improve the sales of products which people don't need. Many advertisements promote luxury products, which by definition are things that aren't necessary for living, even if they may make a person's life more pleasurable. A sports car is a good example of this, as well as luxury handbags, watches, and jewellery. They might increase your social status, but you can definitely live without them. The sales of luxury products depend heavily on advertising because advertisements spread awareness of these items, establishing them as high-class, sophisticated or elegant in the public mind.", "Regardless, I would argue that the main purpose of advertising is to provide consumers with information about products and services, many of which fulfil certain needs of consumers. After all, advertisements for luxury goods are outnumbered by advertisements that spread awareness of products necessary for living in some way. An example is a commercial I caught the other day that advertised car insurance. Not all types of insurance are needed, of course, but car insurance is definitely necessary for drivers. Also, I would not have been able to buy a suitable replacement for my broken phone if not for an advertisement I saw recently. Though phones are expensive, they're essential for functioning in modern society.", "Thus, while some advertisements aim to improve the sales of unnecessary products, I believe that the primary purpose of most advertising is just to inform consumers about various products and services."], "translations": ["人们对广告是否主要旨在增加非必需产品销量看法不一。虽然广告可以这样运作，但我认为它的主要目的只是传播产品信息，不论该产品是否必需。", "一方面，广告有时确实旨在提高非必需产品的销量。许多广告推销奢侈品，按定义，这些并非生活必需品，即使它们可能让生活更愉快。跑车就是一个好例子，奢侈手袋、手表和珠宝也一样。它们或许提高社会地位，但没有它们也完全能生活。奢侈品销售高度依赖广告，因为广告传播这些物品的信息，在公众心中树立其高档、精致或优雅的形象。", "尽管如此，我认为广告的主要目的是给消费者提供产品和服务信息，其中许多满足消费者的需要。毕竟，奢侈品广告的数量少于以某种方式宣传生活所需产品的广告。例如，我前几天看到一则车险广告。当然，并非所有保险都需要，但车险对驾驶者确实必需。另外，若非最近看见一则广告，我便无法为坏手机买到合适替代品。手机虽然昂贵，却是现代社会正常生活的必需品。", "因此，虽然有些广告旨在提高非必需产品的销量，我认为大多数广告的主要目的只是告知消费者各种产品和服务。"], "kind": "同意与否", "stance": "承认部分奢侈品广告，反对概括为主要目的。信息传递也可服务于销售，两者并不互斥。", "structure": [{"title": "引言", "role": "", "points": ["部分承认，主张信息传播是主要目的。"]}, {"title": "主体一", "role": "", "points": ["奢侈品非必需；广告塑造形象以促销量。"]}, {"title": "主体二", "role": "", "points": ["必需品广告、保险和手机例子", "“数量更多”未给依据；地区保险要求亦不同。"]}, {"title": "结论", "role": "", "points": ["回扣部分广告与多数广告的范围区别。"]}], "readerNotes": [{"p": 1, "c": "vocab", "q": "pleasurable", "t": "pleasurable adj.", "e": "令人愉悦的。"}, {"p": 1, "c": "vocab", "q": "sophisticated", "t": "sophisticated adj.", "e": "本文指精致、高级的产品形象；也可表示复杂。"}, {"p": 1, "c": "vocab", "q": "elegant", "t": "elegant adj.", "e": "优雅的、雅致的。"}, {"p": 2, "c": "vocab", "q": "outnumbered", "t": "outnumber v.", "e": "数量超过；be outnumbered by＝数量少于后者。"}, {"p": 2, "c": "vocab", "q": "commercial I caught", "t": "catch v.", "e": "熟词生义：偶然看到、听到。commercial 为广告。"}, {"p": 1, "c": "syntax", "q": "products, which by definition are things that aren't necessary", "t": "定语从句嵌套", "e": "which 修饰 products；that 修饰 things。by definition 是插入的界定短语。"}, {"p": 2, "c": "syntax", "q": "would not have been able to buy", "t": "would have + 过去分词", "e": "描述与过去情况相反的假设结果，配合 if not for an advertisement。"}, {"p": 1, "c": "link", "q": "even if", "t": "即使：让步条件", "e": "即使提升愉悦感，仍不是生存必需品。"}, {"p": 2, "c": "link", "q": "After all", "t": "补充理由", "e": "用“毕竟”支持主要目的的判断，但不能代替证据。"}, {"p": 0, "c": "link", "q": "regardless of whether it's needed or not", "t": "regardless of whether", "e": "不论是否需要；whether 从句作介词 of 的宾语。"}, {"p": 0, "c": "expression", "q": "main purpose", "t": "main aim / main purpose / primary purpose", "e": "主要目的的替换；purpose 与 aim 在本语境近义。"}, {"p": 1, "c": "expression", "q": "social status", "t": "social status", "e": "社会地位。"}, {"p": 1, "c": "expression", "q": "spread awareness", "t": "spread awareness", "e": "提高／传播认知；spread information 更侧重信息内容。"}], "sourcePage": 22}, {"id": "essay-22", "title": "工作闲暇失衡", "question": "Many working people do not have enough free time off work to spend with their families and friends.\nWhy?\nWhat are the effects on family life and society?", "qzh": "许多上班族工作之余没有足够时间陪伴家人朋友。原因是什么？对家庭生活和社会有何影响？", "paragraphs": ["In contemporary society, many working people do not have enough free time to spend with their families and friends. This phenomenon is driven by specific social and professional factors, and it brings negative effects on both family life and society as a whole.", "There are two main reasons why working individuals struggle to find time for their loved ones. First, the competitive job market pushes people to work longer hours to secure their positions or pursue career advancement. Many employees, especially in fields like technology or finance, feel pressured to take on extra tasks or work overtime to meet high performance standards—fearful that falling behind could lead to job loss. Second, the desire for higher income also plays a role. With rising living costs (such as housing, education, and healthcare expenses), many people choose to work more, or even take on second jobs, to improve their family’s financial situation. They prioritize earning more money over leisure time, believing this will provide better security for their families.", "The lack of free time for family and friends has harmful impacts on family life first. When people spend most of their time at work, they miss out on important family moments—like their children’s school events or family gatherings. This can weaken emotional bonds between family members: children may feel neglected by parents who are rarely present, and couples may grow apart due to lack of communication. Over time, this can lead to family conflicts or even breakdowns. In addition，this trend also affects society negatively. If many families face relationship problems, it can increase social instability. For example, children from families with little parental companionship may be more likely to feel lonely or develop behavioral issues, which could lead to problems like dropping out of school or getting involved in crime later.", "In conclusion, the lack of free time among working people is mainly caused by job competition and the need for higher income. It harms family relationships by weakening emotional connections and creates problems for society such as increased instability and pressure on healthcare."], "translations": ["当代社会，许多工作的人没有足够空闲时间陪伴家人朋友。这一现象由特定的社会和职业因素驱动，也给家庭生活和整个社会带来负面影响。", "上班族难以找到时间陪伴亲近的人，主要有两个原因。首先，竞争激烈的就业市场迫使人们工作更长时间，以保住岗位或争取职业晋升。许多员工，尤其科技或金融行业的员工，为达到高绩效标准，感到必须承担额外任务或加班，因为担心落后会导致失业。其次，追求更高收入也发挥作用。住房、教育、医疗等生活成本上涨，许多人选择多工作甚至兼职，以改善家庭经济状况。他们把增加收入放在休闲之前，认为这样能给家庭提供更好保障。", "缺少陪伴家人朋友的闲暇，首先损害家庭生活。把大部分时间用于工作，人们就会错过孩子学校活动、家庭聚会等重要时刻。这会削弱家庭成员的情感联系：孩子可能觉得经常缺席的父母忽视自己，夫妻也会因缺乏交流而疏远。久而久之，可能导致家庭冲突甚至破裂。此外，这一趋势对社会也有负面影响。许多家庭面临关系问题时，社会不稳定可能增加。例如，缺少父母陪伴的孩子更容易感到孤独或出现行为问题，之后可能辍学或卷入犯罪。", "总之，上班族闲暇不足主要由就业竞争和增加收入的需要造成。它削弱情感联系、损害家庭关系，也给社会带来不稳定加剧和医疗压力等问题。"], "kind": "原因＋影响", "stance": "必须分别覆盖家庭和社会影响。结尾出现 healthcare pressure，但正文未展开，不宜在结论新加论点。", "structure": [{"title": "引言", "role": "", "points": ["明确原因与家庭、社会两个影响层面。"]}, {"title": "原因段", "role": "", "points": ["2 点：保住岗位和晋升压力；生活成本与收入需要。"]}, {"title": "影响段", "role": "", "points": ["家庭：缺席、疏远、冲突；社会：儿童孤独和行为问题", "从少陪伴推到犯罪需谨慎限定。"]}, {"title": "结论", "role": "", "points": ["汇总原因与关系损害", "医疗压力是未在正文论证的新信息。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "contemporary", "t": "contemporary adj.", "e": "当代的、现代的。"}, {"p": 1, "c": "vocab", "q": "career advancement", "t": "career advancement", "e": "职业发展、晋升。"}, {"p": 2, "c": "vocab", "q": "neglected", "t": "neglected adj.", "e": "被忽视、未得到应有照顾的。"}, {"p": 2, "c": "vocab", "q": "companionship", "t": "companionship n.", "e": "陪伴、相伴关系。"}, {"p": 2, "c": "vocab", "q": "instability", "t": "instability n.", "e": "不稳定。"}, {"p": 1, "c": "syntax", "q": "There are two main reasons why", "t": "There are … reasons why …", "e": "提前交代有两个原因，让段内 First、Second 对应清楚。"}, {"p": 1, "c": "syntax", "q": "believing this will provide better security", "t": "分词短语说明想法", "e": "believing 的逻辑主语是 they，解释优先赚钱的动机。"}, {"p": 2, "c": "syntax", "q": "parents who are rarely present", "t": "who 定语从句", "e": "限定很少在场陪伴的父母；rarely 避免绝对化。"}, {"p": 1, "c": "link", "q": "With rising living costs", "t": "With + 名词短语", "e": "交代选择增加工作的背景。"}, {"p": 2, "c": "link", "q": "Over time", "t": "时间推进", "e": "表示关系问题逐渐积累。"}, {"p": 2, "c": "link", "q": "In addition", "t": "补充层面", "e": "从家庭影响扩展到社会影响。"}, {"p": 1, "c": "expression", "q": "prioritize earning more money over leisure time", "t": "prioritize A over B", "e": "优先 A 而非 B，体现取舍。"}, {"p": 2, "c": "expression", "q": "grow apart", "t": "grow apart", "e": "关系逐渐疏远。"}, {"p": 2, "c": "expression", "q": "weaken emotional bonds", "t": "weaken emotional bonds", "e": "削弱情感纽带。"}], "sourcePage": 23}, {"id": "essay-23", "title": "再犯罪问题", "question": "Many offenders commit more crimes after serving the first punishment.\nWhy is this happening, and what measures can be taken to tackle this problem?", "qzh": "许多违法者在第一次服刑或受罚后再度犯罪。为什么会这样？可以采取什么措施？", "paragraphs": ["It is true that many offenders continue to commit crimes even after being imprisoned for their wrongdoing. There are several contributing factors for recidivism among criminals and a number of possible solutions that can be implemented to decrease the likelihood of repeat offenders.", "The causes of crimes are complex and manifold. However, the most significant risk factors include poverty, one’s inability to obtain employment, and mental health issues aggravated by a brutal and inhumane criminal justice system. Prisoners who are released often have a considerably difficult time reintegrating into society. Not only are they traumatised by the harsh conditions in prison, they are also permanently labelled as a “criminal” and alienated by other members of society, including their family and friends. Furthermore, having a criminal record makes it significantly more difficult to obtain a job, so the employment options for former prisoners are severely limited. This combination of social stigma and lack of employment options can be devastating for former prisoners, leading them back into a life of crime.", "Several possible measures can be taken to prevent recidivism. First of all, prisons need to shift their focus from punishment to rehabilitation. All too often, incarceration facilities subject prisoners to unthinkable levels of abuse, violence and deprivation. Mistreatment of inmates causes them to have greater levels of anger and anguish, which may lead them to become mentally unstable and seek revenge on society in the future. In addition, prison-based education programs and job training should be implemented to help prisoners develop the occupational skills they’ll need for life after prison. Finally, substance abuse and mental health issues, which are common among prisoners, need to be properly diagnosed and treated to help prisoners reintegrate into society.", "In conclusion, it is clear that many criminals continue to commit crimes despite being punished. However, several measures can be taken to effectively combat this issue."], "translations": ["确实，许多违法者即便因违法行为被监禁，仍继续犯罪。犯罪者再犯有若干促成因素，也有一些可实施的办法来降低再犯的可能性。", "犯罪原因复杂多样。不过，最重要的风险因素包括贫困、无法就业，以及被残酷、不人道的刑事司法制度加重的心理问题。获释囚犯往往很难重新融入社会。他们不仅因恶劣狱中条件受到创伤，还被永久贴上“罪犯”标签，被包括亲友在内的其他社会成员疏远。此外，有犯罪记录会使找工作更加困难，因此前囚犯就业选择严重受限。社会污名与就业机会不足相结合，可能给他们沉重打击，使他们重返犯罪生活。", "可以采取几项措施预防再犯。首先，监狱需要将重心由惩罚转向改造。监禁设施常让囚犯遭受难以想象的虐待、暴力和匮乏。虐待使囚犯产生更强烈的愤怒和痛苦，可能导致心理失衡，并在未来寻求报复社会。此外，应实施狱中教育和职业培训项目，帮助囚犯发展出狱后所需职业技能。最后，应妥善诊断和治疗囚犯中常见的物质滥用及心理健康问题，以帮助他们重新融入社会。", "总之，许多犯罪者受罚后仍继续犯罪，这一点很明显。不过，可以采取若干措施有效应对这一问题。"], "kind": "原因＋措施", "stance": "原因与措施应逐一对应：排斥及失业、狱中创伤、心理与成瘾问题。文中对监狱的概括过强，不代表所有制度。", "structure": [{"title": "引言", "role": "", "points": ["提出再犯现象，预告原因和办法。"]}, {"title": "原因段", "role": "", "points": ["狱中创伤、社会污名、就业受限共同提高再犯风险", "重点应始终落在再犯而非一般犯罪。"]}, {"title": "措施段", "role": "", "points": ["3 项：重改造、教育培训、治疗心理和物质问题", "对应上述风险。"]}, {"title": "结论", "role": "", "points": ["仅笼统重述，可更明确回扣关键原因和办法。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "recidivism", "t": "recidivism n.", "e": "再犯、重复犯罪，犯罪话题专业词。"}, {"p": 1, "c": "vocab", "q": "manifold", "t": "manifold adj.", "e": "多种多样的。"}, {"p": 1, "c": "vocab", "q": "aggravated", "t": "aggravate v.", "e": "使恶化、加重。"}, {"p": 1, "c": "vocab", "q": "alienated", "t": "alienate v.", "e": "疏远、使孤立。"}, {"p": 1, "c": "vocab", "q": "stigma", "t": "stigma n.", "e": "污名、负面社会标签。"}, {"p": 2, "c": "vocab", "q": "rehabilitation", "t": "rehabilitation n.", "e": "本文指教育改造、帮助重返社会。"}, {"p": 2, "c": "vocab", "q": "incarceration", "t": "incarceration n.", "e": "监禁。"}, {"p": 2, "c": "vocab", "q": "anguish", "t": "anguish n.", "e": "剧烈痛苦。"}, {"p": 1, "c": "syntax", "q": "Not only are they traumatised", "t": "Not only 前置倒装", "e": "are 提到 they 前面；第二分句 they are also … 不倒装。"}, {"p": 1, "c": "syntax", "q": "makes it significantly more difficult to obtain a job", "t": "make it + 比较级 + to do", "e": "it 是形式宾语，不定式说明找工作的困难。"}, {"p": 2, "c": "syntax", "q": "need to be properly diagnosed and treated", "t": "need to be + 过去分词", "e": "需要被诊断并治疗，两个分词并列。"}, {"p": 1, "c": "link", "q": "Furthermore", "t": "递进", "e": "由被孤立补充就业受限。"}, {"p": 2, "c": "link", "q": "from punishment to rehabilitation", "t": "from … to …", "e": "表示监狱工作重心的转变。"}, {"p": 2, "c": "link", "q": "Finally", "t": "最后一项", "e": "标示第三个措施：健康与物质问题治疗。"}, {"p": 1, "c": "expression", "q": "reintegrating into society", "t": "reintegrate into society", "e": "重新融入社会。"}, {"p": 2, "c": "expression", "q": "occupational skills", "t": "occupational skills", "e": "职业技能。"}, {"p": 0, "c": "expression", "q": "repeat offenders", "t": "offenders / prisoners", "e": "offender 是违法者；prisoner 是囚犯，身份范围不同，不能无条件互换。"}], "sourcePage": 24}, {"id": "essay-24", "title": "了解人们生活的途径", "question": "In order to learn the way other people in the world live, it is better to look at film and video records than written documents.\nTo what extent do you agree or disagree?", "qzh": "为了了解世界其他人的生活方式，看电影和影像记录比读书面资料更好。你在多大程度上同意或不同意？", "paragraphs": ["To gain a comprehensive understanding of how people live around the world, I believe that written documents are more effective than visual media or moving images. Although visual media can provide an engaging glimpse into different cultures, they often lack the depth and reliability found in written records.", "One primary reason written documents are more effective is their higher level of accuracy. Moving images and visual media, including documentaries, are often influenced by commercial and artistic considerations. Directors and producers may choose to dramatize events, simplify complex realities, or focus on stereotypes to appeal to audiences and ensure financial success. These choices can result in a skewed representation of how people truly live. In contrast, written documents such as reports, articles, and academic studies are usually created with a strong commitment to accuracy and factual information. Writers, journalists, and researchers aim to provide a truthful account of events and social practices, making written sources more reliable for understanding different cultures.", "Furthermore, written records offer a greater level of detail and context that moving images and visual media cannot match. For example, academic studies, ethnography, and research papers provide thorough analyses of social, economic, and cultural dynamics, while personal memoirs and travelogues can offer intimate perspectives on everyday life that are rarely captured in visual media. Moving images and visual media, due to time limitations and the need to maintain viewer interest, often condense or omit many intricate aspects of life to focus on the most visually compelling scenes. This compression can lead to a superficial understanding, missing the subtler aspects of how people live, work, and interact within their cultural contexts.", "In conclusion, I maintain that written documents are a more effective tool than moving images and visual media for understanding the way people live around the world. They offer greater accuracy, depth, and context, while visual media often fall short due to their tendency to prioritize entertainment over factual representation. For a more complete and nuanced understanding of different cultures, written records are indispensable."], "translations": ["为了全面了解世界各地人们如何生活，我认为书面资料比视觉媒体或动态影像更有效。虽然视觉媒体可以生动地展示不同文化的一角，但往往缺乏书面记录具有的深度和可靠性。", "书面资料更有效的一个主要原因，是准确性更高。包括纪录片在内的动态影像和视觉媒体，常受到商业和艺术考虑影响。导演和制作人可能将事件戏剧化、简化复杂现实，或突出刻板印象，以吸引观众、确保商业成功。这些选择可能导致对真实生活的歪曲呈现。相比之下，报告、文章和学术研究等书面资料，通常十分重视准确性和事实。作者、记者及研究者力求如实记录事件与社会习俗，使书面来源在理解不同文化方面更可靠。", "此外，书面记录提供的细节和背景深度，动态影像和视觉媒体难以匹敌。例如，学术研究、民族志及论文深入分析社会、经济和文化动态，而个人回忆录及游记能提供关于日常生活的贴近个人的视角，这在影像中很少被捕捉。动态影像和视觉媒体因时间限制和保持观众兴趣的需要，常压缩或省略生活中许多复杂细节，聚焦视觉上最吸引人的场面。这种压缩可能导致浅层理解，遗漏人们如何在文化背景下生活、工作和互动的更微妙方面。", "总之，我坚持认为，理解世界各地人的生活方式时，书面资料比动态影像和视觉媒体更有效。它们提供更高准确性、深度和背景，而视觉媒体因倾向优先娱乐而非事实呈现，往往有所不足。要更完整、更细致地理解不同文化，书面记录不可或缺。"], "kind": "同意与否", "stance": "反对题目比较，主张书面资料更好。文章对书面准确性、影像片面性的概括较绝对，应考虑来源质量而非只看媒介。", "structure": [{"title": "引言", "role": "", "points": ["直接提出相反立场，预告可靠性和深度。"]}, {"title": "主体一", "role": "", "points": ["影像商业艺术取舍 → 可能歪曲；书面研究重事实 → 可靠", "两种媒介对照。"]}, {"title": "主体二", "role": "", "points": ["学术与个人记录提供背景；影像时间限制导致压缩", "围绕深度展开。"]}, {"title": "结论", "role": "", "points": ["回扣准确性、深度、背景三方面。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "comprehensive", "t": "comprehensive adj.", "e": "全面的、综合的。"}, {"p": 1, "c": "vocab", "q": "stereotypes", "t": "stereotypes n.", "e": "刻板印象。"}, {"p": 1, "c": "vocab", "q": "skewed", "t": "skewed adj.", "e": "偏颇的、歪曲的。"}, {"p": 2, "c": "vocab", "q": "ethnography", "t": "ethnography n.", "e": "民族志，对群体文化生活的研究记录。"}, {"p": 2, "c": "vocab", "q": "memoirs and travelogues", "t": "memoirs / travelogues", "e": "回忆录／游记。"}, {"p": 2, "c": "vocab", "q": "condense or omit", "t": "condense / omit", "e": "压缩／省略。"}, {"p": 2, "c": "vocab", "q": "intricate", "t": "intricate adj.", "e": "复杂精细的。"}, {"p": 3, "c": "vocab", "q": "nuanced", "t": "nuanced adj.", "e": "细致、有层次、考虑细微差别的。"}, {"p": 0, "c": "syntax", "q": "the depth and reliability found in written records", "t": "过去分词修饰", "e": "found … 修饰 depth and reliability，表示书面记录中具备的品质。"}, {"p": 2, "c": "syntax", "q": "detail and context that moving images and visual media cannot match", "t": "that 定语从句", "e": "that 作 match 的宾语，修饰 detail and context。"}, {"p": 2, "c": "syntax", "q": "missing the subtler aspects", "t": "分词结果状语", "e": "压缩内容导致遗漏细节，missing 补充结果。"}, {"p": 1, "c": "link", "q": "In contrast", "t": "两种媒介对照", "e": "从影像取舍转到书面准确性。"}, {"p": 2, "c": "link", "q": "while personal memoirs", "t": "while：对照补充", "e": "学术研究与个人回忆录各提供不同角度。"}, {"p": 2, "c": "link", "q": "due to time limitations", "t": "due to + 名词", "e": "解释影像为什么压缩内容。"}, {"p": 1, "c": "expression", "q": "a truthful account", "t": "a truthful account of", "e": "对……的真实记录；account 在此不是账户。"}, {"p": 3, "c": "expression", "q": "fall short", "t": "fall short", "e": "未达到期待、存在不足。"}, {"p": 3, "c": "expression", "q": "prioritize entertainment over factual representation", "t": "prioritize A over B", "e": "把娱乐优先于事实呈现，表达价值取舍。"}], "sourcePage": 25}, {"id": "essay-25", "title": "动植物种类变少", "question": "Many species of animals and plants are in danger of becoming extinct.\nWhat are the causes of this problem?\nWhat can be done to prevent it from happening?", "qzh": "许多动植物物种面临灭绝危险。原因是什么？可以做什么来防止它发生？", "paragraphs": ["In recent decades, a growing number of animal and plant species have been pushed to the brink of extinction. This issue is largely the result of human activities, but there are several practical measures that can be taken to address it.", "One major cause of species loss is the destruction of natural habitats. As cities expand and agricultural land increases, forests, wetlands and grasslands are cleared on a massive scale. Many animals lose their shelters and food sources, while numerous plant species disappear because the conditions they need to survive no longer exist. Another key factor is pollution. Chemicals from factories, plastic waste and contaminated water have damaged ecosystems and poisoned wildlife. For example, many marine species have died after ingesting plastic or becoming trapped in fishing nets. In addition, climate change has altered temperatures and rainfall patterns, disrupting migration routes and breeding cycles for many species. These environmental changes happen so quickly that most animals and plants cannot adapt in time.", "Despite the seriousness of this problem, several solutions could help protect endangered species. First, governments should strengthen environmental regulations and enforce strict penalties for illegal activities such as logging, poaching and overfishing. Protecting natural habitats through national parks and conservation zones is an effective way to give species a safe place to live and reproduce. Second, public awareness campaigns can encourage people to reduce pollution and adopt more sustainable lifestyles. When individuals understand how their daily habits affect wildlife, they are more likely to recycle, reduce waste and support conservation efforts. Finally, scientific research and breeding programmes can play an important role. By studying endangered species and breeding them in controlled environments, scientists can help increase their populations before releasing them back into the wild.", "In conclusion, the extinction of many species is mainly caused by habitat loss, pollution and climate change. However, with stronger laws, better public awareness and scientific intervention, it is possible to slow down or even reverse this trend. Protecting biodiversity is essential not only for wildlife but also for the health of the planet and future generations."], "translations": ["近几十年，越来越多动植物物种被推到灭绝边缘。这个问题主要由人类活动造成，但可以采取若干切实措施应对。", "物种减少的一个主要原因，是自然栖息地被破坏。随着城市扩展、农业土地增加，森林、湿地和草原遭到大规模清除。许多动物失去栖身地与食物来源，大量植物也因生存条件消失而灭绝。另一个关键因素是污染。工厂化学物、塑料废物和受污染的水破坏生态系统，使野生动物中毒。例如，许多海洋物种因摄入塑料或被渔网缠住而死亡。此外，气候变化改变温度和降雨模式，扰乱许多物种的迁徙路线和繁殖周期。这些环境变化如此迅速，以至于大多数动植物无法及时适应。", "尽管问题严重，仍有几项解决办法能帮助保护濒危物种。首先，政府应加强环境法规，对非法砍伐、偷猎和过度捕捞等行为严格处罚。通过国家公园和保护区保护自然栖息地，能有效为物种提供安全生活和繁殖场所。其次，公众意识宣传能够鼓励减少污染、采用更可持续的生活方式。当个人理解日常习惯怎样影响野生生物时，更可能回收利用、减少浪费并支持保护行动。最后，科研和繁育项目能发挥重要作用。科学家研究濒危物种并在受控环境下繁育，可帮助扩大种群，再将其放归野外。", "总之，许多物种灭绝主要由栖息地丧失、污染和气候变化造成。不过，通过更严格法律、更强公众意识和科学干预，可以减缓甚至逆转这一趋势。保护生物多样性不仅对野生生物重要，也关系到地球及后代的健康。"], "kind": "原因＋措施", "stance": "三类原因与三组措施。应补足针对气候变化的直接措施，使原因与办法对应更紧密。", "structure": [{"title": "引言", "role": "", "points": ["指出人类活动为主因，预告可采取措施。"]}, {"title": "原因段", "role": "", "points": ["3 点：栖息地破坏；污染；气候变化", "逐项说明生存或繁殖机制。"]}, {"title": "措施段", "role": "", "points": ["3 组：法规与保护区；公众行为；科研繁育", "以行动主体区分。"]}, {"title": "结论", "role": "", "points": ["汇总原因和措施，强调生物多样性价值。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "the brink of extinction", "t": "brink / extinction", "e": "边缘／灭绝，be on the brink of extinction＝濒临灭绝。"}, {"p": 1, "c": "vocab", "q": "habitats", "t": "habitats n.", "e": "栖息地。"}, {"p": 1, "c": "vocab", "q": "contaminated", "t": "contaminated adj.", "e": "受到污染的。"}, {"p": 1, "c": "vocab", "q": "ingesting", "t": "ingest v.", "e": "摄入、吞食。"}, {"p": 1, "c": "vocab", "q": "migration", "t": "migration n.", "e": "迁徙。"}, {"p": 2, "c": "vocab", "q": "poaching", "t": "poaching n.", "e": "偷猎、非法捕猎。"}, {"p": 2, "c": "vocab", "q": "conservation", "t": "conservation n.", "e": "保护、保育。"}, {"p": 3, "c": "vocab", "q": "biodiversity", "t": "biodiversity n.", "e": "生物多样性。"}, {"p": 0, "c": "syntax", "q": "have been pushed to", "t": "have been + 过去分词", "e": "现在完成时被动，强调目前已形成的濒危状态。"}, {"p": 1, "c": "syntax", "q": "so quickly that", "t": "so + 副词 + that", "e": "变化如此迅速，以至于来不及适应；结果从句。"}, {"p": 2, "c": "syntax", "q": "Protecting natural habitats through national parks and conservation zones is", "t": "动名词短语作主语", "e": "整个 Protecting … zones 作主语，谓语用单数 is。"}, {"p": 1, "c": "link", "q": "As cities expand", "t": "As：伴随变化", "e": "随着城市扩展，引出土地被清理。"}, {"p": 1, "c": "link", "q": "while numerous plant species", "t": "while：并列对照", "e": "分别说明动物与植物受影响的方式。"}, {"p": 2, "c": "link", "q": "Despite the seriousness", "t": "Despite：让步", "e": "问题虽严重，但仍可采取行动。"}, {"p": 2, "c": "expression", "q": "enforce strict penalties", "t": "enforce penalties", "e": "严格执行惩罚规定；enforce 强调执行而非制定。"}, {"p": 2, "c": "expression", "q": "adopt more sustainable lifestyles", "t": "adopt lifestyles", "e": "采用更可持续的生活方式。"}, {"p": 3, "c": "expression", "q": "slow down or even reverse this trend", "t": "slow down / reverse a trend", "e": "减缓甚至扭转趋势，程度逐步增强。"}], "sourcePage": 26}]</script><script>'use strict';

const MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></svg>';
function status(text){$('#status').textContent=text;$('#status').hidden=!text;}
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').innerHTML=dark?SUN:MOON;$('#theme').setAttribute('aria-label',dark?'切换浅色模式':'切换暗色模式');$('#theme').title=dark?'切换浅色模式':'切换暗色模式';try{localStorage.setItem('ielts-theme',dark?'dark':'light');}catch(e){}}
let theme;try{theme=localStorage.getItem('ielts-theme');}catch(e){}setTheme(theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
function key(id){return 'ielts-'+id+'-personal-notes-v1';}
function valid(n,essay){return n&&Number.isInteger(n.p)&&typeof n.q==='string'&&n.q.length>0&&typeof n.e==='string'&&Object.hasOwn(labels,n.c)&&Number.isInteger(n.start)&&n.start>=0&&essay.paragraphs[n.p]?.slice(n.start,n.start+n.q.length)===n.q;}
function load(essay){try{const value=JSON.parse(localStorage.getItem(key(essay.id))||'[]');return Array.isArray(value)?value.filter(n=>valid(n,essay)):[];}catch(e){status('无法读取笔记存储。');return [];}}
function save(next){try{localStorage.setItem(key(current.id),JSON.stringify(next));personal=next;return true;}catch(e){status('笔记保存失败，请先复制内容或导出备份。');return false;}}
function guard(){if(!editor)return true;editor.querySelector('.save-state').textContent='请先保存或取消当前笔记';return false;}
function dismiss(){editor?.remove();editor=null;pending=null;}
function spans(text,p){const r=notes.map((n,id)=>({...n,id,start:n.start??text.indexOf(n.q)})).filter(n=>n.p===p&&(n.c==='vocab'||filter==='all'||filter===n.c));const bounds=[...new Set([0,text.length,...r.flatMap(n=>[n.start,n.start+n.q.length])])].sort((a,b)=>a-b);let html='';for(let i=0;i<bounds.length-1;i++){const a=bounds[i],b=bounds[i+1],group=r.filter(n=>n.start<=a&&n.start+n.q.length>=b);const str=esc(text.slice(a,b));if(!group.length){html+=str;continue;}const n=group.find(n=>n.c===filter)||group.find(n=>n.c==='vocab')||group[0];html+=`<span tabindex="0" role="button" class="annotation ${n.c}" data-ids="${group.map(n=>n.id).join(',')}" title="${group.map(n=>labels[n.c]).join(' / ')}">${str}</span>`;}return html;}
function card(n,id){const own=Boolean(n.personal);return `<div class="note ${n.c} ${own?'personal-note':''}" id="n${id}" data-id="${id}" data-category="${n.c}" ${n.c==='vocab'&&!opened.has(id)?'hidden':''} tabindex="0" role="button">${own?`<button class="personal-delete" data-delete="${id}" aria-label="删除笔记：${esc(n.q)}">删除</button>`:''}<span class="type">${labels[n.c]}</span><strong>${esc(own?n.q:n.t)}</strong>${!own&&n.t!==n.q?`<div class="anchor">${esc(n.q)}</div>`:''}<p>${esc(n.e)}</p></div>`;}
function structural(i){const s=current.structure[i];return `<div class="note structure" data-category="structure"><span class="type">结构</span><strong>${esc(s.title)}</strong>${s.role?`<p>${esc(s.role)}</p>`:''}<ul>${s.points.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>`;}
function overview(){return `<div class="note structure" data-category="structure"><span class="type">题型</span><strong>${esc(current.kind)}</strong><p>${esc(current.stance)}</p></div>`;}
function highlight(ids){$$('.selected').forEach(e=>e.classList.remove('selected'));ids.forEach(id=>$('#n'+id)?.classList.add('selected'));$$('[data-ids]').forEach(e=>{if(e.dataset.ids.split(',').map(Number).some(i=>ids.includes(i)))e.classList.add('selected');});}
function render(){notes=[...current.readerNotes,...personal.map((n,i)=>({...n,t:n.q,personal:true,personalIndex:i}))];$('#question').innerHTML=current.question.split('\n').map(esc).join('<br>');$('#question-translation').textContent=current.qzh;
$('#content').innerHTML=current.paragraphs.map((text,p)=>`<section class="row body-row"><aside class="left">${notes.map((n,id)=>n.p===p&&n.c==='vocab'?card(n,id):'').join('')}</aside><article class="center"><div class="para-heading">${p+1}</div><p class="original" id="p${p}">${spans(text,p)}</p><p class="translation trans" ${showTranslation?'':'hidden'}>${esc(current.translations[p])}</p></article><aside class="right">${p===0?overview():''}${structural(p)}${notes.map((n,id)=>n.p===p&&n.c!=='vocab'?card(n,id):'').join('')}</aside></section>`).join('');
$$('.right [data-category]').forEach(n=>n.hidden=filter!=='all'&&filter!==n.dataset.category);$$('.trans').forEach(n=>n.hidden=!showTranslation);
$$('[data-ids]').forEach(s=>{const ids=s.dataset.ids.split(',').map(Number);const vs=ids.filter(i=>notes[i].c==='vocab');if(vs.length)s.setAttribute('aria-expanded',String(vs.some(i=>opened.has(i))));s.onclick=()=>{if(editor)return;const close=vs.length&&vs.every(i=>opened.has(i));vs.forEach(i=>{if(close)opened.delete(i);else opened.add(i);$('#n'+i).hidden=Boolean(close);});highlight(ids.filter(i=>!close||!vs.includes(i)));syncExpanded();};s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();s.click();}};});
$$('[data-id]').forEach(n=>{n.onclick=e=>{if(e.target.closest('[data-delete]')||editor)return;const id=Number(n.dataset.id);if(notes[id].c==='vocab'){opened.delete(id);n.hidden=true;syncExpanded();highlight([]);}else{highlight([id]);const anchor=$$('[data-ids]').find(s=>s.dataset.ids.split(',').map(Number).includes(id));if(anchor)anchor.scrollIntoView({block:'center',behavior:'smooth'});}};n.onkeydown=e=>{if(e.target!==n)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click();}};});
$$('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!guard())return;const n=notes[Number(b.dataset.delete)];const next=personal.filter((_,i)=>i!==n.personalIndex);if(save(next)){opened=new Set([...opened].filter(id=>id<current.readerNotes.length));render();}});
}
function syncExpanded(){$$('[data-ids]').forEach(s=>{const ids=s.dataset.ids.split(',').map(Number).filter(i=>notes[i].c==='vocab');if(ids.length)s.setAttribute('aria-expanded',String(ids.some(i=>opened.has(i))));});}
function selectEssay(id,scroll=true){if(!guard())return false;current=ESSAYS.find(e=>e.id===id)||ESSAYS[0];opened.clear();personal=load(current);document.title=current.title+' · hyggeZ';$$('[data-essay]').forEach(b=>{const active=b.dataset.essay===current.id;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false');});history.replaceState(null,'','#'+current.id);render();if(scroll)window.scrollTo({top:0});return true;}
$('#essay-tabs').innerHTML=ESSAYS.map((e,i)=>`<button data-essay="${e.id}" title="${esc(e.title)}"><span class="tab-number">${i+1}</span><span class="tab-name">${esc(e.title)}</span></button>`).join('');
function closePicker(){ $('#essay-picker').hidden=true;$('#essay-picker-toggle').setAttribute('aria-expanded','false'); }
function revealEssay(id,advance=false){requestAnimationFrame(()=>{const track=$('#essay-tabs'),button=track.querySelector('[data-essay="'+id+'"]');if(!button)return;const left=button.getBoundingClientRect().left-track.getBoundingClientRect().left+track.scrollLeft,right=left+button.offsetWidth;let target=track.scrollLeft;if(advance||right>target+track.clientWidth-45)target=left-track.clientWidth*.35;else if(left<target)target=left-16;target=Math.max(0,Math.min(target,track.scrollWidth-track.clientWidth));if(track.scrollTo)track.scrollTo({left:target,behavior:'smooth'});else track.scrollLeft=target;});}
$$('[data-essay]').forEach(b=>b.onclick=()=>{const track=$('#essay-tabs');const nearEnd=b.getBoundingClientRect().right>track.getBoundingClientRect().left+track.clientWidth*.75;if(selectEssay(b.dataset.essay)){closePicker();revealEssay(b.dataset.essay,nearEnd);}});
$('#essay-picker').innerHTML=ESSAYS.map((e,i)=>'<button data-pick="'+e.id+'">'+(i+1)+'. '+esc(e.title)+'</button>').join('');
$('#essay-picker-toggle').onclick=()=>{const open=$('#essay-picker').hidden;$('#essay-picker').hidden=!open;$('#essay-picker-toggle').setAttribute('aria-expanded',String(open));if(open){$$('[data-pick]').forEach(b=>b.setAttribute('aria-current',b.dataset.pick===current.id?'page':'false'));$('#essay-picker').querySelector('[aria-current="page"]')?.focus();}};
$$('[data-pick]').forEach(b=>b.onclick=()=>{if(selectEssay(b.dataset.pick)){closePicker();revealEssay(b.dataset.pick,true);$('#essay-picker-toggle').focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('.essay-navigation'))closePicker();});
$('#essay-picker').addEventListener('keydown',e=>{const items=$$('[data-pick]');let i=items.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}if(e.key==='Escape'){closePicker();$('#essay-picker-toggle').focus();}});
$('#essay-picker-toggle').addEventListener('keydown',e=>{if(e.key==='Escape')closePicker();});
window.addEventListener('resize',()=>revealEssay(current.id));

$$('[data-filter]').forEach(b=>b.onclick=()=>{if(!guard())return;filter=b.dataset.filter;$$('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});render();});
$('#translate').onclick=()=>{if(!guard())return;showTranslation=!showTranslation;$('#translate').textContent=showTranslation?'隐藏译文':'显示译文';$('#translate').setAttribute('aria-pressed',String(showTranslation));$$('.trans').forEach(n=>n.hidden=!showTranslation);};
function addEditor(range,p,start,q){pending={p,start,q};editor=document.createElement('span');editor.className='note-editor';editor.setAttribute('role','group');editor.setAttribute('aria-label','添加笔记');editor.innerHTML='<select aria-label="笔记标签"><option value="">选择标签</option>'+Object.entries(labels).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')+'</select><textarea aria-label="笔记内容" placeholder="写笔记…"></textarea><button class="save-note">保存</button><button class="cancel-note">取消</button><span class="save-state" role="status"></span>';const insert=range.cloneRange();insert.collapse(false);insert.insertNode(editor);editor.addEventListener('click',e=>e.stopPropagation());editor.addEventListener('keydown',e=>e.stopPropagation());editor.querySelector('.cancel-note').onclick=()=>{dismiss();render();};editor.querySelector('.save-note').onclick=()=>{const c=editor.querySelector('select').value,e=editor.querySelector('textarea').value;if(!c){editor.querySelector('.save-state').textContent='请选择标签';return;}if(save([...personal,{...pending,c,e}])){const id=current.readerNotes.length+personal.length-1;if(c==='vocab')opened.add(id);dismiss();render();highlight([id]);}else editor.querySelector('.save-state').textContent='未保存，请先复制内容。';};getSelection().removeAllRanges();editor.querySelector('select').focus();}
function captureSelection(e){if(editor||e.target.closest('button,select,textarea,.note-editor,.note'))return;const selection=getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0),a=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,b=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement;const para=a.closest('.original');if(!para||b.closest('.original')!==para)return;const q=range.toString();if(!q.trim())return;const prefix=range.cloneRange();prefix.selectNodeContents(para);prefix.setEnd(range.startContainer,range.startOffset);const start=prefix.toString().length,p=Number(para.id.slice(1));if(current.paragraphs[p].slice(start,start+q.length)!==q)return;addEditor(range,p,start,q);}
document.addEventListener('mouseup',captureSelection);document.addEventListener('keyup',e=>{if(e.key==='Shift')captureSelection(e);});
document.addEventListener('click',e=>{if(editor&&e.target.closest('.original')&&!e.target.closest('.note-editor')){e.stopImmediatePropagation();e.preventDefault();}},true);
window.addEventListener('beforeunload',e=>{if(editor&&editor.querySelector('textarea').value){e.preventDefault();e.returnValue='';}});
$('#export-notes').onclick=()=>{if(!guard())return;const exportData={format:'ielts-notes',version:1,essays:Object.fromEntries(ESSAYS.map(e=>[e.id,load(e)]))};const url=URL.createObjectURL(new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ielts-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#import-notes').onchange=async e=>{if(!guard()){e.target.value='';return;}const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('文件超过 5 MB');const data=JSON.parse(await file.text());if(data.format!=='ielts-notes'||data.version!==1||!data.essays||typeof data.essays!=='object')throw Error('笔记格式不正确');let added=0;for(const [id,items] of Object.entries(data.essays)){const essay=ESSAYS.find(x=>x.id===id);if(!essay||!Array.isArray(items)||!items.every(n=>valid(n,essay)))throw Error('笔记与文章不匹配');}const changes=[];for(const essay of ESSAYS){const existing=load(essay);const seen=new Set(existing.map(n=>JSON.stringify([n.p,n.start,n.q,n.c,n.e])));const next=[...existing];for(const n of data.essays[essay.id]||[]){const sig=JSON.stringify([n.p,n.start,n.q,n.c,n.e]);if(!seen.has(sig)){next.push(n);seen.add(sig);added++;}}changes.push([key(essay.id),JSON.stringify(next)]);}const previous=changes.map(([k])=>[k,localStorage.getItem(k)]);try{changes.forEach(([k,v])=>localStorage.setItem(k,v));}catch(err){previous.forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));throw err;}personal=load(current);render();status('已导入 '+added+' 条笔记。');}catch(err){status('导入失败：'+err.message);}e.target.value='';};
selectEssay(location.hash.slice(1),false);

revealEssay(current.id);
</script></body></html>
