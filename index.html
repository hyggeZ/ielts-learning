y caregivers and moral compasses for their offspring. If children break the law, it sometimes reflects a severe lack of proper parental supervision or guidance. For instance, if parents turn a blind eye to their children's early misbehaviors, these minor issues can eventually escalate into serious offenses. Therefore, holding parents partially accountable can force them to take their parenting responsibilities more seriously. By being more involved, parents can identify early signs of trouble and nip it in the bud before their children commit actual crimes.", "On the other hand, it is unreasonable to place all the blame entirely on parents. As children grow up, they are heavily influenced by the outside world, including peer pressure, social media, and school environments. Even with the best upbringing, teenagers can be led astray by bad company or harmful online content. Furthermore, older children and adolescents are capable of independent thought and must learn to take responsibility for their own actions. Punishing parents for crimes they did not commit or endorse would be unjust and could severely damage the family dynamic.", "In conclusion, while parents should face some form of accountability if gross negligence in their parenting is proven, they should not be automatically punished for every crime committed by their children. A fair justice system should evaluate each case individually, considering both the parents' involvement and the external influences on the child."], "translations": ["父母是否应为孩子的犯罪行为承担法律后果，极具争议。虽然我同意父母对孩子养育至关重要，应在一定程度上负责，但我也认为普遍惩罚他们并不公平，因为其他外部因素也会导致青少年违法犯罪。", "一方面，父母是子女的主要照护者和道德引导者。孩子违法有时反映出父母严重缺乏监督或引导。例如，如果父母对孩子早期的不良行为视而不见，小问题最终可能升级为严重罪行。因此，让父母承担部分责任能够促使他们更认真对待养育责任。父母更多参与，就能及早发现问题迹象，在孩子真正犯罪前将问题消除在萌芽状态。", "另一方面，把一切完全归咎于父母并不合理。孩子成长时会深受外部世界影响，包括同伴压力、社交媒体和学校环境。即使得到最好的养育，青少年也可能被不良同伴或有害网络内容引入歧途。此外，年长儿童和青少年具有独立思考能力，必须学会为自己的行为负责。因他们没有实施、也没有认可的犯罪而惩罚父母，会不公平，并可能严重破坏家庭关系。", "总之，如果证实养育中存在严重疏忽，父母应承担某种责任；但不应因孩子犯下的每一项罪行而自动受罚。公正的司法制度应逐案评估，同时考虑父母的参与程度和孩子受到的外界影响。"], "kind": "同意与否", "stance": "条件立场：严重疏忽被证实时追责，反对一概惩罚。", "structure": [{"title": "引言", "role": "", "points": ["承认父母责任，同时指出外部因素。"]}, {"title": "主体一", "role": "", "points": ["监督失职可能促成犯罪；追责促使尽责", "预防机制解释。"]}, {"title": "主体二", "role": "", "points": ["2 点限制：外部影响；孩子独立责任", "补充不当惩罚的家庭后果。"]}, {"title": "结论", "role": "", "points": ["明确追责条件，逐案判断。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "whether parents should bear legal consequences for their children's criminal actions", "t": "whether 从句作介词宾语", "e": "作 regarding 的宾语，明确争论的具体法律责任内容。"}, {"p": 0, "c": "expression", "q": "bear legal consequences", "t": "bear consequences", "e": "承担法律后果；bear 在此为动词承担。"}, {"p": 0, "c": "vocab", "q": "controversial", "t": "controversial adj.", "e": "有争议的，表明存在明显分歧。"}, {"p": 0, "c": "link", "q": "While I agree", "t": "While：让步", "e": "承认父母的教养责任，但不接受普遍惩罚。"}, {"p": 0, "c": "vocab", "q": "upbringing", "t": "upbringing n.", "e": "养育、成长教育。"}, {"p": 0, "c": "syntax", "q": "should be held accountable", "t": "hold sb accountable → 被动", "e": "应被追责；accountable 是宾语补足语在被动中的保留形式。"}, {"p": 0, "c": "vocab", "q": "accountable", "t": "accountable adj.", "e": "需负责、可被追责的，常用 accountable for/to。"}, {"p": 0, "c": "link", "q": "to some degree", "t": "程度限定", "e": "表示部分责任，不是一概全责。"}, {"p": 0, "c": "link", "q": "as other external factors contribute to juvenile delinquency", "t": "as：原因", "e": "解释为何不能将所有责任一概归给父母。"}, {"p": 0, "c": "vocab", "q": "juvenile delinquency", "t": "juvenile delinquency", "e": "青少年违法犯罪。"}, {"p": 1, "c": "vocab", "q": "caregivers", "t": "caregiver n.", "e": "照护者，提供日常照料的人。"}, {"p": 1, "c": "vocab", "q": "offspring", "t": "offspring n.", "e": "子女、后代；单复数同形。"}, {"p": 1, "c": "syntax", "q": "If children break the law, it sometimes reflects", "t": "If 条件＋程度限定", "e": "以违法为条件讨论教养问题；sometimes 表示并非每一次都如此。"}, {"p": 1, "c": "vocab", "q": "parental supervision", "t": "parental supervision", "e": "父母监督，parental 为形容词。"}, {"p": 1, "c": "syntax", "q": "if parents turn a blind eye to their children's early misbehaviors", "t": "if 条件从句", "e": "具体设定父母忽视早期问题的情境，让责任论证有条件而非一概而论。"}, {"p": 1, "c": "expression", "q": "turn a blind eye to", "t": "turn a blind eye to", "e": "对……视而不见，后接名词。"}, {"p": 1, "c": "vocab", "q": "misbehaviors", "t": "misbehavior n.", "e": "不良行为、不守规矩的举动；通常常作不可数总称。"}, {"p": 1, "c": "vocab", "q": "escalate", "t": "escalate v.", "e": "升级、恶化。"}, {"p": 1, "c": "vocab", "q": "offenses", "t": "offense n.", "e": "违法或犯罪行为；在此不是冒犯他人的言语。"}, {"p": 1, "c": "link", "q": "Therefore", "t": "由机制导出措施", "e": "从忽视早期问题可能导致升级，推出部分追责促使尽责。"}, {"p": 1, "c": "syntax", "q": "holding parents partially accountable can force them to take their parenting responsibilities more seriously", "t": "动名词主语＋force sb to do", "e": "holding … accountable 作主语；partially 限定责任程度，force 后用 to take。"}, {"p": 1, "c": "expression", "q": "take their parenting responsibilities more seriously", "t": "take sth seriously", "e": "认真对待某事；more seriously 是副词比较级。"}, {"p": 1, "c": "syntax", "q": "By being more involved, parents can identify early signs of trouble", "t": "By + being + 形容词", "e": "being more involved 表示更积极参与，逻辑主语是 parents。"}, {"p": 1, "c": "expression", "q": "nip it in the bud", "t": "nip … in the bud", "e": "及早阻止问题恶化；it 指早期问题。"}, {"p": 1, "c": "link", "q": "before their children commit actual crimes", "t": "before 时间从句", "e": "指出介入应发生在真正犯罪之前，强调预防价值。"}, {"p": 2, "c": "syntax", "q": "it is unreasonable to place all the blame entirely on parents", "t": "It is + adj. + to do", "e": "真正主语为 to place …；all 与 entirely 意义重复，可保留一个。"}, {"p": 2, "c": "link", "q": "As children grow up", "t": "As：随时间发展", "e": "随着孩子长大，其社会接触和自主性增加。"}, {"p": 2, "c": "syntax", "q": "they are heavily influenced by the outside world", "t": "被动＋程度副词", "e": "孩子受到外部影响，heavily 强调程度，by 指影响来源。"}, {"p": 2, "c": "link", "q": "Even with the best upbringing", "t": "Even with：让步", "e": "即使养育良好，也有外部风险。"}, {"p": 2, "c": "syntax", "q": "teenagers can be led astray by bad company or harmful online content", "t": "情态被动", "e": "can be led astray 指可能被引入歧途，by 后有两个来源。"}, {"p": 2, "c": "vocab", "q": "astray", "t": "astray adv.", "e": "偏离正道，lead sb astray＝引人入歧途。"}, {"p": 2, "c": "vocab", "q": "bad company", "t": "bad company", "e": "熟词生义：不良同伴，不是经营不善的公司。"}, {"p": 2, "c": "link", "q": "Furthermore", "t": "新增责任主体", "e": "从外界影响进一步转向孩子自己的独立责任。"}, {"p": 2, "c": "vocab", "q": "adolescents", "t": "adolescent n.", "e": "青少年，强调青春期年龄阶段。"}, {"p": 2, "c": "expression", "q": "capable of independent thought", "t": "be capable of", "e": "有能力独立思考；of 后接名词或动名词。"}, {"p": 2, "c": "expression", "q": "take responsibility for their own actions", "t": "take responsibility for", "e": "为自己的行为负责。"}, {"p": 2, "c": "syntax", "q": "Punishing parents for crimes they did not commit or endorse would be unjust", "t": "动名词主语＋假设评价", "e": "Punishing … endorse 整体作主语，would 表示该做法的可能评价或后果。"}, {"p": 2, "c": "syntax", "q": "crimes they did not commit or endorse", "t": "省略关系代词的定语从句", "e": "修饰 crimes，强调父母既未实施也未认可。"}, {"p": 2, "c": "vocab", "q": "endorse", "t": "endorse v.", "e": "认可、支持。"}, {"p": 2, "c": "vocab", "q": "unjust", "t": "unjust adj.", "e": "不公正的，尤其涉及待遇或判断。"}, {"p": 2, "c": "vocab", "q": "family dynamic", "t": "family dynamic", "e": "家庭成员之间的互动与关系模式。"}, {"p": 3, "c": "link", "q": "while parents should face some form of accountability", "t": "while：让步", "e": "同意有条件承担责任，但主句强调不能自动受罚。"}, {"p": 3, "c": "expression", "q": "accountability", "t": "accountability / responsibility", "e": "accountability 强调需解释、接受追责；responsibility 可泛指职责，不能完全混同。"}, {"p": 3, "c": "syntax", "q": "if gross negligence in their parenting is proven", "t": "if + 被动从句", "e": "以证明严重疏忽作为追责条件。"}, {"p": 3, "c": "vocab", "q": "gross negligence", "t": "gross negligence", "e": "严重疏忽；gross 在此不是“总的”。"}, {"p": 3, "c": "syntax", "q": "every crime committed by their children", "t": "过去分词后置修饰", "e": "committed by … 修饰 crime，相当于 that is committed …。"}, {"p": 3, "c": "syntax", "q": "should evaluate each case individually", "t": "should＋动词＋副词", "e": "说明司法系统应逐案评估，individually 反对一刀切。"}, {"p": 3, "c": "link", "q": "considering both", "t": "补充考虑因素", "e": "分词短语说明逐案判断应兼顾的两方面。"}, {"p": 3, "c": "vocab", "q": "involvement", "t": "involvement n.", "e": "参与程度、介入情况。"}], "sourcePage": 20}, {"id": "essay-20", "title": "如果有机会不工作", "question": "If some people get a chance to choose between life without work and spending most of their time working, then they would choose not to work.\nTo what extent do you agree or disagree with this statement?", "qzh": "如果人们能在完全不工作与大部分时间都在工作之间选择，他们会选择不工作。你在多大程度上同意或不同意？", "paragraphs": ["It is often said that if people had to choose between working all the time and never working, most would choose not to work. While I agree that people want to escape from tiring jobs, I disagree that they would choose to do nothing forever, because work gives us a sense of purpose.", "On the one hand, a life without work sounds attractive, especially today when many people are too busy. A lot of jobs are very stressful and take up most of our time. If people did not have to worry about making money, they would certainly want to leave these tiring jobs. Without work, they could spend more time on their hobbies, stay with their families, and travel. These are things that people often have to give up because of their careers. Therefore, wanting to escape from an exhausting working life is a very natural reaction to stress.", "On the other hand, never working will not bring true happiness. Work is not just a way to make a living; it also gives us a daily routine, social connections, and a sense of value. Without a job, people often feel empty and bored. Also, solving problems at work gives us a feeling of success that hobbies usually cannot provide. For example, many people who win the lottery or retire early often go back to part-time jobs or start small businesses. They do this not for money, but to feel useful and connected to society.", "In conclusion, although most people would hate a life where work takes up all their time, they do not really want to be completely jobless. Humans need goals, achievements, and communication, which are all closely connected to having a meaningful job. So, if given the choice, most people would prefer a balanced life with reasonable work rather than no work at all."], "translations": ["人们常说，如果必须在一直工作和从不工作之间选择，大多数人会选择不工作。虽然我同意人们想逃离令人疲惫的工作，但我不同意他们愿意永远什么也不做，因为工作赋予我们目标感。", "一方面，不工作的生活听起来有吸引力，尤其在许多人非常忙碌的今天。许多工作压力很大，占用大部分时间。如果不用担心赚钱，人们当然希望离开这些疲惫的工作。不工作时，他们可以花更多时间发展爱好、陪伴家人和旅行。这些是人们常因事业而不得不放弃的事情。因此，想逃离令人精疲力竭的职业生活，是面对压力的自然反应。", "另一方面，从不工作不会带来真正幸福。工作不仅是谋生方式，还提供日常规律、社会联系和价值感。没有工作时，人们常感到空虚无聊。而且，解决工作中的问题能带来爱好通常无法提供的成就感。例如，许多中彩票或提前退休的人经常重返兼职岗位或创业。他们这样做不是为了钱，而是为了感到有用，并与社会保持联系。", "总之，虽然大多数人讨厌工作占满所有时间的生活，但他们并不真正希望完全失业。人类需要目标、成就和沟通，这些都与有意义的工作密切相关。因此，若能选择，大多数人更愿意过工作合理、生活平衡的日子，而非完全不工作。"], "kind": "同意与否", "stance": "部分同意逃离过度工作，反对永久不工作。原题有明显文字错误，展示题干已作最小语法修复；不工作不等于什么也不做，正文概念有所扩大。", "structure": [{"title": "引言", "role": "", "points": ["区分逃离疲惫工作与永久无所事事。"]}, {"title": "主体一", "role": "", "points": ["让步：压力和时间被占用 → 不工作能恢复家庭和休闲。"]}, {"title": "主体二", "role": "", "points": ["工作提供规律、联系、价值感", "以重返工作为例，但未提供数据。"]}, {"title": "结论", "role": "", "points": ["转向适量工作的平衡生活", "这是题目二选一之外的折中方案，需要说明。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "It is often said that", "t": "It is said that …", "e": "形式主语和被动报告结构，呈现常见说法而非已被证实的数据。"}, {"p": 0, "c": "syntax", "q": "if people had to choose", "t": "if + 过去式，would + 动词", "e": "假设选择情境，使用虚拟条件形式。"}, {"p": 0, "c": "link", "q": "While I agree that people want to escape from tiring jobs", "t": "While：让步", "e": "承认人们想摆脱疲惫工作，但不推出永不工作的结论。"}, {"p": 0, "c": "vocab", "q": "escape from", "t": "escape from", "e": "摆脱、逃离，from 后为想离开的状态或环境。"}, {"p": 0, "c": "link", "q": "because work gives us a sense of purpose", "t": "because：核心理由", "e": "预告主体二的工作价值，不只是说作者不同意。"}, {"p": 0, "c": "expression", "q": "a sense of purpose", "t": "a sense of purpose / value", "e": "目标感／价值感，心理与就业话题表达。"}, {"p": 0, "c": "vocab", "q": "purpose", "t": "purpose n.", "e": "目的、目标感；a sense of purpose 指生活有方向的感受。"}, {"p": 1, "c": "syntax", "q": "a life without work sounds attractive", "t": "感官系动词＋形容词", "e": "sounds 后用 attractive 作表语，说明这种生活看起来有吸引力。"}, {"p": 1, "c": "link", "q": "especially today when many people are too busy", "t": "especially＋when 从句", "e": "突出当今繁忙的背景；when 修饰时间 today。"}, {"p": 1, "c": "vocab", "q": "stressful", "t": "stressful adj.", "e": "造成压力的；与 stressed（感到压力的）区分。"}, {"p": 1, "c": "expression", "q": "take up most of our time", "t": "take up time", "e": "占用时间，不是开始某项爱好的 take up。"}, {"p": 1, "c": "syntax", "q": "If people did not have to worry about making money, they would certainly want to leave", "t": "虚拟条件句", "e": "did not … 与 would … 配合，假设无需考虑收入；about 后用 making。"}, {"p": 1, "c": "link", "q": "Without work", "t": "without + 名词", "e": "设定不工作的情境。"}, {"p": 1, "c": "syntax", "q": "they could spend more time on their hobbies, stay with their families, and travel", "t": "could＋三个并列动词", "e": "spend、stay、travel 共享 could，给出不工作的具体时间用途。"}, {"p": 1, "c": "syntax", "q": "things that people often have to give up", "t": "that 定语从句", "e": "that 指代 things，并作 give up 的宾语。"}, {"p": 1, "c": "link", "q": "because of their careers", "t": "because of + 名词", "e": "解释为何必须放弃休闲或家庭时间，不接完整句子。"}, {"p": 1, "c": "vocab", "q": "careers", "t": "career n.", "e": "职业生涯，不仅是某一天的一份任务。"}, {"p": 1, "c": "syntax", "q": "wanting to escape from an exhausting working life is a very natural reaction to stress", "t": "动名词主语", "e": "wanting … life 作 is 的主语；reaction to 表对压力的反应。"}, {"p": 1, "c": "vocab", "q": "exhausting", "t": "exhausting adj.", "e": "令人精疲力尽的；exhausted 描述人的疲惫状态。"}, {"p": 1, "c": "expression", "q": "a very natural reaction to stress", "t": "reaction to", "e": "对压力的自然反应，to 引出反应对象。"}, {"p": 1, "c": "vocab", "q": "reaction", "t": "reaction n.", "e": "反应，reaction to stress 指压力引发的应对。"}, {"p": 2, "c": "syntax", "q": "never working will not bring true happiness", "t": "动名词主语的否定", "e": "never working 是主语，not bring 是否定谓语，分别否定工作频率和结果。"}, {"p": 2, "c": "syntax", "q": "Work is not just a way to make a living; it also gives us", "t": "not just … also …", "e": "用分号连接两个独立分句，将工作价值从收入扩展到其他需求。"}, {"p": 2, "c": "expression", "q": "make a living", "t": "make a living", "e": "谋生。"}, {"p": 2, "c": "vocab", "q": "daily routine", "t": "daily routine", "e": "日常规律、固定生活节奏，不必含贬义“例行公事”。"}, {"p": 2, "c": "expression", "q": "social connections", "t": "social connections", "e": "社会联系、人际连接，解释工作的社交价值。"}, {"p": 2, "c": "link", "q": "Without a job", "t": "without：假设情境", "e": "在没有工作的情况下，引出空虚和无聊。"}, {"p": 2, "c": "syntax", "q": "solving problems at work gives us a feeling of success that hobbies usually cannot provide", "t": "动名词主语＋that 定语从句", "e": "solving … 作主语；that 修饰 feeling of success，并作 provide 的宾语。"}, {"p": 2, "c": "link", "q": "For example", "t": "举例支持动机", "e": "退休或中彩票者回到工作的例子支持非金钱需求，但 many/often 未给证据。"}, {"p": 2, "c": "syntax", "q": "people who win the lottery or retire early", "t": "who 定语从句", "e": "win 与 retire 是共享 who 的两个谓语，限定例子中所指人群。"}, {"p": 2, "c": "vocab", "q": "lottery", "t": "lottery n.", "e": "彩票。"}, {"p": 2, "c": "vocab", "q": "retire", "t": "retire v.", "e": "退休。"}, {"p": 2, "c": "vocab", "q": "retire early", "t": "retire early", "e": "提前退休；不等于永远停止所有有偿或无偿活动。"}, {"p": 2, "c": "vocab", "q": "part-time", "t": "part-time adj.", "e": "兼职的、非全日制的，修饰 jobs。"}, {"p": 2, "c": "link", "q": "not for money, but to feel useful", "t": "not … but …", "e": "纠正回到工作的动机；两个不同形式的状语形成对照。"}, {"p": 2, "c": "expression", "q": "feel useful and connected to society", "t": "feel＋形容词", "e": "感到有用且与社会相连；两个表语描写心理需求。"}, {"p": 3, "c": "link", "q": "although most people would hate", "t": "although：让步", "e": "不喜欢过度工作，与不想完全失业两层判断并存。"}, {"p": 3, "c": "syntax", "q": "a life where work takes up all their time", "t": "where 修饰抽象情境", "e": "where = in which，说明这种生活的特点，而非真实地点。"}, {"p": 3, "c": "vocab", "q": "jobless", "t": "jobless adj.", "e": "无工作的、失业的。"}, {"p": 3, "c": "vocab", "q": "achievements", "t": "achievement n.", "e": "成就、达成目标的成果。"}, {"p": 3, "c": "syntax", "q": "which are all closely connected to having a meaningful job", "t": "which＋be connected to doing", "e": "which 指 goals、achievements、communication 三项，故用 are；to 是介词。"}, {"p": 3, "c": "syntax", "q": "if given the choice", "t": "省略条件从句", "e": "可展开为 if they were given the choice。"}, {"p": 3, "c": "expression", "q": "a balanced life", "t": "a balanced life", "e": "均衡的生活，结论中的替代选择。"}, {"p": 3, "c": "expression", "q": "reasonable work", "t": "reasonable work", "e": "此处想表达合理工作量，a reasonable workload 更准确；reasonable work 单独用略含糊。"}, {"p": 3, "c": "link", "q": "rather than no work at all", "t": "rather than：选择", "e": "适量工作与完全不工作对照。"}], "sourcePage": 21}, {"id": "essay-21", "title": "广告推销", "question": "Some people say that the main aim of advertising is to improve the sales of products that people do not really need.\nTo what extent do you agree or disagree?", "qzh": "有人认为广告的主要目的是增加人们并不真正需要的产品的销量。你在多大程度上同意或不同意？", "paragraphs": ["People have different views on whether advertising mainly aims to increase the sales of products which people don't actually need. Although advertising can work that way, I believe that the main purpose of advertising is simply to spread information about a product, regardless of whether it's needed or not.", "On one hand, advertising does sometimes aim to improve the sales of products which people don't need. Many advertisements promote luxury products, which by definition are things that aren't necessary for living, even if they may make a person's life more pleasurable. A sports car is a good example of this, as well as luxury handbags, watches, and jewellery. They might increase your social status, but you can definitely live without them. The sales of luxury products depend heavily on advertising because advertisements spread awareness of these items, establishing them as high-class, sophisticated or elegant in the public mind.", "Regardless, I would argue that the main purpose of advertising is to provide consumers with information about products and services, many of which fulfil certain needs of consumers. After all, advertisements for luxury goods are outnumbered by advertisements that spread awareness of products necessary for living in some way. An example is a commercial I caught the other day that advertised car insurance. Not all types of insurance are needed, of course, but car insurance is definitely necessary for drivers. Also, I would not have been able to buy a suitable replacement for my broken phone if not for an advertisement I saw recently. Though phones are expensive, they're essential for functioning in modern society.", "Thus, while some advertisements aim to improve the sales of unnecessary products, I believe that the primary purpose of most advertising is just to inform consumers about various products and services."], "translations": ["人们对广告是否主要旨在增加非必需产品销量看法不一。虽然广告可以这样运作，但我认为它的主要目的只是传播产品信息，不论该产品是否必需。", "一方面，广告有时确实旨在提高非必需产品的销量。许多广告推销奢侈品，按定义，这些并非生活必需品，即使它们可能让生活更愉快。跑车就是一个好例子，奢侈手袋、手表和珠宝也一样。它们或许提高社会地位，但没有它们也完全能生活。奢侈品销售高度依赖广告，因为广告传播这些物品的信息，在公众心中树立其高档、精致或优雅的形象。", "尽管如此，我认为广告的主要目的是给消费者提供产品和服务信息，其中许多满足消费者的需要。毕竟，奢侈品广告的数量少于以某种方式宣传生活所需产品的广告。例如，我前几天看到一则车险广告。当然，并非所有保险都需要，但车险对驾驶者确实必需。另外，若非最近看见一则广告，我便无法为坏手机买到合适替代品。手机虽然昂贵，却是现代社会正常生活的必需品。", "因此，虽然有些广告旨在提高非必需产品的销量，我认为大多数广告的主要目的只是告知消费者各种产品和服务。"], "kind": "同意与否", "stance": "承认部分奢侈品广告，反对概括为主要目的。信息传递也可服务于销售，两者并不互斥。", "structure": [{"title": "引言", "role": "", "points": ["部分承认，主张信息传播是主要目的。"]}, {"title": "主体一", "role": "", "points": ["奢侈品非必需；广告塑造形象以促销量。"]}, {"title": "主体二", "role": "", "points": ["必需品广告、保险和手机例子", "“数量更多”未给依据；地区保险要求亦不同。"]}, {"title": "结论", "role": "", "points": ["回扣部分广告与多数广告的范围区别。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "whether advertising mainly aims to increase the sales of products", "t": "whether 作介词宾语", "e": "whether 从句作 on 的宾语，说明分歧是广告“主要”目的。"}, {"p": 0, "c": "vocab", "q": "aims", "t": "aim v.", "e": "旨在；aim to do 指目标，区别于名词 aim。"}, {"p": 0, "c": "link", "q": "Although advertising can work that way", "t": "Although：让步回指", "e": "that way 指提高非必需品销量，先承认部分情况再作总体判断。"}, {"p": 0, "c": "syntax", "q": "the main purpose of advertising is simply to spread information", "t": "不定式作表语", "e": "to spread … 说明 purpose 的具体内容；simply 把目的限定为信息传播。"}, {"p": 0, "c": "expression", "q": "main purpose", "t": "main aim / main purpose / primary purpose", "e": "主要目的的替换；purpose 与 aim 在本语境近义。"}, {"p": 0, "c": "link", "q": "regardless of whether it's needed or not", "t": "regardless of whether", "e": "不论是否需要；whether 从句作介词 of 的宾语。"}, {"p": 0, "c": "vocab", "q": "regardless", "t": "regardless adv.", "e": "不管怎样；regardless of 表不论、不顾某条件。"}, {"p": 1, "c": "vocab", "q": "luxury products", "t": "luxury products", "e": "奢侈品，强调超出基本生活所需的产品。"}, {"p": 1, "c": "syntax", "q": "products, which by definition are things that aren't necessary", "t": "定语从句嵌套", "e": "which 修饰 products；that 修饰 things。by definition 是插入的界定短语。"}, {"p": 1, "c": "link", "q": "by definition", "t": "定义限定", "e": "说明奢侈品按定义不是生活必需，支撑对这类广告的让步。"}, {"p": 1, "c": "link", "q": "even if", "t": "即使：让步条件", "e": "即使提升愉悦感，仍不是生存必需品。"}, {"p": 1, "c": "syntax", "q": "even if they may make a person's life more pleasurable", "t": "make + 宾语 + 形容词", "e": "life 为宾语，more pleasurable 为补语，说明奢侈品并非毫无享受价值。"}, {"p": 1, "c": "vocab", "q": "pleasurable", "t": "pleasurable adj.", "e": "令人愉悦的。"}, {"p": 1, "c": "syntax", "q": "A sports car is a good example of this, as well as luxury handbags, watches, and jewellery", "t": "例子与并列补充", "e": "跑车为主例，as well as 补充其他奢侈品；不是独立论点。"}, {"p": 1, "c": "vocab", "q": "jewellery", "t": "jewellery n.", "e": "珠宝首饰，英式拼写，通常不可数。"}, {"p": 1, "c": "expression", "q": "social status", "t": "social status", "e": "社会地位。"}, {"p": 1, "c": "expression", "q": "depend heavily on advertising", "t": "depend on", "e": "高度依赖，heavily 强调程度。"}, {"p": 1, "c": "link", "q": "because advertisements spread awareness of these items", "t": "because：原因", "e": "解释为什么奢侈品销量高度依赖广告。"}, {"p": 1, "c": "expression", "q": "spread awareness", "t": "spread awareness", "e": "提高／传播认知；spread information 更侧重信息内容。"}, {"p": 1, "c": "vocab", "q": "awareness", "t": "awareness n.", "e": "认知、知晓程度，awareness of 指对某物的了解。"}, {"p": 1, "c": "syntax", "q": "establishing them as high-class, sophisticated or elegant in the public mind", "t": "分词结果＋establish A as B", "e": "广告将这些商品树立为高档精致形象；them 指 luxury products。"}, {"p": 1, "c": "vocab", "q": "high-class", "t": "high-class adj.", "e": "高档的；这里描述广告塑造的产品形象。"}, {"p": 1, "c": "vocab", "q": "sophisticated", "t": "sophisticated adj.", "e": "本文指精致、高级的产品形象；也可表示复杂。"}, {"p": 1, "c": "vocab", "q": "elegant", "t": "elegant adj.", "e": "优雅的、雅致的。"}, {"p": 2, "c": "link", "q": "Regardless", "t": "承认后转回主张", "e": "意为尽管如此；单独作过渡副词，与引言 regardless of 的介词结构不同。"}, {"p": 2, "c": "syntax", "q": "many of which fulfil certain needs of consumers", "t": "many of which 定语从句", "e": "指产品和服务中的许多，限定并非所有广告对象都必需。"}, {"p": 2, "c": "vocab", "q": "fulfil", "t": "fulfil v.", "e": "满足需求；fulfil needs 为常见搭配。"}, {"p": 2, "c": "link", "q": "After all", "t": "补充理由", "e": "用“毕竟”支持主要目的的判断，但不能代替证据。"}, {"p": 2, "c": "syntax", "q": "advertisements for luxury goods are outnumbered by advertisements", "t": "被动比较数量", "e": "奢侈品广告是被超过的一方；该数量判断本身缺少来源。"}, {"p": 2, "c": "vocab", "q": "outnumbered", "t": "outnumber v.", "e": "数量超过；be outnumbered by＝数量少于后者。"}, {"p": 2, "c": "syntax", "q": "a commercial I caught the other day that advertised car insurance", "t": "两层定语修饰", "e": "I caught … 省略宾语关系词；that advertised … 补充广告内容。"}, {"p": 2, "c": "vocab", "q": "commercial I caught", "t": "catch v.", "e": "熟词生义：偶然看到、听到。commercial 为广告。"}, {"p": 2, "c": "vocab", "q": "insurance", "t": "insurance n.", "e": "保险，本文为汽车保险，通常不可数。"}, {"p": 2, "c": "syntax", "q": "Not all types of insurance are needed", "t": "Not all：部分否定", "e": "不是所有保险都需要，不等于所有保险都不需要。"}, {"p": 2, "c": "link", "q": "of course", "t": "插入态度短语", "e": "承认保险并非一概必需，对前面例子作限定。"}, {"p": 2, "c": "syntax", "q": "would not have been able to buy", "t": "would have + 过去分词", "e": "描述与过去情况相反的假设结果，配合 if not for an advertisement。"}, {"p": 2, "c": "expression", "q": "a suitable replacement for my broken phone", "t": "replacement for", "e": "某物的合适替代品，for 引出被替换对象。"}, {"p": 2, "c": "vocab", "q": "replacement", "t": "replacement n.", "e": "替代品，常接 for 指所替代之物。"}, {"p": 2, "c": "link", "q": "Though phones are expensive", "t": "Though：让步", "e": "昂贵与必需并不冲突，回应非必需奢侈品的分类。"}, {"p": 2, "c": "expression", "q": "essential for functioning in modern society", "t": "be essential for doing", "e": "为在现代社会正常生活所必需，for 后接动名词。"}, {"p": 2, "c": "vocab", "q": "functioning", "t": "function v.", "e": "正常运作、有效生活；本文不是指物品某项功能。"}, {"p": 3, "c": "link", "q": "Thus", "t": "推论总结", "e": "用前面两段比较收束观点，不再增加例子。"}, {"p": 3, "c": "syntax", "q": "while some advertisements aim to improve the sales of unnecessary products", "t": "while：让步＋some 限定", "e": "结论再次承认部分广告符合题目描述，但拒绝推广到大多数。"}, {"p": 3, "c": "vocab", "q": "primary", "t": "primary adj.", "e": "首要的、主要的，primary purpose 指最主要目的。"}, {"p": 3, "c": "expression", "q": "inform consumers about", "t": "inform sb about sth", "e": "告知某人某事；主张广告的信息功能，但不自动排除销售功能。"}], "sourcePage": 22}, {"id": "essay-22", "title": "工作闲暇失衡", "question": "Many working people do not have enough free time off work to spend with their families and friends.\nWhy?\nWhat are the effects on family life and society?", "qzh": "许多上班族工作之余没有足够时间陪伴家人朋友。原因是什么？对家庭生活和社会有何影响？", "paragraphs": ["In contemporary society, many working people do not have enough free time to spend with their families and friends. This phenomenon is driven by specific social and professional factors, and it brings negative effects on both family life and society as a whole.", "There are two main reasons why working individuals struggle to find time for their loved ones. First, the competitive job market pushes people to work longer hours to secure their positions or pursue career advancement. Many employees, especially in fields like technology or finance, feel pressured to take on extra tasks or work overtime to meet high performance standards—fearful that falling behind could lead to job loss. Second, the desire for higher income also plays a role. With rising living costs (such as housing, education, and healthcare expenses), many people choose to work more, or even take on second jobs, to improve their family’s financial situation. They prioritize earning more money over leisure time, believing this will provide better security for their families.", "The lack of free time for family and friends has harmful impacts on family life first. When people spend most of their time at work, they miss out on important family moments—like their children’s school events or family gatherings. This can weaken emotional bonds between family members: children may feel neglected by parents who are rarely present, and couples may grow apart due to lack of communication. Over time, this can lead to family conflicts or even breakdowns. In addition，this trend also affects society negatively. If many families face relationship problems, it can increase social instability. For example, children from families with little parental companionship may be more likely to feel lonely or develop behavioral issues, which could lead to problems like dropping out of school or getting involved in crime later.", "In conclusion, the lack of free time among working people is mainly caused by job competition and the need for higher income. It harms family relationships by weakening emotional connections and creates problems for society such as increased instability and pressure on healthcare."], "translations": ["当代社会，许多工作的人没有足够空闲时间陪伴家人朋友。这一现象由特定的社会和职业因素驱动，也给家庭生活和整个社会带来负面影响。", "上班族难以找到时间陪伴亲近的人，主要有两个原因。首先，竞争激烈的就业市场迫使人们工作更长时间，以保住岗位或争取职业晋升。许多员工，尤其科技或金融行业的员工，为达到高绩效标准，感到必须承担额外任务或加班，因为担心落后会导致失业。其次，追求更高收入也发挥作用。住房、教育、医疗等生活成本上涨，许多人选择多工作甚至兼职，以改善家庭经济状况。他们把增加收入放在休闲之前，认为这样能给家庭提供更好保障。", "缺少陪伴家人朋友的闲暇，首先损害家庭生活。把大部分时间用于工作，人们就会错过孩子学校活动、家庭聚会等重要时刻。这会削弱家庭成员的情感联系：孩子可能觉得经常缺席的父母忽视自己，夫妻也会因缺乏交流而疏远。久而久之，可能导致家庭冲突甚至破裂。此外，这一趋势对社会也有负面影响。许多家庭面临关系问题时，社会不稳定可能增加。例如，缺少父母陪伴的孩子更容易感到孤独或出现行为问题，之后可能辍学或卷入犯罪。", "总之，上班族闲暇不足主要由就业竞争和增加收入的需要造成。它削弱情感联系、损害家庭关系，也给社会带来不稳定加剧和医疗压力等问题。"], "kind": "原因＋影响", "stance": "必须分别覆盖家庭和社会影响。结尾出现 healthcare pressure，但正文未展开，不宜在结论新加论点。", "structure": [{"title": "引言", "role": "", "points": ["明确原因与家庭、社会两个影响层面。"]}, {"title": "原因段", "role": "", "points": ["2 点：保住岗位和晋升压力；生活成本与收入需要。"]}, {"title": "影响段", "role": "", "points": ["家庭：缺席、疏远、冲突；社会：儿童孤独和行为问题", "从少陪伴推到犯罪需谨慎限定。"]}, {"title": "结论", "role": "", "points": ["汇总原因与关系损害", "医疗压力是未在正文论证的新信息。"]}], "readerNotes": [{"p": 0, "c": "vocab", "q": "contemporary", "t": "contemporary adj.", "e": "当代的、现代的。"}, {"p": 0, "c": "syntax", "q": "This phenomenon is driven by specific social and professional factors", "t": "be driven by", "e": "被……推动、由……驱动；被动交代原因类别。"}, {"p": 0, "c": "vocab", "q": "phenomenon", "t": "phenomenon n.", "e": "现象，单数；复数为 phenomena。"}, {"p": 0, "c": "link", "q": "on both family life and society as a whole", "t": "both … and …", "e": "明确题目所要求的家庭与社会两个受影响层面。"}, {"p": 1, "c": "syntax", "q": "There are two main reasons why", "t": "There are … reasons why …", "e": "提前交代有两个原因，让段内 First、Second 对应清楚。"}, {"p": 1, "c": "link", "q": "First", "t": "First / Second 分点", "e": "第一点是竞争和工作安全感，第二点是生活成本与收入需求。"}, {"p": 1, "c": "vocab", "q": "competitive", "t": "competitive adj.", "e": "竞争激烈的，形容就业市场环境。"}, {"p": 1, "c": "syntax", "q": "pushes people to work longer hours to secure their positions or pursue career advancement", "t": "push sb to do＋目的 to do", "e": "第一层 to work 为被迫行动；第二层 to secure/pursue 为延长工时的目的。"}, {"p": 1, "c": "vocab", "q": "secure their positions", "t": "secure v.", "e": "确保、保住岗位，熟词生义。"}, {"p": 1, "c": "vocab", "q": "career advancement", "t": "career advancement", "e": "职业发展、晋升。"}, {"p": 1, "c": "link", "q": "especially in fields like technology or finance", "t": "具体化适用行业", "e": "举科技、金融行业作为加班压力场景，不能把行业例子另算一个原因。"}, {"p": 1, "c": "syntax", "q": "feel pressured to take on extra tasks or work overtime", "t": "feel＋过去分词状态＋to do", "e": "pressured 表被施压的状态，take on 与 work 并列。"}, {"p": 1, "c": "expression", "q": "work overtime", "t": "work overtime", "e": "加班，overtime 在这里作副词，不必加介词。"}, {"p": 1, "c": "expression", "q": "meet high performance standards", "t": "meet standards", "e": "达到高绩效标准；meet 在此不是见面。"}, {"p": 1, "c": "syntax", "q": "fearful that falling behind could lead to job loss", "t": "形容词＋that 从句", "e": "fearful 描述员工担忧；falling behind 在从句中作主语。"}, {"p": 1, "c": "vocab", "q": "fearful", "t": "fearful adj.", "e": "担忧的、害怕的，后可接 that 从句说明内容。"}, {"p": 1, "c": "link", "q": "With rising living costs", "t": "With + 名词短语", "e": "交代选择增加工作的背景。"}, {"p": 1, "c": "link", "q": "such as housing, education, and healthcare expenses", "t": "such as：生活成本实例", "e": "房屋、教育、医疗是成本类别的具体展开。"}, {"p": 1, "c": "syntax", "q": "to improve their family’s financial situation", "t": "不定式表目的", "e": "说明选择更多工作或第二份工作是为了改善经济情况。"}, {"p": 1, "c": "vocab", "q": "financial", "t": "financial adj.", "e": "财务的、经济上的，修饰家庭状况。"}, {"p": 1, "c": "expression", "q": "prioritize earning more money over leisure time", "t": "prioritize A over B", "e": "优先 A 而非 B，体现取舍。"}, {"p": 1, "c": "vocab", "q": "prioritize", "t": "prioritize v.", "e": "优先考虑，把某事排在其他事项之前。"}, {"p": 1, "c": "vocab", "q": "leisure", "t": "leisure n.", "e": "闲暇、休闲时间。"}, {"p": 1, "c": "syntax", "q": "believing this will provide better security", "t": "分词短语说明想法", "e": "believing 的逻辑主语是 they，解释优先赚钱的动机。"}, {"p": 2, "c": "syntax", "q": "When people spend most of their time at work, they miss out on important family moments", "t": "When：情境与后果", "e": "设定长时间工作的情况，后面说明错失家庭时刻。"}, {"p": 2, "c": "expression", "q": "miss out on", "t": "miss out on", "e": "错过本来可以参与或得到的机会。"}, {"p": 2, "c": "vocab", "q": "gatherings", "t": "gathering n.", "e": "聚会、聚集活动，本文是家庭聚会。"}, {"p": 2, "c": "expression", "q": "weaken emotional bonds", "t": "weaken emotional bonds", "e": "削弱情感纽带。"}, {"p": 2, "c": "vocab", "q": "emotional bonds", "t": "emotional bonds", "e": "情感纽带，emotional 为情绪情感方面的。"}, {"p": 2, "c": "syntax", "q": "children may feel neglected by parents who are rarely present", "t": "feel＋过去分词＋who 从句", "e": "neglected 描述孩子感受，by 引出忽视的来源；who 进一步限定父母状态。"}, {"p": 2, "c": "vocab", "q": "neglected", "t": "neglected adj.", "e": "被忽视、未得到应有照顾的。"}, {"p": 2, "c": "syntax", "q": "parents who are rarely present", "t": "who 定语从句", "e": "限定很少在场陪伴的父母；rarely 避免绝对化。"}, {"p": 2, "c": "expression", "q": "grow apart", "t": "grow apart", "e": "关系逐渐疏远。"}, {"p": 2, "c": "link", "q": "due to lack of communication", "t": "due to：原因", "e": "指出夫妻疏远的机制是交流不足。"}, {"p": 2, "c": "link", "q": "Over time", "t": "时间推进", "e": "表示关系问题逐渐积累。"}, {"p": 2, "c": "vocab", "q": "conflicts", "t": "conflict n.", "e": "冲突、矛盾，不仅指战争。"}, {"p": 2, "c": "vocab", "q": "breakdowns", "t": "breakdown n.", "e": "熟词生义：关系破裂，不是机器故障。"}, {"p": 2, "c": "link", "q": "In addition", "t": "补充层面", "e": "从家庭影响扩展到社会影响。"}, {"p": 2, "c": "syntax", "q": "If many families face relationship problems, it can increase social instability", "t": "If 条件与指代", "e": "it 概括许多家庭出现关系问题的情况，写成 this situation 可使指代更清楚。"}, {"p": 2, "c": "vocab", "q": "instability", "t": "instability n.", "e": "不稳定。"}, {"p": 2, "c": "link", "q": "For example", "t": "社会后果举例", "e": "儿童孤独和行为问题是解释社会层面的例子，而非所有家庭都如此。"}, {"p": 2, "c": "vocab", "q": "companionship", "t": "companionship n.", "e": "陪伴、相伴关系。"}, {"p": 2, "c": "syntax", "q": "may be more likely to feel lonely or develop behavioral issues", "t": "be likely to do＋比较级", "e": "表示可能性更高，而不是必定如此；feel 与 develop 并列。"}, {"p": 2, "c": "vocab", "q": "behavioral issues", "t": "behavioral issues", "e": "行为问题；behavioral 为形容词。"}, {"p": 2, "c": "syntax", "q": "which could lead to problems like dropping out of school or getting involved in crime later", "t": "which 结果＋like doing", "e": "补充潜在后果，dropping 与 getting 为并列例子；因果跨度需要解释。"}, {"p": 2, "c": "expression", "q": "dropping out of school", "t": "drop out of", "e": "辍学、中途退出，of 后接学校或课程。"}, {"p": 3, "c": "syntax", "q": "is mainly caused by job competition and the need for higher income", "t": "be caused by", "e": "总结两个原因；mainly 表主要而非唯一。"}, {"p": 3, "c": "link", "q": "by weakening emotional connections", "t": "by + doing", "e": "交代对家庭造成损害的方式，而不是时间。"}, {"p": 3, "c": "expression", "q": "pressure on healthcare", "t": "pressure on", "e": "医疗体系承受的压力；此处结论新加入，正文未解释，应删去或前文补论证。"}], "sourcePage": 23}, {"id": "essay-23", "title": "再犯罪问题", "question": "Many offenders commit more crimes after serving the first punishment.\nWhy is this happening, and what measures can be taken to tackle this problem?", "qzh": "许多违法者在第一次服刑或受罚后再度犯罪。为什么会这样？可以采取什么措施？", "paragraphs": ["It is true that many offenders continue to commit crimes even after being imprisoned for their wrongdoing. There are several contributing factors for recidivism among criminals and a number of possible solutions that can be implemented to decrease the likelihood of repeat offenders.", "The causes of crimes are complex and manifold. However, the most significant risk factors include poverty, one’s inability to obtain employment, and mental health issues aggravated by a brutal and inhumane criminal justice system. Prisoners who are released often have a considerably difficult time reintegrating into society. Not only are they traumatised by the harsh conditions in prison, they are also permanently labelled as a “criminal” and alienated by other members of society, including their family and friends. Furthermore, having a criminal record makes it significantly more difficult to obtain a job, so the employment options for former prisoners are severely limited. This combination of social stigma and lack of employment options can be devastating for former prisoners, leading them back into a life of crime.", "Several possible measures can be taken to prevent recidivism. First of all, prisons need to shift their focus from punishment to rehabilitation. All too often, incarceration facilities subject prisoners to unthinkable levels of abuse, violence and deprivation. Mistreatment of inmates causes them to have greater levels of anger and anguish, which may lead them to become mentally unstable and seek revenge on society in the future. In addition, prison-based education programs and job training should be implemented to help prisoners develop the occupational skills they’ll need for life after prison. Finally, substance abuse and mental health issues, which are common among prisoners, need to be properly diagnosed and treated to help prisoners reintegrate into society.", "In conclusion, it is clear that many criminals continue to commit crimes despite being punished. However, several measures can be taken to effectively combat this issue."], "translations": ["确实，许多违法者即便因违法行为被监禁，仍继续犯罪。犯罪者再犯有若干促成因素，也有一些可实施的办法来降低再犯的可能性。", "犯罪原因复杂多样。不过，最重要的风险因素包括贫困、无法就业，以及被残酷、不人道的刑事司法制度加重的心理问题。获释囚犯往往很难重新融入社会。他们不仅因恶劣狱中条件受到创伤，还被永久贴上“罪犯”标签，被包括亲友在内的其他社会成员疏远。此外，有犯罪记录会使找工作更加困难，因此前囚犯就业选择严重受限。社会污名与就业机会不足相结合，可能给他们沉重打击，使他们重返犯罪生活。", "可以采取几项措施预防再犯。首先，监狱需要将重心由惩罚转向改造。监禁设施常让囚犯遭受难以想象的虐待、暴力和匮乏。虐待使囚犯产生更强烈的愤怒和痛苦，可能导致心理失衡，并在未来寻求报复社会。此外，应实施狱中教育和职业培训项目，帮助囚犯发展出狱后所需职业技能。最后，应妥善诊断和治疗囚犯中常见的物质滥用及心理健康问题，以帮助他们重新融入社会。", "总之，许多犯罪者受罚后仍继续犯罪，这一点很明显。不过，可以采取若干措施有效应对这一问题。"], "kind": "原因＋措施", "stance": "原因与措施应逐一对应：排斥及失业、狱中创伤、心理与成瘾问题。文中对监狱的概括过强，不代表所有制度。", "structure": [{"title": "引言", "role": "", "points": ["提出再犯现象，预告原因和办法。"]}, {"title": "原因段", "role": "", "points": ["狱中创伤、社会污名、就业受限共同提高再犯风险", "重点应始终落在再犯而非一般犯罪。"]}, {"title": "措施段", "role": "", "points": ["3 项：重改造、教育培训、治疗心理和物质问题", "对应上述风险。"]}, {"title": "结论", "role": "", "points": ["仅笼统重述，可更明确回扣关键原因和办法。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "It is true that many offenders continue to commit crimes", "t": "It is true that …", "e": "形式主语结构引出现象；continue to do 表继续做某事。"}, {"p": 0, "c": "syntax", "q": "even after being imprisoned for their wrongdoing", "t": "after + being + 过去分词", "e": "受罚后仍再犯；being imprisoned 为介词后的被动动名词。"}, {"p": 0, "c": "vocab", "q": "wrongdoing", "t": "wrongdoing n.", "e": "违法或不当行为，通常不可数。"}, {"p": 0, "c": "vocab", "q": "recidivism", "t": "recidivism n.", "e": "再犯、重复犯罪，犯罪话题专业词。"}, {"p": 0, "c": "syntax", "q": "solutions that can be implemented to decrease", "t": "that 定语从句＋被动", "e": "that 指 solutions，在从句中作主语；to decrease 表实施目的。"}, {"p": 0, "c": "expression", "q": "the likelihood of repeat offenders", "t": "搭配不精确", "e": "likelihood 应对应事件，而非人；the likelihood of reoffending 更准确地表示再犯概率。"}, {"p": 0, "c": "expression", "q": "repeat offenders", "t": "offenders / prisoners", "e": "offender 是违法者；prisoner 是囚犯，身份范围不同，不能无条件互换。"}, {"p": 1, "c": "vocab", "q": "manifold", "t": "manifold adj.", "e": "多种多样的。"}, {"p": 1, "c": "link", "q": "However", "t": "从总体转到重点", "e": "先承认原因复杂，再提出作者认为最重要的风险因素。"}, {"p": 1, "c": "syntax", "q": "mental health issues aggravated by a brutal and inhumane criminal justice system", "t": "过去分词后置修饰", "e": "aggravated by … 修饰 issues，说明心理问题被什么加重。"}, {"p": 1, "c": "vocab", "q": "aggravated", "t": "aggravate v.", "e": "使恶化、加重。"}, {"p": 1, "c": "vocab", "q": "brutal and inhumane", "t": "brutal / inhumane", "e": "残酷的／不人道的，评价语气强，不宜无条件描述所有司法制度。"}, {"p": 1, "c": "syntax", "q": "Prisoners who are released often have a considerably difficult time reintegrating into society", "t": "who 从句＋have a difficult time doing", "e": "who 限定获释者，reintegrating 表示困难发生在哪个行动上。"}, {"p": 1, "c": "expression", "q": "reintegrating into society", "t": "reintegrate into society", "e": "重新融入社会。"}, {"p": 1, "c": "vocab", "q": "reintegrating", "t": "reintegrating 的含义", "e": "原文 reintegrating into society 指重新融入社会；其名词形式为 reintegration。"}, {"p": 1, "c": "syntax", "q": "Not only are they traumatised", "t": "Not only 前置倒装", "e": "are 提到 they 前面；第二分句 they are also … 不倒装。"}, {"p": 1, "c": "vocab", "q": "traumatised", "t": "traumatise v.", "e": "使遭受心理创伤，英式拼写。"}, {"p": 1, "c": "vocab", "q": "labelled", "t": "label v.", "e": "贴上标签；permanently labelled 为永久负面身份化的主张。"}, {"p": 1, "c": "vocab", "q": "alienated", "t": "alienate v.", "e": "疏远、使孤立。"}, {"p": 1, "c": "link", "q": "including their family and friends", "t": "including：范围补充", "e": "强调排斥可能连来自最亲近的人，而不仅是陌生人。"}, {"p": 1, "c": "link", "q": "Furthermore", "t": "递进", "e": "由被孤立补充就业受限。"}, {"p": 1, "c": "syntax", "q": "having a criminal record makes it significantly more difficult", "t": "动名词主语", "e": "having a criminal record 作主语；significantly 加强比较级 more difficult。"}, {"p": 1, "c": "expression", "q": "criminal record", "t": "criminal record", "e": "犯罪记录，区别于 criminal justice system（刑事司法制度）。"}, {"p": 1, "c": "syntax", "q": "makes it significantly more difficult to obtain a job", "t": "make it + 比较级 + to do", "e": "it 是形式宾语，不定式说明找工作的困难。"}, {"p": 1, "c": "expression", "q": "employment options for former prisoners are severely limited", "t": "be severely limited", "e": "受到严重限制，severely 表程度。"}, {"p": 1, "c": "vocab", "q": "stigma", "t": "stigma n.", "e": "污名、负面社会标签。"}, {"p": 1, "c": "vocab", "q": "devastating", "t": "devastating adj.", "e": "造成极大伤害、毁灭性影响的。"}, {"p": 1, "c": "syntax", "q": "leading them back into a life of crime", "t": "分词说明结果", "e": "社会污名与失业的组合可能促使再犯，them 指前囚犯。"}, {"p": 2, "c": "syntax", "q": "Several possible measures can be taken to prevent recidivism", "t": "measures can be taken", "e": "被动建议：可采取措施；to prevent 说明目标。"}, {"p": 2, "c": "link", "q": "from punishment to rehabilitation", "t": "from … to …", "e": "表示监狱工作重心的转变。"}, {"p": 2, "c": "vocab", "q": "rehabilitation", "t": "rehabilitation n.", "e": "本文指教育改造、帮助重返社会。"}, {"p": 2, "c": "link", "q": "All too often", "t": "频率评价", "e": "强调某事发生得过于频繁，带批评色彩；不能替代具体证据。"}, {"p": 2, "c": "vocab", "q": "incarceration", "t": "incarceration n.", "e": "监禁。"}, {"p": 2, "c": "syntax", "q": "subject prisoners to unthinkable levels of abuse", "t": "subject sb to sth", "e": "使某人遭受某事，subject 此处为动词，不是名词科目。"}, {"p": 2, "c": "vocab", "q": "deprivation", "t": "deprivation n.", "e": "剥夺、匮乏，指基本需要得不到满足。"}, {"p": 2, "c": "syntax", "q": "Mistreatment of inmates causes them to have greater levels of anger and anguish", "t": "cause sb to do", "e": "虐待使囚犯产生更强烈的负面感受，them 指 inmates。"}, {"p": 2, "c": "vocab", "q": "Mistreatment", "t": "mistreatment n.", "e": "虐待、不当对待。"}, {"p": 2, "c": "vocab", "q": "inmates", "t": "inmate n.", "e": "被关押者、囚犯，与 prisoners 在此近义。"}, {"p": 2, "c": "vocab", "q": "anguish", "t": "anguish n.", "e": "剧烈痛苦。"}, {"p": 2, "c": "syntax", "q": "which may lead them to become mentally unstable and seek revenge on society", "t": "which＋lead sb to do", "e": "may 保留可能性，become 和 seek 两个动作共享 to。"}, {"p": 2, "c": "vocab", "q": "unstable", "t": "unstable adj.", "e": "不稳定的，mentally unstable 为原文对心理状态的描述。"}, {"p": 2, "c": "expression", "q": "seek revenge on society", "t": "seek revenge on", "e": "向社会寻求报复，on 引出对象。"}, {"p": 2, "c": "link", "q": "In addition", "t": "第二项措施", "e": "在重改造之外补充教育和职业培训。"}, {"p": 2, "c": "syntax", "q": "the occupational skills they’ll need for life after prison", "t": "省略关系代词", "e": "they’ll need … 为定语从句，修饰 skills；关系词在从句中作 need 的宾语，可省略。"}, {"p": 2, "c": "expression", "q": "occupational skills", "t": "occupational skills", "e": "职业技能。"}, {"p": 2, "c": "link", "q": "Finally", "t": "最后一项", "e": "标示第三个措施：健康与物质问题治疗。"}, {"p": 2, "c": "vocab", "q": "substance abuse", "t": "substance abuse", "e": "对酒精、药物等物质的滥用，不是一般物品误用。"}, {"p": 2, "c": "syntax", "q": "need to be properly diagnosed and treated", "t": "need to be + 过去分词", "e": "需要被诊断并治疗，两个分词并列。"}, {"p": 2, "c": "vocab", "q": "diagnosed", "t": "diagnose v.", "e": "诊断，识别健康或心理问题的性质。"}, {"p": 3, "c": "link", "q": "despite being punished", "t": "despite + being + 过去分词", "e": "虽然已经受罚仍继续犯罪，despite 后不是完整从句。"}, {"p": 3, "c": "expression", "q": "combat this issue", "t": "combat v.", "e": "应对、打击某问题；语气较强，常用于犯罪或社会问题。"}], "sourcePage": 24}, {"id": "essay-24", "title": "了解人们生活的途径", "question": "In order to learn the way other people in the world live, it is better to look at film and video records than written documents.\nTo what extent do you agree or disagree?", "qzh": "为了了解世界其他人的生活方式，看电影和影像记录比读书面资料更好。你在多大程度上同意或不同意？", "paragraphs": ["To gain a comprehensive understanding of how people live around the world, I believe that written documents are more effective than visual media or moving images. Although visual media can provide an engaging glimpse into different cultures, they often lack the depth and reliability found in written records.", "One primary reason written documents are more effective is their higher level of accuracy. Moving images and visual media, including documentaries, are often influenced by commercial and artistic considerations. Directors and producers may choose to dramatize events, simplify complex realities, or focus on stereotypes to appeal to audiences and ensure financial success. These choices can result in a skewed representation of how people truly live. In contrast, written documents such as reports, articles, and academic studies are usually created with a strong commitment to accuracy and factual information. Writers, journalists, and researchers aim to provide a truthful account of events and social practices, making written sources more reliable for understanding different cultures.", "Furthermore, written records offer a greater level of detail and context that moving images and visual media cannot match. For example, academic studies, ethnography, and research papers provide thorough analyses of social, economic, and cultural dynamics, while personal memoirs and travelogues can offer intimate perspectives on everyday life that are rarely captured in visual media. Moving images and visual media, due to time limitations and the need to maintain viewer interest, often condense or omit many intricate aspects of life to focus on the most visually compelling scenes. This compression can lead to a superficial understanding, missing the subtler aspects of how people live, work, and interact within their cultural contexts.", "In conclusion, I maintain that written documents are a more effective tool than moving images and visual media for understanding the way people live around the world. They offer greater accuracy, depth, and context, while visual media often fall short due to their tendency to prioritize entertainment over factual representation. For a more complete and nuanced understanding of different cultures, written records are indispensable."], "translations": ["为了全面了解世界各地人们如何生活，我认为书面资料比视觉媒体或动态影像更有效。虽然视觉媒体可以生动地展示不同文化的一角，但往往缺乏书面记录具有的深度和可靠性。", "书面资料更有效的一个主要原因，是准确性更高。包括纪录片在内的动态影像和视觉媒体，常受到商业和艺术考虑影响。导演和制作人可能将事件戏剧化、简化复杂现实，或突出刻板印象，以吸引观众、确保商业成功。这些选择可能导致对真实生活的歪曲呈现。相比之下，报告、文章和学术研究等书面资料，通常十分重视准确性和事实。作者、记者及研究者力求如实记录事件与社会习俗，使书面来源在理解不同文化方面更可靠。", "此外，书面记录提供的细节和背景深度，动态影像和视觉媒体难以匹敌。例如，学术研究、民族志及论文深入分析社会、经济和文化动态，而个人回忆录及游记能提供关于日常生活的贴近个人的视角，这在影像中很少被捕捉。动态影像和视觉媒体因时间限制和保持观众兴趣的需要，常压缩或省略生活中许多复杂细节，聚焦视觉上最吸引人的场面。这种压缩可能导致浅层理解，遗漏人们如何在文化背景下生活、工作和互动的更微妙方面。", "总之，我坚持认为，理解世界各地人的生活方式时，书面资料比动态影像和视觉媒体更有效。它们提供更高准确性、深度和背景，而视觉媒体因倾向优先娱乐而非事实呈现，往往有所不足。要更完整、更细致地理解不同文化，书面记录不可或缺。"], "kind": "同意与否", "stance": "反对题目比较，主张书面资料更好。文章对书面准确性、影像片面性的概括较绝对，应考虑来源质量而非只看媒介。", "structure": [{"title": "引言", "role": "", "points": ["直接提出相反立场，预告可靠性和深度。"]}, {"title": "主体一", "role": "", "points": ["影像商业艺术取舍 → 可能歪曲；书面研究重事实 → 可靠", "两种媒介对照。"]}, {"title": "主体二", "role": "", "points": ["学术与个人记录提供背景；影像时间限制导致压缩", "围绕深度展开。"]}, {"title": "结论", "role": "", "points": ["回扣准确性、深度、背景三方面。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "To gain a comprehensive understanding of how people live around the world", "t": "句首不定式目的＋how 从句", "e": "to gain 说明目标；how 从句作 of 的宾语，明确了解的是生活方式。"}, {"p": 0, "c": "vocab", "q": "comprehensive", "t": "comprehensive adj.", "e": "全面的、综合的。"}, {"p": 0, "c": "syntax", "q": "written documents are more effective than visual media or moving images", "t": "形容词比较级＋than", "e": "直接反转题干比较，明确书面资料更好这一立场。"}, {"p": 0, "c": "link", "q": "Although visual media can provide an engaging glimpse", "t": "Although：让步", "e": "先承认影像吸引力，再指出深度可靠性不足。"}, {"p": 0, "c": "expression", "q": "an engaging glimpse into different cultures", "t": "engaging adj.", "e": "有吸引力的、引人入胜的；into 引出了解的文化对象。"}, {"p": 0, "c": "vocab", "q": "glimpse", "t": "glimpse n.", "e": "短暂一瞥、初步了解，强调观察不全面。"}, {"p": 0, "c": "syntax", "q": "the depth and reliability found in written records", "t": "过去分词修饰", "e": "found … 修饰 depth and reliability，表示书面记录中具备的品质。"}, {"p": 0, "c": "vocab", "q": "reliability", "t": "reliability n.", "e": "可靠性，指资料是否值得信赖。"}, {"p": 1, "c": "syntax", "q": "One primary reason written documents are more effective is their higher level of accuracy", "t": "reason＋省略 why 的从句", "e": "主干是 One primary reason is …；后面的 higher level of accuracy 给具体理由。"}, {"p": 1, "c": "syntax", "q": "are often influenced by commercial and artistic considerations", "t": "被动结构", "e": "媒体受到商业和艺术考量影响；often 避免说成每部作品都如此。"}, {"p": 1, "c": "vocab", "q": "considerations", "t": "consideration n.", "e": "考量因素；不是对他人的体贴这一含义。"}, {"p": 1, "c": "syntax", "q": "may choose to dramatize events, simplify complex realities, or focus on stereotypes", "t": "choose to＋三个并列动词", "e": "dramatize、simplify、focus 共享 to，列出内容取舍的三种方式。"}, {"p": 1, "c": "vocab", "q": "dramatize", "t": "dramatize v.", "e": "把事情戏剧化、夸大表现；不只是拍成电视剧。"}, {"p": 1, "c": "vocab", "q": "stereotypes", "t": "stereotypes n.", "e": "刻板印象。"}, {"p": 1, "c": "link", "q": "to appeal to audiences and ensure financial success", "t": "to do：目的", "e": "解释媒体为何作戏剧化或简化选择：吸引观众并盈利。"}, {"p": 1, "c": "expression", "q": "appeal to audiences", "t": "appeal to sb", "e": "吸引某人；此处不是法律上诉。"}, {"p": 1, "c": "vocab", "q": "skewed", "t": "skewed adj.", "e": "偏颇的、歪曲的。"}, {"p": 1, "c": "vocab", "q": "representation", "t": "representation n.", "e": "呈现、再现；本文指如何描述人的实际生活。"}, {"p": 1, "c": "link", "q": "In contrast", "t": "两种媒介对照", "e": "从影像取舍转到书面准确性。"}, {"p": 1, "c": "expression", "q": "a strong commitment to accuracy", "t": "commitment to", "e": "对准确性的重视、坚持；to 后接名词或动名词。"}, {"p": 1, "c": "vocab", "q": "factual", "t": "factual adj.", "e": "基于事实的，区别于虚构或艺术加工。"}, {"p": 1, "c": "expression", "q": "a truthful account", "t": "a truthful account of", "e": "对……的真实记录；account 在此不是账户。"}, {"p": 1, "c": "vocab", "q": "account", "t": "account n.", "e": "熟词生义：记述、报告，不是账户。"}, {"p": 1, "c": "syntax", "q": "making written sources more reliable for understanding different cultures", "t": "make＋宾语＋形容词", "e": "written sources 为宾语，more reliable 为补语；making 表作者推导的结果。"}, {"p": 2, "c": "link", "q": "Furthermore", "t": "第二个主论点", "e": "从准确性转向细节和背景深度。"}, {"p": 2, "c": "syntax", "q": "detail and context that moving images and visual media cannot match", "t": "that 定语从句", "e": "that 作 match 的宾语，修饰 detail and context。"}, {"p": 2, "c": "vocab", "q": "ethnography", "t": "ethnography n.", "e": "民族志，对群体文化生活的研究记录。"}, {"p": 2, "c": "expression", "q": "thorough analyses of", "t": "thorough analyses", "e": "深入全面的分析；analyses 是 analysis 的复数。"}, {"p": 2, "c": "vocab", "q": "dynamics", "t": "dynamics n.", "e": "发展变化及相互作用，本文为社会经济文化的动态。"}, {"p": 2, "c": "link", "q": "while personal memoirs", "t": "while：对照补充", "e": "学术研究与个人回忆录各提供不同角度。"}, {"p": 2, "c": "syntax", "q": "personal memoirs and travelogues can offer intimate perspectives on everyday life", "t": "主语并列＋can offer", "e": "两类个人记录提供生活视角，can 限定为潜力，并非所有作品都有。"}, {"p": 2, "c": "vocab", "q": "memoirs and travelogues", "t": "memoirs / travelogues", "e": "回忆录／游记。"}, {"p": 2, "c": "vocab", "q": "intimate", "t": "intimate adj.", "e": "本文指贴近个人、深入细致的视角，不限于亲密关系。"}, {"p": 2, "c": "syntax", "q": "that are rarely captured in visual media", "t": "that 定语从句的被动", "e": "修饰 perspectives，说明这些视角在影像中不常被呈现。"}, {"p": 2, "c": "link", "q": "due to time limitations", "t": "due to + 名词", "e": "解释影像为什么压缩内容。"}, {"p": 2, "c": "vocab", "q": "condense or omit", "t": "condense / omit", "e": "压缩／省略。"}, {"p": 2, "c": "vocab", "q": "intricate", "t": "intricate adj.", "e": "复杂精细的。"}, {"p": 2, "c": "syntax", "q": "to focus on the most visually compelling scenes", "t": "不定式目的", "e": "说明省略内容是为了聚焦视觉吸引力最强的场面。"}, {"p": 2, "c": "vocab", "q": "compelling", "t": "compelling adj.", "e": "有吸引力、令人难以忽视的；此处修饰 scenes。"}, {"p": 2, "c": "vocab", "q": "compression", "t": "compression n.", "e": "压缩，指内容被缩短删减。"}, {"p": 2, "c": "syntax", "q": "missing the subtler aspects", "t": "分词结果状语", "e": "压缩内容导致遗漏细节，missing 补充结果。"}, {"p": 2, "c": "vocab", "q": "subtler", "t": "subtle 的比较级", "e": "更微妙、更不易察觉的，修饰 aspects。"}, {"p": 2, "c": "syntax", "q": "how people live, work, and interact within their cultural contexts", "t": "how 名词性从句", "e": "作 of 的宾语，三个动词说明需要理解的生活层面。"}, {"p": 2, "c": "link", "q": "within their cultural contexts", "t": "within：范围", "e": "把生活行为放在各自文化背景中理解，而非脱离环境。"}, {"p": 3, "c": "syntax", "q": "I maintain that written documents are a more effective tool", "t": "maintain that", "e": "坚持认为、主张；maintain 在此不是维护设备。"}, {"p": 3, "c": "expression", "q": "accuracy, depth, and context", "t": "三个评价维度", "e": "准确性、深度、背景；分别回扣两段主体的比较标准。"}, {"p": 3, "c": "expression", "q": "fall short", "t": "fall short", "e": "未达到期待、存在不足。"}, {"p": 3, "c": "syntax", "q": "due to their tendency to prioritize entertainment", "t": "due to＋名词＋to do", "e": "原因中心词 tendency 后接不定式说明倾向做什么。"}, {"p": 3, "c": "expression", "q": "prioritize entertainment over factual representation", "t": "prioritize A over B", "e": "把娱乐优先于事实呈现，表达价值取舍。"}, {"p": 3, "c": "link", "q": "For a more complete and nuanced understanding", "t": "For：目标", "e": "为了获得更完整细致的理解，引出书面记录不可或缺的结论。"}, {"p": 3, "c": "vocab", "q": "nuanced", "t": "nuanced adj.", "e": "细致、有层次、考虑细微差别的。"}, {"p": 3, "c": "vocab", "q": "indispensable", "t": "indispensable adj.", "e": "不可或缺的，用于结尾强调资料价值。"}], "sourcePage": 25}, {"id": "essay-25", "title": "动植物种类变少", "question": "Many species of animals and plants are in danger of becoming extinct.\nWhat are the causes of this problem?\nWhat can be done to prevent it from happening?", "qzh": "许多动植物物种面临灭绝危险。原因是什么？可以做什么来防止它发生？", "paragraphs": ["In recent decades, a growing number of animal and plant species have been pushed to the brink of extinction. This issue is largely the result of human activities, but there are several practical measures that can be taken to address it.", "One major cause of species loss is the destruction of natural habitats. As cities expand and agricultural land increases, forests, wetlands and grasslands are cleared on a massive scale. Many animals lose their shelters and food sources, while numerous plant species disappear because the conditions they need to survive no longer exist. Another key factor is pollution. Chemicals from factories, plastic waste and contaminated water have damaged ecosystems and poisoned wildlife. For example, many marine species have died after ingesting plastic or becoming trapped in fishing nets. In addition, climate change has altered temperatures and rainfall patterns, disrupting migration routes and breeding cycles for many species. These environmental changes happen so quickly that most animals and plants cannot adapt in time.", "Despite the seriousness of this problem, several solutions could help protect endangered species. First, governments should strengthen environmental regulations and enforce strict penalties for illegal activities such as logging, poaching and overfishing. Protecting natural habitats through national parks and conservation zones is an effective way to give species a safe place to live and reproduce. Second, public awareness campaigns can encourage people to reduce pollution and adopt more sustainable lifestyles. When individuals understand how their daily habits affect wildlife, they are more likely to recycle, reduce waste and support conservation efforts. Finally, scientific research and breeding programmes can play an important role. By studying endangered species and breeding them in controlled environments, scientists can help increase their populations before releasing them back into the wild.", "In conclusion, the extinction of many species is mainly caused by habitat loss, pollution and climate change. However, with stronger laws, better public awareness and scientific intervention, it is possible to slow down or even reverse this trend. Protecting biodiversity is essential not only for wildlife but also for the health of the planet and future generations."], "translations": ["近几十年，越来越多动植物物种被推到灭绝边缘。这个问题主要由人类活动造成，但可以采取若干切实措施应对。", "物种减少的一个主要原因，是自然栖息地被破坏。随着城市扩展、农业土地增加，森林、湿地和草原遭到大规模清除。许多动物失去栖身地与食物来源，大量植物也因生存条件消失而灭绝。另一个关键因素是污染。工厂化学物、塑料废物和受污染的水破坏生态系统，使野生动物中毒。例如，许多海洋物种因摄入塑料或被渔网缠住而死亡。此外，气候变化改变温度和降雨模式，扰乱许多物种的迁徙路线和繁殖周期。这些环境变化如此迅速，以至于大多数动植物无法及时适应。", "尽管问题严重，仍有几项解决办法能帮助保护濒危物种。首先，政府应加强环境法规，对非法砍伐、偷猎和过度捕捞等行为严格处罚。通过国家公园和保护区保护自然栖息地，能有效为物种提供安全生活和繁殖场所。其次，公众意识宣传能够鼓励减少污染、采用更可持续的生活方式。当个人理解日常习惯怎样影响野生生物时，更可能回收利用、减少浪费并支持保护行动。最后，科研和繁育项目能发挥重要作用。科学家研究濒危物种并在受控环境下繁育，可帮助扩大种群，再将其放归野外。", "总之，许多物种灭绝主要由栖息地丧失、污染和气候变化造成。不过，通过更严格法律、更强公众意识和科学干预，可以减缓甚至逆转这一趋势。保护生物多样性不仅对野生生物重要，也关系到地球及后代的健康。"], "kind": "原因＋措施", "stance": "三类原因与三组措施。应补足针对气候变化的直接措施，使原因与办法对应更紧密。", "structure": [{"title": "引言", "role": "", "points": ["指出人类活动为主因，预告可采取措施。"]}, {"title": "原因段", "role": "", "points": ["3 点：栖息地破坏；污染；气候变化", "逐项说明生存或繁殖机制。"]}, {"title": "措施段", "role": "", "points": ["3 组：法规与保护区；公众行为；科研繁育", "以行动主体区分。"]}, {"title": "结论", "role": "", "points": ["汇总原因和措施，强调生物多样性价值。"]}], "readerNotes": [{"p": 0, "c": "syntax", "q": "a growing number of animal and plant species", "t": "a growing number of", "e": "越来越多的物种；谓语用复数 have，不受 number 单数表面形式影响。"}, {"p": 0, "c": "syntax", "q": "have been pushed to", "t": "have been + 过去分词", "e": "现在完成时被动，强调目前已形成的濒危状态。"}, {"p": 0, "c": "vocab", "q": "the brink of extinction", "t": "brink / extinction", "e": "边缘／灭绝，be on the brink of extinction＝濒临灭绝。"}, {"p": 0, "c": "link", "q": "but there are several practical measures", "t": "but：问题与可行应对", "e": "从人类活动造成问题转向仍可采取措施，给全文原因—措施结构定调。"}, {"p": 0, "c": "vocab", "q": "practical", "t": "practical adj.", "e": "切实可行的、实际的，修饰措施。"}, {"p": 0, "c": "syntax", "q": "measures that can be taken to address it", "t": "定语从句＋情态被动", "e": "that 指 measures，can be taken 表可采取，to address 说明目的；it 指濒危问题。"}, {"p": 1, "c": "vocab", "q": "habitats", "t": "habitats n.", "e": "栖息地。"}, {"p": 1, "c": "link", "q": "As cities expand", "t": "As：伴随变化", "e": "随着城市扩展，引出土地被清理。"}, {"p": 1, "c": "syntax", "q": "forests, wetlands and grasslands are cleared on a massive scale", "t": "并列主语＋被动", "e": "三个生态空间作主语，are cleared 说明遭清理；on a massive scale 为规模状语。"}, {"p": 1, "c": "vocab", "q": "wetlands", "t": "wetlands n.", "e": "湿地，生态系统类型。"}, {"p": 1, "c": "expression", "q": "on a massive scale", "t": "on a … scale", "e": "大规模地，scale 表规模，不是秤。"}, {"p": 1, "c": "vocab", "q": "shelters", "t": "shelter n.", "e": "栖身处、庇护所，本文指动物生存空间。"}, {"p": 1, "c": "expression", "q": "food sources", "t": "food sources", "e": "食物来源，与 shelters 共同说明栖息地损失的具体后果。"}, {"p": 1, "c": "link", "q": "while numerous plant species", "t": "while：并列对照", "e": "分别说明动物与植物受影响的方式。"}, {"p": 1, "c": "syntax", "q": "because the conditions they need to survive no longer exist", "t": "because＋含定语从句的主语", "e": "主语核心 conditions，they need … 为省略关系词的修饰；谓语为 no longer exist。"}, {"p": 1, "c": "link", "q": "Another key factor", "t": "切换第二原因", "e": "由栖息地破坏转到污染，不把污染当成上一点的例子。"}, {"p": 1, "c": "vocab", "q": "contaminated", "t": "contaminated adj.", "e": "受到污染的。"}, {"p": 1, "c": "vocab", "q": "marine species", "t": "marine adj.", "e": "海洋的；marine species 指海洋物种。"}, {"p": 1, "c": "syntax", "q": "after ingesting plastic or becoming trapped in fishing nets", "t": "after＋并列 doing", "e": "ingesting 表吞入；becoming trapped 表被困，两个过程都可能导致死亡。"}, {"p": 1, "c": "vocab", "q": "ingesting", "t": "ingest v.", "e": "摄入、吞食。"}, {"p": 1, "c": "link", "q": "In addition", "t": "追加第三原因", "e": "气候变化作为独立因素，与栖息地和污染并列。"}, {"p": 1, "c": "vocab", "q": "altered", "t": "alter v.", "e": "改变，常强调性质或状态发生变化。"}, {"p": 1, "c": "syntax", "q": "disrupting migration routes and breeding cycles", "t": "分词表示后果", "e": "温度降雨变化扰乱迁徙和繁殖，disrupting 承接前半句变化。"}, {"p": 1, "c": "vocab", "q": "disrupting", "t": "disrupt v.", "e": "扰乱、打断正常运行，本文为迁徙和繁殖规律。"}, {"p": 1, "c": "vocab", "q": "migration", "t": "migration n.", "e": "迁徙。"}, {"p": 1, "c": "vocab", "q": "breeding cycles", "t": "breeding cycles", "e": "繁殖周期；breeding 与生殖繁育有关。"}, {"p": 1, "c": "syntax", "q": "so quickly that", "t": "so + 副词 + that", "e": "变化如此迅速，以至于来不及适应；结果从句。"}, {"p": 1, "c": "link", "q": "in time", "t": "时间限制", "e": "及时适应；来不及适应才构成生存风险。"}, {"p": 2, "c": "link", "q": "Despite the seriousness", "t": "Despite：让步", "e": "问题虽严重，但仍可采取行动。"}, {"p": 2, "c": "link", "q": "First", "t": "First / Second / Finally", "e": "分别对应政府法规、公众行为、科研繁育三组措施，保持主体分工清晰。"}, {"p": 2, "c": "vocab", "q": "regulations", "t": "regulation n.", "e": "法规、规章制度。"}, {"p": 2, "c": "expression", "q": "enforce strict penalties", "t": "enforce penalties", "e": "严格执行惩罚规定；enforce 强调执行而非制定。"}, {"p": 2, "c": "vocab", "q": "penalties", "t": "penalty n.", "e": "惩罚、处罚措施。"}, {"p": 2, "c": "vocab", "q": "logging", "t": "logging n.", "e": "伐木；本文与 illegal activities 连用指非法砍伐。"}, {"p": 2, "c": "vocab", "q": "poaching", "t": "poaching n.", "e": "偷猎、非法捕猎。"}, {"p": 2, "c": "vocab", "q": "overfishing", "t": "overfishing n.", "e": "过度捕捞，over- 表过量。"}, {"p": 2, "c": "syntax", "q": "Protecting natural habitats through national parks and conservation zones is", "t": "动名词短语作主语", "e": "整个 Protecting … zones 作主语，谓语用单数 is。"}, {"p": 2, "c": "link", "q": "through national parks and conservation zones", "t": "through：实现途径", "e": "通过设立或利用保护区域维持栖息地。"}, {"p": 2, "c": "vocab", "q": "conservation", "t": "conservation n.", "e": "保护、保育。"}, {"p": 2, "c": "vocab", "q": "reproduce", "t": "reproduce v.", "e": "繁殖，在此不是复制文字或图像。"}, {"p": 2, "c": "expression", "q": "public awareness campaigns", "t": "public awareness campaigns", "e": "公众意识宣传活动；campaign 不只指竞选。"}, {"p": 2, "c": "expression", "q": "adopt more sustainable lifestyles", "t": "adopt lifestyles", "e": "采用更可持续的生活方式。"}, {"p": 2, "c": "syntax", "q": "When individuals understand how their daily habits affect wildlife, they are more likely to", "t": "When＋嵌套 how 从句", "e": "understand 的宾语是 how … wildlife；主句说明理解影响后更可能改变行为。"}, {"p": 2, "c": "expression", "q": "recycle, reduce waste and support conservation efforts", "t": "三个并列动词", "e": "给出公众可采取的具体行动，避免只说“提高意识”。"}, {"p": 2, "c": "syntax", "q": "By studying endangered species and breeding them in controlled environments", "t": "By＋并列 doing", "e": "studying 与 breeding 并列，逻辑主语为 scientists；说明增加种群的方法。"}, {"p": 2, "c": "vocab", "q": "controlled environments", "t": "controlled environments", "e": "受控环境，温度、食物等条件由人管理。"}, {"p": 2, "c": "syntax", "q": "before releasing them back into the wild", "t": "before＋doing", "e": "先扩大种群，再放归；them 指繁育的物种个体。"}, {"p": 3, "c": "link", "q": "with stronger laws, better public awareness and scientific intervention", "t": "with：实现条件", "e": "明确减缓或扭转趋势所依赖的三类措施。"}, {"p": 3, "c": "vocab", "q": "intervention", "t": "intervention n.", "e": "干预、介入；scientific intervention 指科研手段参与保护。"}, {"p": 3, "c": "syntax", "q": "it is possible to slow down or even reverse this trend", "t": "形式主语＋不定式", "e": "it 占主语位置，to slow down/reverse 才是实际被评价的行动。"}, {"p": 3, "c": "expression", "q": "slow down or even reverse this trend", "t": "slow down / reverse a trend", "e": "减缓甚至扭转趋势，程度逐步增强。"}, {"p": 3, "c": "vocab", "q": "reverse", "t": "reverse v.", "e": "扭转、使方向相反，指改变物种减少趋势。"}, {"p": 3, "c": "syntax", "q": "Protecting biodiversity is essential not only for wildlife but also for the health of the planet and future generations", "t": "动名词主语＋并列 for 短语", "e": "Protecting … 作单数主语；两组 for 分别指野生生物与地球后代的利益。"}, {"p": 3, "c": "vocab", "q": "biodiversity", "t": "biodiversity n.", "e": "生物多样性。"}], "sourcePage": 26}]</script><script>'use strict';
const ESSAYS=JSON.parse(document.querySelector('#essay-data').textContent);
const labels={vocab:'词汇',structure:'结构',syntax:'句型',link:'衔接',expression:'积累'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current,notes=[],personal=[],filter='all',showTranslation=false,editor=null,pending=null,opened=new Set();
const SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
const MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></svg>';
function status(text){$('#status').textContent=text;$('#status').hidden=!text;}
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').innerHTML=dark?SUN:MOON;$('#theme').setAttribute('aria-label',dark?'切换浅色模式':'切换暗色模式');$('#theme').title=dark?'切换浅色模式':'切换暗色模式';try{localStorage.setItem('ielts-theme',dark?'dark':'light');}catch(e){}}
let theme;try{theme=localStorage.getItem('ielts-theme');}catch(e){}setTheme(theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
function key(id){return 'ielts-'+id+'-personal-notes-v1';}
function valid(n,essay){return n&&Number.isInteger(n.p)&&typeof n.q==='string'&&n.q.length>0&&typeof n.e==='string'&&Object.hasOwn(labels,n.c)&&Number.isInteger(n.start)&&n.start>=0&&essay.paragraphs[n.p]?.slice(n.start,n.start+n.q.length)===n.q;}
function load(essay){try{const value=JSON.parse(localStorage.getItem(key(essay.id))||'[]');return Array.isArray(value)?value.filter(n=>valid(n,essay)):[];}catch(e){status('无法读取笔记存储。');return [];}}
function save(next){try{localStorage.setItem(key(current.id),JSON.stringify(next));personal=next;return true;}catch(e){status('笔记保存失败，请先复制内容或导出备份。');return false;}}
function guard(){if(!editor)return true;editor.querySelector('.save-state').textContent='请先保存或取消当前笔记';return false;}
function dismiss(){editor?.remove();editor=null;pending=null;}
function spans(text,p){const r=notes.map((n,id)=>({...n,id,start:n.start??text.indexOf(n.q)})).filter(n=>n.p===p&&(n.c==='vocab'||filter==='all'||filter===n.c));const bounds=[...new Set([0,text.length,...r.flatMap(n=>[n.start,n.start+n.q.length])])].sort((a,b)=>a-b);let html='';for(let i=0;i<bounds.length-1;i++){const a=bounds[i],b=bounds[i+1],group=r.filter(n=>n.start<=a&&n.start+n.q.length>=b);const str=esc(text.slice(a,b));if(!group.length){html+=str;continue;}const n=group.find(n=>n.c===filter)||group.find(n=>n.c==='vocab')||group[0];html+=`<span tabindex="0" role="button" class="annotation ${n.c}" data-ids="${group.map(n=>n.id).join(',')}" title="${group.map(n=>labels[n.c]).join(' / ')}">${str}</span>`;}return html;}
function card(n,id){const own=Boolean(n.personal);return `<div class="note ${n.c} ${own?'personal-note':''}" id="n${id}" data-id="${id}" data-category="${n.c}" ${n.c==='vocab'&&!opened.has(id)?'hidden':''} tabindex="0" role="button">${own?`<button class="personal-delete" data-delete="${id}" aria-label="删除笔记：${esc(n.q)}">删除</button>`:''}<span class="type">${labels[n.c]}</span><strong>${esc(own?n.q:n.t)}</strong>${!own&&n.t!==n.q?`<div class="anchor">${esc(n.q)}</div>`:''}<p>${esc(n.e)}</p></div>`;}
function structural(i){const s=current.structure[i];return `<div class="note structure" data-category="structure"><span class="type">结构</span><strong>${esc(s.title)}</strong>${s.role?`<p>${esc(s.role)}</p>`:''}<ul>${s.points.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>`;}
function overview(){return `<div class="note structure" data-category="structure"><span class="type">题型</span><strong>${esc(current.kind)}</strong><p>${esc(current.stance)}</p></div>`;}
function highlight(ids){$$('.selected').forEach(e=>e.classList.remove('selected'));ids.forEach(id=>$('#n'+id)?.classList.add('selected'));$$('[data-ids]').forEach(e=>{if(e.dataset.ids.split(',').map(Number).some(i=>ids.includes(i)))e.classList.add('selected');});}
function render(){notes=[...current.readerNotes,...personal.map((n,i)=>({...n,t:n.q,personal:true,personalIndex:i}))];$('#question').innerHTML=current.question.split('\n').map(esc).join('<br>');$('#question-translation').textContent=current.qzh;
$('#content').innerHTML=current.paragraphs.map((text,p)=>`<section class="row body-row"><aside class="left">${notes.map((n,id)=>n.p===p&&n.c==='vocab'?card(n,id):'').join('')}</aside><article class="center"><div class="para-heading">${p+1}</div><p class="original" id="p${p}">${spans(text,p)}</p><p class="translation trans" ${showTranslation?'':'hidden'}>${esc(current.translations[p])}</p></article><aside class="right">${p===0?overview():''}${structural(p)}${notes.map((n,id)=>n.p===p&&n.c!=='vocab'?card(n,id):'').join('')}</aside></section>`).join('');
$$('.right [data-category]').forEach(n=>n.hidden=filter!=='all'&&filter!==n.dataset.category);$$('.trans').forEach(n=>n.hidden=!showTranslation);
$$('[data-ids]').forEach(s=>{const ids=s.dataset.ids.split(',').map(Number);const vs=ids.filter(i=>notes[i].c==='vocab');if(vs.length)s.setAttribute('aria-expanded',String(vs.some(i=>opened.has(i))));s.onclick=()=>{if(editor)return;const close=vs.length&&vs.every(i=>opened.has(i));vs.forEach(i=>{if(close)opened.delete(i);else opened.add(i);$('#n'+i).hidden=Boolean(close);});highlight(ids.filter(i=>!close||!vs.includes(i)));syncExpanded();};s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();s.click();}};});
$$('[data-id]').forEach(n=>{n.onclick=e=>{if(e.target.closest('[data-delete]')||editor)return;const id=Number(n.dataset.id);if(notes[id].c==='vocab'){opened.delete(id);n.hidden=true;syncExpanded();highlight([]);}else{highlight([id]);const anchor=$$('[data-ids]').find(s=>s.dataset.ids.split(',').map(Number).includes(id));if(anchor)anchor.scrollIntoView({block:'center',behavior:'smooth'});}};n.onkeydown=e=>{if(e.target!==n)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();n.click();}};});
$$('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!guard())return;const n=notes[Number(b.dataset.delete)];const next=personal.filter((_,i)=>i!==n.personalIndex);if(save(next)){opened=new Set([...opened].filter(id=>id<current.readerNotes.length));render();}});
}
function syncExpanded(){$$('[data-ids]').forEach(s=>{const ids=s.dataset.ids.split(',').map(Number).filter(i=>notes[i].c==='vocab');if(ids.length)s.setAttribute('aria-expanded',String(ids.some(i=>opened.has(i))));});}
function selectEssay(id,scroll=true){if(!guard())return false;current=ESSAYS.find(e=>e.id===id)||ESSAYS[0];opened.clear();personal=load(current);document.title=current.title+' · hyggeZ';$$('[data-essay]').forEach(b=>{const active=b.dataset.essay===current.id;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false');});history.replaceState(null,'','#'+current.id);render();if(scroll)window.scrollTo({top:0});return true;}
$('#essay-tabs').innerHTML=ESSAYS.map((e,i)=>`<button data-essay="${e.id}" title="${esc(e.title)}"><span class="tab-number">${i+1}</span><span class="tab-name">${esc(e.title)}</span></button>`).join('');
function closePicker(){ $('#essay-picker').hidden=true;$('#essay-picker-toggle').setAttribute('aria-expanded','false'); }
function revealEssay(id,advance=false){requestAnimationFrame(()=>{const track=$('#essay-tabs'),button=track.querySelector('[data-essay="'+id+'"]');if(!button)return;const left=button.getBoundingClientRect().left-track.getBoundingClientRect().left+track.scrollLeft,right=left+button.offsetWidth;let target=track.scrollLeft;if(advance||right>target+track.clientWidth-45)target=left-track.clientWidth*.35;else if(left<target)target=left-16;target=Math.max(0,Math.min(target,track.scrollWidth-track.clientWidth));if(track.scrollTo)track.scrollTo({left:target,behavior:'smooth'});else track.scrollLeft=target;});}
$$('[data-essay]').forEach(b=>b.onclick=()=>{const track=$('#essay-tabs');const nearEnd=b.getBoundingClientRect().right>track.getBoundingClientRect().left+track.clientWidth*.75;if(selectEssay(b.dataset.essay)){closePicker();revealEssay(b.dataset.essay,nearEnd);}});
$('#essay-picker').innerHTML=ESSAYS.map((e,i)=>'<button data-pick="'+e.id+'">'+(i+1)+'. '+esc(e.title)+'</button>').join('');
$('#essay-picker-toggle').onclick=()=>{const open=$('#essay-picker').hidden;$('#essay-picker').hidden=!open;$('#essay-picker-toggle').setAttribute('aria-expanded',String(open));if(open){$$('[data-pick]').forEach(b=>b.setAttribute('aria-current',b.dataset.pick===current.id?'page':'false'));$('#essay-picker').querySelector('[aria-current="page"]')?.focus();}};
$$('[data-pick]').forEach(b=>b.onclick=()=>{if(selectEssay(b.dataset.pick)){closePicker();revealEssay(b.dataset.pick,true);$('#essay-picker-toggle').focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('.essay-navigation'))closePicker();});
$('#essay-picker').addEventListener('keydown',e=>{const items=$$('[data-pick]');let i=items.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}if(e.key==='Escape'){closePicker();$('#essay-picker-toggle').focus();}});
$('#essay-picker-toggle').addEventListener('keydown',e=>{if(e.key==='Escape')closePicker();});
window.addEventListener('resize',()=>revealEssay(current.id));

$$('[data-filter]').forEach(b=>b.onclick=()=>{if(!guard())return;filter=b.dataset.filter;$$('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});render();});
$('#translate').onclick=()=>{if(!guard())return;showTranslation=!showTranslation;$('#translate').textContent=showTranslation?'隐藏译文':'显示译文';$('#translate').setAttribute('aria-pressed',String(showTranslation));$$('.trans').forEach(n=>n.hidden=!showTranslation);};
function addEditor(range,p,start,q){pending={p,start,q};editor=document.createElement('span');editor.className='note-editor';editor.setAttribute('role','group');editor.setAttribute('aria-label','添加笔记');editor.innerHTML='<select aria-label="笔记标签"><option value="">选择标签</option>'+Object.entries(labels).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')+'</select><textarea aria-label="笔记内容" placeholder="写笔记…"></textarea><button class="save-note">保存</button><button class="cancel-note">取消</button><span class="save-state" role="status"></span>';const insert=range.cloneRange();insert.collapse(false);insert.insertNode(editor);editor.addEventListener('click',e=>e.stopPropagation());editor.addEventListener('keydown',e=>e.stopPropagation());editor.querySelector('.cancel-note').onclick=()=>{dismiss();render();};editor.querySelector('.save-note').onclick=()=>{const c=editor.querySelector('select').value,e=editor.querySelector('textarea').value;if(!c){editor.querySelector('.save-state').textContent='请选择标签';return;}if(save([...personal,{...pending,c,e}])){const id=current.readerNotes.length+personal.length-1;if(c==='vocab')opened.add(id);dismiss();render();highlight([id]);}else editor.querySelector('.save-state').textContent='未保存，请先复制内容。';};getSelection().removeAllRanges();editor.querySelector('select').focus();}
function captureSelection(e){if(editor||e.target.closest('button,select,textarea,.note-editor,.note'))return;const selection=getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0),a=range.startContainer.nodeType===1?range.startContainer:range.startContainer.parentElement,b=range.endContainer.nodeType===1?range.endContainer:range.endContainer.parentElement;const para=a.closest('.original');if(!para||b.closest('.original')!==para)return;const q=range.toString();if(!q.trim())return;const prefix=range.cloneRange();prefix.selectNodeContents(para);prefix.setEnd(range.startContainer,range.startOffset);const start=prefix.toString().length,p=Number(para.id.slice(1));if(current.paragraphs[p].slice(start,start+q.length)!==q)return;addEditor(range,p,start,q);}
document.addEventListener('mouseup',captureSelection);document.addEventListener('keyup',e=>{if(e.key==='Shift')captureSelection(e);});
document.addEventListener('click',e=>{if(editor&&e.target.closest('.original')&&!e.target.closest('.note-editor')){e.stopImmediatePropagation();e.preventDefault();}},true);
window.addEventListener('beforeunload',e=>{if(editor&&editor.querySelector('textarea').value){e.preventDefault();e.returnValue='';}});
$('#export-notes').onclick=()=>{if(!guard())return;const exportData={format:'ielts-notes',version:1,essays:Object.fromEntries(ESSAYS.map(e=>[e.id,load(e)]))};const url=URL.createObjectURL(new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ielts-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#import-notes').onchange=async e=>{if(!guard()){e.target.value='';return;}const file=e.target.files[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('文件超过 5 MB');const data=JSON.parse(await file.text());if(data.format!=='ielts-notes'||data.version!==1||!data.essays||typeof data.essays!=='object')throw Error('笔记格式不正确');let added=0;for(const [id,items] of Object.entries(data.essays)){const essay=ESSAYS.find(x=>x.id===id);if(!essay||!Array.isArray(items)||!items.every(n=>valid(n,essay)))throw Error('笔记与文章不匹配');}const changes=[];for(const essay of ESSAYS){const existing=load(essay);const seen=new Set(existing.map(n=>JSON.stringify([n.p,n.start,n.q,n.c,n.e])));const next=[...existing];for(const n of data.essays[essay.id]||[]){const sig=JSON.stringify([n.p,n.start,n.q,n.c,n.e]);if(!seen.has(sig)){next.push(n);seen.add(sig);added++;}}changes.push([key(essay.id),JSON.stringify(next)]);}const previous=changes.map(([k])=>[k,localStorage.getItem(k)]);try{changes.forEach(([k,v])=>localStorage.setItem(k,v));}catch(err){previous.forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));throw err;}personal=load(current);render();status('已导入 '+added+' 条笔记。');}catch(err){status('导入失败：'+err.message);}e.target.value='';};
selectEssay(location.hash.slice(1),false);

revealEssay(current.id);
</script></body></html>
